/* ---- text asks: the companion asked for words; the next message is the answer ---- */
function askText(kind, extra, promptText){
  textAsk = Object.assign({kind:kind}, extra || {});
  pushMsg({type:"companion", text:promptText});
}
function handleTextAsk(text){
  var ask = textAsk;
  textAsk = null;
  if(!ask) return;
  if(ask.kind === "move"){
    saveMove(ask.claimId, text);
    var e1 = ledgerEntryById(ask.claimId);
    if(e1){ e1.moveAsked = true; saveLedger(); }
    var mm = threadMsgById(ask.msgId);
    if(mm){ mm.moveDone = true; if(mm.outDone) mm.done = "done"; saveThread(); }
    /* move momentum rides the confirmation: the count, this move
       included, is the feedback for this message (v1.8) */
    var mvLine = noticedSuppressed() ? "" : fbLine("move", {n:moveCount()});
    pushMsg({type:"companion", noticed: !!mvLine, fbKind: mvLine ? "move" : "",
      text:"Move written down — yours, in your words." + (mvLine ? " " + mvLine : "")});
  } else if(ask.kind === "outcome"){
    setOutcome(ask.claimId, "", text);
    var mm2 = threadMsgById(ask.msgId);
    if(mm2){ mm2.outDone = true; if(mm2.moveDone) mm2.done = "done"; saveThread(); }
    pushMsg({type:"companion", text:"Written down — what actually happened, in your words."});
  } else if(ask.kind === "claimtext"){
    pushMsg({type:"claimkind", text:text, claimId:""});
  } else if(ask.kind === "seeing"){
    var p1 = pieceById(ask.pieceId);
    if(p1){ p1.seeing = text; p1.seeingTs = Date.now(); saveAtlas(); }
    var sm = threadMsgById(ask.msgId);
    if(sm){ sm.done = true; saveThread(); }
    pushMsg({type:"companion", text:"Your seeing is on top now."});
  } else if(ask.kind === "rename"){
    var p2 = pieceById(ask.pieceId);
    if(p2){
      p2.name = text;
      p2.nameHistory = p2.nameHistory || [];
      p2.nameHistory.push({name:text, ts:Date.now()});
      saveAtlas();
    }
    pushMsg({type:"companion", text:"Renamed. History kept."});
  } else if(ask.kind === "glossterm"){
    pushMsg({type:"glossdoes", pieceId:ask.pieceId, term:text, done:false});
  }
}

/* ================= Add detail — the tap trees, as a conversation =================
   The capture and confirm screens are gone. Filing an entry with
   detail — a first capture from the map card, or Add detail on a
   filed entry — now walks the same trees as a sequence of chip
   messages in the thread, one step at a time. `cap` is the
   session's working capture, the shape the trees always used;
   fileCapture files it exactly as before. Steps that ask for his
   own words set detail.textField: the next message he sends fills
   the field. Nothing files until he taps File it on the review. */
function clearModes(){
  writeMode = null;
  correctionDay = "";
  textAsk = null;
  if(detail){
    var dm = threadMsgById(detail.msgId);
    if(dm && detail.step !== "review" && !dm.answered){ dm.dropped = true; saveThread(); }
    detail = null;
    cap = null;
  }
}
function startDetailSession(editEv){
  clearModes();
  view = "home";
  cap = blankCap();
  if(editEv){
    cap.editEventId = editEv.id;
    cap.mode = editEv.mode === "pour" ? "pour" : "quick";
    cap.pourText = editEv.pourText || "";
    cap.whoIds = (editEv.whoIds || []).slice();
    /* piece-creating flags are stripped: those pieces already exist in whoIds */
    cap.whoFlags = (editEv.whoFlags || []).filter(function(f){
      return ["new","knownnew","group","presence","notperson"].indexOf(f) === -1;
    });
    cap.whoOwn = editEv.whoOwn || "";
    cap.channels = (editEv.channels || []).slice();
    cap.mannerWhere = (editEv.mannerWhere || []).slice();
    cap.mannerHow = (editEv.mannerHow || []).slice();
    cap.bodySpots = (editEv.bodySpots || []).slice();
    cap.among = (editEv.among || []).slice();
    cap.register = (editEv.register || []).slice();
    cap.response = (editEv.response || []).slice();
    cap.seeingOwn = editEv.seeing || "";
    cap.eventOwn = editEv.eventOwn || editEv.fragmentText || "";
    if(editEv.claimLedgerId){
      for(var i=0;i<ledger.entries.length;i++){
        if(ledger.entries[i].id === editEv.claimLedgerId){
          var le = ledger.entries[i];
          cap.claimKind = le.kind || "";
          cap.claimOwn = le.claim || "";
          cap.claimWhoId = le.whoId || "";
          if(le.encoded) cap.claimChips = ["It charged me with something it won’t say plainly"];
          break;
        }
      }
    }
  }
  detail = {step:"who", msgId:"", textField:"", editing: !!editEv};
  pushMsg({type:"companion", text: editEv
    ? "Add detail — we’ll walk it in the talk. Tap what fits; Next keeps what’s there."
    : "Let’s put it on the map, right here in the talk. Tap what fits — at the end, you file it or you don’t."});
  var m = pushMsg({type:"dstep", step:"who"});
  detail.msgId = m.id;
  render();
}
var DETAIL_STEPS = ["who","newpiece","channels","manner","among","claim","register","seeing","gloss","ownevent"];
var DETAIL_LABELS = {who:"Who is present", newpiece:"The new one", channels:"What came through",
  manner:"Manner and position", among:"Among themselves", claim:"What they’re doing — claims",
  register:"How they presented", seeing:"How you see them", gloss:"A word they use", ownevent:"Anything else"};
var CLAIM_KIND_CHIPOPTS = [["prediction","A prediction — something would happen"],["now","A claim about right now"],
  ["commentary","Running commentary"],["announcement","An announcement"],["instruction","Not a claim — an instruction"]];
var RESPONSE_OPTS = ["I answered back","It argued with what I decided"];
function detailStepApplies(step){
  if(step === "newpiece") return newPieceWanted();
  if(step === "manner") return hasPresence();
  if(step === "among") return whoCount() >= 2 || cap.whoFlags.indexOf("group") !== -1;
  return true;
}
function detailStepHasContent(step){
  if(!cap) return false;
  switch(step){
    case "who": return !!(cap.whoIds.length || cap.whoFlags.length || cap.whoOwn);
    case "newpiece": return !!(cap.newPiece.name || cap.newPiece.noName || cap.newPiece.likeness);
    case "channels": return !!cap.channels.length;
    case "manner": return !!(cap.mannerWhere.length || cap.mannerHow.length || cap.bodySpots.length || cap.bodySpotOwn);
    case "among": return !!cap.among.length;
    case "claim": return !!cap.claimKind;
    case "register": return !!cap.register.length;
    case "seeing": return !!(cap.seeingOwn || cap.seeingChip);
    case "gloss": return !!cap.glossTerm;
    case "ownevent": return !!cap.eventOwn;
  }
  return false;
}
function detailAdvance(){
  var curMsg = threadMsgById(detail.msgId);
  if(curMsg && detail.step !== "review"){
    curMsg.answered = true;
    curMsg.summary = DETAIL_LABELS[detail.step] + (detailStepHasContent(detail.step) ? " — noted." : " — passed.");
    saveThread();
  }
  var idx = DETAIL_STEPS.indexOf(detail.step);
  var nxt = null;
  for(var i = idx + 1; i < DETAIL_STEPS.length; i++){
    if(detailStepApplies(DETAIL_STEPS[i])){ nxt = DETAIL_STEPS[i]; break; }
  }
  if(!nxt){
    detail.step = "review";
    var rm = pushMsg({type:"dreview", filed:null, editing: detail.editing});
    detail.msgId = rm.id;
  } else {
    detail.step = nxt;
    var m2 = pushMsg({type:"dstep", step:nxt});
    detail.msgId = m2.id;
  }
  render();
}
function dstepHTML(m){
  if(m.dropped)
    return '<div class="msg them"><div class="bubble"><p class="muted small">Detail — set aside, not filed.</p></div></div>';
  if(m.answered || !detail || detail.msgId !== m.id || !cap)
    return '<div class="msg them"><div class="bubble"><p class="muted small">'+esc(m.summary || ((DETAIL_LABELS[m.step] || "Detail") + " — done."))+'</p></div></div>';
  var d = cap;
  var step = m.step;
  function dchip(spec, label, on){
    return '<button type="button" class="chip'+(on ? " on" : "")+'" data-dchip="'+spec+'">'+label+'</button>';
  }
  function optChips(group, opts, selected, multi){
    return '<div class="chiprow">' + opts.map(function(o, i){
      var val = Array.isArray(o) ? o[0] : o;
      var lab = Array.isArray(o) ? o[1] : o;
      var on = multi ? (selected.indexOf(val) !== -1) : (selected === val);
      return dchip(group+":"+i, esc(lab), on);
    }).join("") + '</div>';
  }
  var next = '<div class="chiprow"><button type="button" class="chip" data-dchip="next">Next</button></div>';
  var h = '<div class="msg them"><div class="bubble wide"><p class="hub-label">'+esc(DETAIL_LABELS[step])+'</p>';
  if(step === "who"){
    if(detail.editing) h += '<p class="small" style="margin:4px 0">Change anything — or Next to keep it as it is.</p>';
    if(atlas.pieces.length){
      h += '<p class="small" style="margin:4px 0"><strong>Your pieces</strong></p><div class="chiprow">'
        + atlas.pieces.map(function(p, i){
            return dchip("piece:"+i, esc(p.name), d.whoIds.indexOf(p.id) !== -1);
          }).join("") + '</div>';
    }
    h += optChips("whoflag", WHO_FLAG_OPTS, d.whoFlags, true);
    if(d.whoOwn) h += '<p class="small" style="margin:4px 0">In your words: &ldquo;'+esc(d.whoOwn)+'&rdquo;</p>';
    h += '<div class="chiprow"><button type="button" class="chip" data-dchip="writetext:whoOwn">In my own words</button></div>' + next;
  }
  else if(step === "newpiece"){
    h += '<p class="small" style="margin:4px 0">The new one — captured now, while it’s in front of you.</p>';
    h += '<p class="small" style="margin:4px 0"><strong>Its name:</strong> '
      + (d.newPiece.name ? '&ldquo;'+esc(d.newPiece.name)+'&rdquo;' : (d.newPiece.noName ? 'No name yet' : 'Not set')) + '</p>';
    h += '<div class="chiprow">'
      + dchip("writetext:npName", "Write the name", false)
      + dchip("npnoname", "No name yet", d.newPiece.noName) + '</div>';
    h += '<p class="small" style="margin:8px 0 4px"><strong>Who it is like</strong></p>'
      + optChips("likeness", LIKENESS_OPTS, d.newPiece.likeness, false);
    h += '<p class="small" style="margin:8px 0 4px"><strong>New or known</strong></p>'
      + optChips("npstatus", [["new","New — first time"],["known","I’ve met this one before"]], d.newPiece.status, false);
    h += '<div class="chiprow">' + dchip("npstanding", "It stands for something that happened", d.newPiece.standing) + '</div>' + next;
  }
  else if(step === "channels"){
    h += optChips("channels", CHANNEL_OPTS, d.channels, true) + next;
  }
  else if(step === "manner"){
    h += '<p class="small" style="margin:4px 0"><strong>Where it was</strong></p>'
      + optChips("where", WHERE_OPTS, d.mannerWhere, true);
    h += '<p class="small" style="margin:8px 0 4px"><strong>How it came through</strong></p>'
      + optChips("how", HOW_OPTS, d.mannerHow, true);
    var showSpots = d.mannerWhere.indexOf("In a part of my body") !== -1
      || d.channels.indexOf("A feeling in my body") !== -1
      || d.channels.indexOf("Pain") !== -1 || d.channels.indexOf("Being touched") !== -1;
    if(showSpots){
      var spots = learnedBodySpots();
      h += '<p class="small" style="margin:8px 0 4px"><strong>Where in the body</strong></p>';
      if(spots.length) h += '<div class="chiprow">' + spots.map(function(s, i){
        return dchip("spot:"+i, esc(s), d.bodySpots.indexOf(s) !== -1);
      }).join("") + '</div>';
      if(d.bodySpotOwn) h += '<p class="small" style="margin:4px 0">In your words: &ldquo;'+esc(d.bodySpotOwn)+'&rdquo;</p>';
      h += '<div class="chiprow"><button type="button" class="chip" data-dchip="writetext:bodySpotOwn">A body spot, in my words</button></div>';
    }
    h += next;
  }
  else if(step === "among"){
    h += optChips("among", AMONG_OPTS, d.among, true) + next;
  }
  else if(step === "claim"){
    h += optChips("claimkind", [["","No claim"]].concat(CLAIM_KIND_CHIPOPTS), d.claimKind, false);
    if(d.claimKind){
      h += '<p class="small" style="margin:8px 0 4px"><strong>The shape of it</strong></p>'
        + optChips("claimsub", CLAIM_SUBS[d.claimKind], d.claimChips, true);
      if(d.claimKind === "now")
        h += '<p class="muted small">If it charged you with something it won’t say plainly, the record holds the question open: <strong>not yet understandable</strong>. It is never marked nonsense, and the app never closes it.</p>';
      if(d.claimOwn) h += '<p class="small" style="margin:4px 0">The claim, your words: &ldquo;'+esc(d.claimOwn)+'&rdquo;</p>';
      h += '<div class="chiprow"><button type="button" class="chip" data-dchip="writetext:claimOwn">The claim, in my words</button></div>';
      var cwOpts = claimWhoOptions();
      var cwChosen = d.claimWhoId || (cwOpts.length ? cwOpts[0][0] : "");
      h += '<p class="small" style="margin:8px 0 4px"><strong>Who said it</strong></p><div class="chiprow">'
        + cwOpts.map(function(o, i){ return dchip("claimwho:"+i, esc(o[1]), cwChosen === o[0]); }).join("") + '</div>';
      h += '<p class="small" style="margin:8px 0 4px"><strong>My response</strong></p>'
        + optChips("response", RESPONSE_OPTS, d.response, true);
    }
    h += next;
  }
  else if(step === "register"){
    h += '<div class="chiprow">' + REGISTER_OPTS_CAP.map(function(o, i){
      return dchip("register:"+i, esc(o[0]) + (o[1] ? '<small>'+esc(o[1])+'</small>' : ''), d.register.indexOf(o[0]) !== -1);
    }).join("") + '</div>' + next;
  }
  else if(step === "seeing"){
    h += '<p class="muted small" style="margin:4px 0">Your seeing is the top layer.</p>';
    var curSeeing = d.seeingOwn || d.seeingChip;
    if(curSeeing) h += '<p class="small" style="margin:4px 0">So far: &ldquo;'+esc(curSeeing)+'&rdquo;</p>';
    h += '<div class="chiprow"><button type="button" class="chip" data-dchip="writetext:seeingOwn">In my own words</button></div>'
      + optChips("seeingchip", SEEING_OPTS, d.seeingChip, false) + next;
  }
  else if(step === "gloss"){
    if(!d.glossTerm){

    } else {
      h += '<p class="small" style="margin:4px 0">The word: &ldquo;<strong>'+esc(d.glossTerm)+'</strong>&rdquo;</p>';
      h += '<p class="small" style="margin:8px 0 4px"><strong>What it means / what it does</strong></p>'
        + optChips("glossdoes", GLOSS_DOES_OPTS, d.glossDoes, false);
      if(d.glossDoesOwn) h += '<p class="small" style="margin:4px 0">In your words: &ldquo;'+esc(d.glossDoesOwn)+'&rdquo;</p>';
      h += '<div class="chiprow"><button type="button" class="chip" data-dchip="writetext:glossDoesOwn">In my own words</button></div>' + next;
    }
  }
  else if(step === "ownevent"){
    if(d.eventOwn) h += '<p class="small" style="margin:4px 0">&ldquo;'+esc(d.eventOwn)+'&rdquo;</p>';
    h += '<div class="chiprow"><button type="button" class="chip" data-dchip="writetext:eventOwn">Write it</button></div>'
      + '<div class="chiprow"><button type="button" class="chip" data-dchip="next">To the review</button></div>';
  }
  return h + '</div></div>';
}
function dreviewHTML(m){
  if(m.filed === true)
    return '<div class="msg them"><div class="bubble"><p class="muted small">'+(m.editing ? "Updated — the entry keeps its place in the record." : "Filed — it’s in the record.")+'</p></div></div>';
  if(m.filed === false)
    return '<div class="msg them"><div class="bubble"><p class="muted small">'+(m.editing ? "Left as it was." : "Not filed.")+'</p></div></div>';
  if(!detail || detail.msgId !== m.id || !cap) return "";
  return '<div class="msg them"><div class="bubble wide"><p class="hub-label">'+(cap.editEventId ? "Here’s what will change" : "Here’s what will be filed")+'</p>'
    + '<p class="muted small" style="margin:4px 0">'+(cap.editEventId ? "Nothing changes until you file." : "Nothing is filed yet.")+'</p>'
    + detailSummaryHTML(cap)
    + '<div class="chiprow"><button type="button" class="chip" data-dchip="file">File it</button>'
    + '<button type="button" class="chip" data-dchip="dropfile">Don’t file this</button></div></div></div>';
}
function detailSummaryHTML(d){
  var h = "";
  if(d.mode === "pour" && d.pourText){
    h += '<h3>Your pour, kept whole</h3><p>'+esc(d.pourText.length > 280 ? d.pourText.slice(0,280) + "…" : d.pourText)+'</p>';
  }
  var whoNames = d.whoIds.map(function(id){ return esc(pieceName(id)); }).filter(Boolean);
  if(newPieceWanted()) whoNames.push(esc(defaultPieceName()) + " (new)");
  if(d.whoOwn) whoNames.push(esc(d.whoOwn));
  if(d.whoFlags.indexOf("noises") !== -1) whoNames.push("Just noises");
  if(d.whoFlags.indexOf("bodyonly") !== -1) whoNames.push("No one — body only");
  if(d.whoFlags.indexOf("toomany") !== -1) whoNames.push("Too many to count");
  if(whoNames.length) h += '<h3>Who</h3>' + summaryList(whoNames);
  if(d.channels.length) h += '<h3>What came through</h3>' + summaryList(d.channels.map(esc));
  var manner = d.mannerWhere.concat(d.mannerHow).concat(d.bodySpots).concat(d.bodySpotOwn ? [d.bodySpotOwn] : []);
  if(manner.length) h += '<h3>Manner and position</h3>' + summaryList(manner.map(esc));
  if(d.among.length) h += '<h3>Among themselves</h3>' + summaryList(d.among.map(esc));
  if(d.claimKind){
    var cw = claimWhoOf(d);
    h += '<h3>A claim for the ledger</h3>' + summaryList([
      esc(KIND_LABELS[d.claimKind] || d.claimKind),
      "&ldquo;" + esc(claimTextOf(d) || "(from the options above)") + "&rdquo;",
      cw.name ? "Said by: " + esc(cw.name) : "No one specific named"
    ]);
    if(d.claimChips.indexOf("It charged me with something it won’t say plainly") !== -1)
      h += '<p class="muted small">Encoded charge: the record holds the question open — not yet understandable.</p>';
  }
  if(d.response.length) h += '<h3>Your response</h3>' + summaryList(d.response.map(esc));
  if(d.register.length) h += '<h3>How they presented</h3>' + summaryList(d.register.map(esc));
  var seeing = d.seeingOwn.trim() || d.seeingChip;
  if(seeing) h += '<h3>How you see them</h3><p>'+esc(seeing)+'</p>';
  if(d.glossTerm) h += '<h3>A word they use</h3>' + summaryList([esc(d.glossTerm), esc(d.glossDoes || d.glossDoesOwn || "")].filter(Boolean));
  if(d.eventOwn) h += '<h3>In your words</h3><p>'+esc(d.eventOwn)+'</p>';
  if(!whoNames.length && !d.channels.length && !d.claimKind && !d.pourText && !d.eventOwn && !d.glossTerm)
    h += '<p class="empty">Nothing picked. Nothing to file.</p>';
  return h;
}
function handleDetailText(text){
  if(!detail || !cap) return;
  var f = detail.textField;
  detail.textField = "";
  if(f === "whoOwn") cap.whoOwn = text;
  else if(f === "npName"){ cap.newPiece.name = text; if(text) cap.newPiece.noName = false; }
  else if(f === "bodySpotOwn") cap.bodySpotOwn = text;
  else if(f === "claimOwn") cap.claimOwn = text;
  else if(f === "seeingOwn") cap.seeingOwn = text;
  else if(f === "glossTerm") cap.glossTerm = text;
  else if(f === "glossDoesOwn") cap.glossDoesOwn = text;
  else if(f === "eventOwn") cap.eventOwn = text;
}
function handleDetailChip(spec){
  if(!detail || !cap) return;
  flushPendingPour(); /* a tap is a pause — a hanging pour run gets its proposals */
  var parts = String(spec || "").split(":");
  var act = parts[0];
  if(act === "next"){ detailAdvance(); return; }
  if(act === "writetext"){
    detail.textField = parts[1];
    var prompts = {
      whoOwn:"Say who, in your own words — it fills this step.",
      npName:"Say the name — the name as you know it, or a name you’re giving it.",
      bodySpotOwn:"Say the body spot, in your own words.",
      claimOwn:"Say the claim, in your own words.",
      seeingOwn:"Say how you see them — your words lead.",
      glossTerm:"Say the word — just the word.",
      glossDoesOwn:"Say what the word does, in your own words.",
      eventOwn:"Say whatever else belongs in the record."
    };
    pushMsg({type:"companion", text:prompts[parts[1]] || "Say it in your words."});
    render();
    return;
  }
  if(act === "file"){
    var rm = threadMsgById(detail.msgId);
    var wasEdit = detail.editing;
    var ledBefore = ledger.entries.length;
    var capFirst = computeCaptureFirsts(); /* figured from cap BEFORE it files */
    detail = null;
    fileCapture();
    if(rm){ rm.filed = true; saveThread(); }
    pushMsg({type:"companion", text: wasEdit ? "Updated — it keeps its place in the record." : "Filed. It’s on the map now."});
    /* a first from this filing is its feedback — unless the filing
       also created a claim, whose own organizing (precedent or
       filing facts, inside fileCapture) already spoke for it */
    if(capFirst && ledger.entries.length === ledBefore) postNoticed(capFirst);
    render();
    return;
  }
  if(act === "dropfile"){
    var rm2 = threadMsgById(detail.msgId);
    var wasEdit2 = detail.editing;
    if(rm2){ rm2.filed = false; saveThread(); }
    detail = null; cap = null;
    pushMsg({type:"companion", text: wasEdit2 ? "Left as it was." : "Not filed."});
    render();
    return;
  }
  var idx = parseInt(parts[1], 10);
  if(act === "piece"){ var p = atlas.pieces[idx]; if(p) toggleIn(cap.whoIds, p.id); }
  else if(act === "whoflag"){ var wf = WHO_FLAG_OPTS[idx]; if(wf) toggleIn(cap.whoFlags, wf[0]); }
  else if(act === "npnoname"){ cap.newPiece.noName = !cap.newPiece.noName; }
  else if(act === "likeness"){ cap.newPiece.likeness = LIKENESS_OPTS[idx] || ""; }
  else if(act === "npstatus"){ cap.newPiece.status = idx === 0 ? "new" : "known"; }
  else if(act === "npstanding"){ cap.newPiece.standing = !cap.newPiece.standing; }
  else if(act === "channels"){ toggleIn(cap.channels, CHANNEL_OPTS[idx]); }
  else if(act === "where"){ toggleIn(cap.mannerWhere, WHERE_OPTS[idx]); }
  else if(act === "how"){ toggleIn(cap.mannerHow, HOW_OPTS[idx]); }
  else if(act === "spot"){ var sp = learnedBodySpots()[idx]; if(sp) toggleIn(cap.bodySpots, sp); }
  else if(act === "among"){ toggleIn(cap.among, AMONG_OPTS[idx]); }
  else if(act === "claimkind"){
    var v2 = idx === 0 ? "" : (CLAIM_KIND_CHIPOPTS[idx - 1] ? CLAIM_KIND_CHIPOPTS[idx - 1][0] : "");
    cap.claimKind = (cap.claimKind === v2) ? "" : v2;
    cap.claimChips = [];
  }
  else if(act === "claimsub"){ var cs = (CLAIM_SUBS[cap.claimKind] || [])[idx]; if(cs) toggleIn(cap.claimChips, cs); }
  else if(act === "claimwho"){ var o = claimWhoOptions()[idx]; if(o) cap.claimWhoId = o[0]; }
  else if(act === "response"){ toggleIn(cap.response, RESPONSE_OPTS[idx]); }
  else if(act === "register"){ var ro = REGISTER_OPTS_CAP[idx]; if(ro) toggleIn(cap.register, ro[0]); }
  else if(act === "seeingchip"){ cap.seeingChip = (cap.seeingChip === SEEING_OPTS[idx]) ? "" : SEEING_OPTS[idx]; }
  else if(act === "glossdoes"){ cap.glossDoes = (cap.glossDoes === GLOSS_DOES_OPTS[idx]) ? "" : GLOSS_DOES_OPTS[idx]; }
  render();
}

/* ================= Screen 8 — Help button + help ladder ================= */
var helpReturn = "home";
var ladderReturn = "help";
function viewHelp(){
  var t = allReceiptTallies();
  var h = '<div class="card" style="margin-top:10px">';
  h += '<button class="btn quiet small" id="helpBack" type="button">\u2190 Back</button>';
  h += '<h2 style="margin-top:8px">Help, your way</h2>';
  h += '<p class="lede muted">Sometimes you just need help. This connects you outward \u2014 it never alerts or notifies anyone behind your back, and pressing it writes nothing down. No log of help-seeking is kept, anywhere.</p>';

  /* rung 1 — reassurance, from the person's own record */
  h += '<div class="rung"><h3>Reassurance \u2014 from your own record</h3>';
  if(ladder.noteForHardDay){
    h += '<p class="muted small">A note you wrote on a calm day, for a hard one:</p>';
    h += '<div class="hardday-note">'+esc(ladder.noteForHardDay)+'</div>';
  }
  if(t.total){
    h += '<p>The claims have a track record, and you can check it: '+t.total+(t.total===1?" claim":" claims")+' logged, '
      + t.checked+' checked' + (t.checked ? ' \u2014 '+t.held+' held up, '+t.didnt+' didn\u2019t' : '') + '.</p>';
    h += '<div class="btnrow"><button class="btn secondary small" id="helpReceipts" type="button">Check the receipts</button></div>';
  }
  if(!ladder.noteForHardDay && !t.total){
    h += '<p>You are the one who keeps this record. Their claims have a track record, and you can check it.</p>';
  }
  if(!ladder.noteForHardDay){
    h += '<div class="btnrow"><button class="btn quiet small" id="helpNote" type="button">Write a note for a hard day</button></div>';
  }
  h += '</div>';

  /* rung 2 — a person */
  h += '<div class="rung"><h3>A person</h3>';
  if(ladder.contacts.length){
    ladder.contacts.forEach(function(c){
      h += '<p><strong>'+esc(c.name)+'</strong><br>'
        + '<a class="call-link" href="tel:'+esc(c.phone)+'">Call</a>'
        + '<a class="call-link" href="sms:'+esc(c.phone)+'">Text</a></p>';
    });
  } else {
    h += '<p class="muted">Circles and the people features arrive in a later phase \u2014 in v1, nothing shared leaves this phone. You can still put a person you trust on this rung.</p>';
  }
  h += '<div class="btnrow"><button class="btn secondary small" id="helpArrange" type="button">Arrange my ladder</button></div>';
  h += '</div>';

  /* rung 3 — a professional: live from first open, no setup, never removable */
  h += '<div class="rung far"><h3>Speak with a professional</h3>';
  h += '<p><strong>988 Suicide and Crisis Lifeline</strong> (US)<br>'
    + '<a class="call-link far" href="tel:988">Call 988</a>'
    + '<a class="call-link far" href="sms:988">Text 988</a></p>';
  h += '<p><strong>Crisis Text Line</strong><br>'
    + '<a class="call-link far" href="sms:741741?&amp;body=HOME">Text HOME to 741741</a></p>';
  if(ladder.clinician && ladder.clinician.phone){
    h += '<p><strong>'+esc(ladder.clinician.name || "My clinician")+'</strong><br>'
      + '<a class="call-link far" href="tel:'+esc(ladder.clinician.phone)+'">Call '+esc(ladder.clinician.phone)+'</a></p>';
  }
  h += '<p class="muted small">These standard routes stay on your ladder and can\u2019t be removed by accident. Stepping up from any rung is one tap \u2014 no gates, no \u201care you sure.\u201d</p>';
  h += '</div></div>';
  return h;
}
function bindHelp(){
  el("helpBack").addEventListener("click", function(){ go(helpReturn || "home"); });
  var r = el("helpReceipts"); if(r) r.addEventListener("click", function(){ go("home"); postReceiptsCard(); render(); });
  var n = el("helpNote"); if(n) n.addEventListener("click", function(){ ladderReturn = "help"; go("ladder"); });
  el("helpArrange").addEventListener("click", function(){ ladderReturn = "help"; go("ladder"); });
}

/* ---- arrange the ladder (owner-authored, in calm times, skippable) ---- */
function viewLadder(){
  var h = '<div class="card" style="margin-top:10px">';
  h += '<button class="btn quiet small" id="ladBack" type="button">\u2190 Back</button>';
  h += '<h2 style="margin-top:8px">Arrange your help ladder</h2>';
  h += '<p class="lede muted">Yours to arrange. Stored on this phone only.</p>';
  h += '<h3>A note for a hard day</h3>';
  h += '<p class="muted small">From a calm day, for a hard one.</p>';
  h += '<textarea class="big" id="ladNote" style="min-height:14vh" placeholder="What a hard day needs to hear from you\u2026" aria-label="A note for a hard day">'+esc(ladder.noteForHardDay)+'</textarea>';
  h += '<div class="btnrow"><button class="btn small" id="ladNoteSave" type="button">Save note</button></div>';
  h += '<hr class="divider"><h3>A person</h3>';
  if(ladder.contacts.length){
    ladder.contacts.forEach(function(c, i){
      h += '<p class="small"><strong>'+esc(c.name)+'</strong> \u2014 '+esc(c.phone)
        + ' <button class="btn quiet small" data-delcontact="'+i+'" type="button">Remove</button></p>';
    });
  }
  h += '<input type="text" class="txt" id="ladCName" placeholder="Their name" aria-label="Contact name" style="margin-bottom:8px">';
  h += '<input type="tel" class="txt" id="ladCPhone" placeholder="Their number" aria-label="Contact number">';
  h += '<div class="btnrow"><button class="btn secondary small" id="ladCAdd" type="button">Add</button></div>';
  h += '<hr class="divider"><h3>My clinician or clinic</h3>';
  h += '<input type="text" class="txt" id="ladClinName" placeholder="Name (e.g. my clinic)" value="'+esc(ladder.clinician.name || "")+'" aria-label="Clinician name" style="margin-bottom:8px">';
  h += '<input type="tel" class="txt" id="ladClinPhone" placeholder="Number" value="'+esc(ladder.clinician.phone || "")+'" aria-label="Clinician number">';
  h += '<div class="btnrow"><button class="btn small" id="ladClinSave" type="button">Save</button></div>';
  h += '</div>';
  return h;
}
function bindLadder(){
  el("ladBack").addEventListener("click", function(){ go(ladderReturn || "help"); });
  el("ladNoteSave").addEventListener("click", function(){
    ladder.noteForHardDay = el("ladNote").value.trim();
    saveLadder(); toast = "Saved.";
    render();
  });
  el("ladCAdd").addEventListener("click", function(){
    var n = el("ladCName").value.trim(), ph = el("ladCPhone").value.trim();
    if(!n || !ph){ (n ? el("ladCPhone") : el("ladCName")).focus(); return; }
    ladder.contacts.push({name:n, phone:ph});
    saveLadder(); render();
  });
  document.querySelectorAll("[data-delcontact]").forEach(function(b){
    b.addEventListener("click", function(){
      ladder.contacts.splice(parseInt(b.getAttribute("data-delcontact"), 10), 1);
      saveLadder(); render();
    });
  });
  el("ladClinSave").addEventListener("click", function(){
    ladder.clinician = {name: el("ladClinName").value.trim(), phone: el("ladClinPhone").value.trim()};
    saveLadder(); toast = "Saved to your ladder\u2019s professional rung.";
    render();
  });
}



/* ================= boot ================= */
el("helpBtn").addEventListener("click", function(){
  if(view !== "help"){ helpReturn = view; }
  view = "help";
  render(); window.scrollTo(0,0);
});
render();
