  if(m.type === "playbook") return br("You showed moves that worked before: " + (m.lines || []).join(" / "));
  if(m.type === "precedent") return br("From their record: " + (m.text || ""));
  if(m.type === "pick") return br("You offered a next step: " + (m.title || "") + " — " + (m.body || ""));
  if(m.type === "proposal" || m.type === "understanding"){
    var um = normalizeUnderstandingMessage(m);
    return br("You said back what you heard: " + understandingSentence(um));
  }
  if(m.type === "uchoice") return "";
  if(m.type === "journalcard") return br("You brought their journal card — the recent days, written from this talk");
  if(m.type === "mapcard") return br("You brought their map card — the pieces and how they see them");
  if(m.type === "piececard"){ var p = pieceById(m.pieceId); return br("You brought the card for " + (p ? p.name : "a piece")); }
  if(m.type === "receiptscard") return br("You brought the receipts card — the figured picture and the open claims");
  if(m.type === "playlistcard") return br("You brought their playlist card — the songs they are building with you, one at a time");
  if(m.type === "welcome") return br("You welcomed them back — one line from the room" + (m.roomLine ? ": " + m.roomLine : "") + (m.playlistLine ? " " + m.playlistLine : ""));
  if(m.type === "wordless") return br("The words were hard to find, and you offered the wordless channel: a song can hold what words can't");
  if(m.type === "recordlabel" && m.done) return br("They recorded themselves, and you kept it on their day's page" + (m.label ? " under the name “" + m.label + "”" : "") + " — received, never analyzed");
  if(m.type === "settingscard") return br("You brought the settings card");
  if(m.type === "moveask"){ var me = ledgerEntryById(m.claimId); return br("You asked whether they want to note their move on the claim “" + (me ? shortWords(me.claim, 80) : "") + "”"); }
  if(m.type === "mapGlimpse") return br("You showed a glimpse of their map");
  return ""; /* interactive prompts (claim kinds, detail steps, writing) need no narration */
}
function buildLiveHistory(){
  var msgs = [];
  thread.messages.forEach(function(m){
    if(m.type === "person"){ msgs.push({role:"user", content:String(m.text || "")}); return; }
    if(m.type === "companion"){ if(m.text) msgs.push({role:"assistant", content:String(m.text)}); return; }
    var note = liveHistoryNote(m);
    if(note) msgs.push({role:"assistant", content:note});
  });
  msgs = msgs.filter(function(x){ return x.content && x.content.trim(); });
  /* merge consecutive same-role turns — chat APIs want alternation */
  var merged = [];
  msgs.forEach(function(x){
    var last = merged[merged.length - 1];
    if(last && last.role === x.role) last.content += "\n" + x.content;
    else merged.push({role:x.role, content:x.content});
  });
  if(merged.length > 20) merged = merged.slice(merged.length - 20);
  while(merged.length && merged[0].role !== "user") merged.shift();
  if(merged.length && merged[merged.length - 1].role !== "user") merged.pop();
  return merged;
}
/* the knowledge base, whole, for the live packet (v1.9; widened
   to the CONTEXT BANK in v1.11): the research is the person's own
   experience base — the companion cannot draw on what it cannot
   see. This section is static content, inherently bounded: 22
   items measure 5,505 characters (v1.18). The record digest keeps
   its own 6,500-character cap. Measured whole-system packets:
   9,920 characters on a fresh record at v1.11; 14,003 fresh at
   v1.18 — under the ~17,500 bound. A maximally rich record
   measured ~19,346 at v1.18, over that aspiration: the growth
   since v1.11 is the constitution (8,129 characters at v1.18,
   4,817 at v1.11), not this section — a trim pass is owed. */
function buildKnowledgeBaseSection(){
  var L = ["=== KNOWLEDGE BASE (the research gathered for this person's atlas — findings from others' accounts and studies, in the app's short form. Offer at most one per exchange, only on a genuine match, framed as what others have described) ==="];
  KNOWLEDGE.forEach(function(it){
    L.push("- [" + it.theme + "] " + it.l1 + " More: " + it.l2);
  });
  return L.join("\n");
}
function buildLivePacket(){
  var system = liveConstitution() + "\n\n" + buildRecordDigest()
    + "\n\n" + buildKnowledgeBaseSection();
  /* organizing notes: the facts figured at this message's moment,
     PLUS the day-shape facts — computed fresh on every packet, so
     even talk that matches nothing hands the model something true
     about the shape of the record to build on (v1.9). The model
     may build on them; the code does not also post them as lines
     (no double-posting). */
  var notes = (thread.orgNotes || []).slice();
  dayShapeFacts().forEach(function(f){
    if(notes.indexOf(f) === -1) notes.push(f);
  });
  if(notes.length){
    system += "\n\n=== ORGANIZING NOTES (figured by the app from what they have already communicated — facts about this talk you may build on; you need not repeat them, and they never replace what the person said) ===\n"
      + notes.map(function(n){ return "- " + n; }).join("\n");
  }
  if(thread.orgNotes && thread.orgNotes.length){
    thread.orgNotes = [];
    saveThread();
  }
  return {
    system: system,
    messages: buildLiveHistory()
  };
}
/* ---- transport: straight from the browser to the provider ---- */
function liveFetch(url, opts){
  if(typeof AbortController !== "undefined"){
    var ctl = new AbortController();
    var to = setTimeout(function(){ ctl.abort(); }, 30000);
    var withSig = {};
    Object.keys(opts).forEach(function(k){ withSig[k] = opts[k]; });
    withSig.signal = ctl.signal;
    return fetch(url, withSig).then(function(r){ clearTimeout(to); return r; },
      function(e){ clearTimeout(to); throw e; });
  }
  return fetch(url, opts);
}
function fetchLiveReply(){
  var packet = buildLivePacket();
  if(!packet.messages.length) return Promise.resolve(null);
  var req, parse;
  if(liveai.provider === "openai"){
    req = liveFetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + liveai.key.trim()},
      body:JSON.stringify({model:liveai.model.trim(), max_tokens:700,
        messages:[{role:"system", content:packet.system}].concat(packet.messages)})
    });
    parse = function(j){
      return (j && j.choices && j.choices[0] && j.choices[0].message) ? j.choices[0].message.content : "";
    };
  } else {
    req = liveFetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json", "x-api-key":liveai.key.trim(),
        "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:liveai.model.trim(), max_tokens:700,
        system:packet.system, messages:packet.messages})
    });
    parse = function(j){
      if(!j || !j.content) return "";
      return j.content.filter(function(b){ return b && b.type === "text"; })
        .map(function(b){ return b.text || ""; }).join("\n");
    };
  }
  return req.then(function(r){
    if(!r.ok){
      if(r.status === 401 || r.status === 403) noteLiveKeyFailure();
      return null;
    }
    return r.json();
  }).then(function(j){
    if(j == null) return null;
    var t = parse(j);
    t = (t == null ? "" : String(t)).trim();
    return t || null;
  }).catch(function(){ return null; });
}
function requestLiveReply(){
  /* serialized: a second message sent mid-answer queues its own call,
     so replies land in the order the person spoke */
  liveChain = liveChain.then(function(){
    var typing = pushMsg({type:"typing"});
    render();
    function settle(text){
      thread.messages = thread.messages.filter(function(x){ return x.id !== typing.id; });
      if(text){
        pushMsg({type:"companion", live:true, text:text});
      } else {
        pushMsg({type:"companion", text:ACK_LINES[thread.messages.length % ACK_LINES.length]});
      }
      render();
    }
    return Promise.resolve()
      .then(function(){ return fetchLiveReply(); })
      .then(settle, function(){ settle(null); });
  });
}

/* ---- asking for a view: simple intent matching on the person's words ----
   Distinctive nouns (journal, map, receipts, claims, settings…) are
   requests on their own. Ambiguous words (today, my day, this week,
   who, a piece's name) count as requests only alongside a request
   word, so a pour that merely mentions them stays a pour. */
function detectIntent(text){
  var low = " " + text.toLowerCase().replace(/[^a-z0-9'\s]/g, " ") + " ";
  function w(x){ return low.indexOf(" " + x + " ") !== -1; }
  var req = ["show","see","open","bring","check","look","what","how","give"].some(function(x){ return w(x); });
  var pieceHit = null;
  atlas.pieces.forEach(function(p){
    var names = [p.name].concat((p.nameHistory || []).map(function(n){ return n.name; }));
    names.forEach(function(nm){
      if(nm && low.indexOf(" " + nm.toLowerCase()) !== -1) pieceHit = p;
    });
  });
  /* recording himself (v1.17): "record me" / "I want to record" is
     a door, not material — it opens the recording card in the talk */
  if(low.indexOf(" record me ") !== -1 || low.indexOf(" want to record ") !== -1
     || low.indexOf(" record myself ") !== -1)
    return {kind:"record"};
  if(w("receipts") || w("claims") || low.indexOf(" track record ") !== -1
     || (pieceHit && (w("record") || w("claims") || w("receipts"))))
    return {kind:"receipts"};
  if(w("settings") || w("export") || w("import") || w("erase") || w("reshape") || low.indexOf(" my data ") !== -1)
    return {kind:"settings"};
  /* adding a song by talking: "add X by Y to my playlist" — the
     words themselves carry the song; the confirm flow does the rest */
  var addM = String(text).match(/\badd\s+(.+?)\s+to\s+my\s+playlist/i)
          || String(text).match(/\bput\s+(.+?)\s+on\s+my\s+playlist/i);
  if(addM){
    var spx = splitSongText(addM[1]);
    if(spx.title) return {kind:"songadd", title:spx.title, artist:spx.artist};
  }
  if(w("playlist") || low.indexOf(" my songs ") !== -1) return {kind:"playlist"};
  if(w("journal")) return {kind:"journal"};
  if((w("today") || low.indexOf(" my day ") !== -1 || low.indexOf(" this week ") !== -1) && req)
    return {kind:"journal"};
  if(w("map")) return {kind:"map"};
  if(pieceHit && req) return {kind:"piece", pieceId:pieceHit.id};
  if(w("who") && req) return {kind:"map"};
  return null;
}
function routeIntent(it){
  if(it.kind === "journal") postJournalCard("week");
  else if(it.kind === "map") postMapCard(0);
  else if(it.kind === "piece") postPieceCard(it.pieceId);
  else if(it.kind === "receipts") postReceiptsCard();
  else if(it.kind === "settings") postSettingsCard();
  else if(it.kind === "playlist") postPlaylistCard();
  else if(it.kind === "songadd") postSongConfirm(it.title, it.artist, "", "");
  else if(it.kind === "record") postRecordCard();
}
function sendThreadText(){
  var ta = el("threadInput");
  if(!ta) return;
  var text = ta.value.trim();
  if(!text){ ta.focus(); return; }
  ta.value = "";
  if(writeMode){
    /* writing in the talk: saved to the journal store, verbatim,
       never analyzed, never filed anywhere else */
    journal.entries.push({id:uid(), ts:Date.now(), prompt:writeMode.prompt || "", text:text});
    saveJournal();
    pushMsg({type:"person", text:text});
    render();
    return;
  }
  if(textAsk){
    /* the companion asked for words — a move, an outcome, a name —
       and this message is the answer, landing where it was aimed */
    pushMsg({type:"person", text:text});
    handleTextAsk(text);
    render();
    return;
  }
  if(detail && detail.textField){
    /* a detail step asked for his own words; they fill the field */
    pushMsg({type:"person", text:text});
    handleDetailText(text);
    render();
    return;
  }
  var intent = detectIntent(text);
  if(intent){
    /* a request, not a pour: the companion brings the view as a card.
       Requests win over modes — even mid-correction, asking for a
       view brings the view, it doesn't become a correction note. */
    pushMsg({type:"person", text:text});
    flushPendingPour();
    routeIntent(intent);
    render();
    return;
  }
  if(correctionDay){
    /* corrections file as part of the talk AND are proposed for the
       day — never applied silently */
    var evC = filePourEvent(text);
    pushMsg({type:"person", text:text, eventId:evC.id});
    pushMsg({type:"correctNote", dayKey:correctionDay, note:text, kept:false, skipped:false});
    render();
    return;
  }
  var social = socialKind(text);
  if(social){
    /* small talk is conversation, never material (v1.15): a person
       answers in the companion's voice; nothing is filed, nothing
       is echoed back, no playback is formed */
    pushMsg({type:"person", text:text});
    noteSocialMessage(social, text);
    render();
    return;
  }
  if(protestIn(text)){
    /* protest is received, never routed (v1.14): it files as life,
       verbatim, and the whole reply is witness — no playback, no
       doors, no facts, and nothing in it can trip the ledger-read
       interruption, because it never touches the ledger */
    fileLifeEntry(text);
    pushMsg({type:"person", text:text});
    noteProtestMessage(text);
    render();
    return;
  }
  if(!voiceSignalIn(text)){
    /* the life lane (v1.14): ordinary talk — his day, feelings,
       thoughts, the interesting things — kept on the day's page
       in his own words and answered as conversation */
    fileLifeEntry(text);
    pushMsg({type:"person", text:text});
    noteLifeMessage(text);
    render();
    return;
  }
  var ev = filePourEvent(text);
  pushMsg({type:"person", text:text, eventId:ev.id});
  notePourMessage(ev);
  render();
}

/* Piece tallies (channels, registers) are counts built from events. When an
   entry is edited, its old contribution is lifted out before the new one is
   laid in. Body spots and seeing are left as-is on removal: both are unions
   across the whole record, and unlearning them from one edit could erase
   what other entries taught. */
function adjustPiecesForEvent(ev, dir){
  (ev.whoIds || []).forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    if(!pc.channels) pc.channels = {};
    if(!pc.registers) pc.registers = {};
    (ev.channels || []).forEach(function(c){
      pc.channels[c] = (pc.channels[c] || 0) + dir;
      if(pc.channels[c] <= 0) delete pc.channels[c];
    });
    (ev.register || []).forEach(function(r){
      pc.registers[r] = (pc.registers[r] || 0) + dir;
      if(pc.registers[r] <= 0) delete pc.registers[r];
    });
  });
}

function fileCapture(){
  var d = cap;
  var ts = Date.now();
  var editingEv = null;
  var toldForCap = d.toldTs || ts;
  if(d.timeExplicit && TOLD_TIME_BUCKETS[d.timeBucket]){
    ts = (d.timeBucket === "unknown" || d.timeBucket === "now")
      ? toldForCap
      : toldForCap - TOLD_TIME_BUCKETS[d.timeBucket].days * 86400000;
  }
  if(d.editEventId){
    for(var ei=0;ei<atlas.events.length;ei++){
      if(atlas.events[ei].id === d.editEventId){ editingEv = atlas.events[ei]; break; }
    }
    if(editingEv){ adjustPiecesForEvent(editingEv, -1); ts = editingEv.ts; }
  }
  var involved = d.whoIds.slice();
  var newId = "";
  if(newPieceWanted()){
    newId = uid();
    var p = {
      id:newId, name: defaultPieceName(),
      nameHistory:[{name: defaultPieceName(), ts:ts}],
      type: newPieceType(), likeness: d.newPiece.likeness || "", status: d.newPiece.status || "",
      standing: !!d.newPiece.standing,
      seeing:"", seeingTs:0, registers:{}, channels:{}, bodySpots:[], created:ts
    };
    atlas.pieces.push(p);
    involved.push(newId);
  }
  var seeing = d.seeingOwn.trim() || d.seeingChip;
  var spots = d.bodySpots.slice(); if(d.bodySpotOwn) uniqPush(spots, d.bodySpotOwn.trim());
  involved.forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    if(!pc.channels) pc.channels = {};
    if(!pc.registers) pc.registers = {};
    if(!pc.bodySpots) pc.bodySpots = [];
    d.channels.forEach(function(c){ pc.channels[c] = (pc.channels[c]||0) + 1; });
    d.register.forEach(function(r){ pc.registers[r] = (pc.registers[r]||0) + 1; });
    spots.forEach(function(s){ uniqPush(pc.bodySpots, s); });
    if(seeing){ pc.seeing = seeing; pc.seeingTs = ts; }
  });
  var ledgerId = "";
  var editingOldLedgerId = editingEv ? (editingEv.claimLedgerId || "") : "";
  if(d.claimKind){
    var cw = claimWhoOf(d);
    var whoId = cw.id === "__new" ? newId : cw.id;
    var claimFields = {
      claim: claimTextOf(d), kind: d.claimKind,
      who: cw.id === "__new" ? defaultPieceName() : cw.name, whoId: whoId || "",
      encoded: d.claimChips.indexOf("It charged me with something it won\u2019t say plainly") !== -1
    };
    var claimTime = {};
    if(d.timeExplicit){
      if(d.timeBucket === "unknown") claimTime = {timeUnknown:true, toldTs:toldForCap};
      else if(d.timeBucket !== "now") claimTime = {remembered:true, toldTs:toldForCap};
    } else if(editingEv){
      if(editingEv.timeUnknown) claimTime = {timeUnknown:true, toldTs:editingEv.toldTs || toldForCap};
      else if(editingEv.remembered) claimTime = {remembered:true, toldTs:editingEv.toldTs || toldForCap};
    }
    var updatedOld = false;
    var newClaimEntry = null;
    if(editingOldLedgerId){
      ledger.entries.forEach(function(e){
        if(e.id === editingOldLedgerId){
          e.claim = claimFields.claim; e.kind = claimFields.kind;
          e.who = claimFields.who; e.whoId = claimFields.whoId; e.encoded = claimFields.encoded;
          e.ts = ts;
          if(claimTime.timeUnknown){ e.timeUnknown = true; e.toldTs = claimTime.toldTs; delete e.remembered; }
          else if(claimTime.remembered){ e.remembered = true; e.toldTs = claimTime.toldTs; delete e.timeUnknown; }
          else { delete e.timeUnknown; delete e.remembered; delete e.toldTs; }
          ledgerId = e.id; updatedOld = true;
        }
      });
    }
    if(!updatedOld){
      ledgerId = uid();
      ledger.entries.push({
        id:ledgerId, claim: claimFields.claim, kind: claimFields.kind,
        who: claimFields.who, whoId: claimFields.whoId,
        ts:ts, outcome:"", outcomeChip:"", tsOutcome:0,
        encoded: claimFields.encoded
      });
      newClaimEntry = ledger.entries[ledger.entries.length - 1];
      if(claimTime.timeUnknown){ newClaimEntry.timeUnknown = true; newClaimEntry.toldTs = claimTime.toldTs; }
      else if(claimTime.remembered){ newClaimEntry.remembered = true; newClaimEntry.toldTs = claimTime.toldTs; }
    }
    saveLedger();
    if(newClaimEntry) afterClaimFiled(newClaimEntry);
  } else if(editingOldLedgerId){
    /* the claim was removed in Add detail — its ledger entry goes with it */
    ledger.entries = ledger.entries.filter(function(e){ return e.id !== editingOldLedgerId; });
    saveLedger();
  }
  var glossId = "";
  if(d.glossTerm){
    glossId = uid();
    atlas.glossary.push({
      id:glossId, term:d.glossTerm.trim(), does:d.glossDoes || "", doesOwn:d.glossDoesOwn || "",
      whoIds: involved.slice(),
      whoText: involved.map(function(id){ return pieceName(id); }).filter(Boolean).join(", "),
      ts:ts
    });
  }
  var evFields = {
    mode:d.mode, pourText:d.pourText || "",
    whoIds: involved, whoFlags: d.whoFlags.slice(), whoOwn: d.whoOwn,
    channels: d.channels.slice(), mannerWhere: d.mannerWhere.slice(), mannerHow: d.mannerHow.slice(),
    bodySpots: spots, among: d.among.slice(),
    claimLedgerId: ledgerId, register: d.register.slice(),
    seeing: seeing, response: d.response.slice(),
    glossaryId: glossId || (editingEv ? (editingEv.glossaryId || "") : ""), eventOwn: d.eventOwn
  };
  if(d.timeExplicit){
    evFields.timeBucket = d.timeBucket; evFields.timePhrase = d.timeLabel;
    if(d.timeBucket === "unknown"){ evFields.timeUnknown = true; evFields.toldTs = toldForCap; }
    else if(d.timeBucket !== "now"){ evFields.remembered = true; evFields.toldTs = toldForCap; }
  }
  if(editingEv){
    Object.keys(evFields).forEach(function(k){ editingEv[k] = evFields[k]; });
    if(d.timeExplicit) applyToldTime(editingEv, timeInfoForBucket(d.timeBucket), toldForCap);
    /* enriched: a fragment that gains detail becomes a full entry */
    delete editingEv.type; delete editingEv.fragmentText; delete editingEv.filed;
  } else {
    evFields.id = uid(); evFields.ts = ts;
    atlas.events.push(evFields);
  }
  saveAtlas();
  cap = null;
}

/* ================= the map's shared pieces =================
   Type labels, tally helpers and per-piece receipts lines — used
   by the map and piece cards the companion brings into the thread. */
var TYPE_LABELS = {voice:"Voice", presence:"Felt presence", group:"Group", other:"Not a person, exactly"};
function topKeys(counts, n){
  return Object.keys(counts || {}).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, n || 4);
}
function miniChips(items){
  if(!items.length) return "";
  return '<div class="mini-chips">' + items.map(function(i){ return '<span>'+esc(i)+'</span>'; }).join("") + '</div>';
}
function receiptsLine(p){

  return '<p class="small">Receipts: '+r.total+(r.total===1?" claim":" claims")+' said, '+r.checked+' checked'
    + (r.checked ? ' \u2014 '+r.held+' held up, '+r.didnt+' didn\u2019t' : '')

/* ================= the dynamic journal — the day data =================
   The journal still assembles itself from the record, day by day:
   his words verbatim and dominant, the companion's part connective
   tissue and figuring only — claims as they logged and closed, his
   moves, the receipts figured (stamped on the day they were
   figured), precedents surfaced, knowledge offered. It renders as
   a card in the thread now (journalCardHTML); this is the data
   under it, and the correction flow that starts from its days. */
function journalPrompts(){
  var prompts = [
    "What did they claim this week that never happened?",
    "Which voice has been quiet lately \u2014 and what changed?",
    "Write the moment they defined for you, in your words instead."
  ];
  var pers = [];
  /* a quiet op, named */
  var lastSeen = {};
  atlas.events.forEach(function(ev){ if(ev.timeUnknown) return; (ev.whoIds||[]).forEach(function(id){
    if(!lastSeen[id] || ev.ts > lastSeen[id]) lastSeen[id] = ev.ts;
  }); });
  var quietId = "", quietTs = Infinity;
  Object.keys(lastSeen).forEach(function(id){ if(lastSeen[id] < quietTs){ quietTs = lastSeen[id]; quietId = id; } });
  if(quietId && Date.now() - quietTs > 86400000){
    var qp = pieceById(quietId);
    if(qp) pers.push(qp.name + " has been quiet since " + relDay(quietTs) + ". What\u2019s different?");
  }
  /* an unchecked claim, named */
  var open = openClaims();
  if(open.length) pers.push("Still open: \u201c" + open[0].claim + "\u201d What has actually happened since?");
  /* a claim that failed, named */
  var failed = ledger.entries.filter(function(e){ return e.outcomeChip === "didnt"; });
  if(failed.length){
    var f = failed[failed.length - 1];
    pers.push((f.who ? f.who : "A voice") + " claimed \u201c" + f.claim + "\u201d \u2014 and it didn\u2019t happen. What does their record look like now?");
  }
  return pers.concat(prompts);
}
function dayKeyOf(ts){
  var d = new Date(ts);
  var mo = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (mo < 10 ? "0" + mo : mo) + "-" + (dd < 10 ? "0" + dd : dd);
}
function dayLabel(key){
  var p = key.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
}
function fmtTime(ts){
  return new Date(ts).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
}
function evWords(ev){
  return ev.fragmentText || ev.pourText || ev.eventOwn || "";
}
/* The journal's spine is the day something was TOLD — every entry
   lives under the day it was communicated, full stop. A stated when
   stays inside the entry as part of the telling (an in-entry tag);
   it never moves the entry to another day. */
function journalToldKeyForEvent(ev){ return dayKeyOf(ev.toldTs || ev.ts); }
function journalToldKeyForClaim(e){ return dayKeyOf(e.toldTs || e.ts); }
function journalDayData(key){
  var d = {key:key, pours:[], writings:[], claimsLog:[], claimsClosed:[], moves:[],
           fig:null, prec:[], know:null, corrections:[], hiddenItems:[], verbatim:[], clips:[]};
  atlas.events.forEach(function(ev){
    if(journalToldKeyForEvent(ev) !== key) return;
    if(djournal.hidden[ev.id]){ d.hiddenItems.push({id:ev.id, text:evWords(ev)}); return; }
    d.pours.push(ev);
    d.verbatim.push({id:ev.id, text:evWords(ev)});
  });
  journal.entries.forEach(function(en){
    if(dayKeyOf(en.ts) !== key) return;
    if(djournal.hidden[en.id]){ d.hiddenItems.push({id:en.id, text:en.text}); return; }
    d.writings.push(en);
    d.verbatim.push({id:en.id, text:en.text});
  });
  media.clips.forEach(function(c){
    if(dayKeyOf(c.ts) !== key) return;
    d.clips.push(c); /* his recordings sit on the day they were told, like everything else (v1.17) */
  });
  ledger.entries.forEach(function(e){
    if(journalToldKeyForClaim(e) === key) d.claimsLog.push(e);
    if(e.move && e.move.trim()){
      if(dayKeyOf(e.tsOutcome || e.toldTs || e.ts) === key) d.moves.push(e);
    } else if(isChecked(e) && e.tsOutcome && dayKeyOf(e.tsOutcome) === key && journalToldKeyForClaim(e) !== key){
      d.claimsClosed.push(e);
    }
  });
  if(djournal.dayFig[key]) d.fig = djournal.dayFig[key].slice();
  d.prec = (djournal.precedents[key] || []).slice();
  d.know = djournal.knowledgeDays[key] || null;
  d.corrections = (djournal.corrections[key] || []).slice();
  d.pours.sort(function(a,b){ return a.ts - b.ts; });
  d.writings.sort(function(a,b){ return a.ts - b.ts; });
  d.claimsLog.sort(function(a,b){ return a.ts - b.ts; });
  d.claimsClosed.sort(function(a,b){ return (a.tsOutcome || 0) - (b.tsOutcome || 0); });
  d.moves.sort(function(a,b){ return (a.tsOutcome || a.ts) - (b.tsOutcome || b.ts); });
  d.clips.sort(function(a,b){ return a.ts - b.ts; });
  return d;
}
function journalHasContent(d){
  return !!(d.pours.length || d.writings.length || d.claimsLog.length || d.claimsClosed.length
    || d.moves.length || d.fig || d.prec.length || d.know || d.corrections.length || d.hiddenItems.length
    || (d.clips && d.clips.length));
}
function journalDayKeys(){
  var seen = {};
  atlas.events.forEach(function(ev){ seen[journalToldKeyForEvent(ev)] = 1; });
  journal.entries.forEach(function(en){ seen[dayKeyOf(en.ts)] = 1; });
  media.clips.forEach(function(c){ seen[dayKeyOf(c.ts)] = 1; });
  ledger.entries.forEach(function(e){
    seen[journalToldKeyForClaim(e)] = 1;
    if(e.tsOutcome) seen[dayKeyOf(e.tsOutcome)] = 1;
  });
  Object.keys(djournal.dayFig).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.precedents).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.knowledgeDays).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.corrections).forEach(function(k){ seen[k] = 1; });
  return Object.keys(seen).sort().reverse();
}
function shortWords(text, n){
  var t = String(text || "").replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}

function startCorrectDay(key){
  clearModes();
  correctionDay = key;
  view = "home";
  var d = journalDayData(key);
  var actions = [];
  d.verbatim.forEach(function(v){
    actions.push({act:"hide", eventId:v.id, label:"Hide: " + (shortWords(v.text, 28) || "something you said")});
  });
  if(d.fig){
    actions.push({act:"editfig", label:"Rewrite the figures"});
    actions.push({act:"dropfig", label:"Take the figures off this day"});
  }
  actions.push({act:"donecorrect", label:"That’s all"});
  pushMsg({type:"correct", dayKey:key, actions:actions,
    text:"What’s off about " + dayLabel(key) + "? Say it here — your words go on the day as a correction, word for word. Your pours and writings are never rewritten; you can hide one from the journal, and the figuring is mine to fix."});
  render();
}

/* ================= views, brought into the talk =================
   The Journal, the Map, the Receipts and the Settings are not
   screens anymore. The companion brings them into the thread as
   cards — when the person asks, and when its own surfacing chooses
   them. Cards store only type + references and re-render from the
   record stores, so the thread cap never bloats with markup.
   Every control on a card works in place. */
function ledgerEntryById(id){
  for(var i=0;i<ledger.entries.length;i++) if(ledger.entries[i].id === id) return ledger.entries[i];
  return null;
}
function cardBubble(label, inner, cls){
  return '<div class="msg them"><div class="bubble wide'+(cls ? ' '+cls : '')+'">'
    + (label ? '<p class="hub-label">'+esc(label)+'</p>' : '') + inner + '</div></div>';
}

/* ---- the journal card: today + this week, condensed; earlier days a tap away ---- */
function startOfWeekKey(){
  var d = new Date();
  var dow = (d.getDay() + 6) % 7; /* Monday = 0 */
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  return dayKeyOf(mon.getTime());
}
function postJournalCard(scope, beforeKey){
  pushMsg({type:"journalcard", scope:scope || "week", beforeKey:beforeKey || ""});
}
function journalCardHTML(m){
  var keys = journalDayKeys();
  var wk = startOfWeekKey();
  var show = [], olderKey = "";
  if(m.scope === "earlier"){
    var before = m.beforeKey || wk;
    show = keys.filter(function(k){ return k < before; }).slice(0, 7);
    if(show.length){
      var lastK = show[show.length - 1];
      if(keys.some(function(k){ return k < lastK; })) olderKey = lastK;
    }
  } else {
    show = keys.filter(function(k){ return k >= wk; });
    if(keys.some(function(k){ return k < wk; })) olderKey = wk;
  }
  var body = "";
  if(!show.length)
    body = '<p style="margin:4px 0">Nothing there yet — the journal writes itself from our talk, day by day, your words first.</p>';
  show.forEach(function(k){ body += journalCardDayHTML(m, k); });
  if(olderKey)
    body += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':jearlier:'+olderKey+'">Earlier days</button></div>';
  return cardBubble("Journal", body);
}
/* one recording on the day's page (v1.17): its label above it, the
   player under it — the element renders with no src and is pointed
   at its IndexedDB blob once the thread binds (hydrateMediaElements),
   so it plays the same after a reload. Taking it off goes through
   the standard confirm, and removes blob + metadata together. */
function mediaClipHTML(cardMsg, c){
  if(c.kind === "photo"){
    /* an attached photo on the day's page (v1.25): the picture
       under its day, viewable in place — same hydrate path,
       same take-it-off, no label, no caption */
    return '<div class="jitem"><p class="small muted" style="margin:4px 0 0">Photo · ' + esc(fmtTime(c.ts)) + '</p>'
      + '<img class="jmedia" data-media-src="'+c.id+'" alt="A photo you kept">'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+cardMsg.id+':mediadelask:'+c.id+'">Take it off</button></div></div>';
  }
  if(c.kind === "video" && c.attached){
    /* an attached video on the day's page (v1.26): the same
       video player the recordings use, under its day — no
       label, no caption, same take-it-off */
    return '<div class="jitem"><p class="small muted" style="margin:4px 0 0">Video · ' + esc(fmtTime(c.ts)) + '</p>'
      + '<video class="jmedia" controls playsinline preload="metadata" data-media-src="'+c.id+'" aria-label="A video you kept"></video>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+cardMsg.id+':mediadelask:'+c.id+'">Take it off</button></div></div>';
  }
  if(c.kind === "file"){
    /* an attached file on the day's page (v1.26): a card with
       its name and size; the card itself is the door — an
       anchor the hydrate path points at the kept bytes, so
       it opens/downloads from this phone only */
    var jname = c.name || "Untitled file";
    var jsize = fmtFileSize(c.size);
    return '<div class="jitem"><p class="small muted" style="margin:4px 0 0">File · ' + esc(fmtTime(c.ts)) + '</p>'
      + '<a class="jfile" data-media-src="'+c.id+'" download="'+esc(jname)+'"><span class="file-ico">'+ATTACH_FILE_GLYPH+'</span>'
      + '<span class="file-meta"><strong>'+esc(jname)+'</strong>'
      + (jsize ? '<small>'+esc(jsize)+'</small>' : '') + '</span></a>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+cardMsg.id+':mediadelask:'+c.id+'">Take it off</button></div></div>';
  }
  var tag = c.kind === "video"
    ? '<video class="jmedia" controls playsinline preload="metadata" data-media-src="'+c.id+'" aria-label="Your video recording"></video>'
    : '<audio class="jmedia" controls preload="metadata" data-media-src="'+c.id+'" aria-label="Your voice recording"></audio>';
  return '<div class="jitem"><p class="small muted" style="margin:4px 0 0">'
    + (c.kind === "video" ? "Video" : "Recording") + ' · ' + esc(fmtTime(c.ts))
    + (c.seconds ? ' · ' + fmtDuration(c.seconds) : '') + '</p>'
    + (c.label ? '<p style="margin:2px 0"><strong>' + esc(c.label) + '</strong></p>' : '')
    + tag
    + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+cardMsg.id+':mediadelask:'+c.id+'">Take it off</button></div></div>';
}
function journalCardDayHTML(m, key){
  var d = journalDayData(key);
  var h = '<div class="cardblock"><p style="margin:2px 0"><strong>'+esc(dayLabel(key))+'</strong></p>';
  var items = 0;
  /* the day's moments in the order they were told — pours,
     writings, and his recordings in one timeline (v1.17). Text
     condenses to three, as before; a recording always shows —
     he made it on purpose. */
  var moments = [];
  d.pours.forEach(function(ev){ moments.push({ts:ev.toldTs || ev.ts, tie:ev.ts, kind:"pour", ev:ev}); });
  d.writings.forEach(function(en){ moments.push({ts:en.ts, tie:en.ts, kind:"writing", en:en}); });
  (d.clips || []).forEach(function(c){ moments.push({ts:c.ts, tie:c.ts, kind:"clip", clip:c}); });
  moments.sort(function(a,b){ return (a.ts - b.ts) || (a.tie - b.tie); });
  moments.forEach(function(mo){
    if(mo.kind === "clip"){ h += mediaClipHTML(m, mo.clip); return; }
    if(items >= 3) return;
    if(mo.kind === "pour"){
      var ev = mo.ev;
      var wtxt = evWords(ev);
      if(!wtxt) return;
      var isFrag = ev.mode === "fragment" || ev.type === "fragment";
      var tag = isFrag ? "Fragment" : (ev.mode === "quick" ? "Quick note" : "A pour");
      var names = (ev.whoIds || []).map(function(id){ return pieceName(id); }).filter(Boolean).join(", ");
      var whenTag = ev.timeUnknown ? " · from some time back" : (ev.remembered ? " · remembered — " + (ev.timePhrase || "earlier") : "");
      h += '<p class="small muted" style="margin:4px 0 0">'+esc(tag)+' · '+esc(fmtTime(ev.toldTs || ev.ts))+esc(whenTag)+(names ? ' — '+esc(names) : '')+'</p>'
        + '<p style="margin:2px 0">'+esc(shortWords(wtxt, 150))+'</p>';
      items++;
    } else {
      var en = mo.en;
      h += '<p class="small muted" style="margin:4px 0 0">'+(en.prompt ? esc(shortWords(en.prompt, 60)) : 'Journal')+' · '+esc(fmtTime(en.ts))+'</p>'
        + '<p style="margin:2px 0">'+esc(shortWords(en.text, 150))+'</p>';
      items++;
    }
  });
  var extraN = (d.pours.length + d.writings.length) - items;
  if(extraN > 0) h += '<p class="small muted" style="margin:2px 0">…and '+extraN+' more '+(extraN === 1 ? "thing" : "things")+' that day.</p>';
  d.claimsLog.forEach(function(e){
    h += '<p class="small" style="margin:3px 0">A claim was said — &ldquo;'+esc(shortWords(e.claim, 90))+'&rdquo;'
      + (e.who ? ' — '+esc(e.who) : '')
      + (e.timeUnknown ? ' — from some time back' : (e.remembered ? ' — remembered' : ''))
      + (isChecked(e) ? ' — checked: '+esc(outcomeLabel(e)) : '') + '.</p>';
  });
  d.claimsClosed.forEach(function(e){
    h += '<p class="small" style="margin:3px 0">&ldquo;'+esc(shortWords(e.claim, 90))+'&rdquo; was checked — '+esc(outcomeLabel(e))+'.</p>';
  });
  d.moves.forEach(function(e){
    h += '<p class="small" style="margin:3px 0"><strong>Your move</strong> — on &ldquo;'+esc(shortWords(e.claim, 70))+'&rdquo;: '+esc(e.move)
      + (isChecked(e) ? ' It ended: '+esc(outcomeShort(e))+'.' : '') + '</p>';
  });
  if(d.fig){
    h += '<div style="margin-top:6px"><p class="hub-label">Receipts, figured</p>'
      + d.fig.map(function(l){ return '<p class="small" style="margin:3px 0">'+esc(l)+'</p>'; }).join("") + '</div>';
  }
  d.prec.forEach(function(t){
    h += '<p class="small" style="margin:3px 0">'+esc(t)+'</p>';
  });
  if(d.know) h += '<p class="small muted" style="margin:3px 0">Offered — from others’ accounts: '+esc(shortWords(d.know.l1, 110))+'</p>';
  d.corrections.forEach(function(c){
    h += '<p class="small" style="margin:3px 0"><strong>Your correction:</strong> '+esc(shortWords(c.text, 140))+'</p>';
  });
  if(d.hiddenItems.length){
    h += '<p class="small muted" style="margin:3px 0">'+d.hiddenItems.length
      + (d.hiddenItems.length === 1 ? " thing you" : " things you") + ' kept out of this journal. '
      + (journalHiddenShown[key]
          ? '<button type="button" class="chip" data-tchip="'+m.id+':jhidehid:'+key+'">Put them away</button>'
          : '<button type="button" class="chip" data-tchip="'+m.id+':jshowhid:'+key+'">See them</button>')
      + '</p>';
    if(journalHiddenShown[key]){
      d.hiddenItems.forEach(function(it){
        h += '<div class="jhidden"><p style="margin:3px 0">'+esc(shortWords(it.text, 140))+'</p>'
          + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':junhide:'+it.id+'">Put it back in the journal</button></div></div>';
      });
    }
  }
  h += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':jcorrect:'+key+'">Correct this day</button></div>';
  h += '</div>';
  return h;
}

/* ---- the map card: pieces with counts and their seeing lines ---- */

}

function exportRecord(){
  /* The export is the record itself: a flat map of store names to
     their values, exactly what Import reads back — so a record that
     leaves this phone can come home to any phone, whole. */
  var data = {};
  Object.keys(K).forEach(function(name){
    var key = K[name];
    var raw = null;
    try{ raw = localStorage.getItem(key); }catch(e){}
    if(raw === null || raw === undefined) return;
    var val;
    try{ val = JSON.parse(raw); }catch(e){ val = raw; }
    if(key === K.liveai && val && typeof val === "object"){
      /* the live-companion settings travel with the record — the key itself never does */
      val = {provider: val.provider, model: val.model, on: !!val.on};
    }
    data[key] = val;
  });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ever-present-record.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 400);
}

/* ---- import: bring a record home from an export file ----
   The file must be what Export writes — an object keyed by store
   names. Anything else is refused, plainly, and nothing changes.
   The live-companion key is never read out of a file and never
   overwritten by one: it lives on this device only, so the device's
   own key survives an import untouched. */
var pendingImport = null;
/* recordings don't travel yet (v1.17): the media store is left out
   of import entirely — a file's recording index is simply not read */
var IMPORT_KEYS = Object.keys(K).map(function(name){ return K[name]; })
  .filter(function(key){ return key !== K.media; });
function importParse(text){
  var data;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  if(!data || typeof data !== "object" || Array.isArray(data)) return null;
  var stores = {}, found = 0, bad = false;
  Object.keys(data).forEach(function(key){
    if(bad || IMPORT_KEYS.indexOf(key) === -1) return; /* keys that aren't stores are simply not part of the record */
    var val = data[key];
    if(typeof val === "string"){
      try{ JSON.parse(val); }catch(e){ bad = true; return; } /* a store's value must itself be readable */
    }
    stores[key] = val; found++;
  });
  if(bad || !found) return null;
  return stores;
}
function importRejected(){
  pendingImport = null;
  pushMsg({type:"companion", text:"That file doesn’t look like an Ever Present export. Nothing was changed."});
  render();
}
function handleImportFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var stores = importParse(String(reader.result || ""));
    if(!stores){ importRejected(); return; }
    pendingImport = stores;
    pushMsg({type:"confirmact", kind:"import", done:""});
    render();
  };
  reader.onerror = function(){ importRejected(); };
  try{ reader.readAsText(file); }catch(e){ importRejected(); }
}
function pickImportFile(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.style.display = "none";
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(f) handleImportFile(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
function applyImport(stores){
  var deviceKey = "";
  try{
    var cur = storeLoad(K.liveai, liveaiBlank);
    if(cur && typeof cur.key === "string") deviceKey = cur.key;
  }catch(e){}
  var kill = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("ever_present") === 0) kill.push(k);
  }
  kill.forEach(function(k){ localStorage.removeItem(k); });
  Object.keys(stores).forEach(function(key){
    var val = stores[key];
    if(key === K.liveai){
      var lv = val;
      if(typeof lv === "string"){ try{ lv = JSON.parse(lv); }catch(e){ lv = null; } }
      if(!lv || typeof lv !== "object") lv = {};
      var clean = {};
      Object.keys(lv).forEach(function(p){ if(p !== "key") clean[p] = lv[p]; });
      clean.key = deviceKey; /* this device's key stays this device's */
      localStorage.setItem(key, JSON.stringify(clean));
    } else if(typeof val === "string"){
      localStorage.setItem(key, val);
    } else {
      localStorage.setItem(key, JSON.stringify(val));
    }
  });
  location.reload();
}
function eraseEverything(){
  var kill = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("ever_present") === 0) kill.push(k);
  }
  kill.forEach(function(k){ localStorage.removeItem(k); });
  /* the recordings go too — their bytes live in IndexedDB, so the
     erase isn't done until that store is cleared as well (v1.17) */
  var finished = false;
  function finish(){ if(!finished){ finished = true; try{ location.reload(); }catch(e){} } }
  try{
    var p = (window.EPMedia && typeof EPMedia.clear === "function") ? EPMedia.clear() : null;
    if(p && typeof p.then === "function"){ p.then(finish, finish); setTimeout(finish, 800); }
    else finish();
  }catch(e){ finish(); }
}
