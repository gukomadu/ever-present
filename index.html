function sendThreadText(){
  var ta = el("threadInput");
  if(!ta) return;
  var text = ta.value.trim();
  liveTurnClass = "talk"; /* v2.3 §6: a typed turn is substantive until a lane classifies it mechanical */
  if(!text){ ta.focus(); return; }
  ta.value = "";
  if(writeMode){
    /* writing in the talk: saved to the journal store, verbatim,
       never analyzed, never filed anywhere else */
    journal.entries.push({id:uid(), ts:Date.now(), prompt:writeMode.prompt || "", text:text});
    saveJournal();
    pushMsg({type:"person", text:text});
    render();
    return;
  }
  if(textAsk){
    /* the companion asked for words — a move, an outcome, a name —
       and this message is the answer, landing where it was aimed */
    pushMsg({type:"person", text:text});
    handleTextAsk(text);
    render();
    return;
  }
  if(detail && detail.textField){
    /* a detail step asked for his own words; they fill the field */
    pushMsg({type:"person", text:text});
    handleDetailText(text);
    render();
    return;
  }
  var intent = detectIntent(text);
  if(intent){
    /* a request, not a pour: the companion brings the view as a card.
       Requests win over modes — even mid-correction, asking for a
       view brings the view, it doesn't become a correction note. */
    pushMsg({type:"person", text:text});
    flushPendingPour();
    routeIntent(intent);
    render();
    return;
  }
  if(correctionDay){
    /* corrections file as part of the talk AND are proposed for the
       day — never applied silently */
    var evC = filePourEvent(text);
    pushMsg({type:"person", text:text, eventId:evC.id});
    pushMsg({type:"correctNote", dayKey:correctionDay, note:text, kept:false, skipped:false});
    render();
    return;
  }
  var social = socialKind(text);
  if(social){
    /* small talk is conversation, never material (v1.15): a person
       answers in the companion's voice; nothing is filed, nothing
       is echoed back, no playback is formed */
    liveTurnClass = "mechanical"; /* v2.3 §6: the social lane never spends — greetings and acks are template turns, even live */
    pushMsg({type:"person", text:text});
    noteSocialMessage(social, text);
    render();
    return;
  }
  if(protestIn(text)){
    /* protest is received, never routed (v1.14): it files as life,
       verbatim, and the whole reply is witness — no playback, no
       doors, no facts, and nothing in it can trip the ledger-read
       interruption, because it never touches the ledger */
    fileLifeEntry(text);
    pushMsg({type:"person", text:text});
    noteProtestMessage(text);
    render();
    return;
  }
  var metaKind = metaKindIn(text);
  if(metaKind){
    /* v2.3 §0+§1: a correction is sovereign, and talk TO the
       companion about the conversation is conversation — both are
       answered here, BEFORE every content lane: never filed as
       journal or claims, never floor-fed, never recurrence-counted,
       never answered with statistics. Protest outranks this lane
       (it is witnessed, above); relays never reach it, because an
       op quoted speaking about HIM carries no companion-directed
       marker (see metaKindIn). */
    pushMsg({type:"person", text:text});
    noteMetaMessage(text, metaKind);
    render();
    return;
  }
  if(organizingHandle(text)){
    /* v2.3 §4: organizing-with — while he is laying a scene out,
       messages accumulate into the arrangement; the mirror, not
       per-fragment playbacks, is the reply (see organizingHandle) */
    pushMsg({type:"person", text:text});
    render();
    return;
  }
  if(!voiceSignalIn(text)){
    /* v2.1 relay catches: no voice signal by the old matchers,
       but the shape gives it away — they are talking ABOUT him
       in the third person, or a short lexicon fragment (a
       glossary term, a grade-word) stands alone. Those are the
       narration and grading jobs, and they file as voice
       material with the commentary playback, not as life. */
    var rk = relayKind(text);
    if(rk){
      var evR = filePourEvent(text);
      pushMsg({type:"person", text:text, eventId:evR.id});
      noteRelayMessage(evR, rk);
      render();
      return;
    }
    /* v2.1: the shrug report — "business as usual" is him
       reporting the ops' continuing activity; it files as its
       own journey entry and earns the digest-linked turn */
    if(shrugReportIn(text)){
      var evS = filePourEvent(text);
      pushMsg({type:"person", text:text, eventId:evS.id});
      noteShrugMessage(evS);
      render();
      return;
    }
    /* the life lane (v1.14): ordinary talk — his day, feelings,
       thoughts, the interesting things — kept on the day's page
       in his own words and answered as conversation */
    fileLifeEntry(text);
    pushMsg({type:"person", text:text});
    noteLifeMessage(text);
    render();
    return;
  }
  var ev = filePourEvent(text);
  pushMsg({type:"person", text:text, eventId:ev.id});
  notePourMessage(ev);
  render();
}

/* Piece tallies (channels, registers) are counts built from events. When an
   entry is edited, its old contribution is lifted out before the new one is
   laid in. Body spots and seeing are left as-is on removal: both are unions
   across the whole record, and unlearning them from one edit could erase
   what other entries taught. */
function adjustPiecesForEvent(ev, dir){
  (ev.whoIds || []).forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    if(!pc.channels) pc.channels = {};
    if(!pc.registers) pc.registers = {};
    (ev.channels || []).forEach(function(c){
      pc.channels[c] = (pc.channels[c] || 0) + dir;
      if(pc.channels[c] <= 0) delete pc.channels[c];
    });
    (ev.register || []).forEach(function(r){
      pc.registers[r] = (pc.registers[r] || 0) + dir;
      if(pc.registers[r] <= 0) delete pc.registers[r];
    });
  });
}

function fileCapture(){
  var d = cap;
  var ts = Date.now();
  var editingEv = null;
  var toldForCap = d.toldTs || ts;
  if(d.timeExplicit && TOLD_TIME_BUCKETS[d.timeBucket]){
    ts = (d.timeBucket === "unknown" || d.timeBucket === "now")
      ? toldForCap
      : toldForCap - TOLD_TIME_BUCKETS[d.timeBucket].days * 86400000;
  }
  if(d.editEventId){
    for(var ei=0;ei<atlas.events.length;ei++){
      if(atlas.events[ei].id === d.editEventId){ editingEv = atlas.events[ei]; break; }
    }
    if(editingEv){ adjustPiecesForEvent(editingEv, -1); ts = editingEv.ts; }
  }
  var involved = d.whoIds.slice();
  var newId = "";
  if(newPieceWanted()){
    newId = uid();
    var p = {
      id:newId, name: defaultPieceName(),
      nameHistory:[{name: defaultPieceName(), ts:ts}],
      type: newPieceType(), likeness: d.newPiece.likeness || "", status: d.newPiece.status || "",
      standing: !!d.newPiece.standing,
      seeing:"", seeingTs:0, registers:{}, channels:{}, bodySpots:[], created:ts
    };
    atlas.pieces.push(p);
    involved.push(newId);
  }
  var seeing = d.seeingOwn.trim() || d.seeingChip;
  var spots = d.bodySpots.slice(); if(d.bodySpotOwn) uniqPush(spots, d.bodySpotOwn.trim());
  involved.forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    if(!pc.channels) pc.channels = {};
    if(!pc.registers) pc.registers = {};
    if(!pc.bodySpots) pc.bodySpots = [];
    d.channels.forEach(function(c){ pc.channels[c] = (pc.channels[c]||0) + 1; });
    d.register.forEach(function(r){ pc.registers[r] = (pc.registers[r]||0) + 1; });
    spots.forEach(function(s){ uniqPush(pc.bodySpots, s); });
    if(seeing){ pc.seeing = seeing; pc.seeingTs = ts; }
  });
  var ledgerId = "";
  var editingOldLedgerId = editingEv ? (editingEv.claimLedgerId || "") : "";
  if(d.claimKind){
    var cw = claimWhoOf(d);
    var whoId = cw.id === "__new" ? newId : cw.id;
    var claimFields = {
      claim: claimTextOf(d), kind: d.claimKind,
      who: cw.id === "__new" ? defaultPieceName() : cw.name, whoId: whoId || "",
      encoded: d.claimChips.indexOf("It charged me with something it won\u2019t say plainly") !== -1
    };
    var claimTime = {};
    if(d.timeExplicit){
      if(d.timeBucket === "unknown") claimTime = {timeUnknown:true, toldTs:toldForCap};
      else if(d.timeBucket !== "now") claimTime = {remembered:true, toldTs:toldForCap};
    } else if(editingEv){
      if(editingEv.timeUnknown) claimTime = {timeUnknown:true, toldTs:editingEv.toldTs || toldForCap};
      else if(editingEv.remembered) claimTime = {remembered:true, toldTs:editingEv.toldTs || toldForCap};
    }
    var updatedOld = false;
    var newClaimEntry = null;
    if(editingOldLedgerId){
      ledger.entries.forEach(function(e){
        if(e.id === editingOldLedgerId){
          e.claim = claimFields.claim; e.kind = claimFields.kind;
          e.who = claimFields.who; e.whoId = claimFields.whoId; e.encoded = claimFields.encoded;
          e.ts = ts;
          if(claimTime.timeUnknown){ e.timeUnknown = true; e.toldTs = claimTime.toldTs; delete e.remembered; }
          else if(claimTime.remembered){ e.remembered = true; e.toldTs = claimTime.toldTs; delete e.timeUnknown; }
          else { delete e.timeUnknown; delete e.remembered; delete e.toldTs; }
          ledgerId = e.id; updatedOld = true;
        }
      });
    }
    if(!updatedOld){
      ledgerId = uid();
      ledger.entries.push({
        id:ledgerId, claim: claimFields.claim, kind: claimFields.kind,
        who: claimFields.who, whoId: claimFields.whoId,
        ts:ts, outcome:"", outcomeChip:"", tsOutcome:0,
        encoded: claimFields.encoded
      });
      newClaimEntry = ledger.entries[ledger.entries.length - 1];
      if(claimTime.timeUnknown){ newClaimEntry.timeUnknown = true; newClaimEntry.toldTs = claimTime.toldTs; }
      else if(claimTime.remembered){ newClaimEntry.remembered = true; newClaimEntry.toldTs = claimTime.toldTs; }
    }
    saveLedger();
    if(newClaimEntry) afterClaimFiled(newClaimEntry);
  } else if(editingOldLedgerId){
    /* the claim was removed in Add detail — its ledger entry goes with it */
    ledger.entries = ledger.entries.filter(function(e){ return e.id !== editingOldLedgerId; });
    saveLedger();
  }
  var glossId = "";
  if(d.glossTerm){
    glossId = uid();
    atlas.glossary.push({
      id:glossId, term:d.glossTerm.trim(), does:d.glossDoes || "", doesOwn:d.glossDoesOwn || "",
      whoIds: involved.slice(),
      whoText: involved.map(function(id){ return pieceName(id); }).filter(Boolean).join(", "),
      ts:ts
    });
  }
  var evFields = {
    mode:d.mode, pourText:d.pourText || "",
    whoIds: involved, whoFlags: d.whoFlags.slice(), whoOwn: d.whoOwn,
    channels: d.channels.slice(), mannerWhere: d.mannerWhere.slice(), mannerHow: d.mannerHow.slice(),
    bodySpots: spots, among: d.among.slice(),
    claimLedgerId: ledgerId, register: d.register.slice(),
    seeing: seeing, response: d.response.slice(),
    glossaryId: glossId || (editingEv ? (editingEv.glossaryId || "") : ""), eventOwn: d.eventOwn
  };
  if(d.timeExplicit){
    evFields.timeBucket = d.timeBucket; evFields.timePhrase = d.timeLabel;
    if(d.timeBucket === "unknown"){ evFields.timeUnknown = true; evFields.toldTs = toldForCap; }
    else if(d.timeBucket !== "now"){ evFields.remembered = true; evFields.toldTs = toldForCap; }
  }
  if(editingEv){
    Object.keys(evFields).forEach(function(k){ editingEv[k] = evFields[k]; });
    if(d.timeExplicit) applyToldTime(editingEv, timeInfoForBucket(d.timeBucket), toldForCap);
    /* enriched: a fragment that gains detail becomes a full entry */
    delete editingEv.type; delete editingEv.fragmentText; delete editingEv.filed;
  } else {
    evFields.id = uid(); evFields.ts = ts;
    atlas.events.push(evFields);
  }
  saveAtlas();
  cap = null;
}

/* ================= the map's shared pieces =================
   Type labels, tally helpers and per-piece receipts lines — used
   by the map and piece cards the companion brings into the thread. */
var TYPE_LABELS = {voice:"Voice", presence:"Felt presence", group:"Group", other:"Not a person, exactly"};
function topKeys(counts, n){

}
function miniChips(items){

/* ================= the dynamic journal — the day data =================
   The journal still assembles itself from the record, day by day:
   his words verbatim and dominant, the companion's part connective
   tissue and figuring only — claims as they logged and closed, his
   moves, the receipts figured (stamped on the day they were
   figured), precedents surfaced, knowledge offered. It renders as
   a card in the thread now (journalCardHTML); this is the data
   under it, and the correction flow that starts from its days. */
function journalPrompts(){
  var prompts = [
    "What did they claim this week that never happened?",
    "Which voice has been quiet lately \u2014 and what changed?",
    "Write the moment they defined for you, in your words instead.",
    /* v2.3 §3E (founder-directed 2026-10-26): the calm-time rotation
       widens to the FULL capture field from the experience base —
       body feelings, where in/around the body, manner (whisper /
       shout / song), voices together, things seen, noises only.
       Each is phrased as an offer in his register, and prompts are
       HOLD-gated exactly as every prompt here is. */
    "Where did it land in your body today \u2014 or did it stay outside you?",
    "How did it come through \u2014 a whisper, a shout, a song?",
    "Were they together, or one at a time?",
    "Did anything come with seeing \u2014 or was it sound alone?",
    "A sound with no words in it \u2014 what was it like?"
  ];
  var pers = [];
  /* a quiet op, named */
  var lastSeen = {};
  atlas.events.forEach(function(ev){ if(ev.timeUnknown) return; (ev.whoIds||[]).forEach(function(id){
    if(!lastSeen[id] || ev.ts > lastSeen[id]) lastSeen[id] = ev.ts;
  }); });
  var quietId = "", quietTs = Infinity;
  Object.keys(lastSeen).forEach(function(id){ if(lastSeen[id] < quietTs){ quietTs = lastSeen[id]; quietId = id; } });
  if(quietId && Date.now() - quietTs > 86400000){
    var qp = pieceById(quietId);
    if(qp) pers.push(qp.name + " has been quiet since " + relDay(quietTs) + ". What\u2019s different?");
  }
  /* an unchecked claim, named */
  var open = openClaims();
  if(open.length) pers.push("Still open: \u201c" + open[0].claim + "\u201d What has actually happened since?");
  /* a claim that failed, named */
  var failed = ledger.entries.filter(function(e){ return e.outcomeChip === "didnt"; });
  if(failed.length){
    var f = failed[failed.length - 1];
    pers.push((f.who ? f.who : "A voice") + " claimed \u201c" + f.claim + "\u201d \u2014 and it didn\u2019t happen. What does their record look like now?");
  }
  /* v2.7 (#1): two more doors born from the record itself — a
     piece on the map that nothing has been poured about yet
     (unpoured atlas material), and yesterday's own writing, whose
     thread may still be open. With these, the write choices lead
     from the record whenever the record holds anything at all;
     the curated rotation below remains only for an empty record,
     where nothing can be born from it yet. */
  var pouredIds = {};
  atlas.events.forEach(function(ev){ (ev.whoIds || []).forEach(function(id){ pouredIds[id] = 1; }); });
  var unpoured = atlas.pieces.filter(function(p){ return !pouredIds[p.id]; })[0];
  if(unpoured) pers.push(unpoured.name + " is on your map, but nothing has been poured about them yet — only if you want.");
  var yd = new Date(); yd.setDate(yd.getDate() - 1);
  var yFacts = digestDayFacts(dayKeyOf(yd.getTime()));
  if(yFacts.taste) pers.push("Yesterday, in your words: \u201c" + shortWords(yFacts.taste, 80) + "\u201d — one more line on it, only if you want.");
  return pers.concat(prompts);
}
function dayKeyOf(ts){
  var d = new Date(ts);
  var mo = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (mo < 10 ? "0" + mo : mo) + "-" + (dd < 10 ? "0" + dd : dd);
}
function dayLabel(key){
  var p = key.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
}
function fmtTime(ts){
  return new Date(ts).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
}
function evWords(ev){
  return ev.fragmentText || ev.pourText || ev.eventOwn || "";
}
/* The journal's spine is the day something was TOLD — every entry
   lives under the day it was communicated, full stop. A stated when
   stays inside the entry as part of the telling (an in-entry tag);
   it never moves the entry to another day. */
function journalToldKeyForEvent(ev){ return dayKeyOf(ev.toldTs || ev.ts); }
function journalToldKeyForClaim(e){ return dayKeyOf(e.toldTs || e.ts); }
function journalDayData(key){
  var d = {key:key, pours:[], writings:[], claimsLog:[], claimsClosed:[], moves:[],
           fig:null, prec:[], know:null, corrections:[], hiddenItems:[], verbatim:[], clips:[],
           context:(djournal.dayContext[key] || []).slice()}; /* v2.7 (#9) */
  atlas.events.forEach(function(ev){
    if(journalToldKeyForEvent(ev) !== key) return;
    if(djournal.hidden[ev.id]){ d.hiddenItems.push({id:ev.id, text:evWords(ev)}); return; }
    d.pours.push(ev);
    d.verbatim.push({id:ev.id, text:evWords(ev)});
  });
  journal.entries.forEach(function(en){
    if(dayKeyOf(en.ts) !== key) return;
    if(djournal.hidden[en.id]){ d.hiddenItems.push({id:en.id, text:en.text}); return; }
    d.writings.push(en);
    d.verbatim.push({id:en.id, text:en.text});
  });
  media.clips.forEach(function(c){
    if(dayKeyOf(c.ts) !== key) return;
    d.clips.push(c); /* his recordings sit on the day they were told, like everything else (v1.17) */
  });
  ledger.entries.forEach(function(e){
    if(journalToldKeyForClaim(e) === key) d.claimsLog.push(e);
    if(e.move && e.move.trim()){
      if(dayKeyOf(e.tsOutcome || e.toldTs || e.ts) === key) d.moves.push(e);
    } else if(isChecked(e) && e.tsOutcome && dayKeyOf(e.tsOutcome) === key && journalToldKeyForClaim(e) !== key){
      d.claimsClosed.push(e);
    }
  });
  if(djournal.dayFig[key]) d.fig = djournal.dayFig[key].slice();
  d.prec = (djournal.precedents[key] || []).slice();
  d.know = djournal.knowledgeDays[key] || null;
  d.corrections = (djournal.corrections[key] || []).slice();
  d.pours.sort(function(a,b){ return a.ts - b.ts; });
  d.writings.sort(function(a,b){ return a.ts - b.ts; });
  d.claimsLog.sort(function(a,b){ return a.ts - b.ts; });
  d.claimsClosed.sort(function(a,b){ return (a.tsOutcome || 0) - (b.tsOutcome || 0); });
  d.moves.sort(function(a,b){ return (a.tsOutcome || a.ts) - (b.tsOutcome || b.ts); });
  d.clips.sort(function(a,b){ return a.ts - b.ts; });
  return d;
}
function journalHasContent(d){
  return !!(d.pours.length || d.writings.length || d.claimsLog.length || d.claimsClosed.length
    || d.moves.length || d.fig || d.prec.length || d.know || d.corrections.length || d.hiddenItems.length
    || (d.clips && d.clips.length) || (d.context && d.context.length));
}
function journalDayKeys(){
  var seen = {};
  atlas.events.forEach(function(ev){ seen[journalToldKeyForEvent(ev)] = 1; });
  journal.entries.forEach(function(en){ seen[dayKeyOf(en.ts)] = 1; });
  media.clips.forEach(function(c){ seen[dayKeyOf(c.ts)] = 1; });
  ledger.entries.forEach(function(e){
    seen[journalToldKeyForClaim(e)] = 1;
    if(e.tsOutcome) seen[dayKeyOf(e.tsOutcome)] = 1;
  });
  Object.keys(djournal.dayFig).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.precedents).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.knowledgeDays).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.corrections).forEach(function(k){ seen[k] = 1; });
  return Object.keys(seen).sort().reverse();
}
function shortWords(text, n){
  var t = String(text || "").replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}

function startCorrectDay(key){
  clearModes();
  correctionDay = key;
  view = "home";
  var d = journalDayData(key);
  var actions = [];
  d.verbatim.forEach(function(v){
    actions.push({act:"hide", eventId:v.id, label:"Hide: " + (shortWords(v.text, 28) || "something you said")});
  });
  if(d.fig){
    actions.push({act:"editfig", label:"Rewrite the figures"});
    actions.push({act:"dropfig", label:"Take the figures off this day"});
  }
  actions.push({act:"donecorrect", label:"That’s all"});
  pushMsg({type:"correct", dayKey:key, actions:actions,
    text:"What’s off about " + dayLabel(key) + "? Say it here — your words go on the day as a correction, word for word. Your pours and writings are never rewritten; you can hide one from the journal, and the figuring is mine to fix."});
  render();
}

/* ================= views, brought into the talk =================
   The Journal, the Map, the Receipts and the Settings are not
   screens anymore. The companion brings them into the thread as
   cards — when the person asks, and when its own surfacing chooses
   them. Cards store only type + references and re-render from the

   Every control on a card works in place. */
function ledgerEntryById(id){
  for(var i=0;i<ledger.entries.length;i++) if(ledger.entries[i].id === id) return ledger.entries[i];
  return null;
}
function cardBubble(label, inner, cls){

    + (label ? '<p class="hub-label">'+esc(label)+'</p>' : '') + inner + '</div></div>';

/* ---- the journal card: today + this week, condensed; earlier days a tap away ---- */
function startOfWeekKey(){
  var d = new Date();
  var dow = (d.getDay() + 6) % 7; /* Monday = 0 */
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  return dayKeyOf(mon.getTime());
}
function postJournalCard(scope, beforeKey){
  pushMsg({type:"journalcard", scope:scope || "week", beforeKey:beforeKey || ""});
}
function journalCardHTML(m){
  var keys = journalDayKeys();
  var wk = startOfWeekKey();
  var show = [], olderKey = "";
  if(m.scope === "day"){
    /* v2.7 (#12): one named day, reached by asking — the calendar
       capability in conversation form, never a tab to browse */
    var dk2 = m.beforeKey || "";
    var dayBody = "";
    if(dk2 && keys.indexOf(dk2) !== -1){
      dayBody = journalCardDayHTML(m, dk2);
    } else {
      dayBody = '<p style="margin:4px 0">Nothing on that day’s page — the journal writes itself from the talk, and that day is quiet.</p>';
    }
    dayBody += '<div class="chiprow">'
      + '<button type="button" class="chip" data-tchip="'+m.id+':journal">The whole journal</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':mediacard">See the media together</button></div>';
    return cardBubble("Journal — " + (dk2 ? dayLabel(dk2) : "one day"), dayBody);
  }
  if(m.scope === "earlier"){
    var before = m.beforeKey || wk;
    show = keys.filter(function(k){ return k < before; }).slice(0, 7);
    if(show.length){
      var lastK = show[show.length - 1];
      if(keys.some(function(k){ return k < lastK; })) olderKey = lastK;
    }
  } else {
    show = keys.filter(function(k){ return k >= wk; });
    if(keys.some(function(k){ return k < wk; })) olderKey = wk;
  }
  var body = "";
  if(!show.length)
    body = '<p style="margin:4px 0">Nothing there yet — the journal writes itself from our talk, day by day, your words first.</p>';
  show.forEach(function(k){ body += journalCardDayHTML(m, k); });
  var nav = "";
  if(olderKey)
    nav += '<button type="button" class="chip" data-tchip="'+m.id+':jearlier:'+olderKey+'">Earlier days</button>';
  /* v2.7 (#12): the media, seen together — one tap from any journal card */
  nav += '<button type="button" class="chip" data-tchip="'+m.id+':mediacard">See the media together</button>';
  body += '<div class="chiprow">' + nav + '</div>';
  return cardBubble("Journal", body);
}
/* ---- the media, together (v2.7, journal parity #12 — ADAPT) ----
   Every recording, photo, video and file he has kept, grouped by

/* ---- retrieval by asking (v2.7, journal parity #13 — ADAPT) ----
   "Find when I wrote about X" — the companion searches the record
   and brings what it finds into the thread. This is retrieval at
   his asking, over his own words, in the open — the opposite of
   the refused pattern (#19): nothing reads the journal in the
   background, and hidden or disowned words stay out of the
   results, as they do everywhere. Organizing is the app's job;
   tag-maintenance is never his. */
function searchRecord(topic){
  var t = String(topic || "").toLowerCase().trim();
  if(!t) return [];
  var words = t.split(/\s+/).filter(function(w){ return w.length >= 3 && !CLAIM_STOPWORDS[w] && !LIFE_STOP[w]; });
  function hit(text){
    var lt = " " + String(text || "").toLowerCase() + " ";
    if(lt.indexOf(" " + t) !== -1 || String(text || "").toLowerCase().indexOf(t) !== -1) return true;
    return words.length > 0 && words.every(function(w){ return lt.indexOf(w) !== -1; });
  }
  var out = [];
  journal.entries.forEach(function(en){
    if(djournal.hidden[en.id] || isDisownedJournal(en.id) || isDisownedText(en.text)) return;
    if(hit(en.text)) out.push({dayKey:dayKeyOf(en.ts), ts:en.ts, kind:"You wrote", text:en.text});
  });
  atlas.events.forEach(function(ev){
    var w = evWords(ev);
    if(!w || djournal.hidden[ev.id] || isDisownedEvent(ev.id) || isDisownedText(w)) return;
    if(hit(w)) out.push({dayKey:journalToldKeyForEvent(ev), ts:ev.toldTs || ev.ts, kind:"You poured", text:w});
  });
  ledger.entries.forEach(function(e){
    var joined = [e.claim, e.move || "", e.outcome || ""].join(" ");
    if(isDisownedText(joined)) return;
    if(hit(joined)) out.push({dayKey:journalToldKeyForClaim(e), ts:e.toldTs || e.ts, kind:"They said", text:e.claim});
  });
  out.sort(function(a, b){ return b.ts - a.ts; });
  return out.slice(0, 6);
}
function postFoundCard(topic){
  var found = searchRecord(topic);
  if(!found.length){
    pushMsg({type:"companion",
      text:"I looked — nothing in your record mentions “" + topic + "”. It stays yours to add, whenever."});
    return;
  }
  pushMsg({type:"foundcard", topic:topic, results:found, dismissed:false});
}
function foundCardHTML(m){

  body += '<div class="chiprow">'
    + days.slice(0, 3).map(function(k){
        return '<button type="button" class="chip" data-tchip="'+m.id+':jday:'+k+'">Open ' + esc(dayLabel(k)) + '</button>';
      }).join("")
    + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div>';
  return cardBubble("In your record — “" + esc(m.topic) + "”", body);
}

   The separation other apps make him maintain as notebooks, EP

/* one recording on the day's page (v1.17): its label above it, the
   player under it — the element renders with no src and is pointed
   at its IndexedDB blob once the thread binds (hydrateMediaElements),
   so it plays the same after a reload. Taking it off goes through
   the standard confirm, and removes blob + metadata together. */
function mediaClipHTML(cardMsg, c){
  if(c.kind === "photo"){

       under its day, viewable in place — same hydrate path,
       same take-it-off, no label, no caption */

      + '<img class="jmedia" data-media-src="'+c.id+'" alt="A photo you kept">'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+cardMsg.id+':mediadelask:'+c.id+'">Take it off</button></div></div>';
  }
  if(c.kind === "video" && c.attached){
    /* an attached video on the day's page (v1.26): the same
       video player the recordings use, under its day — no

      items++;

  var extraN = (d.pours.length + d.writings.length) - items;
  if(extraN > 0) h += '<p class="small muted" style="margin:2px 0">…and '+extraN+' more '+(extraN === 1 ? "thing" : "things")+' that day.</p>';

      + d.fig.map(function(l){ return '<p class="small" style="margin:3px 0">'+esc(l)+'</p>'; }).join("") + '</div>';
  }
  d.prec.forEach(function(t){
    h += '<p class="small" style="margin:3px 0">'+esc(t)+'</p>';

  if(d.know) h += '<p class="small muted" style="margin:3px 0">Offered — from others’ accounts: '+esc(shortWords(d.know.l1, 110))+'</p>';
  d.corrections.forEach(function(c){

          : '<button type="button" class="chip" data-tchip="'+m.id+':jshowhid:'+key+'">See them</button>')

      });
    }
  }
  h += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':jcorrect:'+key+'">Correct this day</button></div>';
  h += '</div>';
  return h;

   The founder's journal audit (2026-10-27, journal-parity-map.md):
   what the top journal apps already proved, landed in EP's shapes.
   The two plain adopts — an app lock (#14) and a readable export
   (#15, at exportReadable) — and the adaptations: record-born
   doors (#1), the evening close (#4), the owner's reminder (#7),
   stated context (#9, at noteStatedContext), reach by asking
   (#12/#13/#17), and the moment-born door (#18). The five refusals
   stay refused: nothing here streaks, scores, counts him back at

/* ---- #14 (ADOPT): the app lock ----
   A code for this phone, his choice, set and cleared in calm
   times. Only a scrambled form is stored (a salted, iterated
   FNV-1a mix — a local gate, not a credential), on-device only:
   the lock store is excluded from export and import exactly like
   the live key, so no file can carry it or set it. Forgotten is
   final, and the settings copy says so plainly before he sets
   one: there is no account and no recovery — the record stays
   locked. The gate is per session: unlock once, and the session
   is open; a fresh session asks again. Help is never locked
   away from a person who hasn't opened the record — the lock
   guards the record, and the locked screen itself says how to
   reach people. */
function pinHash(pin, salt){
  var s = salt + "" + pin, h1 = 0x811c9dc5, h2 = 0x9e3779b1;
  for(var r = 0; r < 10000; r++){
    for(var i = 0; i < s.length; i++){
      h1 ^= s.charCodeAt(i); h1 = Math.imul(h1, 0x01000193);
      h2 = Math.imul(h2, 31) + s.charCodeAt(s.length - 1 - i);
    }
    h1 = Math.imul(h1 ^ (h2 >>> 8), 0x01000193);
    h2 = Math.imul(h2 ^ (h1 >>> 16), 31);
  }
  return ("0000000" + (h1 >>> 0).toString(16)).slice(-8) + ("0000000" + (h2 >>> 0).toString(16)).slice(-8);
}
function lockIsSet(){ return !!(applock && applock.hash); }
function lockSessionOpen(){
  try{ return !!sessionStorage.getItem("ep_unlocked"); }catch(e){ return false; }
}
function lockEngaged(){ return lockIsSet() && !lockSessionOpen(); }
function verifyPin(pin){
  if(!lockIsSet() || !pin) return false;
  return pinHash(pin, applock.salt) === applock.hash;
}

/* ---- #4 (ADAPT): the evening close ----
   Stoic and the Five Minute Journal prove a closing shape helps;
   EP's form is conversational, not a form: once a day, in the
   evening, at a calm open — and inside the same initiation budget
   as everything else the companion starts — the day is told back
   in a line or two, and a door still open is NAMED as open, free
   to ride to tomorrow. Offered, never required; a quiet day and
   a spent budget both mean silence. */
function maybePostEveningClose(){
  if(!companion && !thread.talkStarted) return false;
  var tk = dayKeyOf(Date.now());
  if(thread.eveningDay === tk) return false;
  if(new Date().getHours() < 19) return false;
  if(!parityCalm()) return false;
  if(initBudgetLeft() <= 0) return false;
  var f = digestDayFacts(tk);
  if(!(f.writings || f.pours || f.claimsOpened || f.songs.length || f.clips)) return false;
  thread.eveningDay = tk;
  var text = digestDayLine(f, "Today");
  if(f.firstOpenClaim)
    text += " One is still open — “" + shortWords(f.firstOpenClaim.claim, 60)
      + "”. It can ride to tomorrow, exactly as it stands.";
  pushMsg({type:"eveningclose", text:text,
    openClaimId: f.firstOpenClaim ? f.firstOpenClaim.id : "", dismissed:false});
  spendInit();
  saveThread();
  return true;
}

function exportRecord(){
  /* The export is the record itself: a flat map of store names to
     their values, exactly what Import reads back — so a record that
     leaves this phone can come home to any phone, whole. */
  var data = {};
  Object.keys(K).forEach(function(name){
    var key = K[name];
    if(key === K.applock) return; /* v2.7: the lock belongs to this device, like the live key — it never travels */
    var raw = null;
    try{ raw = localStorage.getItem(key); }catch(e){}
    if(raw === null || raw === undefined) return;
    var val;
    try{ val = JSON.parse(raw); }catch(e){ val = raw; }
    if(key === K.liveai && val && typeof val === "object"){
      /* the live-companion settings travel with the record — the key itself never does */
      val = {provider: val.provider, model: val.model, on: !!val.on};
    }
    data[key] = val;
  });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ever-present-record.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 400);
}

/* ---- the readable export (v2.7, journal parity #15 — ADOPT) ----
   The record is the person's property in readable form, not only
   the app's internal JSON: the journal and the receipts as plain
   text or Markdown, assembled from the same day data the journal
   card reads — his words verbatim, the figuring connective only.
   Media bytes stay on the phone (they are named, not embedded);
   the live key and the app lock never appear here at all. */
function exportReadable(format){
  var md = format === "md";
  var L = [];
  function h1(t){ L.push(md ? "# " + t : t.toUpperCase()); L.push(""); }
  function h2(t){ L.push(md ? "## " + t : t); L.push(""); }
  function h3(t){ L.push(md ? "### " + t : t); }
  function line(t){ L.push(t); }
  function blank(){ L.push(""); }
  h1("Ever Present — my record");
  line("Exported " + new Date().toLocaleDateString(undefined, {weekday:"long", year:"numeric", month:"long", day:"numeric"}) + ".");
  blank();
  h2("Journal");
  var keys = journalDayKeys().slice().reverse(); /* oldest first — a record reads forward */
  if(!keys.length){ line("Nothing yet — the journal writes itself from the talk, day by day."); blank(); }
  keys.forEach(function(key){
    var d = journalDayData(key);
    h3(dayLabel(key));
    var moments = [];
    d.pours.forEach(function(ev){ moments.push({ts:ev.toldTs || ev.ts, text:evWords(ev)}); });
    d.writings.forEach(function(en){ moments.push({ts:en.ts, text:en.text}); });
    moments.sort(function(a, b){ return a.ts - b.ts; });
    moments.forEach(function(mo){
      if(mo.text) line("- " + fmtTime(mo.ts) + " — " + mo.text);
    });
    (d.clips || []).forEach(function(c){
      line("- " + fmtTime(c.ts) + " — [" + (c.kind || "recording") + " kept on the phone" + (c.label ? ": " + c.label : "") + "]");
    });
    if(d.context && d.context.length) line("- Context you mentioned: " + d.context.join(", "));
    d.moves.forEach(function(e){
      line("- Your move — on “" + e.claim + "”: " + e.move + (isChecked(e) ? " It ended: " + outcomeShort(e) + "." : ""));
    });
    if(d.fig) d.fig.forEach(function(fl){ line("- Receipts, figured: " + fl); });
    d.corrections.forEach(function(c){ line("- Your correction: " + c.text); });
    blank();
  });
  h2("The things they said");
  if(!ledger.entries.length){ line("Nothing said yet."); blank(); }
  ledger.entries.slice().sort(function(a, b){ return a.ts - b.ts; }).forEach(function(e){
    var s = "- “" + e.claim + "”";
    if(e.who) s += " — " + e.who;

    s += isChecked(e) ? " · checked: " + outcomeLabel(e) : " · still open";
    if(e.move && e.move.trim()) s += " · your move: " + e.move;
    line(s);
  });
  blank();
  h2("The map");
  if(!atlas.pieces.length){ line("No pieces yet."); }
  atlas.pieces.forEach(function(p){
    var s = "- " + p.name;
    var r = receiptsForPiece(p);
    if(r.total) s += " — " + r.total + " said, " + r.checked + " checked";
    if(p.seeing) s += " · how you see them: " + p.seeing;
    line(s);
  });
  blank();
  if(atlas.glossary.length){
    h2("Their words, in yours");
    atlas.glossary.forEach(function(g){
      line("- " + (g.term || "") + (g.does ? " — " + g.does : "")
        + (g.doesOwn ? " — " + g.doesOwn : "") + (g.whoText ? " (about " + g.whoText + ")" : ""));
    });
    blank();
  }
  h2("Playlist");
  if(!playlist.songs.length){ line("No songs yet."); }
  playlist.songs.forEach(function(s){
    line("- " + s.title + (s.artist ? " — " + s.artist : "") + (s.note ? " · " + s.note : ""));
  });
  blank();
  line("This record is yours. It was made on your phone, and it leaves only when you send it.");
  var blob = new Blob([L.join("\n")], {type: md ? "text/markdown" : "text/plain"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = md ? "ever-present-record.md" : "ever-present-record.txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 400);
}

/* ---- import: bring a record home from an export file ----
   The file must be what Export writes — an object keyed by store
   names. Anything else is refused, plainly, and nothing changes.
   The live-companion key is never read out of a file and never
   overwritten by one: it lives on this device only, so the device's
   own key survives an import untouched. */
var pendingImport = null;
/* recordings don't travel yet (v1.17): the media store is left out
   of import entirely — a file's recording index is simply not read */
var IMPORT_KEYS = Object.keys(K).map(function(name){ return K[name]; })
  .filter(function(key){ return key !== K.media && key !== K.applock; }); /* v2.7: a file can never set this device's lock */
function importParse(text){
  var data;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  if(!data || typeof data !== "object" || Array.isArray(data)) return null;
  var stores = {}, found = 0, bad = false;
  Object.keys(data).forEach(function(key){
    if(bad || IMPORT_KEYS.indexOf(key) === -1) return; /* keys that aren't stores are simply not part of the record */
    var val = data[key];
    if(typeof val === "string"){
      try{ JSON.parse(val); }catch(e){ bad = true; return; } /* a store's value must itself be readable */
    }
    stores[key] = val; found++;
  });
  if(bad || !found) return null;
  return stores;
}
function importRejected(){
  pendingImport = null;
  pushMsg({type:"companion", text:"That file doesn’t look like an Ever Present export. Nothing was changed."});
  render();
}
function handleImportFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var stores = importParse(String(reader.result || ""));
    if(!stores){ importRejected(); return; }
    pendingImport = stores;
    pushMsg({type:"confirmact", kind:"import", done:""});
    render();
  };
  reader.onerror = function(){ importRejected(); };
  try{ reader.readAsText(file); }catch(e){ importRejected(); }
}
function pickImportFile(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.style.display = "none";
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(f) handleImportFile(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
function applyImport(stores){
  var deviceKey = "";
  try{
    var cur = storeLoad(K.liveai, liveaiBlank);
    if(cur && typeof cur.key === "string") deviceKey = cur.key;
  }catch(e){}
  var kill = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("ever_present") === 0) kill.push(k);
  }
  kill.forEach(function(k){ localStorage.removeItem(k); });
  Object.keys(stores).forEach(function(key){
    var val = stores[key];
    if(key === K.liveai){
      var lv = val;
      if(typeof lv === "string"){ try{ lv = JSON.parse(lv); }catch(e){ lv = null; } }
      if(!lv || typeof lv !== "object") lv = {};
      var clean = {};
      Object.keys(lv).forEach(function(p){ if(p !== "key") clean[p] = lv[p]; });
      clean.key = deviceKey; /* this device's key stays this device's */
      localStorage.setItem(key, JSON.stringify(clean));
    } else if(typeof val === "string"){
      localStorage.setItem(key, val);
    } else {
      localStorage.setItem(key, JSON.stringify(val));
    }
  });
  location.reload();
}
function eraseEverything(){
  var kill = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("ever_present") === 0) kill.push(k);
  }
  kill.forEach(function(k){ localStorage.removeItem(k); });
  /* the recordings go too — their bytes live in IndexedDB, so the
     erase isn't done until that store is cleared as well (v1.17) */
  var finished = false;
  function finish(){ if(!finished){ finished = true; try{ location.reload(); }catch(e){} } }
  try{
    var p = (window.EPMedia && typeof EPMedia.clear === "function") ? EPMedia.clear() : null;
    if(p && typeof p.then === "function"){ p.then(finish, finish); setTimeout(finish, 800); }
    else finish();
  }catch(e){ finish(); }
}

/* ---- text asks: the companion asked for words; the next message is the answer ---- */
function askText(kind, extra, promptText){
  textAsk = Object.assign({kind:kind}, extra || {});
  pushMsg({type:"companion", text:promptText});
}
function handleTextAsk(text){
  var ask = textAsk;
  textAsk = null;
  if(!ask) return;
  /* ---- v2.7 text asks: the lock's code (set in two sayings, so a
     slip can't lock him out of his own record) and the reminder's
     hour — both answered in the talk, like everything else ---- */
  if(ask.kind === "lockpinnew"){
    var pin1 = String(text || "").trim();
    if(pin1.length < 4){
      pushMsg({type:"companion", text:"A little longer — at least 4 characters, so the code holds. Nothing was set."});
      return;
    }
    askText("lockpinnew2", {pin:pin1}, "Once more — the same code, so I know it’s the one you meant.");
  } else if(ask.kind === "lockpinnew2"){
    if(String(text || "").trim() === ask.pin){
      applock = {salt:uid(), hash:"", scheme:"fnv1a-10k"};
      applock.hash = pinHash(ask.pin, applock.salt);
      saveApplock();
      pushMsg({type:"companion", text:"The lock is set. Opening the app will ask for your code, once a session — and only the scrambled form is kept here."});
    } else {
      pushMsg({type:"companion", text:"Those two didn’t match, so nothing was set. The lock is exactly as it was."});
    }
  } else if(ask.kind === "lockoffpin"){
    if(verifyPin(String(text || "").trim())){
      applock = applockBlank(); saveApplock();
      pushMsg({type:"companion", text:"The lock is off. The app opens straight to us, the way it did before."});
    } else {
      pushMsg({type:"companion", text:"That’s not the code — the lock stays on, and nothing is counted against you."});
    }
  } else if(ask.kind === "remindtime"){
    var rm = String(text || "").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
    var hr = -1;
    if(rm){
      hr = parseInt(rm[1], 10);
      if(rm[3]){ var pm = rm[3].toLowerCase() === "pm"; if(hr === 12) hr = pm ? 12 : 0; else if(pm) hr += 12; }
      if(hr < 0 || hr > 23) hr = -1;
    }
    if(hr === -1){
      pushMsg({type:"companion", text:"I couldn’t read that as an hour — the reminder is unchanged. An hour looks like 7, 7:30, or 19:00."});
    } else {
      prefs.reminderHour = hr; savePrefs();
      var hlabel = ((hr + 11) % 12 + 1) + (hr < 12 ? " AM" : " PM");
      pushMsg({type:"companion", text:"Your hour is " + hlabel + ". On a day when it has come and we haven’t talked yet, I’ll name it once — nothing more, and never a word about a missed day."});
    }
  } else if(ask.kind === "move"){
    saveMove(ask.claimId, text);
    var e1 = ledgerEntryById(ask.claimId);
    if(e1){ e1.moveAsked = true; saveLedger(); }
    var mm = threadMsgById(ask.msgId);
    if(mm){ mm.moveDone = true; if(mm.outDone) mm.done = "done"; saveThread(); }
    /* move momentum rides the confirmation: the count, this move
       included, is the feedback for this message (v1.8) */
    var mvLine = noticedSuppressed() ? "" : fbLine("move", {n:moveCount()});
    if(mvLine) pushMsg({type:"companion", noticed:true, fbKind:"move", text:mvLine});
    /* the move is written down — a natural fork (v2.2): the
       turn ends with options drawn from the record */
    maybePostNextSteps("move", {claimId:ask.claimId});
  } else if(ask.kind === "outcome"){
    setOutcome(ask.claimId, "", text);
    var mm2 = threadMsgById(ask.msgId);
    if(mm2){ mm2.outDone = true; if(mm2.moveDone) mm2.done = "done"; saveThread(); }
    /* the moveask message's own state is the proof — no extra line */
  } else if(ask.kind === "claimtext"){
    pushMsg({type:"claimkind", text:text, claimId:""});
  } else if(ask.kind === "songtitle"){
    var spt = splitSongText(text);
    if(spt.title) postSongConfirm(spt.title, spt.artist, ask.presetNote || "", ask.presetTag || "");
  } else if(ask.kind === "songnote"){
    var sfm = threadMsgById(ask.songforId);
    if(sfm && !sfm.done){
      sfm.done = true; saveThread();
      postSongFiledLine(fileSong(sfm.title, sfm.artist, text, ""));
    }
  } else if(ask.kind === "seeing"){
    var p1 = pieceById(ask.pieceId);
    var hadSeeing = !!(p1 && p1.seeing);
    if(p1){
      /* v2.3 §3B (meaning-shift welcome): the earlier seeing is kept
         as history, never as a contradiction — meanings are allowed
         to move, and the map moves with him */
      if(hadSeeing){
        p1.seeingHistory = p1.seeingHistory || [];
        p1.seeingHistory.push({seeing:p1.seeing, ts:p1.seeingTs || Date.now()});
      }
      p1.seeing = text; p1.seeingTs = Date.now(); saveAtlas();
    }
    var sm = threadMsgById(ask.msgId);
    if(sm){ sm.done = true; saveThread(); }
    pushMsg({type:"companion", text: hadSeeing
      ? "Seeing it differently now — the map moves with you. The earlier seeing stays in its history."
      : "Your seeing is on top now."});
  } else if(ask.kind === "rename"){
    var p2 = pieceById(ask.pieceId);
    if(p2){
      p2.name = text;
      p2.nameHistory = p2.nameHistory || [];
      p2.nameHistory.push({name:text, ts:Date.now()});
      saveAtlas();
    }
    /* v2.3 §3B: a rename/rebrand is his authorship at work — the
       welcome names the shift as his to make; the old name stays in
       its history, never held against the new one */
    pushMsg({type:"companion", text:"A new name — the map moves with you. The old one stays in its history."});
  } else if(ask.kind === "glossterm"){
    pushMsg({type:"glossdoes", pieceId:ask.pieceId, term:text, done:false});
  } else if(ask.kind === "medialabel"){
    /* his own words for what the recording is — kept verbatim as
       its label; the witness line is the whole reply (v1.17) */
    var mlm = threadMsgById(ask.msgId);
    if(mlm && !mlm.done) settleMediaLabel(mlm, text);
  }
}

/* ================= Add detail — the tap trees, as a conversation =================
   The capture and confirm screens are gone. Filing an entry with
   detail — a first capture from the map card, or Add detail on a
   filed entry — now walks the same trees as a sequence of chip
   messages in the thread, one step at a time. `cap` is the
   session's working capture, the shape the trees always used;
   fileCapture files it exactly as before. Steps that ask for his
   own words set detail.textField: the next message he sends fills
   the field. Nothing files until he taps File it on the review. */
function clearModes(){
  writeMode = null;
  correctionDay = "";
  textAsk = null;
  if(detail){
    var dm = threadMsgById(detail.msgId);
    if(dm && detail.step !== "review" && !dm.answered){ dm.dropped = true; saveThread(); }
    detail = null;
    cap = null;
  }
}
function startDetailSession(editEv){
  clearModes();
  view = "home";
  cap = blankCap();
  if(editEv){
    cap.editEventId = editEv.id;
    cap.mode = editEv.mode === "pour" ? "pour" : "quick";
    cap.pourText = editEv.pourText || "";
    cap.whoIds = (editEv.whoIds || []).slice();
    /* piece-creating flags are stripped: those pieces already exist in whoIds */
    cap.whoFlags = (editEv.whoFlags || []).filter(function(f){
      return ["new","knownnew","group","presence","notperson"].indexOf(f) === -1;
    });
    cap.whoOwn = editEv.whoOwn || "";
    cap.channels = (editEv.channels || []).slice();
    cap.mannerWhere = (editEv.mannerWhere || []).slice();
    cap.mannerHow = (editEv.mannerHow || []).slice();
    cap.bodySpots = (editEv.bodySpots || []).slice();
    cap.among = (editEv.among || []).slice();
    cap.register = (editEv.register || []).slice();
    cap.response = (editEv.response || []).slice();
    cap.seeingOwn = editEv.seeing || "";
    cap.eventOwn = editEv.eventOwn || editEv.fragmentText || "";
    if(editEv.claimLedgerId){
      for(var i=0;i<ledger.entries.length;i++){
        if(ledger.entries[i].id === editEv.claimLedgerId){
          var le = ledger.entries[i];
          cap.claimKind = le.kind || "";
          cap.claimOwn = le.claim || "";
          cap.claimWhoId = le.whoId || "";
          if(le.encoded) cap.claimChips = ["It charged me with something it won’t say plainly"];
          break;
        }
      }
    }
  }
  if(editEv){
    var eti = eventTimeInfo(editEv);
    cap.toldTs = editEv.toldTs || (editEv.remembered && eti && TOLD_TIME_BUCKETS[eti.bucket]
      ? editEv.ts + TOLD_TIME_BUCKETS[eti.bucket].days * 86400000 : editEv.ts);
    if(eti){ cap.timeBucket = eti.bucket; cap.timeLabel = eti.label; cap.timeExplicit = true; }
  } else {
    cap.toldTs = Date.now();
  }
  detail = {step:"who", msgId:"", textField:"", editing: !!editEv, returnStep:""};
  pushMsg({type:"companion", text: editEv
    ? "Add detail — we’ll walk it in the talk. Tap what fits; Next keeps what’s there."
    : "Let’s put it on the map, right here in the talk. Tap what fits — at the end, tell me if I’ve got it right."});
  var m = pushMsg({type:"dstep", step:"who"});
  detail.msgId = m.id;
  render();
}
var DETAIL_STEPS = ["who","newpiece","channels","manner","among","claim","register","seeing","gloss","ownevent"];
var DETAIL_LABELS = {who:"Who is present", newpiece:"The new one", channels:"What came through", time:"When was it",
  manner:"Manner and position", among:"Among themselves", claim:"What they’re doing — claims",
  register:"How they presented", seeing:"How you see them", gloss:"A word they use", ownevent:"Anything else"};
var CLAIM_KIND_CHIPOPTS = [["prediction","A prediction — something would happen"],["now","A claim about right now"],
  ["commentary","Running commentary"],["announcement","An announcement"],["instruction","Not a claim — an instruction"]];
var RESPONSE_OPTS = ["I answered back","It argued with what I decided"];
function detailStepApplies(step){
  if(step === "newpiece") return newPieceWanted();
  if(step === "manner") return hasPresence();
  if(step === "among") return whoCount() >= 2 || cap.whoFlags.indexOf("group") !== -1;
  return true;
}
function detailStepHasContent(step){
  if(!cap) return false;
  if(step === "time") return !!cap.timeExplicit;
  switch(step){
    case "who": return !!(cap.whoIds.length || cap.whoFlags.length || cap.whoOwn);
    case "newpiece": return !!(cap.newPiece.name || cap.newPiece.noName || cap.newPiece.likeness);
    case "channels": return !!cap.channels.length;
    case "manner": return !!(cap.mannerWhere.length || cap.mannerHow.length || cap.bodySpots.length || cap.bodySpotOwn);
    case "among": return !!cap.among.length;
    case "claim": return !!cap.claimKind;
    case "register": return !!cap.register.length;
    case "seeing": return !!(cap.seeingOwn || cap.seeingChip);
    case "gloss": return !!cap.glossTerm;
    case "ownevent": return !!cap.eventOwn;
  }
  return false;
}
function detailAdvance(){
  if(detail.returnStep === "review"){
    var rMsg = threadMsgById(detail.msgId);
    if(rMsg){
      rMsg.answered = true;
      rMsg.summary = DETAIL_LABELS[detail.step] + (detailStepHasContent(detail.step) ? " — noted." : " — passed.");
      saveThread();
    }
    detail.returnStep = "";
    detail.step = "review";
    var rm3 = pushMsg({type:"dreview", filed:null, editing: detail.editing});
    detail.msgId = rm3.id;
    render();
    return;
  }
  var curMsg = threadMsgById(detail.msgId);
  if(curMsg && detail.step !== "review"){
    curMsg.answered = true;
    curMsg.summary = DETAIL_LABELS[detail.step] + (detailStepHasContent(detail.step) ? " — noted." : " — passed.");
    saveThread();
  }
  var idx = DETAIL_STEPS.indexOf(detail.step);
  var nxt = null;
  for(var i = idx + 1; i < DETAIL_STEPS.length; i++){
    if(detailStepApplies(DETAIL_STEPS[i])){ nxt = DETAIL_STEPS[i]; break; }
  }
  if(!nxt){
    detail.step = "review";
    var rm = pushMsg({type:"dreview", filed:null, editing: detail.editing});
    detail.msgId = rm.id;
  } else {
    detail.step = nxt;
    var m2 = pushMsg({type:"dstep", step:nxt});
    detail.msgId = m2.id;
  }
  render();
}
function dstepHTML(m){

    h += '<div class="chiprow">' + dchip("npstanding", "It stands for something that happened", d.newPiece.standing) + '</div>' + next;
  }

      + optChips("how", HOW_OPTS, d.mannerHow, true);
    var showSpots = d.mannerWhere.indexOf("In a part of my body") !== -1
      || d.channels.indexOf("A feeling in my body") !== -1

function handleDetailText(text){
  if(!detail || !cap) return;
  var f = detail.textField;
  detail.textField = "";
  if(f === "whoOwn") cap.whoOwn = text;
  else if(f === "npName"){ cap.newPiece.name = text; if(text) cap.newPiece.noName = false; }
  else if(f === "bodySpotOwn") cap.bodySpotOwn = text;
  else if(f === "claimOwn") cap.claimOwn = text;
  else if(f === "seeingOwn") cap.seeingOwn = text;
  else if(f === "glossTerm") cap.glossTerm = text;
  else if(f === "glossDoesOwn") cap.glossDoesOwn = text;
  else if(f === "eventOwn") cap.eventOwn = text;
}
function handleDetailChip(spec){
  if(!detail || !cap) return;
  flushPendingPour(); /* a tap is a pause — a hanging pour run gets its proposals */
  var parts = String(spec || "").split(":");
  var act = parts[0];
  if(act === "next"){ detailAdvance(); return; }
  if(act === "revvoice" || act === "revkind" || act === "revtime"){
    detail.returnStep = "review";
    detail.step = act === "revtime" ? "time" : (cap.claimKind || act === "revkind" ? "claim" : "who");
    var rvm = pushMsg({type:"dstep", step:detail.step});
    detail.msgId = rvm.id;
    render();
    return;
  }
  if(act === "time"){
    var tb2 = TOLD_TIME_BUCKETS[parts[1]] ? parts[1] : "now";
    cap.timeBucket = tb2;
    cap.timeLabel = TOLD_TIME_BUCKETS[tb2].label;
    cap.timeExplicit = true;
    render();
    return;
  }
  if(act === "writetext"){
    detail.textField = parts[1];
    var prompts = {
      whoOwn:"Say who, in your own words — it fills this step.",
      npName:"Say the name — the name as you know it, or a name you’re giving it.",
      bodySpotOwn:"Say the body spot, in your own words.",
      claimOwn:"Say the claim, in your own words.",
      seeingOwn:"Say how you see them — your words lead.",
      glossTerm:"Say the word — just the word.",
      glossDoesOwn:"Say what the word does, in your own words.",
      eventOwn:"Say whatever else belongs with it."
    };
    pushMsg({type:"companion", text:prompts[parts[1]] || "Say it in your words."});
    render();
    return;
  }
  if(act === "file"){
    var rm = threadMsgById(detail.msgId);
    var wasEdit = detail.editing;
    var ledBefore = ledger.entries.length;
    var capFirst = computeCaptureFirsts(); /* figured from cap BEFORE it files */
    detail = null;
    fileCapture();
    if(rm){ rm.filed = true; saveThread(); }
    /* the review message now reads "As you said it" — no extra line */
    /* a first from this filing is its feedback — unless the filing
       also created a claim, whose own organizing (precedent or
       filing facts, inside fileCapture) already spoke for it */
    if(capFirst && ledger.entries.length === ledBefore) postNoticed(capFirst);
    render();
    return;
  }
  if(act === "dropfile"){
    var rm2 = threadMsgById(detail.msgId);
    var wasEdit2 = detail.editing;
    if(rm2){ rm2.filed = false; saveThread(); }
    detail = null; cap = null;
    /* the review message now reads "Left as it was." / "Not kept." */
    render();
    return;
  }
  var idx = parseInt(parts[1], 10);
  if(act === "piece"){ var p = atlas.pieces[idx]; if(p) toggleIn(cap.whoIds, p.id); }
  else if(act === "whoflag"){ var wf = WHO_FLAG_OPTS[idx]; if(wf) toggleIn(cap.whoFlags, wf[0]); }
  else if(act === "npnoname"){ cap.newPiece.noName = !cap.newPiece.noName; }
  else if(act === "likeness"){ cap.newPiece.likeness = LIKENESS_OPTS[idx] || ""; }
  else if(act === "npstatus"){ cap.newPiece.status = idx === 0 ? "new" : "known"; }
  else if(act === "npstanding"){ cap.newPiece.standing = !cap.newPiece.standing; }
  else if(act === "channels"){ toggleIn(cap.channels, CHANNEL_OPTS[idx]); }
  else if(act === "where"){ toggleIn(cap.mannerWhere, WHERE_OPTS[idx]); }
  else if(act === "how"){ toggleIn(cap.mannerHow, HOW_OPTS[idx]); }
  else if(act === "spot"){ var sp = learnedBodySpots()[idx]; if(sp) toggleIn(cap.bodySpots, sp); }
  else if(act === "among"){ toggleIn(cap.among, AMONG_OPTS[idx]); }
  else if(act === "claimkind"){
    var v2 = idx === 0 ? "" : (CLAIM_KIND_CHIPOPTS[idx - 1] ? CLAIM_KIND_CHIPOPTS[idx - 1][0] : "");
    cap.claimKind = (cap.claimKind === v2) ? "" : v2;
    cap.claimChips = [];
  }
  else if(act === "claimsub"){ var cs = (CLAIM_SUBS[cap.claimKind] || [])[idx]; if(cs) toggleIn(cap.claimChips, cs); }
  else if(act === "claimwho"){ var o = claimWhoOptions()[idx]; if(o) cap.claimWhoId = o[0]; }
  else if(act === "response"){ toggleIn(cap.response, RESPONSE_OPTS[idx]); }
  else if(act === "register"){ var ro = REGISTER_OPTS_CAP[idx]; if(ro) toggleIn(cap.register, ro[0]); }
  else if(act === "seeingchip"){ cap.seeingChip = (cap.seeingChip === SEEING_OPTS[idx]) ? "" : SEEING_OPTS[idx]; }
  else if(act === "glossdoes"){ cap.glossDoes = (cap.glossDoes === GLOSS_DOES_OPTS[idx]) ? "" : GLOSS_DOES_OPTS[idx]; }
  render();
}

function bindLadder(){
  el("ladBack").addEventListener("click", function(){ go(ladderReturn || "help"); });
  el("ladNoteSave").addEventListener("click", function(){
    ladder.noteForHardDay = el("ladNote").value.trim();
    saveLadder(); toast = "Saved.";
    render();
  });
  el("ladCAdd").addEventListener("click", function(){
    var n = el("ladCName").value.trim(), ph = el("ladCPhone").value.trim();
    if(!n || !ph){ (n ? el("ladCPhone") : el("ladCName")).focus(); return; }
    ladder.contacts.push({name:n, phone:ph});
    saveLadder(); render();
  });
  document.querySelectorAll("[data-delcontact]").forEach(function(b){
    b.addEventListener("click", function(){
      ladder.contacts.splice(parseInt(b.getAttribute("data-delcontact"), 10), 1);
      saveLadder(); render();
    });
  });
  el("ladClinSave").addEventListener("click", function(){
    ladder.clinician = {name: el("ladClinName").value.trim(), phone: el("ladClinPhone").value.trim()};
    saveLadder(); toast = "Saved to your ladder\u2019s professional rung.";
    render();
  });
}



/* ================= boot ================= */
el("helpBtn").addEventListener("click", function(){
  if(view === "locked") return; /* v2.7 (#14): the doors stay shut while the record is locked */
  if(view !== "help"){ helpReturn = view; }
  helpBar = ""; /* a fresh press of Help starts at the three bars */
  view = "help";
  render(); scrollViewTop();
});
/* the side doors: back to the talk, the card comes into the
   thread, and the talk rests at its end (v1.29) */
function doorIntoThread(postFn){
  if(view === "locked") return; /* v2.7 (#14) */
  view = "home";
  postFn();
  render();
  scrollThreadEnd(true);
}
el("circlesBtn").addEventListener("click", function(){ doorIntoThread(postCirclesDoor); });
el("playlistBtn").addEventListener("click", function(){ doorIntoThread(postPlaylistDoor); });
/* v2.0 (parity map row 6): the boot veil — the photo room
   and the wordmark, shown ONCE per session, fully faded
   inside 600ms, and pointer-events none throughout, so
   it can never stand between a person and the bar */
(function(){
  var bv = el("bootveil");
  if(!bv) return;
  var seen = false;
  try{ seen = !!sessionStorage.getItem("ep_boot_seen"); }catch(e){}
  if(seen){ if(bv.parentNode) bv.parentNode.removeChild(bv); return; }
  try{ sessionStorage.setItem("ep_boot_seen", "1"); }catch(e){}
  setTimeout(function(){ bv.classList.add("gone"); }, 150);
  setTimeout(function(){ if(bv.parentNode) bv.parentNode.removeChild(bv); }, 620);
})();
/* v2.7 (#14): a set lock greets the session before anything of
   the record does — no greeting, no thread, nothing leaks first */
if(lockEngaged()) view = "locked";
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  /* the update path (v1.25): the worker skips waiting and
     claims its clients the moment a new build activates
     (sw.js). When that takeover lands on a page that was
     ALREADY controlled — an update arriving, not a first
     install — refresh onto the new build exactly once, so
     an open app never sits on a stale build. The session
     flag is set before the reload and cleared on every
     normal load, so this can fire once per update and can
     never loop. */
  var epWasControlled = !!navigator.serviceWorker.controller;
  try{ sessionStorage.removeItem("ep_sw_reloaded"); }catch(e){}
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if(!epWasControlled) return; /* first install — this page already runs this build */
    try{
      if(sessionStorage.getItem("ep_sw_reloaded")) return;
      sessionStorage.setItem("ep_sw_reloaded", "1");
    }catch(e){}
    location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
