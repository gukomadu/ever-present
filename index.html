   One screen is the conversation. The only other full screens are
   flows, not views of the record: arrival, companion creation, and
   the Help overlay the Help button opens (the ladder it leads to). */
/* the frame's scrollers (v1.32, THE DOCK): the window never
   scrolls — views scroll inside #app, and the talk scrolls
   inside .thread. Every scroll in the app goes through
   these two. */
function scrollViewTop(){ var a = el("app"); if(a) a.scrollTop = 0; }
/* v2.0 S11 (feel): the door-into-thread and card-bring
   rests glide (smooth); boot and send rests stay instant;
   reduced motion makes every rest instant */
function scrollThreadEnd(smooth){
  var t = document.querySelector(".thread"); if(!t) return;
  var reduce = false;
  try{ reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){}
  if(smooth && !reduce && t.scrollTo){ t.scrollTo({top:t.scrollHeight, behavior:"smooth"}); }
  else t.scrollTop = t.scrollHeight;
}
/* v2.0 (field report A): the frame's height is locked to
   the VISIBLE viewport. 100dvh covers modern browsers;
   where dvh is missing or wrong (older Android WebViews
   that open the link inside another app), 100vh measures
   the full device height including the area behind the
   system bars — the frame runs taller than the visible
   screen and the docked bar lands below the fold,
   "unavailable". --ep-h is set from visualViewport (the
   visible area, keyboard included) and wins over both. */
function epFit(){
  var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
  if(h) document.documentElement.style.setProperty("--ep-h", h + "px");
}
window.addEventListener("resize", epFit);
if(window.visualViewport) window.visualViewport.addEventListener("resize", epFit);
epFit();
function go(v){
  view = v;
  render();
  scrollViewTop();
}
function headerHTML(){
  var h = '<h1 class="appname">Ever Present</h1>';
  if(companion){
    h += '<p class="companion-line">'+esc(companion.name)+' keeps your record.</p>';
  }
  return h;
}
var lastRenderedView = "";
function render(){
  var v = el("app");
  /* v2.0 (parity map row 7): a view SWAP moves — a 200ms
     fade + 6px rise; re-renders inside one view (every new
     message) do not re-animate the frame */
  var swapped = (view !== lastRenderedView);
  lastRenderedView = view;
  var h = "";
  if(toast){ h += '<div class="toast">'+esc(toast)+'</div>'; toast = ""; }
  if(view === "locked"){ v.className = "wrap"; v.innerHTML = h + viewLocked(); bindLocked(); }
  else if(view === "arrival"){ v.className = "wrap"; v.innerHTML = h + viewArrival(); bindArrival(); }
  else if(view === "create"){ v.className = "wrap"; v.innerHTML = h + viewCreate(); bindCreate(); }
  else if(view === "help"){ v.className = "wrap"; v.innerHTML = headerHTML() + h + viewHelp(); bindHelp(); }
  else if(view === "ladder"){ v.className = "wrap"; v.innerHTML = headerHTML() + h + viewLadder(); bindLadder(); }
  else { v.className = "wrap home"; v.innerHTML = h + viewThread(); bindThread(); }
  if(swapped) v.classList.add("view-in");
}

    return !isChecked(e) && !(e.move && e.move.trim()) && !e.doorsDismissed && !e.doorsPosted;
  }).sort(function(a,b){
    var ka = a.kind === "announcement" ? 0 : 1;
    var kb = b.kind === "announcement" ? 0 : 1;
    if(ka !== kb) return ka - kb;
    return a.ts - b.ts;
  });
  if(!cands.length) return false;
  postDoors(cands[0]);
  return true;
}
function pastMoves(){
  return ledger.entries.filter(function(e){
    return isChecked(e) && e.move && e.move.trim();
  }).sort(function(a,b){ return b.ts - a.ts; }).slice(0,3);
}
/* ---- the interruption ----
   From the record only: verdicts landing in a short window with
   nothing answering them — no moves, no pours. The companion holds
   space and hands back the person's own authorship evidence: their
   moves, counted and quoted. Once per signature episode, never
   repeated for the same window, dismissible. It never names a
   state, never claims it detected anything, never escalates. */
function interruptionSignature(){
  var now = Date.now(), W = 48 * 3600 * 1000;
  var blasts = ledger.entries.filter(function(e){
    return !e.timeUnknown && e.kind === "announcement" && e.ts <= now && (now - e.ts) <= W;
  });
  if(blasts.length < 2) return null;
  var answered = false;
  ledger.entries.forEach(function(e){
    if(e.move && e.move.trim() && e.tsOutcome && e.tsOutcome <= now && (now - e.tsOutcome) <= W) answered = true;
  });
  if(!answered) atlas.events.forEach(function(ev){
    if(!ev.timeUnknown && (ev.type === "pour" || ev.mode === "pour") && ev.ts <= now && (now - ev.ts) <= W) answered = true;
  });
  if(answered) return null;
  return blasts.map(function(e){ return e.id; }).sort().join(",");
}
function maybePostInterruption(){
  var key = interruptionSignature();
  if(!key) return false;
  if(vibeOf() === "asked") return false;
  if(thread.interruptionKey === key) return false;
  if(thread.interruptionHandledAt && (Date.now() - thread.interruptionHandledAt) < 48 * 3600 * 1000) return false;
  var moves = ledger.entries.filter(function(e){ return e.move && e.move.trim(); })
    .sort(function(a,b){ return (b.tsOutcome || b.ts) - (a.tsOutcome || a.ts); });
  var line = "";
  if(moves.length){
    line = "Your record says you move: " + moves.length + (moves.length === 1 ? " move" : " moves")
      + " in your record. Last one: \u201C" + moves[0].move.trim() + "\u201D";
  }
  pushMsg({type:"interrupt", key:key, hasMoves:moves.length > 0, line:line, dismissed:false});
  thread.interruptionKey = key;
  saveThread();
  return true;
}

   entries — reception only, no knowledge, no new doors.
   OFFER: calm returns only — a later open, no fresh blast in the
   last ~6 hours, no burst window open. Then the companion may bring
   ONE knowledge item, matched to the person's recent record.
   Knowledge is information about what others have described —
   never advice, never a statement about the person's own state.

  /* --- The heart sweep, staged 2026-10-27 in

  /* Heym, N., Kibowski, F., Bloxsom, C., Blanchard, A., Harper, A.,

  {theme:"empathy-can-be-aimed", label:"being read without being cared for", tags:["empathy","accurate reading","manipulation","antagonistic","dark empath"],
   l1:"Research has a profile for it: reading people accurately and aiming the reading at them anyway. Being read is not the same as being cared for — the skill and the intent are two different things.",
   l2:"When researchers profiled nearly a thousand adults, about one in six of those with antagonistic traits also scored high on empathy. They could tell what others felt — and the map served them, not the person they were reading.",
   ctx:"People describe that too — being read accurately by something that doesn't care for them. Research has a profile for exactly that: the reading skill and the intent are separate things."},
  /* Ickes, W. (1993). "Empathic accuracy", Journal of Personality,
     61(4), 587–610. DOI 10.1111/j.1467-6494.1993.tb00783.x
     (https://doi.org/10.1111/j.1467-6494.1993.tb00783.x). The
     review that founded empathic-accuracy research: inferring

     modest, and people's own ratings of their mind-reading skill

  {theme:"no-reader-is-total", label:"no reader is total", tags:["mind reading","empathic accuracy","limits","claimed access"],
   l1:"Even the people closest to us only ever read part of what we're thinking — between real people, mind-reading is always partial. Total access is something they say — not something anyone actually has.",
   l2:"Decades of laboratory studies found partners and friends correctly infer only some of each other's actual thoughts and feelings — and people who believe they're excellent mind-readers usually aren't.",
   ctx:"People who hear voices describe that too — something claiming to know every thought as it's thought. Between real people, that kind of total reading has never been measured; it is always partial."},
  /* Klimecki, O.M., Leiberg, S., Ricard, M. & Singer, T. (2014).
     "Differential pattern of functional brain plasticity after
     compassion and empathy training", Social Cognitive and
     Affective Neuroscience, 9(6), 873–879. DOI 10.1093/scan/nst060
     (https://doi.org/10.1093/scan/nst060). Empathic-resonance

  {theme:"feeling-with-feeling-for", label:"feeling with, feeling for", tags:["empathy","compassion","empathic distress","warmth","affiliation"],
   l1:"Feeling with someone's pain and feeling for them are two different stances. One can leave you flooded; the other can leave you steadier and warmer. Brain imaging can tell them apart.",
   l2:"In one experiment, training people to resonate with suffering raised their distress, while training in warm concern reversed it — and lit up the brain's reward and affiliation systems instead of its pain systems.",
   ctx:"People describe that too — the difference between drowning in a feeling and being met with warmth. Research can tell those two stances apart, and they cost the person holding them differently."},
  /* Gilbert, P. (2009). "Introducing compassion-focused therapy",

     10.1192/apt.bp.107.005264
     (https://doi.org/10.1192/apt.bp.107.005264). Compassion-focused

  {theme:"three-systems-one-undersupplied", label:"three systems, one undersupplied", tags:["threat system","drive","soothe","safeness","affiliation","regulation"],
   l1:"One way researchers picture it: we run three systems — one watching for threat, one chasing what we want, and one for feeling safe and soothed. If the safe one rarely gets switched on, threat runs the whole house.",
   l2:"The soothing system grew out of being cared for — it's the physiology of feeling safe with others. Like the other systems, it can be practised and strengthened; it isn't only something that happens to you.",
   ctx:"People describe that too — living on alert all the time, with the settled, safe feeling rarely switching on. One model pictures three systems, and the soothing one can be built up, not just waited for."},
  /* Gilbert, P., Clarke, M., Hempel, S., Miles, J.N.V. & Irons, C.
     (2004). "Criticizing and reassuring oneself: An exploration of
     forms, styles and reasons in female students", British Journal
     of Clinical Psychology, 43, 31–50. DOI
     10.1348/014466504772812959
     (https://doi.org/10.1348/014466504772812959). Self-talk in

  {theme:"the-reassuring-voice-is-a-capacity", label:"the reassuring voice is a capacity", tags:["self-talk","inner critic","persecutor","self-reassurance","warmth"],
   l1:"Self-talk has different voices in it: one that finds fault, one that wants to punish, and one that can reassure. The reassuring one is a separate capacity — it can be practised and made easier to reach.",
   l2:"Researchers found the punishing form of self-talk did the most damage, while being able to remind yourself — warmly, on purpose — of what's true and good about you protected people from it.",
   ctx:"People describe that too — an inner voice that only finds fault, or worse, wants to punish. Research separates that from the capacity to reassure yourself, and the reassuring one can be practised."},
  /* Lieberman, M.D., Eisenberger, N.I., Crockett, M.J., Tom, S.M.,

  {theme:"naming-cools-it", label:"naming a feeling cools it", tags:["affect labeling","naming","feelings","words","amygdala"],
   l1:"Putting a feeling into words — just naming it — measurably turns its volume down. You don't have to solve it first. Naming is already a move.",
   l2:"In brain-imaging studies, choosing a word for the emotion on a face quieted the amygdala, the brain's alarm, compared with just looking at it. The word itself did some of the work.",
   ctx:"People describe that too — a feeling getting quieter once it has its exact name. Naming it is already a move; the studies show the word itself does some of the work."},
  /* Kashdan, T.B., Barrett, L.F. & McKnight, P.E. (2015).
     "Unpacking emotion differentiation: Transforming unpleasant
     experience by perceiving distinctions in negativity", Current
     Directions in Psychological Science, 24(1), 10–16. DOI

     (https://doi.org/10.1177/0963721414550708). A review of emotion

  {theme:"finer-words-looser-grip", label:"finer words, looser grip", tags:["granularity","differentiation","precise words","distress","rejection"],
   l1:"'Bad' is a bucket. The feeling usually has a more exact name, and finding it loosens the grip. People who can tell their hard feelings apart, precisely, ride them out better.",
   l2:"Across studies, people with finer-grained feeling words reached less for harmful ways of coping and were knocked sideways less by rejection — and the precision itself can be practised.",
   ctx:"People describe that too — everything filed under 'bad.' People who can tell their hard feelings apart precisely ride them out better, and the precision can be practised."},
  /* Tangney, J.P., Stuewig, J. & Mashek, D.J. (2007). "Moral
     emotions and moral behavior", Annual Review of Psychology, 58,
     345–372. DOI 10.1146/annurev.psych.56.091103.070145
     (https://doi.org/10.1146/annurev.psych.56.091103.070145). The

     SCOPE NOTE (do not drop): review chapter; the underlying
     research leans on self-report scenario measures, largely
     Western samples. File the distinction (deed-verdict vs

  {theme:"the-whole-self-verdict", label:"a verdict on the whole self", tags:["shame","guilt","verdict","whole self","hiding","repair"],
   l1:"There's a difference between 'I did something bad' and 'I am bad.' The second is a verdict on the whole self — and it's the one that makes a person want to disappear.",
   l2:"Research separates the two cleanly: judging a deed can lead to fixing it; judging the whole self leads to hiding and lashing out. A verdict on one thing you did and a verdict on everything you are are different objects.",
   ctx:"People who hear voices describe that too — one moment inflated into a verdict on everything they are. Research separates a verdict on a deed from a verdict on the whole self; they are different objects."},
  /* Hochschild, A.R. (1979). "Emotion work, feeling rules, and
     social structure", American Journal of Sociology, 85(3),
     551–575. https://www.jstor.org/stable/2778583. The founding
     statement of the sociology of emotion: every social world
     carries "feeling rules" — shared, usually invisible norms
     about what a person should feel, how strongly, and for how

  {theme:"feeling-rules-are-handed-down", label:"feeling rules are handed down", tags:["feeling rules","emotion work","norms","should feel","society"],
   l1:"Every group has rules about what you're supposed to feel — how much, how long, about what. Rules about feelings are handed down. They aren't the same as the feelings themselves.",
   l2:"A sociologist showed people constantly doing hidden work to make their feelings match the rules around them — which means a rule can be installed from outside and mistaken for your own heart.",
   ctx:"People describe that too — being policed on what they're allowed to feel. Rules about feelings are handed down from outside; they aren't the feelings themselves."},
  /* Nussbaum, M.C. (2001). Upheavals of Thought: The Intelligence
     of Emotions, Cambridge University Press. ISBN 9780521462020. A
     neo-Stoic account: emotions are appraisals — judgments about

     not drop): philosophy, not empirical research — a theory of

  {theme:"feelings-carry-verdicts", label:"feelings carry verdicts", tags:["appraisal","judgment","grief","compassion","love","philosophy"],
   l1:"A feeling is never only a feeling — it carries a verdict inside it about what matters. You can open a feeling up, read the verdict it came with, and decide whether that verdict is yours.",
   l2:"A philosopher argued that emotions are judgments of value aimed at things we can't control — which means the judgment inside a feeling can be examined, and refused, without denying the feeling itself.",
   ctx:"People describe that too — a feeling arriving with a whole judgment packed inside it. The judgment can be taken out and examined, and refused, without denying the feeling."},
  /* Ghadri, J.R., Wittstein, I.S., Prasad, A. et al. (2018).
     "International Expert Consensus Document on Takotsubo Syndrome
     (Part I): Clinical characteristics, diagnostic criteria, and

     DOI 10.1093/eurheartj/ehy076
     (https://doi.org/10.1093/eurheartj/ehy076). The international

     preceded by an intense emotional trigger, driven by a surge of
     stress hormones along the brain–heart axis. SCOPE NOTE (do
     not drop): cardiology consensus document; takotsubo is a

     predominantly affecting postmenopausal women. File ONLY the

     health. Serves the founder's heart as part of the mind. */
  {theme:"the-heart-is-in-the-circuit", label:"the heart is in the circuit", tags:["heart-brain axis","emotion","physiology","stress hormones"],

     clips counts remain on the facts object for the code's own
     presence checks; they are never spoken. */
  var parts = [];
  /* v2.4 §2b: "1 thing said," never "1 claim said" — the exact
     offender the founder's §0 replay named, now in plain form */
  if(f.claimsOpened) parts.push(f.claimsOpened + (f.claimsOpened === 1 ? " thing" : " things") + " said");
  if(f.claimsSettled) parts.push(f.claimsSettled + " settled");
  if(f.claimsStillOpen) parts.push(f.claimsStillOpen + " still open");
  if(f.pieceNames.length) parts.push(f.pieceNames.slice(0, 3).join(", ") + " around");
  if(f.songs.length) parts.push("you added “" + f.songs[f.songs.length - 1].title + "”");
  var line;
  if(parts.length){
    var joined = parts.length === 1 ? parts[0]
      : parts.slice(0, -1).join(", ") + (parts.length > 2 ? "," : "") + " and " + parts[parts.length - 1];
    line = label + " — " + joined + ".";
  } else {
    line = label + " was quiet in the record."; /* noteShrugMessage keys on "quiet in the record" — keep the phrase */
  }
  if(f.taste) line += " In your words: “" + shortWords(f.taste, 70) + "”";
  return line;
}
function digestWeekLine(w){
  var parts = [];
  if(w.topPiece && w.topPieceN >= 2) parts.push(w.topPiece + " around " + w.topPieceN + " times");
  /* v2.4 §2b: the week line speaks plainly too — "N of them were
     announcements," "N things settled/still open" (the ban) */
  if(w.topKind && w.topKindN >= 2)
    parts.push(w.topKindN + " of them were " + (KIND_SPOKEN[w.topKind] || "things they said"));
  if(w.settled) parts.push(w.settled + (w.settled === 1 ? " thing" : " things") + " settled");
  if(w.openNow) parts.push(w.openNow + (w.openNow === 1 ? " thing" : " things") + " still open");
  if(!parts.length) return "";
  return "This week: " + parts.slice(0, 3).join("; ") + ".";
}
function briefingText(){
  var dg = journeyDigest();
  if(!dg.hasPrior) return ""; /* first-ever days keep the arrival law, untouched */
  var lines = [digestDayLine(dg.yesterday, "Yesterday")];
  var T = dg.today;
  if(T.writings || T.pours || T.claimsOpened || T.songs.length || T.clips)
    lines.push(digestDayLine(T, "Today so far"));
  var wl = digestWeekLine(dg.week);
  if(wl) lines.push(wl);
  /* the journey's visible shape (v2.2, Duolingo translated): the
     record itself accumulating — pieces on the map, songs on the
     playlist. Growth of HIS record, never points or levels. */
  if(atlas.pieces.length || playlist.songs.length){
    var shp = [];
    if(atlas.pieces.length) shp.push(atlas.pieces.length + (atlas.pieces.length === 1 ? " piece" : " pieces") + " on the map");
    if(playlist.songs.length) shp.push(playlist.songs.length + (playlist.songs.length === 1 ? " song" : " songs") + " on the playlist");
    lines.push("The record so far: " + shp.join(", ") + ".");
  }
  /* at most one door, and only one that arises from the record */
  var oc = dg.yesterday.firstOpenClaim || T.firstOpenClaim;
  if(oc){
    lines.push("The open one — “" + shortWords(oc.claim, 60) + "” — is still waiting. Look at it, or let it ride?");
  } else if(playlist.songs.length){
    var lastSongTs = 0;
    playlist.songs.forEach(function(s){ if((s.ts || 0) > lastSongTs) lastSongTs = s.ts || 0; });
    if(lastSongTs && Date.now() - lastSongTs >= 7 * 86400000)
      lines.push("Your playlist’s been standing at " + playlist.songs.length
        + (playlist.songs.length === 1 ? " song" : " songs") + " a while — want to build it a little today?");
  }
  return lines.join(" ");
}
/* the briefing fires once a day, by whichever door the day opens
   with: the standing opener on a new day (ensureThread), the
   welcome greeting (folded into it), or — when he simply starts
   talking — ahead of the first substantive reply. In live mode
   the digest rides into the model's packet instead of posting
   as a template line, so the live voice can lead with it. */
/* the claim the briefing's one door points at, when it points at
   one — the same selection briefingText makes, so the door can
   ride the message as tappable chips (v2.2, Woebot: a fork after
   a substantive turn is carried by options, not bare words) */
function briefingDoorClaim(){
  var dg = journeyDigest();
  return dg.yesterday.firstOpenClaim || dg.today.firstOpenClaim || null;
}
function maybePostBriefing(){
  var tk = dayKeyOf(Date.now());
  if(thread.briefingDay === tk) return false;
  thread.briefingDay = tk;
  var text = briefingText();
  if(!text){ saveThread(); return false; }
  if(liveOn()){ queueOrgNote("Journey context — " + text); saveThread(); return true; }
  var bm = pushMsg({type:"companion", briefing:true, text:text});
  if(text.indexOf("still waiting") !== -1){
    var oc = briefingDoorClaim();
    if(oc){ bm.doorClaimId = oc.id; saveThread(); }
  }
  saveThread();
  return true;
}

/* ================= v2.2 — THE BEHAVIOR PARITY PASS =================
   The founder's directive (2026-10-26): "Use all their specs and
   incorporate it into my app" — Finch, Spotify, ChatGPT Pulse,
   Woebot, Duolingo, Bearable, translated through EP's laws, which
   outrank every reference (behavior-parity-map.md). What lands
   here: Pulse's finite initiation budget; Spotify's weekly story,
   DJ move and echoes; Finch's small doors and no-guilt rests;
   Woebot's option-carried turns and loop-closing; Duolingo's
   visible journey shape — the record growing, never XP, streaks
   or levels (excluded on record); Bearable's honest pattern
   talk-back. Nothing here grades, scores, streaks or guilts the
   person, and nothing is initiated mid-pour or mid-blast. */

/* ---- Pulse: the initiation budget ----
   Companion-initiated substance is finite: the morning briefing
   stands apart (v2.1), and on top of it at most TWO initiated
   cards a day across every source — a connection (v1.11.1, which
   spends from this budget in postConnection), the story, the DJ,
   an echo, a pattern, the loop-closing questions, the small
   doors. When the day's are spent and something true was still
   waiting, the companion says so, once that day: "That's
   everything I found today." Then it only answers. No badges,
   no dots, no feed — the finitude is the point. */
function initBudgetLeft(){
  var tk = dayKeyOf(Date.now());
  if(!thread.initBudget || thread.initBudget.key !== tk) thread.initBudget = {key:tk, n:0};
  return 2 - thread.initBudget.n;
}
function spendInit(){
  var tk = dayKeyOf(Date.now());
  if(!thread.initBudget || thread.initBudget.key !== tk) thread.initBudget = {key:tk, n:0};
  thread.initBudget.n++;
  saveThread();
}
/* every new initiation shares the standing gates: a burst window
   or a fresh blast is HOLD and "Only when I ask" hears nothing
   initiated (knowledgeBlockedNow carries both) — and a protest as
   his last word is witnessed, never answered with doors, story,
   songs or questions */
function parityCalm(){
  if(knowledgeBlockedNow()) return false;
  for(var i = thread.messages.length - 1; i >= 0; i--){
    if(thread.messages[i].type === "person")
      return !protestIn(thread.messages[i].text || "");
  }
  return true;
}

/* ---- Spotify: the week, told back ----
   Once a week, on the first calm open after the week turns, the
   companion tells the week that just ended back from the record:
   what they said and how it landed, who was around, the
   playlist's growth, one pattern when one honestly computes,
   and one line of his own, verbatim. Narrative first; the counts
   live inside the sentences. No dashboard, nothing scored. A
   thin week is not a story, and a story told is never retold. */
/* v2.4 §2b: the "now" kind speaks as "things about right now" —
   the map's name itself observes the founder's ban on "claims" */
var KIND_SPOKEN = {prediction:"predictions", now:"things about right now",
  commentary:"running commentary", announcement:"announcements", instruction:"instructions"};
function prevWeekStartKey(){
  var p = startOfWeekKey().split("-");
  return dayKeyOf(new Date(+p[0], +p[1] - 1, +p[2] - 7).getTime());
}
function weekWindow(key){
  var p = key.split("-");
  var startMs = new Date(+p[0], +p[1] - 1, +p[2]).getTime();
  return {start:startMs, end:startMs + 7 * 86400000};
}
function weekStoryData(){
  var wk = prevWeekStartKey();
  if(thread.storyWeek === wk) return null;
  var win = weekWindow(wk);
  if(Date.now() - win.end > 4 * 86400000) return null; /* the turn is near, or the moment has passed */
  var said = ledger.entries.filter(function(e){
    var t = e.toldTs || e.ts; return t >= win.start && t < win.end; });
  var evs = atlas.events.filter(function(ev){
    var t = ev.toldTs || ev.ts; return t >= win.start && t < win.end; });
  var songs = playlist.songs.filter(function(s){ return s.ts >= win.start && s.ts < win.end; });
  var writings = journal.entries.filter(function(en){ return en.ts >= win.start && en.ts < win.end; });
  if(!said.length && !evs.length && !songs.length && !writings.length) return null;
  var lines = [];
  if(said.length){
    var kinds = {};
    said.forEach(function(e){ kinds[e.kind] = (kinds[e.kind] || 0) + 1; });
    var topK = null, topN = 0;
    Object.keys(kinds).forEach(function(k){ if(kinds[k] > topN){ topN = kinds[k]; topK = k; } });
    var s = "They said " + said.length + (said.length === 1 ? " thing" : " things") + " last week";
    if(topK && topN >= 2 && Object.keys(kinds).length > 1)
      s += " — mostly " + (KIND_SPOKEN[topK] || "things they said");
    lines.push(s + ".");
    var checked = said.filter(isChecked);
    if(checked.length){
      var dn = checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length;
      var hp = checked.filter(function(e){ return e.outcomeChip === "happened"; }).length;
      var pt = checked.filter(function(e){ return e.outcomeChip === "partly"; }).length;
      var op = [];
      if(dn) op.push(dn + " didn’t happen");
      if(hp) op.push(hp + (hp === 1 ? " happened as said" : " happened as said"));
      if(pt) op.push(pt + " partly");
      var cs = checked.length + (checked.length === 1 ? " has" : " have") + " been checked";
      if(op.length) cs += ": " + op.join(", ");
      lines.push(cs + ".");
      var openN = said.length - checked.length;
      if(openN) lines.push(openN + (openN === 1 ? " is" : " are") + " still open, waiting on what happens.");
    } else {
      lines.push("None of them checked yet — they stand open.");
    }
  }
  /* who was around, counted from the week's moments */
  var pc = {};
  evs.forEach(function(ev){
    (ev.whoIds || []).forEach(function(id){ pc[id] = (pc[id] || 0) + 1; });
  });
  var topP = null, topPN = 0;
  Object.keys(pc).forEach(function(id){ if(pc[id] > topPN){ topPN = pc[id]; topP = id; } });
  if(topP && pieceName(topP)){
    lines.push(topPN >= 2
      ? pieceName(topP) + " was around most — " + topPN + " moments."
      : pieceName(topP) + " was around.");
  }
  var pat = computePattern(win.start, win.end);
  if(pat) lines.push(pat.line);
  if(songs.length){
    var titles = songs.slice(0, 2).map(function(s){ return "“" + s.title + "”"; }).join(", ");
    lines.push("Your playlist grew by " + songs.length + (songs.length === 1 ? " song" : " songs")
      + " — " + titles + ".");
  }
  /* one line of his own, verbatim — whole or not at all. v2.3 §0B:
     the quote comes ONLY from his journal/life writing, most recent
     ELIGIBLE line (never app-talk, complaints, corrections,
     meta-talk, social forms, or disowned content). The old fallback
     to event words is REMOVED — an event's words are the ops'
     material, not his writing, and handing them back as "in your
     words" is how his app complaint got quoted at him. No eligible
     line: the story simply carries no quote. */
  var verb = "", verbEn = null;
  writings.slice().sort(function(a, b){ return b.ts - a.ts; }).forEach(function(en){
    if(verb) return;
    if(!en.text || en.text.length > 140) return;
    if(isDisownedJournal(en.id) || isDisownedText(en.text)) return;
    if(!quoteEligibleText(en.text)) return;
    verb = en.text; verbEn = en;
  });
  if(verbEn) thread.lastQuoted = {store:"journal", id:verbEn.id, text:verbEn.text};
  if(verb) lines.push("In your words: “" + verb + "”");
  if(!lines.length) return null;
  return {weekKey:wk, lines:lines, patKey: pat ? pat.key : "", hasClaims: said.length > 0};
}
function postWeekStory(data){
  pushMsg({type:"weekstory", weekKey:data.weekKey, lines:data.lines,
           hasClaims:data.hasClaims, dismissed:false});
  thread.storyWeek = data.weekKey;
  if(data.patKey) thread.patternsShown[data.patKey] = Date.now();
  saveThread();
  return true;
}

/* ---- Bearable: the record talks back as patterns ----
   Honest cross-patterns over the record, computed — never
   intuited: a kind landing in one part of the day, two pieces
   arriving together, a kind clustering across the days in the
   window. Every statement carries its own sample size, and every
   one is about the OPS' patterns — never the person's health or
   worth. A pattern that isn't true produces silence. Delivered
   inside the weekly story, or as one budgeted card. */
function computePattern(sinceMs, untilMs){
  var best = null;
  function consider(key, line, n){ if(!best || n > best.n) best = {key:key, line:line, n:n}; }
  var timed = ledger.entries.filter(function(e){
    return !e.timeUnknown && e.ts >= sinceMs && e.ts < untilMs; });
  var byKind = {};
  timed.forEach(function(e){ (byKind[e.kind] = byKind[e.kind] || []).push(e); });
  Object.keys(byKind).forEach(function(k){
    var arr = byKind[k];
    if(arr.length < 4) return;
    var buckets = {morning:0, afternoon:0, evening:0};
    arr.forEach(function(e){
      var h = new Date(e.ts).getHours();
      buckets[h < 12 ? "morning" : (h < 18 ? "afternoon" : "evening")]++;
    });
    var bk = "", bn = 0;
    Object.keys(buckets).forEach(function(b){ if(buckets[b] > bn){ bn = buckets[b]; bk = b; } });
    if(bn * 5 >= arr.length * 3) /* at least three in five */
      consider("tod:" + k + ":" + bk,
        "The " + (KIND_SPOKEN[k] || "things they said") + " landed in the " + bk + "s — "
        + bn + " of the last " + arr.length + " times.", arr.length);
  });
  var pairs = {};
  atlas.events.forEach(function(ev){
    var t = ev.toldTs || ev.ts;
    if(ev.timeUnknown || t < sinceMs || t >= untilMs) return;
    var ids = (ev.whoIds || []).slice().sort();
    for(var i = 0; i < ids.length; i++) for(var j = i + 1; j < ids.length; j++){
      var pk = ids[i] + "+" + ids[j];
      pairs[pk] = (pairs[pk] || 0) + 1;
    }
  });
  Object.keys(pairs).forEach(function(pk){
    if(pairs[pk] < 3) return;
    var ids = pk.split("+");
    if(!pieceName(ids[0]) || !pieceName(ids[1])) return;
    consider("pair:" + pk,
      pieceName(ids[0]) + " and " + pieceName(ids[1]) + " showed up together "
      + pairs[pk] + " times.", pairs[pk]);
  });
  var startKey = dayKeyOf(sinceMs), endKey = dayKeyOf(untilMs);
  var totalDays = journalDayKeys().filter(function(k){ return k >= startKey && k < endKey; }).length;
  if(totalDays >= 4){
    var kindDays = {};
    timed.forEach(function(e){
      (kindDays[e.kind] = kindDays[e.kind] || {})[dayKeyOf(e.toldTs || e.ts)] = 1;
    });
    Object.keys(kindDays).forEach(function(k){
      var d = Object.keys(kindDays[k]).length;
      if(d >= 3 && d * 5 >= totalDays * 3)
        consider("days:" + k,
          "The " + (KIND_SPOKEN[k] || "things they said") + " landed on " + d + " of the last "
          + totalDays + " days in the record.", d);
    });
  }
  return best;
}
function patternCandidate(){
  var now = Date.now();
  var pat = computePattern(now - 14 * 86400000, now);
  if(!pat) return null;
  var shown = thread.patternsShown[pat.key] || 0;
  if(shown && (now - shown) < 30 * 86400000) return null;
  return pat;
}
function postPatternCard(pat){
  pushMsg({type:"pattern", line:pat.line, pkey:pat.key, dismissed:false});
  thread.patternsShown[pat.key] = Date.now();
  saveThread();
  return true;
}

/* ---- Spotify: echoes ----
   The precedent machinery widened past the moment of filing:
   when today's talk genuinely matches a settled receipt, the
   receipt echoes; when a word from an entry at least a week old
   is in today's talk again — and on no day in between — his own
   line echoes. Each source rests a season after it echoes. */
function findEcho(){
  var now = Date.now();
  var recent = atlas.events.filter(function(ev){
    return !ev.timeUnknown && ev.ts <= now && (now - ev.ts) < 36 * 3600 * 1000;
  }).sort(function(a, b){ return b.ts - a.ts; });
  var i, ev, words;
  for(i = 0; i < recent.length && i < 3; i++){
    ev = recent[i]; words = evWords(ev);
    if(!words) continue;
    var hit = findPrecedent({id:"__echo", claim:words, ts:ev.ts, timeUnknown:false});
    if(hit && !(thread.echoesShown[hit.entry.id] && (now - thread.echoesShown[hit.entry.id]) < 30 * 86400000))
      return {kind:"claim", entry:hit.entry};
  }
  var todayWords = {};
  recent.forEach(function(e2){ lifeWords(evWords(e2)).forEach(function(w){ todayWords[w] = 1; }); });
  journal.entries.forEach(function(en){
    if(dayKeyOf(en.ts) === dayKeyOf(now)) lifeWords(en.text).forEach(function(w){ todayWords[w] = 1; });
  });
  if(!Object.keys(todayWords).length) return null;
  var olds = journal.entries.filter(function(en){
    return en.ts < now - 7 * 86400000 && en.text && en.text.length <= 140;
  }).filter(function(en){
    return !isDisownedJournal(en.id) && !isDisownedText(en.text); /* v2.3 §0A: a disowned line is never echoed back */
  }).sort(function(a, b){ return b.ts - a.ts; });
  for(i = 0; i < olds.length; i++){
    var en2 = olds[i];
    if(thread.echoesShown[en2.id] && (now - thread.echoesShown[en2.id]) < 30 * 86400000) continue;
    var ws = lifeWords(en2.text);
    for(var j = 0; j < ws.length; j++){
      var w = ws[j];
      if(!todayWords[w]) continue;
      var inBetween = journal.entries.some(function(x){
        return x.ts > en2.ts && dayKeyOf(x.ts) !== dayKeyOf(now)
          && dayKeyOf(x.ts) !== dayKeyOf(en2.ts) && lifeWordSet(x.text)[w];
      }) || atlas.events.some(function(x){
        return x.ts > en2.ts && (now - x.ts) > 36 * 3600 * 1000 && lifeWordSet(evWords(x))[w];
      });
      if(!inBetween) return {kind:"words", entry:en2, word:w};
    }
  }
  return null;
}
function postEcho(echo){
  var now = Date.now();
  if(echo.kind === "claim"){
    var old = echo.entry;
    var text = "An echo from your record: " + fmtDate(old.ts) + ": “" + old.claim + ".”"
      + (old.move && old.move.trim() ? " Your move: " + old.move.trim() + "." : "")
      + " It ended: " + outcomeShort(old) + ".";
    pushMsg({type:"precedent", echo:true, text:text, claimId:old.id});
    var pk = dayKeyOf(now);
    if(!djournal.precedents[pk]) djournal.precedents[pk] = [];
    djournal.precedents[pk].push(text);
    saveDjournal();
    thread.echoesShown[old.id] = now;
  } else {
    pushMsg({type:"echo", entryId:echo.entry.id, entryDay:dayKeyOf(echo.entry.ts),
             text:echo.entry.text, word:echo.word, dismissed:false});
    thread.echoesShown[echo.entry.id] = now;
  }
  saveThread();
  return true;
}

/* ---- Spotify: the DJ move ----
   In a calm moment, at most once a day, one song from his own
   co-built playlist, matched to the moment the record describes
   — announcements in the air draw the song kept for announcing,
   a commentary stretch draws the commentary song, a morning
   draws the morning song — with the reason in one line, and the
   playlist's own play path. Dismissible; a pass is a close. */
function djPick(){
  if(!playlist.songs.length) return null;
  var now = Date.now();
  var kinds = {};
  ledger.entries.forEach(function(e){
    if(!e.timeUnknown && (now - (e.toldTs || e.ts)) < 2 * 86400000 && (e.toldTs || e.ts) <= now)
      kinds[e.kind] = 1;
  });
  function byTag(tag){
    for(var i = 0; i < playlist.songs.length; i++)
      if((playlist.songs[i].tags || []).indexOf(tag) !== -1) return playlist.songs[i];
    return null;
  }
  var s;
  if(kinds.announcement && (s = byTag("announce")))
    return {song:s, reason:"They’ve been announcing — this is the one you kept for when they announce."};
  if(kinds.commentary && (s = byTag("commentary")))
    return {song:s, reason:"The commentary’s been running — this one is yours for exactly that."};
  if(new Date().getHours() < 12 && (s = byTag("mornings")))
    return {song:s, reason:"Your morning song — the one you kept for hard mornings."};
  s = playlist.songs[playlist.songs.length - 1];
  var reason = "From your playlist — the last one you added together.";
  if(s.note && s.note !== "Just mine")
    reason = "From your playlist — you kept it " + s.note.charAt(0).toLowerCase() + s.note.slice(1)
      + (/\.$/.test(s.note) ? "" : ".");
  else if(s.note === "Just mine") reason = "From your playlist — one that’s just yours.";
  return {song:s, reason:reason};
}
function postDjSong(pick){
  var s = pick.song;
  pushMsg({type:"djsong", songId:s.id, title:s.title, artist:s.artist || "",
           reason:pick.reason, dismissed:false});
  thread.djDay = dayKeyOf(Date.now());
  thread.djPending = {songId:s.id, title:s.title, ts:Date.now(), played:false, passed:false};
  saveThread();
  return true;
}

/* ---- Woebot: loop-closing ----
   Anything opened gets closed at most once — never twice, never
   a nag. A prediction past its moment earns one checking-back
   question, answered through the receipts' own chips. A surfaced
   song closes with one "did it fit?" on a later day. A passed
   door closes with one quiet line. The marks persist, so nothing
   here can re-ask. */
function dueOutcomeEntry(){
  var now = Date.now();
  var cands = ledger.entries.filter(function(e){
    return e.kind === "prediction" && !isChecked(e) && !e.loopAsked && !e.timeUnknown
      && (now - e.ts) >= 2 * 86400000;
  }).sort(function(a, b){ return a.ts - b.ts; });
  if(!cands.length) return null;
  var e = cands[0];
  /* a receipts card for this same claim is already standing
     unanswered today — the question is already in the room */
  var standing = thread.messages.some(function(m){
    return (m.type === "receipt" || m.type === "outcomeq") && m.claimId === e.id
      && dayKeyOf(m.ts) === dayKeyOf(now) && !isChecked(e);
  });
  return standing ? null : e;
}
function postOutcomeQuestion(e){
  e.loopAsked = true;
  saveLedger();
  pushMsg({type:"outcomeq", claimId:e.id});
  return true;
}
function songFitDue(){
  var p = thread.djPending;
  if(!p) return null;
  if(p.passed){ thread.djPending = null; saveThread(); return null; }
  if(dayKeyOf(p.ts) === dayKeyOf(Date.now())) return null; /* a later day, never the same one */
  return p;
}
function postSongFit(p){

/* ---- Finch: small doors ----
   One to three small, completable doors born of the record,
   offered in a calm moment — look at the still-open claim, add
   the song for a moment the record keeps naming, one line on
   yesterday in his own words. Offered, never assigned; the card
   stands at most once a day, each door rests a season once
   passed, and there is no currency, no reward, no guilt —
   an absent day is met with the record exactly as it stands. */
function smallDoorOptions(){
  var out = [];
  var now = Date.now();
  function rested(key){
    var ts = thread.doorsPassed[key] || 0;
    return ts && (now - ts) < 14 * 86400000;
  }
  var oc = openClaims().filter(function(e){ return !e.doorsPosted && !e.doorsDismissed; })
    .sort(function(a, b){ return a.ts - b.ts; })[0];
  if(oc && !rested("claim")){
    var briefed = thread.messages.some(function(m){
      return m.briefing && m.doorClaimId === oc.id && dayKeyOf(m.ts) === dayKeyOf(now);
    });
    if(!briefed)
      out.push({key:"claim", label:"Look at the one still open", claimId:oc.id}); /* v2.4 §2b: the door's label speaks plainly (the ban) */
  }
  var mom = playlistMoment();
  if(mom && !rested("song:" + mom.tag))
    out.push({key:"song:" + mom.tag, label:"Add " + mom.label, note:mom.note, tag:mom.tag});
  var taste = journeyDigest().yesterday.taste;
  if(taste && !rested("prompt"))
    out.push({key:"prompt", label:"One line on yesterday",
      prompt:"Yesterday, in your words: “" + shortWords(taste, 80)
        + "” — one more line on it, only if you want."});
  return out.slice(0, 3);
}

/* ---- Woebot: option-carried turns ----
   When a substantive exchange reaches a natural fork — a
   playback just confirmed, a move just written down — the
   companion's turn ends with two to four tappable next steps
   drawn from the record, through the same chip machinery as
   every other door. Free talk is always right there in the
   composer; the options are a floor, never a cage. */
function maybePostNextSteps(ctx, ref){
  if(vibeOf() === "asked") return false;
  var opts = [];
  if(ctx === "confirm"){
    if(ref.claimId) opts.push({label:"Check the receipts", act:"nsreceipts"});
    if(ref.whoId) opts.push({label:"Open " + pieceName(ref.whoId), act:"nspiece"});
    opts.push({label:"Pour about it", act:"nspour"});
    if(playlistMoment()) opts.push({label:"Add a song for this", act:"nssong"});
  } else if(ctx === "move"){
    var e2 = ledgerEntryById(ref.claimId);
    opts.push({label:"Check the receipts", act:"nsreceipts"});
    if(e2 && e2.whoId) opts.push({label:"Open " + pieceName(e2.whoId), act:"nspiece"});
    if(pastMoves().length) opts.push({label:"Moves that worked before", act:"nsplaybook"});
    opts.push({label:"Pour about it", act:"nspour"});
  }
  opts = opts.slice(0, 4);
  if(opts.length < 2) return false;
  pushMsg({type:"nextsteps", ctx:ctx, claimId:ref.claimId || "",
           pieceId:ref.whoId || ref.pieceId || "", options:opts, dismissed:false});
  return true;
}

/* ---- the parity pass: one finite set, at the day's first calm
   open — after the briefing and the standing surfaces, inside
   the budget, closings before openings, the story first ---- */
function maybeParityPass(){
  if(organizingOpen()) return; /* v2.3 §4: while he is organizing, ALL initiation is silent — presence + structure help only */
  var tk = dayKeyOf(Date.now());
  if(thread.parityDay === tk) return;
  thread.parityDay = tk;
  saveThread();
  if(!parityCalm()) return;
  var ctx = {story:false, storyData:null, echo:null, pat:null};
  var cands = [
    { eligible:function(){ var d = weekStoryData(); if(d){ ctx.storyData = d; return true; } return false; },
      post:function(){ postWeekStory(ctx.storyData); ctx.story = true; } },
    { eligible:function(){ return !!dueOutcomeEntry(); },
      post:function(){ postOutcomeQuestion(dueOutcomeEntry()); } },
    { eligible:function(){ return !!songFitDue(); },
      post:function(){ postSongFit(songFitDue()); } },
    { eligible:function(){ return !!thread.doorClose; },
      post:function(){ postDoorClose(); } },
    { eligible:function(){
        if((djournal.precedents[tk] || []).length) return false; /* a precedent already surfaced today */
        var e = findEcho(); if(e){ ctx.echo = e; return true; } return false; },
      post:function(){ postEcho(ctx.echo); } },
    { eligible:function(){
        if(ctx.story) return false; /* the story already carried it */
        var p = patternCandidate(); if(p){ ctx.pat = p; return true; } return false; },
      post:function(){ postPatternCard(ctx.pat); } },
    { eligible:function(){ return thread.djDay !== tk && !thread.djPending && !!djPick(); },
      post:function(){ postDjSong(djPick()); } },
    { eligible:function(){ return thread.doorDay !== tk && smallDoorOptions().length > 0; },
      post:function(){ postSmallDoors(smallDoorOptions()); } }
  ];
  var unposted = false;
  for(var i = 0; i < cands.length; i++){
    if(!cands[i].eligible()) continue;
    if(initBudgetLeft() <= 0){ unposted = true; break; }
    cands[i].post();
    spendInit();
  }
  if(unposted && thread.initSpentDay !== tk){
    thread.initSpentDay = tk;
    pushMsg({type:"companion", text:"That’s everything I found today."});
    saveThread();
  }
}

/* firsts inside a detail filing (Add detail): a channel or register
   this piece has never come through, figured from cap BEFORE
   fileCapture applies the tallies. Plain in every vibe. */
function computeCaptureFirsts(){
  if(noticedSuppressed() || !cap) return null;
  var ids = (cap.whoIds || []).filter(function(id){ return pieceById(id); });
  var i, j, p;
  for(i = 0; i < ids.length; i++){
    p = pieceById(ids[i]);
    var chans = cap.channels || [];
    for(j = 0; j < chans.length; j++){
      if(!(p.channels && p.channels[chans[j]])){
        var c = chans[j];
        return {kind:"firstchan", line:fbLine("firstchan",
          {name:p.name, chan:c.charAt(0).toLowerCase() + c.slice(1)})};
      }
    }
  }
  for(i = 0; i < ids.length; i++){
    p = pieceById(ids[i]);
    var regs = cap.register || [];
    for(j = 0; j < regs.length; j++){
      if(!(p.registers && p.registers[regs[j]])){
        var r = String(regs[j]).split(" — ")[0];
        return {kind:"firstreg", line:fbLine("firstreg",
          {name:p.name, reg:r.charAt(0).toLowerCase() + r.slice(1)})};
      }
    }
  }
  return null;
}
function ensureThread(){
  if(!bootTypingSwept){
    /* a typing bubble can only be live inside one session; one found
       in the store at boot is stale — the call it belonged to is gone */
    bootTypingSwept = true;
    if(thread.messages.some(function(m){ return m.type === "typing"; })){
      thread.messages = thread.messages.filter(function(m){ return m.type !== "typing"; });
      saveThread();
    }
  }
  var today = Math.floor(Date.now() / 86400000);
  if(!thread.messages.length){
    /* the companion speaks first and carries the opening — a new
       person is never faced with an empty thread (v1.12) */
    sessionOpenerId = pushMsg({type:"companion", text:greetingText()}).id;
    var metArrival = thread.proofDue && !thread.roomShown;
    if(thread.proofDue && !thread.roomShown){
      /* the arrival law: the showing comes with the saying — the
         room itself first, then the not-alone line, never the
         claim alone; then the standing job, finding your first */
      pushMsg({type:"roomproof", lines:roomProofLines()});
      pushMsg({type:"companion", notAlone:true, text:notAloneLine()});
      pushMsg({type:"companion", findingFirst:true, text:findingFirstText()});
      thread.roomShown = true;
      thread.proofDue = false;
    } else {
      pushMsg({type:"companion", notAlone:true, text:notAloneLine()});
    }
    pushMsg(offerMsg(true));
    /* the playlist starts as soon as possible (v1.13): the seed is
       planted inside this first greeting, after the opening settles —
       but only when arrival was met in person; a record that simply
       appears gets the same door later, as a calm daily surface */
    if(metArrival) postPlaylistSeed();
    thread.lastDay = today;
    thread.surfaceDay = today;
    thread.v16note = true; /* a brand-new thread is not an upgrade — no note owed */
    saveThread();
    bootInterruptChecked = true;
    maybePostInterruption();
    return;
  }
  if(!thread.v16note){
    /* first run after the v1.6 upgrade: the companion says what changed, once */
    thread.v16note = true;
    pushMsg({type:"companion", text:"It’s just us talking now. Everything else, I’ll bring to you."});
    saveThread();
  }
  if(thread.lastDay < today){
    sessionOpenerId = pushMsg({type:"companion", text:greetingText()}).id;
    var orgOpenNow = organizingOpen();
    if(orgOpenNow){
      /* v2.3 §4: an unfinished arrangement outranks the day's
         initiations — the mirror he is owed comes first, and the
         briefing, the daily surface, and the parity pass stay
         silent while the organizing is still open */
      if(thread.organizing.items.length - thread.organizing.mirrored >= 1 && !liveOn()) postOrgMirror();
    } else {
      maybePostBriefing(); /* v2.1: the day opens with the journey so far, not a bare hello */
    }
    thread.lastDay = today;
    bootInterruptChecked = true;
    var didInt = maybePostInterruption();
    if(thread.surfaceDay < today){
      if(!didInt && !orgOpenNow) postDailySurface();
      thread.surfaceDay = today;
    }
    /* the behavior parity pass (v2.2): one finite set of
       initiations at the day's first calm open, inside the
       budget — a burst morning hears none of it */
    if(!didInt) maybeParityPass();
    saveThread();
  }
  if(!bootInterruptChecked){
    bootInterruptChecked = true;
    maybePostInterruption();
  }
  /* a pour run left hanging across a pause gets its proposals on this open */
  var run = thread.pendingPour;
  if(run && run.ids && run.ids.length && (Date.now() - run.lastTs) > POUR_PAUSE_MS) flushPendingPour();
  /* v2.7: the owner's reminder (#7) and the evening close (#4)
     ride the day's opens — each gated, each at most once a day */
  maybePostReminder();
  maybePostEveningClose();
  maybeOfferCreation();
}
/* ---- creation, offered later (v1.12) ----
   A person who began by just talking runs the whole app with an
   unnamed companion. Creation is offered conversationally — once
   they have talked a while (three of their own messages in) or on
   a later day than the one they began — as a small card in the
   thread: dismissible, never blocking, at most once a day, and
   never again once a companion exists. Making it theirs later
   touches nothing in the record or the thread. */
function maybeOfferCreation(){
  if(companion) return;
  if(!thread.messages.length) return;
  var todayKey = dayKeyOf(Date.now());
  if(thread.createOfferDay === todayKey) return;
  var personN = 0, firstDay = "";
  for(var i=0;i<thread.messages.length;i++){
    var m = thread.messages[i];
    if(m.type === "createoffer" && !m.dismissed) return; /* one live offer at a time */
    if(m.type === "person"){ personN++; if(!firstDay) firstDay = dayKeyOf(m.ts); }
  }
  if(!personN) return;
  if(personN < 3 && !(firstDay && todayKey > firstDay)) return;
  thread.createOfferDay = todayKey;
  pushMsg({type:"createoffer", dismissed:false});
  saveThread();
}

     want the perspective to be where you're making sure you're

  if(m.type === "createoffer"){

      + '<p style="margin:4px 0">I’m still just '+esc(companionDisplayName())+' — no name of yours, no language of yours in me yet. Make me yours whenever you want.</p>'

  }
  if(m.type === "receipt"){
    var e = null;
    ledger.entries.forEach(function(x){ if(x.id === m.claimId) e = x; });
    if(!e) return "";
    var rh = '<div class="msg them"><div class="bubble"><p class="hub-label">Check the receipts</p>'

      + '<div class="muted small" style="margin-top:4px">'+esc(claimWhenLabel(e))+(e.who ? ' &mdash; '+esc(e.who) : '')+'</div>';

        + '<button type="button" class="chip" data-tout="'+e.id+':happened">It happened</button>'
        + '<button type="button" class="chip" data-tout="'+e.id+':didnt">It didn’t</button>'
        + '<button type="button" class="chip" data-tout="'+e.id+':partly">Partly</button>'
        + '<button type="button" class="chip" data-tout="'+e.id+':notyet">Not yet</button></div>';
      if(e.outcomeChip === "notyet") rh += '<p class="muted small">Marked &ldquo;not yet&rdquo; — still open.</p>';
    }
    return rh + '</div></div>';
  }
  if(m.type === "receiptsFig"){
    if(m.dismissed) return "";
    var fl = (m.lines || []).map(function(l){ return '<p style="margin:4px 0">'+esc(l)+'</p>'; }).join("");
    return '<div class="msg them"><div class="bubble"><p class="hub-label">The receipts, figured</p>'
      + fl
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':seereceipts">See the receipts</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div></div></div>';
  }
  if(m.type === "pick"){
    if(m.dismissed) return "";
    return '<div class="msg them"><div class="bubble"><p class="hub-label">Top pick</p>'
      + '<p style="margin:4px 0"><strong>'+esc(m.title)+'</strong></p>'
      + '<p style="margin:4px 0">'+esc(m.body)+'</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':pickgo">'+esc(m.goLabel)+'</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div></div></div>';
  }
  if(m.type === "mapGlimpse"){
    var pc = atlas.pieces.slice(0,10).map(function(p){
      return '<button type="button" class="chip" data-tpiece="'+p.id+'">'+esc(p.name)+'</button>';
    }).join("");
    return '<div class="msg them"><div class="bubble"><p class="hub-label">Your map</p>'
      + '<div class="chiprow">'+pc+'</div>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':openmap">Open map</button></div></div></div>';
  }
  if(m.type === "doors"){
    if(m.dismissed) return "";
    var de = null;
    ledger.entries.forEach(function(x){ if(x.id === m.claimId) de = x; });
    if(!de || isChecked(de) || (de.move && de.move.trim())) return "";
    var dchips = "";
    if(pastMoves().length)
      dchips += '<button type="button" class="chip" data-tchip="'+m.id+':playbook">Moves that worked before</button>';
    if(findPrecedent(de))
      dchips += '<button type="button" class="chip" data-tchip="'+m.id+':seeprec">See the precedent</button>';
    dchips += '<button type="button" class="chip" data-tchip="'+m.id+':pourclaim">Pour about it</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':helpdoor">Help</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':justlog">Just leave it</button>';
    return '<div class="msg them"><div class="bubble"><p class="hub-label">Still open</p>'
      + '<p style="margin:4px 0">'+esc(doorsLine())+'</p>'
      + '<p class="small muted" style="margin:4px 0">&ldquo;'+esc(de.claim)+'&rdquo;</p>'
      + '<div class="chiprow">'+dchips+'</div></div></div>';
  }
  if(m.type === "playbook"){
    var pl = (m.lines || []).map(function(l){ return '<p style="margin:4px 0">&ldquo;'+esc(l)+'&rdquo;</p>'; }).join("");
    return '<div class="msg them"><div class="bubble"><p class="hub-label">Moves that worked before</p>'
      + pl + '</div></div>';
  }
  if(m.type === "knowledge"){
    if(m.dismissed) return "";
    var kc = "";

  if(m.type === "connection"){

    var nc = "";
    if(m.doorKind === "prompt") nc += '<button type="button" class="chip" data-tchip="'+m.id+':connprompt">Write with it</button>';
    else if(m.doorKind === "receipts") nc += '<button type="button" class="chip" data-tchip="'+m.id+':connreceipts">Check the receipts</button>';

      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':addnote">Put it on the day</button>'

  }
  if(m.type === "figedit"){
    if(m.saved != null) return '<div class="msg them"><div class="bubble"><p class="muted small">'+(m.saved ? "The figures on that day read as you set them now." : "Figures left as they were.")+'</p></div></div>';
    return '<div class="msg them"><div class="bubble"><p class="hub-label">The figures, in your hands</p>'

      + '<textarea class="big short" id="figEdit_'+m.id+'" aria-label="The figured receipts for that day">'+esc((m.lines || []).join("\n"))+'</textarea>'

  if(m.type === "playlistseed"){

      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':seedstart">Start my playlist</button>'

      + '<p style="margin:4px 0">A song can hold it. Want to put one on your playlist for this?</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':wordput">Put a song on</button>'

  if(m.type === "musicoffer"){
    if(m.dismissed) return "";
    var mo = m.title ? '“'+esc(m.title)+'”'+(m.artist ? ' by '+esc(m.artist) : '')+' — want it on your playlist?'

    return '<div class="msg them"><div class="bubble room"><p class="hub-label">Music</p>'
      + '<p style="margin:4px 0">'+mo+'</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':musicput">Put it on my playlist</button>'

    return sc + '<div class="chiprow">'
      + '<button type="button" class="chip" data-tchip="'+m.id+':songyes">That’s right</button>'

    return '<div class="msg them"><div class="bubble room"><p class="hub-label">Your playlist</p>'
      + '<p style="margin:4px 0">What’s “'+esc(m.title)+'” for?</p>'
      + '<div class="chiprow">'+sf
      + '<button type="button" class="chip" data-tchip="'+m.id+':songown">In my words</button></div></div></div>';
  }
  if(m.type === "playlistgrow"){
    if(m.dismissed) return "";
    return '<div class="msg them"><div class="bubble room"><p class="hub-label">Your playlist</p>'
      + '<p style="margin:4px 0">'+(m.label ? 'One more, when you want it: '+esc(m.label)+'.' : 'Your playlist grows one song at a time. One more, when you want it.')+'</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':growadd">Add one</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div></div></div>';
  }
  if(m.type === "journalcard"){ return journalCardHTML(m); }
  /* v2.7 (journal parity): the media together (#12), retrieval
     results (#13), companion-held threads (#17), the evening
     close (#4), and the moment-born doors (#18) */
  if(m.type === "mediacard"){ return mediaCardHTML(m); }
  if(m.type === "foundcard"){
    if(m.dismissed) return "";
    return foundCardHTML(m);
  }
  if(m.type === "threadscard"){
    if(m.dismissed) return "";
    return threadsCardHTML(m);
  }
  if(m.type === "eveningclose"){
    if(m.dismissed) return "";
    var ec = '<p>' + esc(m.text) + '</p><div class="chiprow">';
    if(m.openClaimId)
      ec += '<button type="button" class="chip" data-tchip="'+m.id+':evreceipts">Look at the one still open</button>';
    ec += '<button type="button" class="chip" data-tchip="'+m.id+':evjournal">Open the journal</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div>';
    return cardBubble("The evening close", ec);

  if(m.type === "momentdoor"){
    if(m.dismissed) return "";
    if(m.kind === "dream")
      return cardBubble("From the night",
        '<p>A dream like that can be poured out like anything else — in your words, on today’s page. Only if you want it held.</p>'
        + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':mdoorpour">Pour the dream</button>'
        + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div>');
    return cardBubble("Before you go",
      '<p>Something’s ahead. If you want, set down what you want held for it — it stays on today’s page, in your words.</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':mdoorhold">Set down what I want held</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':dismiss">Not now</button></div>');
  }
  if(m.type === "playlistcard"){ return playlistCardHTML(m); }
  if(m.type === "circlescard"){ return circlesCardHTML(m); }
  if(m.type === "recordcard"){ return recordCardHTML(m); }
  if(m.type === "recordlabel"){ return recordLabelHTML(m); }
  if(m.type === "welcome"){ return welcomeHTML(m); }
  if(m.type === "mapcard"){ return mapCardHTML(m); }
  if(m.type === "piececard"){ return pieceCardHTML(m); }
  if(m.type === "receiptscard"){ return receiptsCardHTML(m); }
  if(m.type === "settingscard"){ return settingsCardHTML(m); }
  if(m.type === "moveask"){ return moveAskHTML(m); }
  if(m.type === "claimkind"){ return claimKindHTML(m); }
  if(m.type === "claimwho"){ return claimWhoHTML(m); }
  if(m.type === "glossdoes"){ return glossDoesHTML(m); }
  if(m.type === "seeingedit"){ return seeingEditHTML(m); }
  if(m.type === "confirmact"){ return confirmActHTML(m); }
  if(m.type === "dstep"){ return dstepHTML(m); }
  if(m.type === "dreview"){ return dreviewHTML(m); }
  if(m.type === "proposal" || m.type === "understanding"){
    return understandingHTML(m);
  }
  if(m.type === "uchoice"){
    return understandingChoiceHTML(m);
  }
  return "";
}

/* the welcome greeting (v1.16): hello, one line from the room,
   the playlist standing beside it — doors as chips on the one
   message; once a door is answered the words stay, the chips rest */
function welcomeHTML(m){
  var h = '<div class="msg them"><div class="bubble room"><p class="hub-label">Welcome</p>'
    + '<p class="display-line" style="margin:4px 0">'+esc(m.text)+'</p>';
  if(m.roomLine) h += '<p class="display-line" style="margin:4px 0"><span class="muted small">From the room:</span> '+esc(m.roomLine)+'</p>';
  if(m.briefLine) h += '<p style="margin:4px 0">'+esc(m.briefLine)+'</p>';
  if(m.playlistLine) h += '<p style="margin:4px 0">'+esc(m.playlistLine)+'</p>';
  if(!m.dismissed && m.plState === "seed"){
    h += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':seedstart">Start my playlist</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':seedlater">Later</button></div>';
  } else if(!m.dismissed && m.plState === "started"){
    h += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':buildplaylist">Build my playlist</button></div>';
  }
  return h + '</div></div>';
}

/* ---- self-recording, in the talk (v1.17) ----
   Recording himself is a way of talking, so it lives here: a
   small affordance in the composer and a card in the thread —
   never an app mode. A recording is received, never analyzed,
   never transcribed; it lands on today's page under the name
   he gives it, and nowhere else. */
var MEDIA_DENIED_LINE = "The mic/camera is off for this page — your phone's site settings can turn it on. Nothing was recorded.";
var MEDIA_LABELS = ["Crying", "Laughing", "Dancing", "Singing", "Just me"];
var MEDIA_MAX_SECONDS = 600; /* ten minutes */
var mediaSession = null; /* {msgId, kind, session, startedAt, stopping} — live only, never stored */
var mediaTimer = null;
var mediaURLCache = {};
function fmtDuration(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
}
function postRecordCard(){
  if(mediaSession) return; /* a recording is already running — its card is the door */
  for(var i=0;i<thread.messages.length;i++){
    var old = thread.messages[i];
    if(old.type === "recordcard" && !old.dismissed && old.stage === "choose") return;
  }
  pushMsg({type:"recordcard", stage:"choose", kind:"", startedAt:0, clipId:"", error:"", capNote:"", dismissed:false});
}
function recordCardHTML(m){
  if(m.dismissed) return "";
  var h = '<div class="msg them"><div class="bubble"><p class="hub-label">Record yourself</p>';
  if(m.stage === "recording"){
    var el = Math.min(MEDIA_MAX_SECONDS, Math.floor((Date.now() - (m.startedAt || Date.now())) / 1000));
    h += '<p style="margin:4px 0"><span class="record-dot">●</span> Recording… <span data-record-elapsed="'+m.id+'">'+fmtDuration(el)+'</span></p>'
      + (m.kind === "video" ? '<p class="small muted" style="margin:4px 0">Video — you, as you are.</p>' : '<p class="small muted" style="margin:4px 0">Voice — you, as you are.</p>')
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':recdone">Done</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':recdiscard">Discard</button></div>';
  } else if(m.stage === "starting" || m.stage === "saving"){
    h += '<p style="margin:4px 0">'+(m.stage === "starting" ? "Getting the mic/camera ready…" : "Keeping it…")+'</p>';
  } else if(m.stage === "error"){
    h += '<p style="margin:4px 0">'+esc(m.error || MEDIA_DENIED_LINE)+'</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':reccancel">Close</button></div>';
  } else {

function startMediaRecording(m, kind){
  if(mediaSession) return;
  m.stage = "starting"; m.kind = kind; m.error = ""; saveThread(); render();
  var capResult;
  try{ capResult = EPMedia.capture(kind); }catch(e){ capResult = Promise.reject(e); }
  Promise.resolve(capResult).then(function(session){
    if(m.dismissed){ if(session && typeof session.discard === "function") session.discard(); return; }
    if(session && session.blob && typeof session.stop !== "function"){
      finalizeMediaResult(m, kind, session); /* a capture that hands back the clip itself */
      return;
    }
    if(!session || typeof session.stop !== "function") throw new Error("capture unavailable");
    mediaSession = {msgId:m.id, kind:kind, session:session, startedAt:Date.now(), stopping:false};
    m.stage = "recording"; m.startedAt = mediaSession.startedAt; saveThread();
    render();

  m.stage = "saving"; saveThread(); render();
  var session = mediaSession.session;
  mediaSession = null;
  var stopped;
  try{ stopped = session.stop(); }catch(e){ stopped = Promise.reject(e); }
  Promise.resolve(stopped).then(function(result){
    finalizeMediaResult(m, m.kind, result || {});
  }).catch(function(){
    m.stage = "error"; m.error = MEDIA_DENIED_LINE; saveThread(); render();
  });

function hydrateMediaElements(){

      if(rec && rec.blob){

var EPPhoto = {
  /* decode the picked file and scale it to the cap, as JPEG.
     Resolves {blob, mime}; rejects when the file cannot be
     decoded as an image at all. The seam exists so the flow
     around it is testable, the way capture sits behind
     EPMedia.capture. */
  prepare: function(file){
    return new Promise(function(resolve, reject){
      var url;
      try{ url = URL.createObjectURL(file); }catch(e){ reject(e); return; }
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth || img.width || 0;
          var h = img.naturalHeight || img.height || 0;
          if(!w || !h) throw new Error("no dimensions");
          var scale = Math.min(1, ATTACH_MAX_EDGE / Math.max(w, h));
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          var ctx = canvas.getContext("2d");
          if(!ctx) throw new Error("canvas unavailable");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try{ URL.revokeObjectURL(url); }catch(e){}
          if(typeof canvas.toBlob === "function"){
            canvas.toBlob(function(blob){
              if(blob) resolve({blob:blob, mime:"image/jpeg"});
              else reject(new Error("encode failed"));
            }, "image/jpeg", 0.85);
          } else {
            var bin = atob((canvas.toDataURL("image/jpeg", 0.85).split(",")[1] || ""));
            var bytes = new Uint8Array(bin.length);
            for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
            resolve({blob:new Blob([bytes], {type:"image/jpeg"}), mime:"image/jpeg"});
          }
        }catch(e){ reject(e); }
      };
      img.onerror = function(){
        try{ URL.revokeObjectURL(url); }catch(e){}
        reject(new Error("decode failed"));
      };
      img.src = url;
    });
  }
};

/* ================= relay catches (v2.1) =================
   Two shapes of relayed op-talk used to fall through to the

   they talk ABOUT him — by his own name, or he/him — as if he
   weren't in the room ("Georgio is dismantling our system").
   That is the narration job, and it is named as such. (2) Short
   lexicon fragments (four words or fewer): a glossary term

   grading job, named as a grade. Both file as events and earn
   the commentary playback with its revision chips: the reading

var GRADE_WORDS = ["disappointment","disappointed","disappointing","discipline","disciplined",

  "guilt","guilty","disgrace","embarrassed","embarrassing","worthless","useless","hopeless"];
function gradeWordIn(text){
  var t = " " + String(text || "").toLowerCase().replace(/[^a-z0-9'\s]/g, " ") + " ";
  for(var i = 0; i < GRADE_WORDS.length; i++)
    if(t.indexOf(" " + GRADE_WORDS[i] + " ") !== -1) return GRADE_WORDS[i];
  return "";
}
function relayKind(text){
  var low = " " + String(text || "").toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'\s]/g, " ") + " ";
  var name = (addressOf() || "").toLowerCase().replace(/[^a-z0-9'\s]/g, "").trim();
  if(name && name.length >= 3 && low.indexOf(" " + name + " ") !== -1){
    var esc = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if(new RegExp("\\b" + esc + "\\b\\s*(?:is|was|has|had|keeps|will|won|can|could|does|did|said|says|thinks|needs|wants|should|would|'s)")

  }
  if(/\b(he|him)\b/.test(low)
     && /\b(system|narrative|punish|punishment|obey|obedient|behave|behavior|behaviour)\b/.test(low))
    return "thirdperson";
  var words = low.trim().split(/\s+/).filter(Boolean);

    var joined = " " + words.join(" ") + " ";
    for(var i = 0; i < atlas.glossary.length; i++){
      var term = (atlas.glossary[i].term || "").toLowerCase().trim();

/* ================= the life lane (v1.14) =================

   way a close friend and fellow researcher of his life receives

   playback, no filing, no event on the atlas. It lands on the
   day's journal page verbatim, as his words — the journal store's

   always lived — and the reply is conversation, with one honest
   addition: when a topic from his own life genuinely recurs

("power dialogue control relationship change stress talking acceptance resistance beliefs telling "

/* v2.5 (the heart sweep): the same discipline for the heart items'

("drive soothe empathy compassion warmth naming feelings words limits shame verdict hiding repair "

 + "arriving transformation rejection regulation").split(" ").forEach(function(w){ LANE_TAG_STOP[w] = 1; });
function bankTagHitForLane(text){
  var low = " " + String(text || "").toLowerCase().replace(/[^a-z0-9'\s]/g, " ") + " ";
  for(var i = 0; i < KNOWLEDGE.length; i++){

    for(var j = 0; j < tags.length; j++){

function voiceSignalIn(text){

}
function fileLifeEntry(text){

/* ---- stated context (v2.7, journal parity #9 — ADAPT) ----
   What the person mentions rides with the day: weather, place,
   company — in their words, held on the day page. Stated, never
   sensed: a small set of plain phrases matched against what he
   actually said, kept verbatim as short labels. No auto-harvest
   from other apps, no activity-tag taxonomy to maintain, and

   scenery, in his own words, exactly as the map specifies. */
var STATED_CONTEXT = [
  {re:/\brain(ing|ed|s|y)?\b/i, label:"rain"},
  {re:/\bsnow(ing|ed|y)?\b/i, label:"snow"},
  {re:/\bsunny\b/i, label:"sunny"},
  {re:/\bstorm(ing|y|s)?\b/i, label:"storm"},
  {re:/\b(cold|freezing) (out|day|morning|night)\b/i, label:"cold out"},

  {re:/\bat home\b/i, label:"at home"},
  {re:/\bat school\b/i, label:"at school"},
  {re:/\bat church\b/i, label:"at church"},
  {re:/\bat the (store|gym|park|hospital|clinic|office|library)\b/i, cap:1},
  {re:/\bwith (my )?(mom|mother|dad|father|sister|brother|family|friends|kids|son|daughter|wife|husband|partner)\b/i, cap:0}

/* ---- life topics: the ordinary things that keep coming up ----

   only when it is true: in this message, and on at least three
   distinct days inside the week. Then it rests — a topic is

var LIFE_STOP = {};
("today yesterday tomorrow morning evening night tonight really just like went came back time times "
 + "thing things something stuff feel felt feels feeling think thought know want wanted need needed "
 + "good bad well much many more most very again still even also day days week").split(" ")
 .forEach(function(w){ LIFE_STOP[w] = 1; });
function lifeWords(text){
  var out = [], seen = {};
  String(text || "").toLowerCase().replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).forEach(function(w){
    w = w.replace(/^'+|'+$/g, "");
    if(w.length < 4 || seen[w]) return;
    if(CLAIM_STOPWORDS[w] || LIFE_STOP[w]) return;
    seen[w] = 1;
    out.push(w);
  });
  return out;

function lifeWordSet(text){

  lifeWords(text).forEach(function(w){ o[w] = 1; });
  return o;
}

  journal.entries.forEach(function(en){

    if(lifeWordSet(en.text)[word]) days[dayKeyOf(en.ts)] = 1;

function computeLifeFact(text){
  if(noticedSuppressed() || knowledgeBlockedNow()) return null; /* the same discipline as every surface */
  var now = Date.now(), tk = dayKeyOf(now);
  if(thread.lifeFactDay === tk) return null; /* one life fact a day is conversation; two is commentary */
  var words = lifeWords(text);
  if(!words.length) return null;
  var best = null;
  words.forEach(function(w){
    var shown = thread.lifeShown[w] || 0;
    if(shown && (now - shown) < 30 * 86400000) return; /* a surfaced topic rests a season */
    var days = lifeWordDays(w, now - 7 * 86400000);
    if(days >= 3 && (!best || days > best.days)) best = {word:w, days:days};
  });
  if(!best) return null;
  thread.lifeShown[best.word] = now;
  thread.lifeFactDay = tk;

function lifeTopicCounts(){
  var since = Date.now() - 30 * 86400000, byWord = {};
  journal.entries.forEach(function(en){
    if(!en.text || en.ts < since) return;
    if(isDisownedJournal(en.id) || isDisownedText(en.text)) return; /* v2.3 §0A: never counted again */
    var dk = dayKeyOf(en.ts);
    lifeWords(en.text).forEach(function(w){
      if(!byWord[w]) byWord[w] = {};

  return Object.keys(byWord).map(function(w){
    return {word:w, days:Object.keys(byWord[w]).length};
  }).filter(function(x){ return x.days >= 2; })
    .sort(function(a, b){ return b.days - a.days || (a.word < b.word ? -1 : 1); })
    .slice(0, 6);

/* ---- the wordless channel (v1.14) ----

/* ---- the social lane (v1.15, founder field report) ----

var SOCIAL_FORMS = {

function socialKind(text){

/* ---- the welcome greeting (v1.16, founder addition) ----
   His words: "Hey should receive the welcome + playlist thing we
   talked about." A greeting is a re-entry into the room: the first
   greeting he sends in a day is answered with the WELCOME — his
   name, one line from the room (the recognition, rotating on the
   same state as Help's room rung, so the room never repeats itself
   back-to-back anywhere), and the playlist standing beside it:
   the seed door if it hasn't started, where it stands if it has.
   One message, doors as chips on it, nothing stacked after. Later
   greetings the same day keep the short social form. This is
   template machinery — it works before any API key; the key buys
   fluency, never the design. If the plain opener for this open is
   still standing in the thread when he greets, it steps aside:
   one welcome, not two. */
function isFirstUserMsgToday(){
  var k = dayKeyOf(Date.now()), n = 0;
  for(var i = 0; i < thread.messages.length; i++){
    var m = thread.messages[i];
    if(m.type === "person" && dayKeyOf(m.ts) === k) n++;
  }
  return n <= 1; /* the greeting just pushed is the only word of his today */
}
function welcomePlaylistBeat(){
  /* if the seed card is already standing in the thread — arrival
     planted it at this same open — its door is already his; the
     beat steps aside rather than stacking a second one */
  var seedStanding = thread.messages.some(function(m){ return m.type === "playlistseed" && !m.dismissed; });
  if(seedStanding) return null;
  var songs = (typeof playlist === "object" && playlist && playlist.songs) ? playlist.songs : [];
  if(songs.length){
    var line;
    if(songs.length > 4) line = "Your playlist: " + songs.length + " songs.";
    else line = "Your playlist: " + songs.slice(-2).map(function(s){ return s.title; }).join(" · ") + ".";
    return {line:line, state:"started"};
  }
  if(typeof playlist === "object" && playlist){
    if(playlist.seed === "done") /* begun, mid-first-song: the start is his already */
      return {line:"Your playlist is started — no songs yet.", state:"started"};
    if(!playlistSeedDue()) return null; /* resting, at his word — the rest is honored here too */
  }
  return {line:"Music is core here. Your playlist hasn’t started yet.", state:"seed"};
}
function postWelcomeGreeting(text){

    thread.messages.forEach(function(m, i){ if(m.id === sessionOpenerId) ix = i; });
    if(ix !== -1){
      var after = thread.messages.slice(ix + 1).filter(function(m){ return m.type === "person"; });
      if(after.length <= 1) thread.messages.splice(ix, 1);

     and today in a line or two — folded into this one message,
     never stacked as a second one. Once a day, like every path. */
  var brief = "";

function padNormText(text){

var CORRECTION_PHRASES = [

/* what a correction points at: the line most recently quoted back at

function correctionTargets(text){

/* ===== v2.3 §4 — ORGANIZING-WITH (founder, 2026-10-26, verbatim:
   "It needs to work with me to organize the thoughts. Sometimes I
   describe things [about] the voices. Keeper should be able to pick
   up on me trying to organize as well."). Sometimes, describing the
   voices, he is actively ORGANIZING his thoughts out loud — laying a
   scene out piece by piece, sorting what was what. This mode picks
   that up and works WITH him: it accumulates instead of answering
   per fragment, mirrors the arrangement back in his words and his
   order at natural pauses, holds every piece he has named so he
   never repeats himself, offers placements as options on the mirror
   (never auto-files mid-organizing), and silences everything else —
   the substance floor, all initiation and budget spending, DJ /

var ORG_ENUM_WORDS = ["first","second","third","then","next","also","after that","and then","finally","lastly"];
function organizingSignals(text){
  var t = padNormText(text);
  var sig = 0, classes = {};

  ORG_ENUM_WORDS.forEach(function(w){ if(t.indexOf(" " + w + " ") !== -1 || t.indexOf(" " + w + ",") !== -1) enumHits++; });
  if(enumHits >= 2) sig += 2; else if(enumHits === 1) sig += 1;
  if(t.indexOf(" that was ") !== -1 && t.indexOf(" this was ") !== -1) sig += 2; /* sorting language */

  if(/\bone was [a-z]+ (the other|and)\b/.test(t)) sig += 1;

  if(/\b(shoulder|chest|stomach|head|ear|neck|back|body|skin|hand|arm|leg|pressed|pressure|touch|pain|hurt)\b/.test(t)) classes.body = 1;
  if(/\b(saw|seen|seeing|shadow|figure|standing|stood|watching|doorway)\b/.test(t)) classes.seen = 1;
  if(CLAIM_PAT.test(text || "") || /\bsaid (i|i'd|i'll|you|you'd|he|she|they)\b/.test(t)) classes.said = 1;
  var nC = Object.keys(classes).length;
