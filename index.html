<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#476b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ever Present">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ever Present</title>
<style>
  /* ================= Ever Present v1 — styles =================
     Palette carried from the local product build: warm paper, calm green.
     Mobile-first. Big tap targets. No streaks, no scores on the person. */
  :root{
    --paper:#faf7f1; --card:#fffdf9; --ink:#2b2620; --muted:#7a7166;
    --line:#e4dccb; --accent:#476b5c; --accent-soft:#e9f0ea;
    --amber-bg:#fbf3e2; --amber-line:#e6d3a3; --amber-ink:#7a5b23;
    --help:#a8432f; --help-soft:#f9ebe7;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; font-size:16px;
    padding-bottom:calc(104px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:680px; margin:0 auto; padding:18px 16px 30px}
  h1.appname{
    font-family:Georgia,"Times New Roman",serif; font-weight:600;
    font-size:1.55rem; margin:6px 0 0; letter-spacing:.2px;
  }
  .companion-line{color:var(--muted); margin:2px 0 14px; font-size:.98rem}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin:0 0 14px;
  }
  .card h2{font-family:Georgia,serif; font-size:1.3rem; margin:0 0 10px; font-weight:600}
  .card h3{font-size:1.02rem; margin:18px 0 6px; font-weight:700}
  .card h3:first-child{margin-top:0}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  .lede{font-size:1.03rem}
  .empty{color:var(--muted); font-style:italic}
  .field-label{font-weight:600; font-size:.95rem; margin:14px 0 6px}
  .field-label:first-child{margin-top:0}

  /* ---- buttons ---- */
  .btn{
    display:inline-block; border:1px solid var(--accent); background:var(--accent); color:#fff;
    padding:12px 20px; border-radius:999px; font-size:1rem; cursor:pointer; min-height:48px;
    font-family:inherit;
  }
  .btn.secondary{background:var(--card); color:var(--ink); border-color:var(--line)}
  .btn.quiet{background:transparent; color:var(--muted); border-color:transparent}
  .btn.danger{background:var(--card); color:var(--help); border-color:var(--help)}
  .btn.small{padding:8px 14px; min-height:40px; font-size:.92rem}
  .btn.block{display:block; width:100%; text-align:center}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .btn:disabled{opacity:.5}

  /* ---- chips (options first, questions last) ---- */
  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:10px 14px; border-radius:999px; font-size:.95rem; cursor:pointer;
    min-height:44px; font-family:inherit; text-align:left;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip.alt.on{background:#7a5b23; border-color:#7a5b23}
  .chip small{display:block; font-size:.78rem; opacity:.85; font-weight:400}

  /* ---- inputs ---- */
  textarea.big, input.txt, textarea.txt{
    width:100%; border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:12px 14px; font-size:1rem; font-family:inherit; color:var(--ink);
  }
  textarea.big{min-height:16vh; line-height:1.55}
  textarea.short{min-height:9vh}

  /* ---- live companion: the typing bubble ---- */
  .tdots span{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--muted); opacity:.45; margin-right:5px;
  }
  .tdots span:last-child{margin-right:0}

  /* ---- persistent help button ---- */
  #helpBtn{
    position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:80;
    background:var(--help); color:#fff; border:2px solid rgba(255,255,255,.9); border-radius:999px;
    padding:12px 22px; font-size:1.02rem; font-weight:700; cursor:pointer; min-height:48px;
    box-shadow:0 5px 16px rgba(43,38,32,.4), 0 2px 5px rgba(43,38,32,.3), inset 0 1px 0 rgba(255,255,255,.35);
    font-family:inherit;
  }
  #helpBtn:active{transform:translateY(2px); box-shadow:0 2px 8px rgba(43,38,32,.35)}

  .chip.big{font-size:1.05rem; padding:14px 18px}

  /* ---- the Hub (Home) ---- */
  .hub-top{padding:8px 2px 18px}
  .hub-opener{
    font-family:Georgia,"Times New Roman",serif; font-weight:600;
    font-size:1.85rem; line-height:1.32; margin:6px 0 12px;
  }
  .status-chips{display:flex; flex-wrap:wrap; gap:8px}
  .status-chips span{
    background:var(--accent-soft); color:var(--accent); border-radius:999px;
    padding:6px 13px; font-size:.84rem; font-weight:600;
  }
  .hero-card{
    border-radius:24px; padding:26px 22px 22px; margin:0 0 16px; cursor:pointer;
    background:linear-gradient(155deg,#5f8772 0%, #476b5c 48%, #324a3e 100%);
    color:#f7f3e8; box-shadow:0 14px 34px rgba(50,74,62,.38);
  }
  .hero-label{
    font-size:.76rem; letter-spacing:1.5px; text-transform:uppercase;
    font-weight:700; opacity:.85;
  }
  .hero-line{
    font-family:Georgia,"Times New Roman",serif; font-size:1.5rem;
    line-height:1.35; margin:10px 0 20px;
  }
  .hero-main{
    display:block; width:100%; border:none; cursor:pointer; font-family:inherit;
    background:#faf7f1; color:#324a3e; font-weight:700; font-size:1.12rem;
    padding:16px 20px; border-radius:999px; min-height:58px;
    box-shadow:0 4px 14px rgba(30,45,38,.25);
  }
  .hero-quick{
    display:block; margin:12px auto 2px; background:transparent; color:#f7f3e8;
    border:1px solid rgba(247,243,232,.55); border-radius:999px;
    padding:10px 20px; font-family:inherit; font-size:.95rem; cursor:pointer;
    min-height:48px;
  }
  .hub-card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:20px 22px; margin:0 0 16px;
    box-shadow:0 6px 22px rgba(43,38,32,.07);
  }
  .hub-card h2{font-family:Georgia,serif; font-size:1.28rem; margin:0 0 8px; font-weight:600}
  .hub-label{
    font-size:.78rem; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin:0 0 10px;
  }
  .hub-card .claim-text{font-size:1.08rem; line-height:1.45}

  /* ---- tallies (ported) ---- */
  .tally{display:flex; gap:14px; flex-wrap:wrap; margin:0 0 14px}
  .tally .pill{
    background:var(--accent-soft); border-radius:999px; padding:8px 16px; font-size:.95rem;
  }
  .tally .pill b{font-size:1.15rem; margin-right:6px}

  /* ---- claims ledger (ported from the local product build) ---- */
  .ledger-entry{border-top:1px solid var(--line); padding:14px 0}
  .ledger-entry:first-of-type{border-top:none}
  .ledger-entry .claim-text{font-size:1.05rem}
  .ledger-outcome{
    background:var(--accent-soft); border-radius:8px; padding:10px 14px; margin-top:10px;
  }
  .kind-tag{
    display:inline-block; background:var(--amber-bg); border:1px solid var(--amber-line);
    color:var(--amber-ink); border-radius:999px; padding:1px 9px; font-size:.76rem;
    margin-left:8px; vertical-align:middle;
  }

  /* ---- map pieces ---- */
  .piece-card{cursor:pointer}
  .piece-card:active{border-color:var(--accent)}
  .piece-name{font-family:Georgia,serif; font-size:1.2rem; font-weight:600}
  .type-tag{
    display:inline-block; background:var(--accent-soft); color:var(--accent);
    border-radius:999px; padding:1px 9px; font-size:.76rem; margin-left:8px; vertical-align:middle;
  }
  .seeing-box{
    background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:8px;
    padding:10px 14px; margin:10px 0;
  }
  .seeing-box .lab{font-size:.78rem; text-transform:uppercase; letter-spacing:.6px; color:var(--amber-ink); font-weight:700}
  .mini-chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
  .mini-chips span{
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:.82rem;
  }

  /* ---- journal prompts ---- */
  .prompt-card{cursor:pointer; text-align:left; width:100%; font-family:inherit; font-size:1rem}
  .prompt-card:active{border-color:var(--accent)}

  /* ---- help ladder ---- */
  .rung{border-left:5px solid var(--accent); padding-left:14px; margin:18px 0}
  .rung.far{border-left-color:var(--help)}
  .rung h3{margin:0 0 4px}
  .hardday-note{
    font-family:Georgia,serif; font-size:1.15rem; background:var(--amber-bg);
    border:1px solid var(--amber-line); border-radius:8px; padding:14px 16px; margin:10px 0;
    white-space:pre-wrap;
  }
  .call-link{
    display:inline-block; margin:4px 8px 4px 0; padding:10px 16px; border-radius:999px;
    background:var(--accent); color:#fff; text-decoration:none; font-weight:600; min-height:44px;
  }
  .call-link.far{background:var(--help)}

  /* ---- misc ---- */
  .howto{background:var(--accent-soft); border-radius:8px; padding:10px 14px; font-size:.92rem; margin:0 0 14px}
  .offer-card{border-color:var(--amber-line); background:var(--amber-bg)}
  .divider{border:none; border-top:1px solid var(--line); margin:16px 0}
  .stepdots{color:var(--muted); font-size:.85rem; margin:0 0 10px}
  .quiet-screen{padding-top:12vh}
  .summary-list{margin:6px 0; padding-left:20px}
  .summary-list li{margin:3px 0}
  a.plain{color:var(--accent)}
  .toast{
    background:var(--accent-soft); border:1px solid var(--accent); color:var(--ink);
    border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:.95rem;
  }

  /* ---- the thread (Home is a conversation) ---- */
  .thread{display:flex; flex-direction:column; gap:10px; padding-top:4px}
  .msg{display:flex}
  .msg.me{justify-content:flex-end}
  .msg .bubble{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 16px; max-width:88%; white-space:pre-wrap; line-height:1.5;
  }
  .msg.me .bubble{background:var(--accent); border-color:var(--accent); color:#fff}
  .msg .bubble .chiprow{margin-top:8px}
  .msg .bubble p{margin:0}
  .thread-spacer{height:118px}
  .composer{
    position:fixed; left:50%; transform:translateX(-50%); z-index:65;
    width:min(680px, 100%);
    bottom:0;
    background:var(--paper); border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .composer-row{display:flex; gap:8px; align-items:flex-end}
  .composer textarea{
    flex:1; border:1px solid var(--line); border-radius:12px; background:#fff;
    padding:12px 14px; font-size:1rem; font-family:inherit; color:var(--ink);
    min-height:48px; max-height:20vh; resize:none; line-height:1.4;
  }
  .composer .btn{min-height:48px}
  /* ---- the dynamic journal ---- */
  .jitem{border-top:1px solid var(--line); padding:12px 0}
  .jitem:first-of-type{border-top:none}
  .jtag{font-size:.78rem; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0 0 4px}
  .jwords{white-space:pre-wrap; font-size:1.03rem; line-height:1.55; margin:4px 0}
  .jblock{margin-top:14px}
  .jhidden{opacity:.55}
  .msg .bubble.wide{max-width:94%}
  .cardblock{border-top:1px solid var(--line); padding-top:10px; margin-top:10px}
  .cardblock:first-child{border-top:none; padding-top:0; margin-top:0}
</style>
</head>
<body>
<button id="helpBtn" type="button" aria-label="Help">Help</button>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
"use strict";
/* =====================================================================
   Ever Present v1.7 — single-file web app.
   The interface is a conversation, full stop: one thread, one
   composer, and the Help button. The companion brings the journal,
   the map, the receipts and the settings into the talk as cards.
   v1.7 adds an optional live voice: with the person's own API key
   (kept only on this device), a model does the talking back while
   the code keeps the record — filing, figuring, doors, cards —
   exactly as before. The model never files or changes anything.
   v1.9 puts the knowledge base to work: it rides in the live
   packet so the companion can draw on the research at the moment,
   it can answer a matching message directly in rule-based mode,
   and a floor of day-shape facts means ordinary talk always has
   something true organizing it. Feedback stops waiting for the
   crude matchers to hit.
   ===================================================================== */

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function el(id){ return document.getElementById(id); }
function fmtDate(ts){ /* ported from the local product build (ledgerFmt) */
  var d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})
    + ", " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function relDay(ts){
  var now = new Date(); var d = new Date(ts);
  var startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var startD = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var days = Math.round((startNow - startD) / 86400000);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 7) return "last " + d.toLocaleDateString(undefined,{weekday:"long"});
  return "on " + d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function uniqPush(arr, val){ if(val && arr.indexOf(val) === -1) arr.push(val); return arr; }

/* ================= stores (localStorage) =================
   Ledger keeps the ported key ever_present_ledger_v1 for continuity
   with the local product build; all v1 stores use ever_present_v1_*.
   Erase-all sweeps every key beginning with "ever_present". */
var K = {
  companion: "ever_present_v1_companion",
  atlas:     "ever_present_v1_atlas",
  journal:   "ever_present_v1_journal",
  ladder:    "ever_present_v1_ladder",
  ledger:    "ever_present_ledger_v1",
  thread:    "ever_present_v1_thread",
  djournal:  "ever_present_v1_djournal",
  liveai:    "ever_present_v1_liveai",
  connections: "ever_present_v1_connections"
};
function storeLoad(key, blank){
  try{
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : blank();
  }catch(e){ return blank(); }
}
function storeSave(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function companionBlank(){ return null; }
function atlasBlank(){ return {pieces:[], events:[], glossary:[]}; }
function journalBlank(){ return {entries:[]}; }
function ladderBlank(){ return {noteForHardDay:"", contacts:[], clinician:{name:"", phone:""}}; }
function ledgerBlank(){ return {entries:[]}; } /* ported shape */
function djournalBlank(){ return {corrections:{}, hidden:{}, dayFig:{}, precedents:{}, knowledgeDays:{}}; }
function liveaiBlank(){ return {provider:"anthropic", key:"", model:"claude-sonnet-4-5", on:false}; }
function connectionsBlank(){ return {shown:{}, lastTs:0}; } /* connections already brought, by theme (v1.11.1) */

var companion = storeLoad(K.companion, companionBlank);
var atlas     = storeLoad(K.atlas, atlasBlank);
if(!atlas.pieces) atlas.pieces = [];
if(!atlas.events) atlas.events = [];
if(!atlas.glossary) atlas.glossary = [];
var journal   = storeLoad(K.journal, journalBlank);
if(!journal.entries) journal.entries = [];
var ladder    = storeLoad(K.ladder, ladderBlank);
if(!ladder.contacts) ladder.contacts = [];
if(!ladder.clinician) ladder.clinician = {name:"", phone:""};
var ledger    = storeLoad(K.ledger, ledgerBlank); /* ported load */
if(!ledger.entries) ledger.entries = [];
var djournal  = storeLoad(K.djournal, djournalBlank);
if(!djournal.corrections) djournal.corrections = {};
if(!djournal.hidden) djournal.hidden = {};
if(!djournal.dayFig) djournal.dayFig = {};
if(!djournal.precedents) djournal.precedents = {};
if(!djournal.knowledgeDays) djournal.knowledgeDays = {};
var liveai    = storeLoad(K.liveai, liveaiBlank);
if(!liveai || typeof liveai !== "object") liveai = liveaiBlank();
if(liveai.provider !== "openai") liveai.provider = "anthropic";
if(typeof liveai.key !== "string") liveai.key = "";
if(!liveai.model) liveai.model = liveai.provider === "openai" ? "gpt-4o" : "claude-sonnet-4-5";
liveai.on = !!liveai.on;
var connections = storeLoad(K.connections, connectionsBlank);
if(!connections || typeof connections !== "object") connections = connectionsBlank();
if(!connections.shown) connections.shown = {};
if(!connections.lastTs) connections.lastTs = 0;

function saveCompanion(){ storeSave(K.companion, companion); }
function saveAtlas(){ storeSave(K.atlas, atlas); }
function saveJournal(){ storeSave(K.journal, journal); }
function saveLadder(){ storeSave(K.ladder, ladder); }
function saveLedger(){ storeSave(K.ledger, ledger); } /* ported save */
function saveDjournal(){ storeSave(K.djournal, djournal); }
function saveLiveai(){ storeSave(K.liveai, liveai); }
function saveConnections(){ storeSave(K.connections, connections); }

/* ================= shared lookups ================= */
function pieceById(id){
  for(var i=0;i<atlas.pieces.length;i++) if(atlas.pieces[i].id === id) return atlas.pieces[i];
  return null;
}
function pieceName(id){ var p = pieceById(id); return p ? p.name : ""; }
function openClaims(){ return ledger.entries.filter(function(e){ return !isChecked(e); }); }
function isChecked(e){
  if(e.outcome && e.outcome.trim()) return true;
  return e.outcomeChip === "happened" || e.outcomeChip === "didnt" || e.outcomeChip === "partly";
}
function heldUp(e){ return e.outcomeChip === "happened" || e.outcomeChip === "partly"; }
var KIND_LABELS = {
  prediction:"Prediction",
  now:"Claim about right now",
  commentary:"Running commentary",
  announcement:"Announcement",
  instruction:"Instruction"
};
function outcomeLabel(e){
  var parts = [];
  if(e.outcomeChip === "happened") parts.push("It happened");
  if(e.outcomeChip === "didnt") parts.push("It didn\u2019t happen");
  if(e.outcomeChip === "partly") parts.push("Partly");
  if(e.outcome) parts.push(e.outcome);
  return parts.join(" \u2014 ");
}
/* receipts tallies for one voice (by piece id or exact name) */
function receiptsForPiece(p){
  var mine = ledger.entries.filter(function(e){
    return (e.whoId && e.whoId === p.id) || (e.who && e.who === p.name);
  });
  var checked = mine.filter(isChecked);
  return {
    total: mine.length,
    checked: checked.length,
    open: mine.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function allReceiptTallies(){
  var checked = ledger.entries.filter(isChecked);
  return {
    total: ledger.entries.length,
    checked: checked.length,
    open: ledger.entries.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function learnedBodySpots(){
  var spots = [];
  atlas.events.forEach(function(ev){ (ev.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  atlas.pieces.forEach(function(p){ (p.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  return spots;
}

/* ================= app state ================= */
var view = companion ? "home" : "arrival";
var toast = "";
var sessionDismissed = {}; /* in-memory only: dismissing an offer writes nothing about the person */
var correctionDay = ""; /* a journal day being corrected in the thread; "" = none */
var writeMode = null;    /* {prompt} while a journal writing is open in the thread */
var journalHiddenShown = {}; /* journal day key -> hidden entries currently shown (in the journal card) */
var textAsk = null;      /* {kind, ...} — the companion asked for words; the next message lands there */
var detail = null;       /* {step, msgId, textField, editing} — the in-thread detail session */
var cap = null;          /* the detail session's working capture (the old trees' state) */

/* ================= render root =================
   One screen is the conversation. The only other full screens are
   flows, not views of the record: arrival, companion creation, and
   the Help overlay the Help button opens (the ladder it leads to). */
function go(v){
  view = v;
  render();
  window.scrollTo(0,0);
}
function headerHTML(){
  var h = '<h1 class="appname">Ever Present</h1>';
  if(companion){
    h += '<p class="companion-line">'+esc(companion.name)+' keeps your record.</p>';
  }
  return h;
}
function render(){
  var v = el("app");
  var h = "";
  if(toast){ h += '<div class="toast">'+esc(toast)+'</div>'; toast = ""; }
  if(view === "arrival"){ v.innerHTML = h + viewArrival(); bindArrival(); }
  else if(view === "create"){ v.innerHTML = h + viewCreate(); bindCreate(); }
  else if(view === "help"){ v.innerHTML = headerHTML() + h + viewHelp(); bindHelp(); }
  else if(view === "ladder"){ v.innerHTML = headerHTML() + h + viewLadder(); bindLadder(); }
  else { v.innerHTML = h + viewThread(); bindThread(); }
}


/* ================= Screen 1 — Arrival / first open ================= */
var CONTRACT_LINES = [
  "I keep your record. It stays on this phone.",
  "I never grade you. I never tell you what things mean.",
  "Everything I write down, you can see, fix, or erase."
];
var PRIVACY_PROMISES = [
  "Your record stays yours.",
  "Nothing is shared unless you share it.",
  "This app never reports on you."
];
function contractHTML(){

function companionOpener(){

  /* the most recent piece in the record */
  for(var i=0;i<evs.length;i++){
    var ids = evs[i].whoIds || [];
    if(ids.length){
      var p0 = pieceById(ids[0]);
      if(p0){ cands.push(p0.name + " was around " + relDay(evs[i].ts) + ". It\u2019s in your record."); break; }
    }
  }

  var open = openClaims();
  if(open.length === 1){
    var ct = open[0].claim.length > 60 ? open[0].claim.slice(0,60) + "\u2026" : open[0].claim;
    cands.push("One claim still open \u2014 \u201c" + ct + "\u201d");
  } else if(open.length > 1){
    cands.push(open.length + " claims still open.");
  }
  /* days since the last pour */
  var lastPour = null;
  for(var j=0;j<evs.length;j++){ if(evs[j].mode === "pour" && evs[j].pourText){ lastPour = evs[j]; break; } }
  if(lastPour){
    var dp = daysSince(lastPour.ts);
    if(dp >= 2) cands.push("Last pour: " + dp + " days ago. The door\u2019s open.");
  }
  /* a piece that hasn't been visited in a while */
  if(atlas.pieces.length > 1){
    var seen = {};
    atlas.events.forEach(function(ev){
      (ev.whoIds||[]).forEach(function(id){ if(!seen[id] || ev.ts > seen[id]) seen[id] = ev.ts; });
    });
    var quietP = null, quietTs = Infinity;
    atlas.pieces.forEach(function(p){
      var t = seen[p.id] || p.created || 0;
      if(t < quietTs){ quietTs = t; quietP = p; }
    });
    if(quietP && Date.now() - quietTs > 4 * 86400000)
      cands.push(quietP.name + " \u2014 quiet since " + relDay(quietTs) + ".");
  }

function figuredReceipts(){

    var line = label + ": " + mine.length + (mine.length === 1 ? " claim" : " claims") + ".";
    if(checked.length) line += " " + checked.length + " checked — " + held + " held up, " + didnt + " didn’t.";
    var openN = mine.length - checked.length;
    if(openN) line += " " + openN + " still open.";
    return line;
  }
  var lines = [];
  Object.keys(byWho).filter(function(k){ return k; }).sort().forEach(function(name){
    lines.push(figLine(name, byWho[name]));
  });
  if(byWho[""] && byWho[""].length) lines.push(figLine("No one specific", byWho[""]));
  var byKind = {};
  ledger.entries.forEach(function(e){
    if(e.kind){ if(!byKind[e.kind]) byKind[e.kind] = []; byKind[e.kind].push(e); }
  });

/* ---- the interruption ----
   From the record only: verdicts landing in a short window with
   nothing answering them — no moves, no pours. The companion holds
   space and hands back the person's own authorship evidence: their
   moves, counted and quoted. Once per signature episode, never
   repeated for the same window, dismissible. It never names a
   state, never claims it detected anything, never escalates. */
function interruptionSignature(){
  var now = Date.now(), W = 48 * 3600 * 1000;
  var blasts = ledger.entries.filter(function(e){
    return !e.timeUnknown && e.kind === "announcement" && e.ts <= now && (now - e.ts) <= W;
  });
  if(blasts.length < 2) return null;
  var answered = false;
  ledger.entries.forEach(function(e){
    if(e.move && e.move.trim() && e.tsOutcome && e.tsOutcome <= now && (now - e.tsOutcome) <= W) answered = true;
  });
  if(!answered) atlas.events.forEach(function(ev){
    if(!ev.timeUnknown && (ev.type === "pour" || ev.mode === "pour") && ev.ts <= now && (now - ev.ts) <= W) answered = true;
  });
  if(answered) return null;
  return blasts.map(function(e){ return e.id; }).sort().join(",");
}
function maybePostInterruption(){
  var key = interruptionSignature();
  if(!key) return false;
  if(vibeOf() === "asked") return false;
  if(thread.interruptionKey === key) return false;
  if(thread.interruptionHandledAt && (Date.now() - thread.interruptionHandledAt) < 48 * 3600 * 1000) return false;
  var moves = ledger.entries.filter(function(e){ return e.move && e.move.trim(); })
    .sort(function(a,b){ return (b.tsOutcome || b.ts) - (a.tsOutcome || a.ts); });
  var line = "";
  if(moves.length){
    line = "Your record says you move: " + moves.length + (moves.length === 1 ? " move" : " moves")
      + " in your record. Last one: \u201C" + moves[0].move.trim() + "\u201D";
  }
  pushMsg({type:"interrupt", key:key, hasMoves:moves.length > 0, line:line, dismissed:false});
  thread.interruptionKey = key;
  saveThread();
  return true;
}
/* ---- posture timing: HOLD and OFFER ----
   HOLD: during pours, during blast bursts, right after hard
   entries — reception only, no knowledge, no new doors.
   OFFER: calm returns only — a later open, no fresh blast in the
   last ~6 hours, no burst window open. Then the companion may bring
   ONE knowledge item, matched to the person's recent record.
   Knowledge is information about what others have described —
   never advice, never a statement about the person's own state.
   v1.9: the calm-open path is now the FALLBACK. A message that
   genuinely matches an item can be answered with it at the moment,
   under the same discipline — one item per day across all paths,
   HOLD and "Only when I ask" win.
   v1.11: the at-the-moment answer is now a CONTEXT LINE said to
   the entry itself (matchContextForMessage) — conversational, and
   budget-free, because it is relating, not an offer. The one-a-day
   budget governs the calm-open knowledge CARD only. HOLD and
   "Only when I ask" still win over both. */

function knowledgeHaystack(){
  var parts = [];
  var now = Date.now(), W = 14 * 86400000;
  atlas.events.slice(-20).forEach(function(ev){
    if(ev.timeUnknown || ev.ts > now || (now - ev.ts) > W) return;
    parts.push(ev.pourText || "", ev.fragmentText || "",
      (ev.channels || []).join(" "), (ev.among || []).join(" "),
      (ev.register || []).join(" "), ev.seeing || "");
  });
  ledger.entries.slice(-10).forEach(function(e){
    if(!e.timeUnknown && e.ts <= now && (now - e.ts) <= W) parts.push(e.claim || "");
  });
  return parts.join(" ").toLowerCase();
}
function calmForKnowledge(){
  if(vibeOf() === "asked") return false;
  if(sessionHold) return false;
  var now = Date.now();
  for(var i=0;i<ledger.entries.length;i++){
    var e = ledger.entries[i];
    if(!e.timeUnknown && e.kind === "announcement" && e.ts <= now && (now - e.ts) < 6 * 3600 * 1000) return false;
  }
  if(interruptionSignature()) return false; /* burst window = HOLD */
  return true;
}
/* ---- knowledge discipline (v1.9, refined v1.11) ----
   The daily budget (knowledgeDay) governs knowledge CARDS — the
   calm-open offer. Context lines said to an entry (v1.11) do not
   spend it. Both paths share the rest: a theme dismissed or shown
   — on a card or in a context line — rests for 30 days. HOLD (a
   burst window, a fresh blast) and "Only when I ask" always win. */
function knowledgeEligible(it, now){
  var M = 30 * 86400000;
  var dis = thread.knowledge.dismissed[it.theme] || 0;
  if(dis && (now - dis) < M) return false;
  var sh = thread.knowledge.shown[it.theme] || 0;
  if(sh && (now - sh) < M) return false;
  return true;
}
function knowledgePostedToday(){
  return thread.knowledgeDay.key === dayKeyOf(Date.now()) && thread.knowledgeDay.n >= 1;
}
function postKnowledgeItem(it){
  var now = Date.now();
  pushMsg({type:"knowledge", theme:it.theme, l1:it.l1, l2:it.l2, expanded:false, dismissed:false});
  djournal.knowledgeDays[dayKeyOf(now)] = {theme:it.theme, l1:it.l1}; /* the journal notes what was offered — one line */
  saveDjournal();
  thread.knowledge.shown[it.theme] = now;
  var tk = dayKeyOf(now);
  if(thread.knowledgeDay.key !== tk) thread.knowledgeDay = {key:tk, n:0};
  thread.knowledgeDay.n++;
  saveThread();
  return true;
}
function knowledgeTagHit(it, hay){
  for(var j=0;j<it.tags.length;j++){
    if(hay.indexOf(it.tags[j].toLowerCase()) !== -1) return true;
  }
  return false;
}
/* HOLD gates for knowledge at the moment: a burst window or a
   fresh announcement in the last ~6 hours means reception only */
function knowledgeBlockedNow(){
  if(vibeOf() === "asked") return true;
  if(interruptionSignature()) return true;
  var now = Date.now();
  for(var i=0;i<ledger.entries.length;i++){
    var e = ledger.entries[i];
    if(!e.timeUnknown && e.kind === "announcement" && e.ts <= now && (now - e.ts) < 6 * 3600 * 1000) return true;
  }
  return false;
}
/* context at the entry (v1.11, replacing v1.9's knowledge at the
   moment): this message's own words — plus the channels of the
   event it filed — matched against the bank. When an item matches
   what the person just communicated, its ctx line is SAID, in
   this exchange, as part of relating to their entry — from day
   one, before their own record holds anything. It is not the
   calm-open knowledge offer, so it does NOT consume the daily
   knowledge budget (knowledgeDay is untouched; a calm-open offer
   can still come later the same day) — but spoken is shown: the
   theme takes the same 30-day rest as any shown item, and a
   dismissed theme is never spoken as context. HOLD still wins:
   a burst window or a fresh blast means reception only, and
   "Only when I ask" hears no context at all. */
function matchContextForMessage(text, ev){
  if(knowledgeBlockedNow()) return null;
  var hay = ((text || "") + " " + ((ev && ev.channels) || []).join(" ")).toLowerCase();
  if(!hay.trim()) return null;
  var now = Date.now();
  for(var i=0;i<KNOWLEDGE.length;i++){
    var it = KNOWLEDGE[i];
    if(!knowledgeEligible(it, now)) continue;
    if(knowledgeTagHit(it, hay)) return it;
  }
  return null;
}
function postContextLine(it){
  thread.knowledge.shown[it.theme] = Date.now(); /* the theme rests, as if shown on a card */
  pushMsg({type:"companion", context:true, theme:it.theme, text:it.ctx});
  return true;
}
function postKnowledgeIfCalm(){
  if(!calmForKnowledge()) return false;
  if(knowledgePostedToday()) return false; /* one a day across all paths */
  var hay = knowledgeHaystack();
  if(!hay.trim()) return false;
  var now = Date.now();
  for(var i=0;i<KNOWLEDGE.length;i++){
    var it = KNOWLEDGE[i];
    if(!knowledgeEligible(it, now)) continue;
    if(!knowledgeTagHit(it, hay)) continue;
    return postKnowledgeItem(it);
  }
  return false;

/* ================= CONNECTIONS (v1.11.1) =================
   The founder's layer: "EP doesn't wait to hear from you. It makes
   connections from research, interviews, etc to bring new ideas,
   insights plus what it learns from your journal entries." The
   companion INITIATES — but only with connections that are true.
   A connection exists when one theme from the research matches
   things the person communicated on at least THREE DIFFERENT
   told-days across the whole record (their writings and what they
   told the companion; a flash counts by the day it was told, the
   journal's spine). The matching is the bank's own tags against
   their stored words — deterministic, countable, never invented.
   A theme already brought as a connection is never brought again,
   and at most one connection arrives in any week. It joins the
   daily surfaces BELOW the interruption (which gates the whole
   surface call), below doors for an unanswered claim and below
   new figured receipts — and above the bare knowledge card,
   because a connection is the research crossed with their own
   days, not the research alone. HOLD still wins: a burst window
   or a fresh blast means no connection, and "Only when I ask"
   hears none. The tone is a fellow researcher's contribution to
   their work — never a system's notification. */
function recordTextsByDay(){
  var out = [];
  atlas.events.forEach(function(ev){
    var body = [ev.pourText || "", ev.fragmentText || "",
      (ev.channels || []).join(" "), (ev.among || []).join(" "),
      (ev.register || []).join(" "), ev.seeing || ""].join(" ").trim();
    if(!body) return;
    out.push({day:journalToldKeyForEvent(ev), text:body.toLowerCase(), snippet:evWords(ev)});
  });
  journal.entries.forEach(function(en){
    if(!en.text) return;
    out.push({day:dayKeyOf(en.ts), text:String(en.text).toLowerCase(), snippet:String(en.text)});
  });
  return out;
}
/* per bank theme: the distinct told-days its tags genuinely appear
   in the person's own words, and one short verbatim snippet */
function themeDayMatches(){
  var texts = recordTextsByDay();
  var out = [];
  KNOWLEDGE.forEach(function(it, idx){
    var days = {};
    texts.forEach(function(t){
      if(!knowledgeTagHit(it, t.text)) return;
      if(!(t.day in days)) days[t.day] = t.snippet || "";
      else if(!days[t.day] && t.snippet) days[t.day] = t.snippet;
    });
    var keys = Object.keys(days).sort();
    if(!keys.length) return;
    var snip = "";
    keys.forEach(function(k){
      var s = days[k];
      if(s && (!snip || s.length < snip.length)) snip = s;
    });
    if(snip.length > 110) snip = ""; /* a snippet is short and whole, or it is not used */
    out.push({item:it, idx:idx, days:keys, snippet:snip});
  });
  return out;
}
/* the live digest's view of the same counting: which research
   themes appear in their words on how many distinct told-days */
function themeDayCounts(){
  return themeDayMatches().map(function(m){
    return {theme:m.item.theme, label:themeLabel(m.item), days:m.days.length};
  }).sort(function(a, b){ return b.days - a.days; });
}
function themeLabel(it){
  if(it.label) return it.label;
  return it.theme.replace(/-/g, " ");
}
function connectionDayName(key){
  if(key === dayKeyOf(Date.now())) return "today";
  if(key === dayKeyOf(Date.now() - 86400000)) return "yesterday";
  var p = key.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}
function findConnectionTheme(){
  var cands = themeDayMatches().filter(function(m){
    return m.days.length >= 3 && !connections.shown[m.item.theme];
  });
  cands.sort(function(a, b){
    if(b.days.length !== a.days.length) return b.days.length - a.days.length;
    var la = a.days[a.days.length - 1], lb = b.days[b.days.length - 1];
    return la < lb ? 1 : (la > lb ? -1 : 0); /* the most recently circled first */
  });
  return cands.length ? cands[0] : null;
}

/* the line itself, in the person's vibe. Firsts stay plain in every
   vibe — a first that touches the body or a new channel is not a
   place for levity. Facts only: the line audits the record and the
   voices' pattern, never the person. */
function fbLine(kind, d){
  var v = vibeOf();
  if(kind === "recurrence"){
    if(v === "straight") return ordinal(d.n) + " " + d.kindShort + " from " + d.name + " this week.";
    if(v === "humor") return d.name + " again — the " + ordinal(d.n) + " " + d.kindShort + " this week.";
    return "That’s the " + ordinal(d.n) + " " + d.kindShort + " from " + d.name + " this week.";
  }
  if(kind === "pieceweek"){
    if(v === "straight") return d.name + ": " + d.n + " moments this week.";
    if(v === "humor") return d.name + " again — " + d.n + " moments this week.";
    return d.name + "’s been in " + d.n + " moments this week.";
  }
  if(kind === "firstpiece") return "First time " + d.name + "’s come up in the talk.";
  if(kind === "firstclaim"){
    if(v === "straight") return d.name + "’s first " + (KIND_SHORT[d.claimKind] || "claim") + " I’ve heard from them.";
    return "That’s " + d.name + "’s first " + (KIND_SHORT[d.claimKind] || "claim") + " I’ve heard from them.";
  }
  if(kind === "firstchan") return "First time " + d.name + "’s come through as " + d.chan + " — it’s on the map now.";
  if(kind === "firstreg") return "First " + d.reg + " register for " + d.name + " — it’s on the map now.";
  if(kind === "move"){
    if(v === "straight") return "Move #" + d.n + " in your record.";
    if(v === "humor") return "Move #" + d.n + ". Your record’s on your side.";
    return "That’s move #" + d.n + " in your record.";
  }
  return "";
}
function noticedSuppressed(){ return vibeOf() === "asked"; }
function postNoticed(fb){
  if(!fb || !fb.line) return null;
  return pushMsg({type:"companion", noticed:true, fbKind:fb.kind, text:fb.line});
}
function queueOrgNote(line){
  if(!line) return;
  if(thread.orgNotes.indexOf(line) === -1) thread.orgNotes.push(line);
  while(thread.orgNotes.length > 6) thread.orgNotes.shift();
  saveThread();
}
/* facts about THIS message, computed from the stores after its event
   filed. Returns {kind, line} or null. Firsts outrank recurrence:
   a piece's first appearance can't also be a recurrence. */
function computeNoticed(ev, text){
  if(noticedSuppressed()) return null;
  var mentioned = piecesMentionedIn(text);
  if(!mentioned.length) return null;
  var p = mentioned[0];
  var now = Date.now(), WEEK = 7 * 86400000;
  var priorAny = atlas.events.some(function(e2){ return e2.id !== ev.id && eventTouchesPiece(e2, p); });
  var ledgerAny = ledger.entries.some(function(e2){ return entryMatchesPiece(e2, p); });
  if(!priorAny && !ledgerAny){
    return {kind:"firstpiece", line:fbLine("firstpiece", {name:p.name})};
  }
  if(!CLAIM_PAT.test(text || "")){
    if(ev.timeUnknown) return null; /* flashes count all-time, never in a dated window */
    var anchor = ev.ts || now;
    var n = 0;
    atlas.events.forEach(function(e2){
      if(e2.id !== ev.id && !e2.timeUnknown && e2.ts >= anchor - WEEK && e2.ts <= anchor && eventTouchesPiece(e2, p)) n++;
    });
    n += 1; /* this message itself — the piece was mentioned in it,
               by name or by its glossary term */
    if(n >= 2) return {kind:"pieceweek", line:fbLine("pieceweek", {name:p.name, n:n})};
  }
  return null;
}
/* feedback at a claim's filing: recurrence of the same piece + same
   kind in the last 7 days — counted INCLUDING this claim, so two
   priors plus this one reads "the 3rd" — or the piece's first claim
   ever. Runs only when no precedent fired (precedent outranks). */
function postClaimFeedback(entry){
  if(noticedSuppressed() || !entry) return;
  var p = entry.whoId ? pieceById(entry.whoId) : null;
  if(!p && entry.who){
    atlas.pieces.forEach(function(x){ if(x.name === entry.who) p = x; });
  }
  if(!p) return;
  var mine = ledger.entries.filter(function(e){ return entryMatchesPiece(e, p); });
  if(mine.length === 1){
    postNoticed({kind:"firstclaim", line:fbLine("firstclaim", {name:p.name, claimKind:entry.kind})});
    return;
  }
  if(entry.timeUnknown) return; /* a flash counts all-time (above), never in a dated window */
  var end = entry.ts || Date.now(), WEEK = 7 * 86400000;
  var n = mine.filter(function(e){ return !e.timeUnknown && e.kind === entry.kind && e.ts >= end - WEEK && e.ts <= end; }).length;
  if(n >= 2){
    postNoticed({kind:"recurrence", line:fbLine("recurrence",
      {name:p.name, n:n, kindShort:KIND_SHORT[entry.kind] || "claim"})});
  }
}
/* every claim filing runs through here: the precedent is the
   feedback when it fires; otherwise the filing's own facts speak */
function afterClaimFiled(entry){
  var prec = maybePostPrecedent(entry);
  if(!prec) postClaimFeedback(entry);
  /* a remembered or flash claim's moment is already past — its
     outcome can be answered right away, through the same receipt
     card every open claim uses */
  if(entry && (entry.remembered || entry.timeUnknown) && !isChecked(entry)){
    pushMsg({type:"receipt", claimId:entry.id});
  }
}
function moveCount(){
  return ledger.entries.filter(function(e){ return e.move && e.move.trim(); }).length;
}
function postMoveMomentum(){
  if(noticedSuppressed()) return;
  var n = moveCount();
  if(n >= 1) postNoticed({kind:"move", line:fbLine("move", {n:n})});
}
/* ---- the feedback floor: day-shape facts (v1.9) ----
   Ordinary talk often matches no piece and no claim pattern — and
   before v1.9 that meant silence, which the founder felt as "no
   feedback yet." These facts are computed from the stores on EVERY
   exchange, match or no match: what is in the record today, what
   is still open, the moves on record, when the last move landed.
   In live mode they ride in the packet's ORGANIZING NOTES every
   time, so the companion always has something true to build on.
   In rule-based mode they post as a line only when nothing else
   computed for the message, and at most once a day — a light
   touch, never a running commentary on the person. */
function lastMoveTs(){
  var t = 0;
  ledger.entries.forEach(function(e){
    if(e.move && e.move.trim()){
      var et = e.tsOutcome || e.ts || 0;
      if(et > t) t = et;
    }
  });
  return t;
}
function dayShapeFacts(){
  var now = Date.now(), tk = dayKeyOf(now), out = [];
  var todayN = 0;
  atlas.events.forEach(function(ev){ if(dayKeyOf(ev.ts) === tk) todayN++; });
  if(todayN) out.push(todayN + (todayN === 1 ? " thing" : " things") + " in your record today");
  var open = openClaims().length;
  if(open) out.push(open + (open === 1 ? " claim" : " claims") + " still open");
  var mv = moveCount();
  if(mv) out.push(mv + (mv === 1 ? " move" : " moves") + " in your record");
  var lm = lastMoveTs();
  if(lm){
    var d = Math.floor((now - lm) / 86400000);
    if(d >= 1) out.push("the last move was " + d + (d === 1 ? " day" : " days") + " ago");
    else out.push("a move landed today");
  }
  return out;
}
function dayShapeFb(){
  if(noticedSuppressed()) return null;
  var tk = dayKeyOf(Date.now());
  if(thread.dayShapeDay === tk) return null; /* the floor speaks once a day */
  var facts = dayShapeFacts();
  if(!facts.length) return null;
  var line = facts.slice(0, 3).join(". ") + ".";
  line = line.charAt(0).toUpperCase() + line.slice(1);
  return {kind:"dayshape", line:line};
}
/* firsts inside a detail filing (Add detail): a channel or register
   this piece has never come through, figured from cap BEFORE
   fileCapture applies the tallies. Plain in every vibe. */
function computeCaptureFirsts(){
  if(noticedSuppressed() || !cap) return null;
  var ids = (cap.whoIds || []).filter(function(id){ return pieceById(id); });
  var i, j, p;
  for(i = 0; i < ids.length; i++){
    p = pieceById(ids[i]);
    var chans = cap.channels || [];
    for(j = 0; j < chans.length; j++){
      if(!(p.channels && p.channels[chans[j]])){
        var c = chans[j];
        return {kind:"firstchan", line:fbLine("firstchan",
          {name:p.name, chan:c.charAt(0).toLowerCase() + c.slice(1)})};
      }
    }
  }
  for(i = 0; i < ids.length; i++){
    p = pieceById(ids[i]);
    var regs = cap.register || [];
    for(j = 0; j < regs.length; j++){
      if(!(p.registers && p.registers[regs[j]])){
        var r = String(regs[j]).split(" — ")[0];
        return {kind:"firstreg", line:fbLine("firstreg",
          {name:p.name, reg:r.charAt(0).toLowerCase() + r.slice(1)})};
      }
    }
  }
  return null;
}
function ensureThread(){
  if(!bootTypingSwept){
    /* a typing bubble can only be live inside one session; one found
       in the store at boot is stale — the call it belonged to is gone */
    bootTypingSwept = true;
    if(thread.messages.some(function(m){ return m.type === "typing"; })){
      thread.messages = thread.messages.filter(function(m){ return m.type !== "typing"; });
      saveThread();
    }
  }
  var today = Math.floor(Date.now() / 86400000);
  if(!thread.messages.length){
    pushMsg({type:"companion", text:greetingText()});
    pushMsg({type:"companion", notAlone:true, text:notAloneLine()});
    pushMsg(offerMsg());
    thread.lastDay = today;
    thread.surfaceDay = today;
    thread.v16note = true; /* a brand-new thread is not an upgrade — no note owed */
    saveThread();
    bootInterruptChecked = true;
    maybePostInterruption();
    return;
  }
  if(!thread.v16note){
    /* first run after the v1.6 upgrade: the companion says what changed, once */
    thread.v16note = true;
    pushMsg({type:"companion", text:"It’s just us talking now. Everything else, I’ll bring to you."});
    saveThread();
  }
  if(thread.lastDay < today){
    pushMsg({type:"companion", text:greetingText()});
    thread.lastDay = today;
    bootInterruptChecked = true;
    var didInt = maybePostInterruption();
    if(thread.surfaceDay < today){
      if(!didInt) postDailySurface();
      thread.surfaceDay = today;
    }
    saveThread();
  }
  if(!bootInterruptChecked){
    bootInterruptChecked = true;
    maybePostInterruption();
  }
  /* a pour run left hanging across a pause gets its proposals on this open */
  var run = thread.pendingPour;
  if(run && run.ids && run.ids.length && (Date.now() - run.lastTs) > POUR_PAUSE_MS) flushPendingPour();
}

  if(m.type === "receiptscard"){ return receiptsCardHTML(m); }

  if(m.type === "claimkind"){ return claimKindHTML(m); }
  if(m.type === "claimwho"){ return claimWhoHTML(m); }
  if(m.type === "glossdoes"){ return glossDoesHTML(m); }

var ACK_LINES = ["Got it.","Word for word.","I hear you.","As you said it.","Heard."];
/* ---- talking is the only input mode ----
   There are no pour or fragment modes anymore: a short message is
   naturally a fragment, a long one a pour. Every message files to
   the record at once — and since v1.8 it is ORGANIZED at once: the
   filing proposal for this message posts at this message's moment,
   and a computed "noticed" line rides the response when the record
   has a fact about this moment. (v1.6/1.7 figured proposals over a
   run of messages — after the 3rd, or after a pause. That coalescing
   gate is retired for new talk; POUR_PAUSE_MS + flushPendingPour
   remain only so a run left hanging by an older version still gets
   its proposals on the next open or tap.) */
var POUR_PAUSE_MS = 120000;
function filePourEvent(text){
  var toldTs = Date.now();
  var ev = {
    id:uid(), ts:toldTs, mode:"pour", pourText:text,
    whoIds:[], whoFlags:[], whoOwn:"", channels:[], mannerWhere:[], mannerHow:[],
    bodySpots:[], among:[], claimLedgerId:"", register:[], seeing:"",
    response:[], glossaryId:"", eventOwn:""

var sessionProposedIds = {}; /* an event's filing is proposed once per session, never twice */
function proposeFromText(text, ev, evIds){
  /* v1.10: the old proposal is now an understanding playback. The
     matchers are unchanged (current names, name-history variants,
     glossary terms that imply a piece, claim patterns); what changed
     is what he sees — the understanding, spoken plainly and held
     open for revision, never a form about where something goes. */
  return postUnderstanding(text, ev, evIds);
}
/* this message's proposal, at its own moment (v1.8) */
function postImmediateProposal(ev, text){
  if(!ev) return;
  proposeFromText(text || ev.pourText || "", ev, [ev.id]);
}
function flushPendingPour(){
  var run = thread.pendingPour;
  if(!run || !run.ids || !run.ids.length) return;
  var ids = run.ids.slice();
  thread.pendingPour = {ids:[], lastTs:0};
  saveThread();
  var evs = ids.map(function(id){ return eventById(id); }).filter(Boolean);
  if(!evs.length) return;
  var combined = evs.map(function(e){ return e.pourText || ""; }).join("\n");
  proposeFromText(combined, evs[evs.length - 1], ids);
}
var sessionAckStreak = false; /* a bare ack already covers this stretch of talk */
function pickAck(){ return ACK_LINES[thread.messages.length % ACK_LINES.length]; }
/* would this message's filing be proposed? (the same matchers the
   proposal itself uses) — when it would, the proposal IS this
   exchange's organizing response, and knowledge waits its turn */
function proposalWouldFire(text){
  return piecesMentionedIn(text).length > 0 || CLAIM_PAT.test(text || "");
}
function notePourMessage(ev){
  sessionHold = true; /* a pour's aftermath is HOLD posture */
  flushPendingPour(); /* a run left by an older version still lands its proposals */
  var text = ev.pourText || "";
  /* organize at the moment: figure what this message's moment holds */
  var fb = computeNoticed(ev, text);
  if(liveOn()){
    /* the facts ride into the model's packet as ORGANIZING NOTES —
       the code posts no line of its own, so nothing double-posts.
       Ordering: the model's reply first, then this message's filing
       proposal — one conversation, the talk-back leading. */
    if(fb) queueOrgNote(fb.line);
    sessionAckStreak = false;
    requestLiveReply();
    liveChain = liveChain.then(function(){ postImmediateProposal(ev, text); });
    return;
  }
  /* rule-based: ONE feedback rides this exchange, in this order —
     a noticed fact about this moment; else, when no proposal is
     coming either, a context line this entry genuinely matches
     (v1.11: the research answers the entry itself, conversationally,
     from day one — not a card, and not the daily knowledge budget);
     else the day-shape floor, once a day; else the plain reception.
     A bare ack covers a quiet stretch once; any real response is
     itself an answer and resets the stretch. */
  var bare = false, ctxItem = null;
  if(fb){
    pushMsg({type:"companion", noticed:true, fbKind:fb.kind,
      text: sessionAckStreak ? fb.line : (pickAck() + " " + fb.line)});
  } else if(proposalWouldFire(text)){
    /* the proposal is this exchange's organizing — reception only,
       as it has always been for matched talk */
    if(!sessionAckStreak){ pushMsg({type:"companion", text:pickAck()}); bare = true; }
  } else if(ctxItem = matchContextForMessage(text, ev)){
    postContextLine(ctxItem);
  } else {
    var ds = dayShapeFb();
    if(ds){
      thread.dayShapeDay = dayKeyOf(Date.now());
      saveThread();
      pushMsg({type:"companion", noticed:true, fbKind:ds.kind,
        text: sessionAckStreak ? ds.line : (pickAck() + " " + ds.line)});
      /* the floor rode in on this stretch's one reception, the way
         a bare ack would — a following quiet message adds nothing */
      if(!sessionAckStreak) bare = true;
    } else if(!sessionAckStreak){
      pushMsg({type:"companion", text:pickAck()});
      bare = true;
    }
  }
  sessionAckStreak = bare;
  postImmediateProposal(ev, text);
}

/* ---- the record digest: a compact, deterministic brief from the stores ---- */
function buildRecordDigest(){
  var L = [];
  L.push("=== THE RECORD (kept by the app — facts, and the person's own words where quoted) ===");
  L.push("Today is " + dayLabel(dayKeyOf(Date.now())) + ".");
  if(companion){
    L.push("Companion: " + companion.name + ". Vibe setting: " + vibeOf() + ".");
  }
  if(atlas.pieces.length){
    L.push("The map — pieces (voices/presences), each with how the person sees them (their top layer):");
    atlas.pieces.slice(0, 15).forEach(function(p){
      var caps = atlas.events.filter(function(ev){ return (ev.whoIds || []).indexOf(p.id) !== -1; }).length;
      var rc = receiptsForPiece(p);
      L.push("- " + p.name + (p.seeing ? " — how they see them: “" + p.seeing + "”" : " — how they see them: not said yet")
        + "; " + caps + (caps === 1 ? " capture" : " captures")
         + "; claims: " + rc.total + " said, " + rc.checked + " checked (" + rc.held + " held up, " + rc.didnt + " did not), " + rc.open + " open.");
    });
  } else {
    L.push("The map has no pieces yet.");
  }
  if(atlas.glossary.length){
    L.push("Their own words (the voices' vocabulary, as the person keeps it):");
    atlas.glossary.slice(-12).forEach(function(g){
      L.push("- “" + g.term + "”" + (g.does ? " — " + g.does : "") + (g.doesOwn ? " — " + g.doesOwn : "") + (g.whoText ? " (about " + g.whoText + ")" : ""));
    });
  }
  var open = openClaims().slice().sort(function(a,b){ return a.ts - b.ts; });
  if(open.length){
    L.push("Claims still open (unanswered):");
    open.slice(0, 10).forEach(function(e){
      L.push("- [" + (KIND_LABELS[e.kind] || e.kind || "claim") + ", " + (e.timeUnknown ? "from some time back, told " + fmtDate(e.toldTs || e.ts) : "said " + relDay(e.ts)) + (e.who ? ", " + e.who : "") + "] “" + shortWords(e.claim, 160) + "”");
    });
    if(open.length > 10) L.push("- …and " + (open.length - 10) + " more open.");
  }
  var checked = ledger.entries.filter(isChecked).slice()
    .sort(function(a,b){ return (b.tsOutcome || b.ts) - (a.tsOutcome || a.ts); }).slice(0, 8);
  if(checked.length){
    L.push("Recently checked claims — what was claimed, their move, how it ended:");
    checked.forEach(function(e){
      L.push("- [" + claimWhenLabel(e) + (e.who ? ", " + e.who : "") + "] “" + shortWords(e.claim, 140) + "”"
        + (e.move && e.move.trim() ? " — their move: “" + shortWords(e.move.trim(), 140) + "”" : "")
        + " — it ended: " + outcomeShort(e) + ".");
    });
  }
  var t = allReceiptTallies();
  var withMove = ledger.entries.filter(function(e){ return e.move && e.move.trim(); }).length;
  L.push("Receipts, figured: " + t.total + " claims said, " + t.checked + " checked (" + t.held + " held up, " + t.didnt + " did not), " + t.open + " still open."
    + (withMove ? " " + withMove + (withMove === 1 ? " time" : " times") + " they announced and the person moved anyway." : ""));
  /* themes across their days (v1.11.1): the same counting the
     connections surface uses — which research themes appear in
     their own words, on how many distinct told-days — so the live
     voice can connect on its own */
  var tdc = themeDayCounts().filter(function(x){ return x.days >= 1; }).slice(0, 10);
  if(tdc.length){
    L.push("Themes across their days (research themes in their own words, counted by distinct days they talked about them): "
      + tdc.map(function(x){ return x.label + " — " + x.days + (x.days === 1 ? " day" : " days"); }).join("; ") + ".");
  }
  var jkeys = journalDayKeys().slice(0, 3);
  if(jkeys.length){
    L.push("Journal, recent days:");
    jkeys.forEach(function(k){
      var d = journalDayData(k);
      var parts = [];
      if(d.pours.length) parts.push(d.pours.length + (d.pours.length === 1 ? " pour" : " pours"));
      if(d.writings.length) parts.push(d.writings.length + (d.writings.length === 1 ? " writing" : " writings"));
      if(d.claimsLog.length) parts.push(d.claimsLog.length + (d.claimsLog.length === 1 ? " claim" : " claims") + " said");
      if(d.claimsClosed.length) parts.push(d.claimsClosed.length + " checked");

}
/* ---- thread history for the model: their words + the companion's,

  if(m.type === "connection") return br("You brought a connection — " + (m.beat1 || "") + " " + (m.ctx || "") + " " + (m.beat3 || ""));
  if(m.type === "playbook") return br("You showed moves that worked before: " + (m.lines || []).join(" / "));
  if(m.type === "precedent") return br("From their record: " + (m.text || ""));
  if(m.type === "pick") return br("You offered a next step: " + (m.title || "") + " — " + (m.body || ""));
  if(m.type === "proposal" || m.type === "understanding"){
    var um = normalizeUnderstandingMessage(m);
    return br("You said back what you heard: " + understandingSentence(um));
  }
  if(m.type === "uchoice") return "";
  if(m.type === "journalcard") return br("You brought their journal card — the recent days, written from this talk");
  if(m.type === "mapcard") return br("You brought their map card — the pieces and how they see them");
  if(m.type === "piececard"){ var p = pieceById(m.pieceId); return br("You brought the card for " + (p ? p.name : "a piece")); }
  if(m.type === "receiptscard") return br("You brought the receipts card — the figured picture and the open claims");
  if(m.type === "settingscard") return br("You brought the settings card");
  if(m.type === "moveask"){ var me = ledgerEntryById(m.claimId); return br("You asked whether they want to note their move on the claim “" + (me ? shortWords(me.claim, 80) : "") + "”"); }
  if(m.type === "mapGlimpse") return br("You showed a glimpse of their map");
  return ""; /* interactive prompts (claim kinds, detail steps, writing) need no narration */
}
function buildLiveHistory(){
  var msgs = [];
  thread.messages.forEach(function(m){
    if(m.type === "person"){ msgs.push({role:"user", content:String(m.text || "")}); return; }
    if(m.type === "companion"){ if(m.text) msgs.push({role:"assistant", content:String(m.text)}); return; }
    var note = liveHistoryNote(m);
    if(note) msgs.push({role:"assistant", content:note});
  });
  msgs = msgs.filter(function(x){ return x.content && x.content.trim(); });
  /* merge consecutive same-role turns — chat APIs want alternation */
  var merged = [];
  msgs.forEach(function(x){
    var last = merged[merged.length - 1];
    if(last && last.role === x.role) last.content += "\n" + x.content;
    else merged.push({role:x.role, content:x.content});
  });
  if(merged.length > 20) merged = merged.slice(merged.length - 20);
  while(merged.length && merged[0].role !== "user") merged.shift();
  if(merged.length && merged[merged.length - 1].role !== "user") merged.pop();
  return merged;
}
/* the knowledge base, whole, for the live packet (v1.9; widened
   to the CONTEXT BANK in v1.11): the research is the person's own
   experience base — the companion cannot draw on what it cannot
   see. This section is static content, inherently bounded: 20
   items measure 4,833 characters. The record digest keeps its
   own 6,500-character cap. Measured whole-system packets (v1.11):
   9,920 characters on a fresh record, 15,685 with a rich one —
   bounded under ~17,500 with the digest at cap and a full
   organizing-notes queue. */
function buildKnowledgeBaseSection(){
  var L = ["=== KNOWLEDGE BASE (the research gathered for this person's atlas — findings from others' accounts and studies, in the app's short form. Offer at most one per exchange, only on a genuine match, framed as what others have described) ==="];
  KNOWLEDGE.forEach(function(it){
    L.push("- [" + it.theme + "] " + it.l1 + " More: " + it.l2);
  });
  return L.join("\n");
}
function buildLivePacket(){
  var system = liveConstitution() + "\n\n" + buildRecordDigest()
    + "\n\n" + buildKnowledgeBaseSection();
  /* organizing notes: the facts figured at this message's moment,
     PLUS the day-shape facts — computed fresh on every packet, so
     even talk that matches nothing hands the model something true
     about the shape of the record to build on (v1.9). The model
     may build on them; the code does not also post them as lines
     (no double-posting). */
  var notes = (thread.orgNotes || []).slice();
  dayShapeFacts().forEach(function(f){
    if(notes.indexOf(f) === -1) notes.push(f);
  });
  if(notes.length){
    system += "\n\n=== ORGANIZING NOTES (figured by the app from what they have already communicated — facts about this talk you may build on; you need not repeat them, and they never replace what the person said) ===\n"
      + notes.map(function(n){ return "- " + n; }).join("\n");
  }
  if(thread.orgNotes && thread.orgNotes.length){
    thread.orgNotes = [];
    saveThread();
  }
  return {
    system: system,
    messages: buildLiveHistory()
  };
}
/* ---- transport: straight from the browser to the provider ---- */
function liveFetch(url, opts){
  if(typeof AbortController !== "undefined"){
    var ctl = new AbortController();
    var to = setTimeout(function(){ ctl.abort(); }, 30000);
    var withSig = {};
    Object.keys(opts).forEach(function(k){ withSig[k] = opts[k]; });
    withSig.signal = ctl.signal;
    return fetch(url, withSig).then(function(r){ clearTimeout(to); return r; },
      function(e){ clearTimeout(to); throw e; });
  }
  return fetch(url, opts);
}
function fetchLiveReply(){
  var packet = buildLivePacket();
  if(!packet.messages.length) return Promise.resolve(null);
  var req, parse;
  if(liveai.provider === "openai"){
    req = liveFetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + liveai.key.trim()},
      body:JSON.stringify({model:liveai.model.trim(), max_tokens:700,
        messages:[{role:"system", content:packet.system}].concat(packet.messages)})
    });
    parse = function(j){
      return (j && j.choices && j.choices[0] && j.choices[0].message) ? j.choices[0].message.content : "";
    };
  } else {
    req = liveFetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json", "x-api-key":liveai.key.trim(),
        "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:liveai.model.trim(), max_tokens:700,
        system:packet.system, messages:packet.messages})
    });
    parse = function(j){
      if(!j || !j.content) return "";
      return j.content.filter(function(b){ return b && b.type === "text"; })
        .map(function(b){ return b.text || ""; }).join("\n");
    };
  }
  return req.then(function(r){
    if(!r.ok){
      if(r.status === 401 || r.status === 403) noteLiveKeyFailure();
      return null;
    }
    return r.json();
  }).then(function(j){
    if(j == null) return null;
    var t = parse(j);
    t = (t == null ? "" : String(t)).trim();
    return t || null;
  }).catch(function(){ return null; });
}
function requestLiveReply(){
  /* serialized: a second message sent mid-answer queues its own call,
     so replies land in the order the person spoke */
  liveChain = liveChain.then(function(){
    var typing = pushMsg({type:"typing"});
    render();
    function settle(text){
      thread.messages = thread.messages.filter(function(x){ return x.id !== typing.id; });
      if(text){
        pushMsg({type:"companion", live:true, text:text});
      } else {
        pushMsg({type:"companion", text:ACK_LINES[thread.messages.length % ACK_LINES.length]});
      }
      render();
    }
    return Promise.resolve()
      .then(function(){ return fetchLiveReply(); })
      .then(settle, function(){ settle(null); });
  });
}

/* ---- asking for a view: simple intent matching on the person's words ----
   Distinctive nouns (journal, map, receipts, claims, settings…) are
   requests on their own. Ambiguous words (today, my day, this week,
   who, a piece's name) count as requests only alongside a request
   word, so a pour that merely mentions them stays a pour. */
function detectIntent(text){
  var low = " " + text.toLowerCase().replace(/[^a-z0-9'\s]/g, " ") + " ";
  function w(x){ return low.indexOf(" " + x + " ") !== -1; }
  var req = ["show","see","open","bring","check","look","what","how","give"].some(function(x){ return w(x); });
  var pieceHit = null;
  atlas.pieces.forEach(function(p){
    var names = [p.name].concat((p.nameHistory || []).map(function(n){ return n.name; }));
    names.forEach(function(nm){
      if(nm && low.indexOf(" " + nm.toLowerCase()) !== -1) pieceHit = p;
    });
  });
  if(w("receipts") || w("claims") || low.indexOf(" track record ") !== -1
     || (pieceHit && (w("record") || w("claims") || w("receipts"))))
    return {kind:"receipts"};
  if(w("settings") || w("export") || w("import") || w("erase") || w("reshape") || low.indexOf(" my data ") !== -1)
    return {kind:"settings"};
  if(w("journal")) return {kind:"journal"};
  if((w("today") || low.indexOf(" my day ") !== -1 || low.indexOf(" this week ") !== -1) && req)
    return {kind:"journal"};
  if(w("map")) return {kind:"map"};
  if(pieceHit && req) return {kind:"piece", pieceId:pieceHit.id};
  if(w("who") && req) return {kind:"map"};
  return null;
}
function routeIntent(it){
  if(it.kind === "journal") postJournalCard("week");
  else if(it.kind === "map") postMapCard(0);
  else if(it.kind === "piece") postPieceCard(it.pieceId);
  else if(it.kind === "receipts") postReceiptsCard();
  else if(it.kind === "settings") postSettingsCard();
}
function sendThreadText(){
  var ta = el("threadInput");
  if(!ta) return;
  var text = ta.value.trim();
  if(!text){ ta.focus(); return; }
  ta.value = "";
  if(writeMode){
    /* writing in the talk: saved to the journal store, verbatim,
       never analyzed, never filed anywhere else */
    journal.entries.push({id:uid(), ts:Date.now(), prompt:writeMode.prompt || "", text:text});
    saveJournal();
    pushMsg({type:"person", text:text});
    render();
    return;
  }
  if(textAsk){
    /* the companion asked for words — a move, an outcome, a name —
       and this message is the answer, landing where it was aimed */
    pushMsg({type:"person", text:text});
    handleTextAsk(text);
    render();
    return;
  }
  if(detail && detail.textField){
    /* a detail step asked for his own words; they fill the field */
    pushMsg({type:"person", text:text});
    handleDetailText(text);
    render();
    return;
  }
  var intent = detectIntent(text);
  if(intent){
    /* a request, not a pour: the companion brings the view as a card.
       Requests win over modes — even mid-correction, asking for a
       view brings the view, it doesn't become a correction note. */
    pushMsg({type:"person", text:text});
    flushPendingPour();
    routeIntent(intent);
    render();
    return;
  }
  if(correctionDay){
    /* corrections file as part of the talk AND are proposed for the
       day — never applied silently */
    var evC = filePourEvent(text);
    pushMsg({type:"person", text:text, eventId:evC.id});
    pushMsg({type:"correctNote", dayKey:correctionDay, note:text, kept:false, skipped:false});
    render();
    return;
  }
  var ev = filePourEvent(text);
  pushMsg({type:"person", text:text, eventId:ev.id});
  notePourMessage(ev);
  render();
}

/* Piece tallies (channels, registers) are counts built from events. When an
   entry is edited, its old contribution is lifted out before the new one is
   laid in. Body spots and seeing are left as-is on removal: both are unions
   across the whole record, and unlearning them from one edit could erase
   what other entries taught. */
function adjustPiecesForEvent(ev, dir){
  (ev.whoIds || []).forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    if(!pc.channels) pc.channels = {};
    if(!pc.registers) pc.registers = {};
    (ev.channels || []).forEach(function(c){
      pc.channels[c] = (pc.channels[c] || 0) + dir;
      if(pc.channels[c] <= 0) delete pc.channels[c];
    });
    (ev.register || []).forEach(function(r){
      pc.registers[r] = (pc.registers[r] || 0) + dir;
      if(pc.registers[r] <= 0) delete pc.registers[r];
    });
  });
}

function fileCapture(){
  var d = cap;
  var ts = Date.now();
  var editingEv = null;
  var toldForCap = d.toldTs || ts;
  if(d.timeExplicit && TOLD_TIME_BUCKETS[d.timeBucket]){
    ts = (d.timeBucket === "unknown" || d.timeBucket === "now")
      ? toldForCap
      : toldForCap - TOLD_TIME_BUCKETS[d.timeBucket].days * 86400000;
  }
  if(d.editEventId){
    for(var ei=0;ei<atlas.events.length;ei++){
      if(atlas.events[ei].id === d.editEventId){ editingEv = atlas.events[ei]; break; }
    }
    if(editingEv){ adjustPiecesForEvent(editingEv, -1); ts = editingEv.ts; }
  }
  var involved = d.whoIds.slice();
  var newId = "";
  if(newPieceWanted()){
    newId = uid();
    var p = {
      id:newId, name: defaultPieceName(),
      nameHistory:[{name: defaultPieceName(), ts:ts}],
      type: newPieceType(), likeness: d.newPiece.likeness || "", status: d.newPiece.status || "",
      standing: !!d.newPiece.standing,
      seeing:"", seeingTs:0, registers:{}, channels:{}, bodySpots:[], created:ts
    };
    atlas.pieces.push(p);
    involved.push(newId);
  }
  var seeing = d.seeingOwn.trim() || d.seeingChip;
  var spots = d.bodySpots.slice(); if(d.bodySpotOwn) uniqPush(spots, d.bodySpotOwn.trim());
  involved.forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    if(!pc.channels) pc.channels = {};
    if(!pc.registers) pc.registers = {};
    if(!pc.bodySpots) pc.bodySpots = [];
    d.channels.forEach(function(c){ pc.channels[c] = (pc.channels[c]||0) + 1; });
    d.register.forEach(function(r){ pc.registers[r] = (pc.registers[r]||0) + 1; });
    spots.forEach(function(s){ uniqPush(pc.bodySpots, s); });
    if(seeing){ pc.seeing = seeing; pc.seeingTs = ts; }
  });
  var ledgerId = "";
  var editingOldLedgerId = editingEv ? (editingEv.claimLedgerId || "") : "";
  if(d.claimKind){
    var cw = claimWhoOf(d);
    var whoId = cw.id === "__new" ? newId : cw.id;
    var claimFields = {
      claim: claimTextOf(d), kind: d.claimKind,
      who: cw.id === "__new" ? defaultPieceName() : cw.name, whoId: whoId || "",
      encoded: d.claimChips.indexOf("It charged me with something it won\u2019t say plainly") !== -1
    };
    var claimTime = {};
    if(d.timeExplicit){
      if(d.timeBucket === "unknown") claimTime = {timeUnknown:true, toldTs:toldForCap};
      else if(d.timeBucket !== "now") claimTime = {remembered:true, toldTs:toldForCap};
    } else if(editingEv){
      if(editingEv.timeUnknown) claimTime = {timeUnknown:true, toldTs:editingEv.toldTs || toldForCap};
      else if(editingEv.remembered) claimTime = {remembered:true, toldTs:editingEv.toldTs || toldForCap};
    }
    var updatedOld = false;
    var newClaimEntry = null;
    if(editingOldLedgerId){
      ledger.entries.forEach(function(e){
        if(e.id === editingOldLedgerId){
          e.claim = claimFields.claim; e.kind = claimFields.kind;
          e.who = claimFields.who; e.whoId = claimFields.whoId; e.encoded = claimFields.encoded;
          e.ts = ts;
          if(claimTime.timeUnknown){ e.timeUnknown = true; e.toldTs = claimTime.toldTs; delete e.remembered; }
          else if(claimTime.remembered){ e.remembered = true; e.toldTs = claimTime.toldTs; delete e.timeUnknown; }
          else { delete e.timeUnknown; delete e.remembered; delete e.toldTs; }
          ledgerId = e.id; updatedOld = true;
        }
      });
    }
    if(!updatedOld){
      ledgerId = uid();
      ledger.entries.push({
        id:ledgerId, claim: claimFields.claim, kind: claimFields.kind,
        who: claimFields.who, whoId: claimFields.whoId,
        ts:ts, outcome:"", outcomeChip:"", tsOutcome:0,
        encoded: claimFields.encoded
      });
      newClaimEntry = ledger.entries[ledger.entries.length - 1];
      if(claimTime.timeUnknown){ newClaimEntry.timeUnknown = true; newClaimEntry.toldTs = claimTime.toldTs; }
      else if(claimTime.remembered){ newClaimEntry.remembered = true; newClaimEntry.toldTs = claimTime.toldTs; }
    }
    saveLedger();
    if(newClaimEntry) afterClaimFiled(newClaimEntry);
  } else if(editingOldLedgerId){
    /* the claim was removed in Add detail — its ledger entry goes with it */
    ledger.entries = ledger.entries.filter(function(e){ return e.id !== editingOldLedgerId; });
    saveLedger();
  }
  var glossId = "";
  if(d.glossTerm){
    glossId = uid();
    atlas.glossary.push({
      id:glossId, term:d.glossTerm.trim(), does:d.glossDoes || "", doesOwn:d.glossDoesOwn || "",
      whoIds: involved.slice(),
      whoText: involved.map(function(id){ return pieceName(id); }).filter(Boolean).join(", "),
      ts:ts
    });
  }
  var evFields = {
    mode:d.mode, pourText:d.pourText || "",
    whoIds: involved, whoFlags: d.whoFlags.slice(), whoOwn: d.whoOwn,
    channels: d.channels.slice(), mannerWhere: d.mannerWhere.slice(), mannerHow: d.mannerHow.slice(),
    bodySpots: spots, among: d.among.slice(),
    claimLedgerId: ledgerId, register: d.register.slice(),
    seeing: seeing, response: d.response.slice(),
    glossaryId: glossId || (editingEv ? (editingEv.glossaryId || "") : ""), eventOwn: d.eventOwn
  };
  if(d.timeExplicit){
    evFields.timeBucket = d.timeBucket; evFields.timePhrase = d.timeLabel;
    if(d.timeBucket === "unknown"){ evFields.timeUnknown = true; evFields.toldTs = toldForCap; }
    else if(d.timeBucket !== "now"){ evFields.remembered = true; evFields.toldTs = toldForCap; }
  }
  if(editingEv){
    Object.keys(evFields).forEach(function(k){ editingEv[k] = evFields[k]; });
    if(d.timeExplicit) applyToldTime(editingEv, timeInfoForBucket(d.timeBucket), toldForCap);
    /* enriched: a fragment that gains detail becomes a full entry */
    delete editingEv.type; delete editingEv.fragmentText; delete editingEv.filed;
  } else {
    evFields.id = uid(); evFields.ts = ts;
    atlas.events.push(evFields);
  }
  saveAtlas();
  cap = null;
}
