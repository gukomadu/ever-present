<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ever Present">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ever Present</title>
<style>
  /* ================= Ever Present v1.22 — the founder's ACTUAL palette =================
     CORRECTION (2026-10-25): v1.21 was built on a MISREAD. The
     founder's "Instagram uses black white blue and purple" was
     INFORMATION about that app, not a direction for this one —
     he corrected it himself: "It was information." v1.22 retires
     the Instagram scheme wholesale (no violet, no IG blue, no
     gradient identity marks anywhere) and lands on what he
     actually stated:
     - "I like a white background (that can go black for dark
       theme at night)": light paper pure white #FFFFFF; dark
       paper TRUE BLACK #000000, surfaces #1A1A1A, text #F5F5F5.
     - "I like baby blue for the sign highlights": labels,
       kickers, badges and sign-like marks are BABY BLUE #89CFF0
       — as fills with ink text on them (10.74:1) where they are
       chips/badges, and as the readable deep blue #0B6FA4
       (5.49:1 on white) where a sign is text on white. Selected
       chips are baby-blue filled. Links are the deep blue.
     - "Your gray message highlights, I like the gray": incoming
       bubbles stay GRAY — #F0F0F0 on white, #262626 on black.
     - Outgoing bubbles return to the v1.20 status quo: the deep
       room-GREEN gradient with white text (6.54–9.63:1). Green
       survives ONLY there — his own messages — and nowhere as a
       general accent.
     - Help returns to terracotta (#B4552D, v1.20 values), top
       pill, unchanged position.
     - Room surfaces stay neutral light gray, told apart by
       baby-blue sign marks + labels.
     The serif stays OUT of the UI entirely (v1.21 finished that;
     v1.22 verifies it). All v1.20 geometry, motion tokens, target
     sizes and the 13px label floor are unchanged. Measured ratios
     are reported with the v1.22 build.
     v1.23 — DAY & NIGHT FROM THE FOUNDER'S PICTURES (2026-10-25):
     he sent two reference photos, "I like this aesthetic for the
     day" / "for night", and the ATMOSPHERE (never the images —
     no photo backgrounds anywhere) now sets the schemes:
     - DAY: the room opens to sky at the top — --paper-glow is the
       palest sky tint #F2F9FD and the body gradient lets it fade
       to white by 240px; the veil takes the tint too, so content
       still dissolves before the Help pill. Everything else stays
       low-saturation v1.22 — except HELP, which becomes the day
       photo's one vivid anchor, the saturated red field:
       #CF3316 (HSL 9°/81%/45%, white bold text 5.07:1 — the most
       saturated poppy that still passes; terracotta superseded).
       Danger #B3261E already harmonises with it.
     - NIGHT: the founder's night sky is INDIGO, not black —
       "night is blue" supersedes v1.22's plain-black reading.
       Paper #0D1230, surfaces step up in blue (#171E42 card,
       #20295C surface-2/field, #252E5E bubbles — off-white body
       text 11.81:1 on the bubbles), secondary text turns
       blue-gray, washes go indigo. Baby-blue signs stay #89CFF0
       and glow on indigo (10.68:1 on the paper). Outgoing green
       stays luminous against it; Help red stays saturated — the
       tower's one warm light. No #000000 remains in the scheme.
     - FOUND WHILE VERIFYING (latent v1.22 bug): in the dark
       scheme --ink flips to off-white, so every baby-blue FILL
       that took its text colour from --ink was carrying
       near-white text at 1.57:1. A new --on-sign token (#141414
       in BOTH schemes) pins dark text on sign fills everywhere;
       light rendering is pixel-identical. The alt-chip selected
       state likewise moves to the pale wash + family ink
       (4.97:1 light / 8.05:1 dark). The hero card gets its own
       --hero ground (near-black by day, deepest indigo #060A24
       by night) instead of borrowing --ink, which flips.
     v1.24 — FOUNDER CALLS (2026-10-25), resolved over a chain
     of corrections, each recorded as it landed:
     - OUTGOING bubbles: "my message background to change from
       green to plum violet" — PLUM VIOLET gradient, a warm
       reddish purple (day #7D3268 → #55204A, white text 8.31:1 /
       12.41:1; night luminous #9C4787 → #753468, 5.73:1 / 8.58:1
       against the indigo). Green is retired as a UI colour.
     - SEND: there isn't one. "the send button to cornflower
       blue" → "No, the highlight" → "do the same thing that's
       here on this app" → "No, the body" → "I'm talking about
       the send button" → FINAL: "Actually yours doesn't have
       a send button. You can actually remove it. And
       incorporate the color somewhere else." The button is
       REMOVED — Enter / the keyboard's send key sends, as in
       this app — and cornflower #6495ED is incorporated into
       the composer: its focus light (border tint + soft glow,
       with a 1px sign-deep hairline inside the glow for
       legibility, cornflower alone being 2.97:1 on white) and
       the Record button's pressed tint. Every earlier steer
       (fill, highlight-only, round icon button) is superseded.
       The Record button itself stays written, exactly as
       v1.23.
     - HELP: "And crimson for the help button" — the fill is
       CRIMSON #DC143C (the named colour, exact, both schemes;
       white bold label 4.99:1) and the family shifts with it
       (deep #A80E30, hi #EF4E6F, pale washes). The v1.23 poppy
       is superseded; danger stays #B3261E, a duller red.
     v1.27 — HELP IS THREE BARS + THE BLUE BRIGHTENS (2026-10-25):
     - "Inside help i like the hotline bars. So instead of
       other words just have bar options for My Playlist, My
       Encouragement, My People." The wordy ladder rungs are
       GONE: Help opens onto three full-width bars in his order
       and nothing else but one quiet "Arrange these" line to
       the calm-time editor. The bars group the same ladder
       store: song → My Playlist (the moment song leads, its
       Play it door first, the rest listed); calm-day note +
       room + receipts → My Encouragement; his people + his
       professional (988 / Crisis Text Line included) → My
       People. An empty playlist renders no Playlist bar.
     - "Center the help button and Bigger so the separation
       is evident." The pill moves to TOP-CENTER and grows
       (18px/700, min-height 56px, a deeper crimson shadow);
       the veil band and the wrap's top clearance grow with
       it, so content still dissolves before reaching it, at
       any scroll position, day and indigo night.
     - "The last message and bottom bar is not small enough"
       (on v1.26's ~14px): the under-thread stance tightens
       again — spacer 56px → 24px, wrap bottom padding
       30px → 20px — one tight rhythm step (~8px).
     - "I want that blue to be a brighter happier color."
       The whole blue family lifts to a brighter sky/azure:
       sign fills #38BDF8 (ink on them 8.60:1), sign-deep
       #0272AD (the #0284C7 family adjusted the minimum that
       holds every floor: 5.23:1 on white, 4.56:1 on the new
       wash), the composer glow takes the same #38BDF8
       (cornflower #6495ED superseded), washes shift pale
       with the family, and at night sign-deep lightens to
       #7DD3FC (10.99:1 on the indigo). Crimson, plum, the
       grays and the indigo are untouched. */
  :root{
    color-scheme:light;
    --paper:#ffffff; --paper-glow:#f2f9fd;
    --card:#ffffff; --card-line:#e7e7e7;
    /* text on a baby-blue sign fill: dark in BOTH schemes (the
       fill never changes, so its text must not flip with --ink) */
    --on-sign:#141414;
    /* the composer glyphs (attach sign + microphone): PURE
       BLACK by day (v1.27 — the founder: "black as black as
       possible"); at night they take off-white, because black
       cannot read on the indigo */
    --glyph:#000;
    /* the hero card's own ground: near-black by day */
    --hero:#141414;
    --field:#ffffff; --surface2:#ffffff;
    /* incoming bubbles: the gray he likes, kept */
    --bubble-in:#f0f0f0;
    --ink:#141414; --ink-soft:#595959; --muted:#6a6a6a;
    /* SIGN HIGHLIGHTS = the blue family (founder's stated
       preference; v1.27: "a brighter happier color" — the
       family lifts to sky/azure). --sign is a FILL (badges,
       selected chips, top lines) and always carries ink text
       (8.60:1); --sign-deep is the same family as readable
       TEXT on white (5.23:1) and carries white on filled
       buttons (5.23:1) */
    --sign:#38bdf8; --sign-deep:#0272ad; --sign-soft:#e0f2fe;
    /* outgoing: PLUM VIOLET (v1.24 — founder: "my message
       background to change from green to plum violet"). A warm
       reddish purple, not blue-violet, not lavender: white text
       8.31:1 on the light stop, 12.41:1 on the deep stop. The
       v1.20–v1.23 room-green gradient is superseded; no green
       remains as a UI colour anywhere. */
    --me:#55204a;
    --me-grad:linear-gradient(160deg, #7d3268 0%, #55204a 100%);
    --me-ink:#ffffff;
    /* THE COMPOSER GLOW (v1.24's home; v1.27's colour):
       there is no send button (founder: "yours doesn't have
       a send button — remove it, and incorporate the color
       somewhere else"), so the blue lives in the composer:
       its focus light (border tint + soft glow) and the
       Record button's pressed tint. Cornflower #6495ED is
       SUPERSEDED by the founder's brighter-blue call —
       --send now takes the same bright sky as the signs,
       #38BDF8, in both schemes */
    --send:#38bdf8;
    /* primary actions: the family's readable azure — the
       same value as --sign-deep, as before (white on it
       5.23:1) */
    --accent:#0272ad; --accent-soft:#e0f2fe; --on-accent:#ffffff;
    /* text links: the same readable azure */
    --link:#0272ad;
    --sage:#a8a8a8; --sage-soft:#f0f0f0; --sage-line:#dbdbdb;
    /* the room: neutral light gray — told apart by the baby-blue
       sign marks and its labels, not a tint wash */
    --room-bg:#f5f5f5; --room-line:#e7e7e7;
    /* Help: the room's one vivid anchor — CRIMSON (v1.24;
       founder: "And crimson for the help button" — the named
       colour #DC143C, exact; white bold text 4.99:1). The
       v1.23 poppy #CF3316 family is superseded */
    --help:#dc143c; --help-deep:#a80e30; --help-hi:#ef4e6f; --help-soft:#fdecef;
    --danger:#b3261e;
    /* legacy --amber names: now a pale azure wash + azure ink
       (v1.27: shifted pale with the brighter family; the ink
       holds 4.76:1 on the wash) */
    --amber-bg:#eaf6fe; --amber-line:#a2dffc; --amber-ink:#0272ad;
    /* legacy alias (older rules lean on this name) */
    --line:var(--card-line);
    --radius:20px;
    --shadow-card:0 1px 2px rgba(20,20,20,.05), 0 10px 28px rgba(20,20,20,.07);
    --shadow-bubble:0 1px 2px rgba(20,20,20,.05), 0 6px 20px rgba(20,20,20,.07);
    --shadow-me:0 2px 4px rgba(85,32,74,.25), 0 8px 20px rgba(85,32,74,.22);
    --shadow-bar:0 12px 32px rgba(20,20,20,.14), 0 2px 8px rgba(20,20,20,.08);
    /* motion tokens (research §8): press / new turn / card / exit */
    --dur-press:120ms; --dur-msg:180ms; --dur-card:280ms; --dur-exit:210ms;
    --ease-std:cubic-bezier(0.2,0,0,1);
    --ease-out:cubic-bezier(0.05,0.7,0.1,1);
    --ease-exit:cubic-bezier(0.3,0,0.8,0.15);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      /* dark: INDIGO (v1.23 — the founder's night photo: cherry
         blossoms against a deep saturated indigo sky; "night is
         blue, not black" supersedes v1.22's plain-black reading).
         Paper is deep indigo #0D1230 and every surface steps up
         in blue; off-white text mitigates halation */
      --paper:#0d1230; --paper-glow:#0d1230;
      --card:#171e42; --card-line:#303a75;
      --field:#20295c; --surface2:#20295c;
      --bubble-in:#252e5e;
      --on-sign:#141414;
      --glyph:#f5f5f5;
      --hero:#060a24;
      --ink:#f5f5f5; --ink-soft:#aab3d8; --muted:#98a1c6;
      /* signs in the dark (v1.27, the brighter family): the
         fill stays the bright sky #38BDF8 and GLOWS on indigo
         (8.55:1 on the paper); sign fills carry --on-sign
         text; sign TEXT on indigo lightens further to
         #7DD3FC (10.99:1 on the paper, 9.68:1 on card) */
      --sign:#38bdf8; --sign-deep:#7dd3fc; --sign-soft:#0e2a47;
      /* outgoing at night: a LUMINOUS plum against the indigo
         (v1.24 supersedes the deep green) — white text 5.73:1
         on the light stop, 8.58:1 on the deep stop */
      --me:#753468;
      --me-grad:linear-gradient(160deg, #9c4787 0%, #753468 100%);
      --me-ink:#ffffff;
      /* cornflower keeps the same home at night — the
         composer's focus light, Record's pressed tint */
      --send:#38bdf8;
      --accent:#0b6fa4; --accent-soft:#0e2a47; --on-accent:#ffffff;
      --link:#7dd3fc;
      --sage:#6b74a3; --sage-soft:#252e5e; --sage-line:#323c74;
      --room-bg:#171e42; --room-line:#303a75;
      /* Help stays CRIMSON at night — the tower's one warm
         light against the indigo (v1.24; white bold text
         4.99:1 — the poppy family superseded) */
      --help:#dc143c; --help-deep:#a80e30; --help-hi:#ef4e6f; --help-soft:#360a1b;
      --danger:#ea8a7f;
      --amber-bg:#0e2a47; --amber-line:#24507a; --amber-ink:#7dd3fc;
      --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
      --shadow-bubble:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
      --shadow-me:0 2px 4px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
      --shadow-bar:0 12px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, var(--paper-glow), var(--paper) 240px) var(--paper);
    font-family:var(--sans);
    line-height:26px; font-size:17px;
    padding-bottom:calc(104px + env(safe-area-inset-bottom));
  }
  ::selection{background:var(--sign); color:var(--on-sign)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  /* the Help shelf: a fixed veil across the top of the screen.
     Thread content scrolls up INTO the veil's colour and is gone
     before it can reach the pill — so the floating Help can never
     sit on top of readable text or a card, at any scroll position.
     The wrap's top padding gives the same clearance at rest.
     v1.23: the veil takes --paper-glow — the local sky tint at
     the top of the room by day, the indigo by night.
     v1.27: the pill is centered and BIGGER (bottom edge at
     12 + 56 = 68px) — the veil's solid band grows to 78px and
     is gone by 100px, and the wrap's top padding grows to
     88px (the pill's bottom edge + 20px of clear air). The
     wrap's bottom padding trims 30px → 20px in the same pass
     (the tighter under-thread stance, see .thread-spacer). */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; z-index:70;
    height:calc(100px + env(safe-area-inset-top));
    background:linear-gradient(180deg, var(--paper-glow) 0, var(--paper-glow) 78px,
      color-mix(in srgb, var(--paper-glow) 0%, transparent) 100px);
    pointer-events:none;
  }
  .wrap{
    max-width:680px; margin:0 auto;
    padding:calc(88px + env(safe-area-inset-top)) 16px 20px;
  }
  h1.appname{
    font-family:var(--sans); font-weight:600;
    font-size:1.55rem; margin:6px 0 0; letter-spacing:.2px;
  }
  .companion-line{color:var(--muted); margin:2px 0 14px; font-size:.98rem}
  .card{
    background:var(--card); border:1px solid var(--card-line); border-radius:20px;
    padding:20px; margin:0 0 14px; box-shadow:var(--shadow-card);
    font-size:16px; line-height:25px;
  }
  .card h2{font-family:var(--sans); font-size:1.3rem; margin:0 0 10px; font-weight:600}
  .card h3{font-size:1.02rem; margin:18px 0 6px; font-weight:700}
  .card h3:first-child{margin-top:0}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  .lede{font-size:1.06rem; line-height:1.55}
  .empty{color:var(--muted); font-style:italic}
  .field-label{font-weight:500; font-size:15px; margin:14px 0 6px}
  .field-label:first-child{margin-top:0}

  /* ---- buttons ---- */
  .btn{
    display:inline-block; border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
    padding:12px 24px; border-radius:999px; font-size:15px; font-weight:500; cursor:pointer; min-height:48px;
    font-family:inherit; transition:background var(--dur-press) var(--ease-std), border-color var(--dur-press) var(--ease-std);
  }
  .btn.secondary{background:var(--card); color:var(--ink); border-color:var(--card-line)}
  .btn.quiet{background:transparent; color:var(--muted); border-color:transparent}
  .btn.danger{background:var(--card); color:var(--danger); border-color:var(--danger)}
  .btn.small{padding:8px 14px; min-height:44px; font-size:14px}
  .btn.block{display:block; width:100%; text-align:center}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .btn:disabled{opacity:.5}

  /* ---- chips (options first, questions last): quiet outlined pills ---- */
  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .chip{
    border:1px solid var(--sage-line); background:transparent; color:var(--ink);
    padding:10px 16px; border-radius:999px; font-size:15px; font-weight:500; cursor:pointer;
    min-height:44px; font-family:var(--sans); text-align:left;
    transition:background var(--dur-press) var(--ease-std), border-color var(--dur-press) var(--ease-std), color var(--dur-press) var(--ease-std);
  }
  /* a selected chip is a sign: baby-blue fill, on-sign text
     (10.74:1 in both schemes — the fill never flips, so the
     text colour is pinned by --on-sign, not --ink) */
  .chip.on{background:var(--sign); border-color:var(--sign); color:var(--on-sign)}
  /* the alt selected chip: pale family wash, family ink
     (4.97:1 light / 8.05:1 dark — the solid family ink as a
     fill failed its own text in one scheme or the other) */
  .chip.alt.on{background:var(--amber-bg); border-color:var(--amber-ink); color:var(--amber-ink)}
  .chip small{display:block; font-size:.8125rem; opacity:.85; font-weight:400}

  /* ---- inputs ---- */
  textarea.big, input.txt, textarea.txt{
    width:100%; border:1px solid var(--card-line); border-radius:12px; background:var(--field);
    padding:12px 14px; font-size:17px; font-family:inherit; color:var(--ink);
  }
  textarea.big{min-height:16vh; line-height:1.55}
  textarea.short{min-height:9vh}

  /* ---- live companion: the typing bubble ---- */
  .tdots span{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--muted); opacity:.45; margin-right:5px;
  }
  .tdots span:last-child{margin-right:0}

  /* ---- persistent help button: the one saturated element in
     the room — CRIMSON #DC143C (v1.24, founder-named; the day
     photo's red field, the v1.23 poppy superseded), on its
     veil shelf. v1.27 (the founder: "Center the help button
     and Bigger so the separation is evident"): TOP-CENTER
     and bigger — 18px/700, min-height 56px, a deeper crimson
     shadow so it floats distinctly above the thread with
     clear air around it. One size at every width: the small
     -screen shrink is gone (it fought the call). The press
     keeps the centering transform as it dips. ---- */
  #helpBtn{
    position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:80;
    background:var(--help);
    color:#ffffff; border:1px solid rgba(255,255,255,.5); border-radius:999px;
    padding:14px 34px; font-size:1.125rem; font-weight:700; letter-spacing:.01em;
    cursor:pointer; min-height:56px; font-family:var(--sans);
    box-shadow:0 14px 34px rgba(220,20,60,.45), 0 4px 10px rgba(20,20,20,.28),
      inset 0 1px 0 rgba(255,255,255,.35);
  }
  #helpBtn:active{transform:translate(-50%, 2px); box-shadow:0 4px 12px rgba(220,20,60,.4)}

  .chip.big{font-size:1.05rem; padding:14px 18px}

  /* ---- the Hub (Home) ---- */
  .hub-top{padding:8px 2px 18px}
  .hub-opener{
    font-family:var(--sans); font-weight:600;
    font-size:1.85rem; line-height:1.32; margin:6px 0 12px;
  }
  .status-chips{display:flex; flex-wrap:wrap; gap:8px}
  .status-chips span{
    /* status badges are signs: baby-blue fill, on-sign text */
    background:var(--sign); color:var(--on-sign); border-radius:999px;
    padding:6px 13px; font-size:.84rem; font-weight:600;
  }
  .hero-card{
    border-radius:20px; padding:26px 22px 22px; margin:0 0 16px; cursor:pointer;
    /* the deep card: its own ground (--hero — near-black by
       day, deepest indigo by night), white text (18.42:1 day /
       19.51:1 night), label and main action signed in baby blue */
    background:var(--hero);
    color:#ffffff; box-shadow:0 14px 34px rgba(20,20,20,.28);
  }
  .hero-label{
    font-size:.8125rem; letter-spacing:.16em; text-transform:uppercase;
    font-weight:700; color:var(--sign);
  }
  .hero-line{
    font-family:var(--sans); font-size:1.5rem;
    line-height:1.35; margin:10px 0 20px;
  }
  .hero-main{
    display:block; width:100%; border:none; cursor:pointer; font-family:inherit;
    /* the hero's main action is a sign: baby-blue fill, on-sign text */
    background:var(--sign); color:var(--on-sign); font-weight:700; font-size:1.12rem;
    padding:16px 20px; border-radius:999px; min-height:58px;
    box-shadow:0 4px 14px rgba(20,20,20,.25);
  }
  .hero-quick{
    display:block; margin:12px auto 2px; background:transparent; color:#ffffff;
    border:1px solid rgba(255,255,255,.55); border-radius:999px;
    padding:10px 20px; font-family:inherit; font-size:.95rem; cursor:pointer;
    min-height:48px;
  }
  .hub-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:20px;
    padding:20px; margin:0 0 16px;
    box-shadow:var(--shadow-card);
    font-size:16px; line-height:25px;
  }
  .hub-card h2{font-family:var(--sans); font-size:1.28rem; margin:0 0 8px; font-weight:600}
  .hub-label{
    font-size:.8125rem; letter-spacing:.16em; text-transform:uppercase;
    /* a sign written as text: the readable deep blue of the
       baby-blue family (5.49:1 light / 9.34:1 dark on card) */
    color:var(--sign-deep); font-weight:700; margin:0 0 8px; font-family:var(--sans);
  }
  .hub-card .claim-text{font-size:1.08rem; line-height:1.45}

  /* ---- tallies (ported) ---- */
  .tally{display:flex; gap:14px; flex-wrap:wrap; margin:0 0 14px}
  .tally .pill{
    /* tally pills are signs: baby-blue fill, on-sign text */
    background:var(--sign); color:var(--on-sign); border-radius:999px; padding:8px 16px; font-size:.95rem;
  }
  .tally .pill b{font-size:1.15rem; margin-right:6px}

  /* ---- claims ledger (ported from the local product build) ---- */
  .ledger-entry{border-top:1px solid var(--card-line); padding:14px 0}
  .ledger-entry:first-of-type{border-top:none}
  .ledger-entry .claim-text{font-size:1.05rem}
  .ledger-outcome{
    background:var(--sign-soft); border-radius:10px; padding:10px 14px; margin-top:10px;
  }
  .kind-tag{
    /* a badge is a sign: baby-blue fill, on-sign text */
    display:inline-block; background:var(--sign); border:1px solid var(--sign);
    color:var(--on-sign); border-radius:999px; padding:1px 9px; font-size:.8125rem;
    margin-left:8px; vertical-align:middle; font-family:var(--sans);
  }

  /* ---- map pieces ---- */
  .piece-card{cursor:pointer}
  .piece-card:active{border-color:var(--sign-deep)}
  .piece-name{font-family:var(--sans); font-size:1.2rem; font-weight:600}
  .type-tag{
    /* a badge is a sign: baby-blue fill, on-sign text */
    display:inline-block; background:var(--sign); color:var(--on-sign);
    border-radius:999px; padding:1px 9px; font-size:.8125rem; margin-left:8px; vertical-align:middle;
    font-family:var(--sans);
  }
  .seeing-box{
    background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:10px;
    padding:10px 14px; margin:10px 0;
  }
  .seeing-box .lab{font-size:.8125rem; text-transform:uppercase; letter-spacing:.12em; color:var(--amber-ink); font-weight:700; font-family:var(--sans)}
  .mini-chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
  .mini-chips span{
    background:var(--field); border:1px solid var(--card-line); border-radius:999px;
    padding:2px 10px; font-size:.82rem;
  }

  /* ---- journal prompts ---- */
  .prompt-card{cursor:pointer; text-align:left; width:100%; font-family:var(--sans); font-size:1rem}
  .prompt-card:active{border-color:var(--sign-deep)}

  /* ---- help ladder ---- */
  .rung{border-left:5px solid var(--sign-deep); padding-left:14px; margin:18px 0}
  .rung.far{border-left-color:var(--help)}
  .rung h3{margin:0 0 4px}
  .hardday-note{
    font-family:var(--sans); font-size:1.15rem; background:var(--amber-bg);
    border:1px solid var(--amber-line); border-radius:10px; padding:14px 16px; margin:10px 0;
    white-space:pre-wrap;
  }
  .call-link{
    display:inline-block; margin:4px 8px 4px 0; padding:10px 16px; border-radius:999px;
    background:var(--accent); color:var(--on-accent); text-decoration:none; font-weight:600; min-height:44px;
    line-height:1.55;
  }
  .call-link.far{background:var(--help)}
  /* ---- help: three bars (v1.27) ----
     "instead of other words just have bar options" — the
     bars ARE the words: full-width, calm card surfaces with
     the baby-blue sign line across the top (the room cards'
     mark) and the label in the family's readable azure.
     Crimson stays on the Help button itself and on the true
     -emergency call links (.far) inside My People; the bars
     and their panels are calm. One bar opens at a time; its
     panel sits directly beneath it. */
  .helpbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; min-height:56px; margin:12px 0 0; padding:10px 18px;
    background-color:var(--card); color:var(--ink);
    background-image:linear-gradient(var(--sign), var(--sign));
    background-size:100% 3px; background-position:top left; background-repeat:no-repeat;
    border:1px solid var(--card-line); border-radius:16px;
    font-family:inherit; font-size:1.06rem; font-weight:600; text-align:left; cursor:pointer;
    box-shadow:var(--shadow-bubble);
    transition:border-color var(--dur-press) var(--ease-std), background-color var(--dur-press) var(--ease-std);
  }
  .helpbar:active{border-color:var(--sign-deep)}
  .helpbar.open{background-color:var(--room-bg); border-color:var(--sign-deep)}
  .helpbar-label{color:var(--sign-deep)}
  .helpbar-mark{
    color:var(--sign-deep); font-size:1.35rem; line-height:1; flex:none;
    transition:transform var(--dur-msg) var(--ease-std);
  }
  .helpbar.open .helpbar-mark{transform:rotate(90deg)}
  .helpbar-panel{padding:12px 6px 2px}
  /* the one quiet line under the bars */
  .arrange-row{text-align:center; margin:18px 0 2px}
  /* the room speaks on neutral gray, marked with a baby-blue
     sign edge: visibly not ordinary talk, without a tint wash */
  .room-line{
    font-family:var(--sans); font-size:1.08rem; line-height:1.55;
    background:var(--room-bg); border:1px solid var(--room-line);
    border-left:4px solid var(--sign);
    border-radius:12px; padding:12px 16px; margin:10px 0;
  }

  /* ---- misc ---- */
  .howto{background:var(--sign-soft); border-radius:10px; padding:10px 14px; font-size:.92rem; margin:0 0 14px}
  .offer-card{border-color:var(--amber-line); background:var(--amber-bg)}
  .divider{border:none; border-top:1px solid var(--card-line); margin:16px 0}
  .stepdots{color:var(--muted); font-size:.85rem; margin:0 0 10px}
  .quiet-screen{padding-top:12vh}
  .summary-list{margin:6px 0; padding-left:20px}
  .summary-list li{margin:3px 0}
  a.plain{color:var(--link)}
  .toast{
    background:var(--sign-soft); border:1px solid var(--sign-deep); color:var(--ink);
    border-radius:10px; padding:10px 14px; margin:0 0 14px; font-size:.95rem;
  }

  /* ---- the thread (Home is a conversation) ---- */
  /* bottom-anchored (v1.26, the founder: "the space between
     the last message and bottom bar should be close like
     yours is") — the column is a flex column justified to
     the END, with a min-height that fills the viewport
     between the wrap's top padding and its bottom
     padding: a short thread therefore sits DOWN
     against the composer, the empty space collecting at the
     top under the sky tint, and a long thread simply grows
     past the min-height and scrolls as before. The spacer
     below is sized with it (see .thread-spacer).
     v1.27: the wrap's paddings moved (top 88px for the
     bigger centered Help, bottom 20px for the tighter
     stance), so the constant follows: 88 + 20 = 108px. */
  .thread{
    display:flex; flex-direction:column; gap:16px; padding-top:4px;
    justify-content:flex-end;
    min-height:calc(100vh - 108px - env(safe-area-inset-top));
    min-height:calc(100dvh - 108px - env(safe-area-inset-top));
  }
  .msg{display:flex}
  .msg.me{justify-content:flex-end}
  /* incoming: the gray he likes (#F0F0F0) in the light scheme,
     indigo-gray #252E5E on the indigo in the dark (v1.23);
     one radius (20px) for every bubble —
     the message markup carries no grouped-run class, so the spec's
     6px grouped corner is not applied rather than faked */
  .msg .bubble{
    background:var(--bubble-in); border:1px solid var(--card-line); border-radius:20px;
    padding:10px 14px; max-width:78%; white-space:pre-wrap;
    font-size:17px; line-height:26px;
    box-shadow:var(--shadow-bubble);
  }
  /* v1.21: the serif is out of the UI entirely — every voice is
     sans; controls and attributions inside a bubble are pinned to
     the sans stack explicitly, as before */
  .msg .bubble .hub-label, .msg .bubble .chip, .msg .bubble .btn,
  .msg .bubble textarea, .msg .bubble input, .msg .bubble select,
  .msg .bubble .small, .msg .bubble .jtag, .msg .bubble .kind-tag,
  .msg .bubble .type-tag{font-family:var(--sans)}
  /* Outgoing: the PLUM VIOLET gradient (v1.24, founder's call —
     supersedes the room-green of v1.20–v1.23) — white on it
     measures 8.31:1 at the light stop, 12.41:1 at the deep stop
     by day (5.73:1 / 8.58:1 for the luminous night stops), and
     position + colour together encode "mine" (the redundant
     cue §7B.7 asks for). */
  .msg.me .bubble{
    background:var(--me-grad) var(--me);
    border-color:transparent; color:var(--me-ink);
    border-radius:20px; box-shadow:var(--shadow-me);
  }
  /* the room and the playlist sit on neutral gray — a different
     surface, so a glance tells them apart from ordinary talk —
     and carry a 3px BABY-BLUE sign line across the top (the
     welcome card's accent line, the playlist card's accent bar).
     A sign mark, never a surface under text. */
  .msg .bubble.room{
    background-color:var(--room-bg); border-color:var(--room-line);
    background-image:linear-gradient(90deg, var(--sign), var(--sign));
    background-size:100% 3px; background-position:top left;
    background-repeat:no-repeat;
    font-family:var(--sans); font-weight:500;
  }
  /* a journal prompt, quoted in the talk: sans, set apart by
     weight and the room's gray */
  .jprompt{font-family:var(--sans); font-size:1.08rem; font-weight:500}
  .msg .bubble .chiprow{margin-top:8px}
  .msg .bubble p{margin:0}
  /* the clearance under the last message: v1.26 set spacer
     56px + wrap bottom 30px for ~14px above the bar by
     structure — the founder's phone read it bigger: "The
     last message and bottom bar is not small enough."
     v1.27 tightens the stance by 42px — spacer 56 → 24 and
     the wrap's bottom padding 30 → 20 — landing the resting
     gap at one tight rhythm step (~8px), at rest and
     scrolled to the bottom alike. The composer's own
     safe-area inset is untouched. */
  .thread-spacer{height:24px}

  /* ---- the composer: one rounded bar on an elevated surface ---- */
  .composer{
    position:fixed; left:50%; transform:translateX(-50%); z-index:65;
    width:min(680px, 100%);
    bottom:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--paper) 0%, transparent), var(--paper) 42%);
  }
  /* v1.27: the row centers its contents — the founder: "I
     don't want pour hanging like that. Align it well." The
     textarea's one line and the two glyphs share one vertical
     center (see the textarea's tuned line below) */
  .composer-row{
    display:flex; gap:6px; align-items:center;
    background:var(--surface2); border:1px solid var(--card-line); border-radius:28px;
    padding:6px; box-shadow:var(--shadow-bar);
    transition:border-color var(--dur-press) var(--ease-std), box-shadow var(--dur-press) var(--ease-std);
  }
  /* the focus light (v1.24's home; v1.27's colour): the
     bright sky lives here — the send button's former home
     (there is no send button; Enter sends). The border
     tints sky with a soft sky glow outside it; a 1px
     azure hairline sits INSIDE the glow, because the sky
     alone measures 2.14:1 on white — the colour is the
     founder's, the hairline is legibility */
  .composer-row:focus-within{
    border-color:var(--send);
    box-shadow:var(--shadow-bar), inset 0 0 0 1px var(--accent),
      0 0 0 3px color-mix(in srgb, var(--send) 45%, transparent),
      0 0 18px color-mix(in srgb, var(--send) 30%, transparent);
  }
  .composer textarea{
    flex:1; border:none; background:transparent; border-radius:22px;
    /* one line, centered: a 24px line inside 12px of padding
       is exactly the 48px row — the words (and "Pour") sit on
       the same center as the glyphs; more lines still grow
       the field to the 120px cap */
    padding:12px; font-size:17px; font-family:inherit; color:var(--ink);
    min-height:48px; max-height:120px; resize:none; line-height:24px;
  }
  .composer textarea:focus{outline:none}
  .composer textarea::placeholder{color:var(--muted); opacity:.75}
  .composer .btn{min-height:48px; border-radius:999px}
  /* there is NO send button (v1.24, the founder's final word:
     "Actually yours doesn't have a send button. You can
     actually remove it. And incorporate the color somewhere
     else.") — Enter / the keyboard's send key sends, wired to
     the same sendThreadText the button used. Cornflower moved
     into the composer's focus light above and into Record's
     pressed tint below. */
  /* the Record control (v1.26): the founder restated the
     original instruction plainly — "Still has the word
     record." The word goes away: an icon-only microphone in
     a 48px ghost circle, like this chat app's mic. Its name
     lives in the aria-label alone; pressed, it still takes
     the sky tint — the colour's second home (cornflower in
     v1.24–26, the brighter sky from v1.27) */
  .composer .record-btn{
    width:48px; min-width:48px; padding:0; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border-color:transparent; color:var(--glyph);
    box-shadow:none;
  }
  .composer .record-btn svg{display:block}
  .composer .record-btn:active{
    background:color-mix(in srgb, var(--send) 20%, transparent);
    border-color:transparent; color:var(--ink);
  }
  /* the attach sign (v1.25, the founder's words: "add an
     attached sign. It doesn't have to be a +. You can try
     something else") — a PHOTO glyph: a small landscape in a
     rounded frame (mountains + a sun dot), not a plus, not a
     paperclip. A quiet ghost square at the composer's start;
     pressed, it takes the cornflower tint, like Record's */
  .composer .attach-btn{
    width:48px; min-width:48px; padding:0; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border-color:transparent; color:var(--glyph);
    box-shadow:none;
  }
  .composer .attach-btn:active{
    background:color-mix(in srgb, var(--send) 20%, transparent);
    border-color:transparent; color:var(--ink);
  }
  .composer .attach-btn svg{display:block}
  /* the attach menu (v1.26, the founder's screenshot of this
     chat app's sheet: "Add these same options on the
     attachment button") — a small card rising from the
     composer's start, above the bar: Camera / Photos /
     Videos / Files, an icon and a word to a row. The baby
     blue signs the sheet — a hairline across its top and the
     glyphs' colour — in both schemes */
  .attach-menu{
    position:absolute; left:12px; bottom:calc(100% - 6px); z-index:66;
    width:min(236px, calc(100vw - 24px)); padding:6px;
    background:var(--card); border:1px solid var(--card-line); border-radius:20px;
    box-shadow:var(--shadow-card);
    background-image:linear-gradient(90deg, var(--sign), var(--sign));
    background-size:100% 3px; background-position:top left; background-repeat:no-repeat;
  }
  .attach-menu[hidden]{display:none}
  .attach-option{
    display:flex; align-items:center; gap:12px; width:100%; min-height:48px;
    padding:10px 12px; border:none; border-radius:14px; background:transparent;
    color:var(--ink); font-family:var(--sans); font-size:16px; font-weight:500;
    text-align:left; cursor:pointer;
  }
  .attach-option:hover{background:var(--sign-soft)}
  .attach-option:active{background:color-mix(in srgb, var(--sign) 28%, transparent)}
  .attach-option:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .attach-option .attach-ico{display:inline-flex; flex:none; color:var(--sign-deep)}
  .attach-option .attach-ico svg{display:block}
  /* his photo in the thread: the image IS the message — the
     bubble keeps its 20px radius and 78% cap, a thin frame of
     plum around the picture */
  .msg .bubble.photo{padding:6px}
  .msg .bubble.photo img{display:block; max-width:100%; border-radius:14px}
  /* his attached video (v1.26): the same plum-framed media
     bubble family, the player inside it */
  .msg .bubble.video{padding:6px}
  .msg .bubble.video video{display:block; width:100%; border-radius:14px; background:#000}
  /* his attached file (v1.26): a card in the talk — the
     paperclip, the name he knows it by, its size */
  .msg .bubble.file{
    display:flex; align-items:center; gap:12px; white-space:normal;
  }
  .msg .bubble.file .file-ico{display:inline-flex; flex:none}
  .msg .bubble.file .file-ico svg{display:block}
  .msg .bubble.file .file-meta{display:flex; flex-direction:column; min-width:0; line-height:1.35}
  .msg .bubble.file .file-meta strong{overflow-wrap:anywhere}
  .msg .bubble.file .file-meta small{opacity:.85}
  .jmedia{width:100%; margin:6px 0; border-radius:12px}
  video.jmedia{max-height:340px; background:#000}
  /* an attached file on the day's page: a plum-tinted card
     that opens/downloads the kept bytes */
  .jfile{
    display:flex; align-items:center; gap:12px; margin:6px 0;
    padding:12px 14px; border-radius:12px; text-decoration:none;
    background:color-mix(in srgb, var(--me) 13%, var(--card));
    border:1px solid color-mix(in srgb, var(--me) 38%, var(--card-line));
    color:var(--ink);
  }
  .jfile .file-ico{display:inline-flex; flex:none; color:var(--me)}
  .jfile .file-meta{display:flex; flex-direction:column; min-width:0; line-height:1.35}
  .jfile .file-meta strong{overflow-wrap:anywhere}
  .jfile .file-meta small{color:var(--muted)}
  .record-dot{color:var(--help); font-weight:700}
  /* ---- the dynamic journal ---- */
  .jitem{border-top:1px solid var(--card-line); padding:12px 0}
  .jitem:first-of-type{border-top:none}
  .jtag{font-size:.8125rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0 0 4px; font-family:var(--sans)}
  .jwords{white-space:pre-wrap; font-size:1.06rem; line-height:1.53; margin:4px 0}
  .jblock{margin-top:14px}
  .jhidden{opacity:.55}
  .msg .bubble.wide{max-width:94%}
  .cardblock{border-top:1px solid var(--card-line); padding-top:10px; margin-top:10px}
  .cardblock:first-child{border-top:none; padding-top:0; margin-top:0}

  /* ---- motion: tokenised and calm — no bounce, no shimmer, no
     loops anywhere in the product. A new turn settles in 180ms on
     the emphasized decelerate; cards take 280ms (inside the spec's
     240–300 band); exits run at 75% of their enter (--dur-exit —
     defined for the token system; the app has no exit animations).
     Nothing exceeds the 400ms ceiling. ---- */
  @keyframes msg-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @keyframes msg-fade{from{opacity:0} to{opacity:1}}
  .msg{animation:msg-in var(--dur-msg) var(--ease-out)}
  .card, .hero-card, .hub-card{animation:msg-in var(--dur-card) var(--ease-out)}
  @media (prefers-reduced-motion: reduce){
    /* crossfade only, ≤100ms, no travel */
    .msg, .card, .hero-card, .hub-card{animation:msg-fade .1s ease-out}
    *{transition-duration:.1s !important}
  }
</style>

<body>
<button id="helpBtn" type="button" aria-label="Help">Help</button>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
"use strict";
/* =====================================================================
   Ever Present v1.7 — single-file web app.
   The interface is a conversation, full stop: one thread, one
   composer, and the Help button. The companion brings the journal,
   the map, the receipts and the settings into the talk as cards.
   v1.7 adds an optional live voice: with the person's own API key
   (kept only on this device), a model does the talking back while
   the code keeps the record — filing, figuring, doors, cards —
   exactly as before. The model never files or changes anything.
   v1.9 puts the knowledge base to work: it rides in the live
   packet so the companion can draw on the research at the moment,
   it can answer a matching message directly in rule-based mode,
   and a floor of day-shape facts means ordinary talk always has
   something true organizing it. Feedback stops waiting for the
   crude matchers to hit.
   ===================================================================== */

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function el(id){ return document.getElementById(id); }
function fmtDate(ts){ /* ported from the local product build (ledgerFmt) */
  var d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})
    + ", " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function relDay(ts){
  var now = new Date(); var d = new Date(ts);
  var startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var startD = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var days = Math.round((startNow - startD) / 86400000);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 7) return "last " + d.toLocaleDateString(undefined,{weekday:"long"});
  return "on " + d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function uniqPush(arr, val){ if(val && arr.indexOf(val) === -1) arr.push(val); return arr; }

/* ================= stores (localStorage) =================
   Ledger keeps the ported key ever_present_ledger_v1 for continuity
   with the local product build; all v1 stores use ever_present_v1_*.
   Erase-all sweeps every key beginning with "ever_present". */
var K = {
  companion: "ever_present_v1_companion",
  atlas:     "ever_present_v1_atlas",
  journal:   "ever_present_v1_journal",
  ladder:    "ever_present_v1_ladder",
  ledger:    "ever_present_ledger_v1",
  thread:    "ever_present_v1_thread",
  djournal:  "ever_present_v1_djournal",
  liveai:    "ever_present_v1_liveai",
  connections: "ever_present_v1_connections",
  playlist:  "ever_present_v1_playlist",
  media:     "ever_present_v1_media"
};
function storeLoad(key, blank){
  try{
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : blank();
  }catch(e){ return blank(); }
}
function storeSave(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function companionBlank(){ return null; }
function atlasBlank(){ return {pieces:[], events:[], glossary:[]}; }
function journalBlank(){ return {entries:[]}; }
function ladderBlank(){ return {noteForHardDay:"", contacts:[], clinician:{name:"", phone:""}, roomIdx:-1}; }
function ledgerBlank(){ return {entries:[]}; } /* ported shape */
function djournalBlank(){ return {corrections:{}, hidden:{}, dayFig:{}, precedents:{}, knowledgeDays:{}}; }

/* ================= self-recording storage (v1.17) =================
   The clips themselves — audio/video blobs — live in IndexedDB
   (db "ever_present_media", store "clips"); only their metadata
   (id, kind, told time, label, length) rides in localStorage, so
   the day's page can lay them out and the export can carry the
   index without carrying a single byte of media. Every operation
   degrades gracefully: no IndexedDB (an old browser, a test rig)
   means the metadata path still works and the clips simply have
   no bytes behind them yet. Capture itself sits behind
   EPMedia.capture, so the whole flow around it is testable. */
var EPMEDIA_DB = "ever_present_media";
var EPMEDIA_STORE = "clips";
var _epMediaDbPromise = null;
var EPMedia = {
  available: function(){ return typeof indexedDB !== "undefined"; },
  open: function(){
    if(!EPMedia.available()) return Promise.reject(new Error("IndexedDB is not available"));
    if(_epMediaDbPromise) return _epMediaDbPromise;
    _epMediaDbPromise = new Promise(function(resolve, reject){
      var req;
      try{ req = indexedDB.open(EPMEDIA_DB, 1); }catch(e){ reject(e); return; }
      req.onupgradeneeded = function(){
        if(!req.result.objectStoreNames.contains(EPMEDIA_STORE))
          req.result.createObjectStore(EPMEDIA_STORE, {keyPath:"id"});
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
      req.onblocked = function(){ reject(new Error("IndexedDB open blocked")); };
    });
    return _epMediaDbPromise;
  },
  _request: function(mode, makeReq){
    if(!EPMedia.available()) return Promise.resolve(null);
    return EPMedia.open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(EPMEDIA_STORE, mode);
        var req;
        try{ req = makeReq(tx.objectStore(EPMEDIA_STORE)); }catch(e){ reject(e); return; }
        if(!req){ resolve(null); return; }
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return null; });
  },
  put: function(record, blob){
    var rec = {id:record.id, kind:record.kind, mime:record.mime || (blob && blob.type) || "",
               ts:record.ts, label:record.label || "", blob:blob};
    return EPMedia._request("readwrite", function(store){ return store.put(rec); })
      .then(function(){ return !!EPMedia.available(); });
  },
  get: function(id){
    return EPMedia._request("readonly", function(store){ return store.get(id); })
      .then(function(rec){ return rec || null; });
  },
  remove: function(id){
    return EPMedia._request("readwrite", function(store){ return store.delete(id); })
      .then(function(){ return !!EPMedia.available(); });
  },
  clear: function(){
    return EPMedia._request("readwrite", function(store){ return store.clear(); })
      .then(function(){ return !!EPMedia.available(); });
  },
  setLabel: function(id, label){
    return EPMedia.get(id).then(function(rec){
      if(!rec) return false;
      rec.label = label;
      return EPMedia._request("readwrite", function(store){ return store.put(rec); })
        .then(function(){ return true; });
    });
  },
  capture: function(kind){ return startMediaCapture(kind); }
};
function pickMediaMime(kind){
  if(typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
  var opts = kind === "video"
    ? ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]
    : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for(var i=0;i<opts.length;i++) if(MediaRecorder.isTypeSupported(opts[i])) return opts[i];
  return "";
}
/* startMediaCapture resolves a session: {kind, stop() -> Promise
   of {blob, mime, kind, seconds}, discard()}. A denial anywhere
   along the way rejects, and the card answers with one plain line. */
function startMediaCapture(kind){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia
     || typeof MediaRecorder === "undefined")
    return Promise.reject(new Error("media capture is not available"));
  var constraints = kind === "video" ? {audio:true, video:true} : {audio:true};
  return navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    var mime = pickMediaMime(kind);
    var rec = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
    var chunks = [];
    var startedAt = Date.now();
    var settled = false;
    rec.addEventListener("dataavailable", function(ev){
      if(ev.data && ev.data.size) chunks.push(ev.data);
    });
    function stopTracks(){ stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }
    var session = {
      kind: kind,
      mime: rec.mimeType || mime || "",
      startedAt: startedAt,
      stop: function(){
        return new Promise(function(resolve, reject){
          if(settled){ reject(new Error("already stopped")); return; }
          settled = true;
          rec.addEventListener("stop", function(){
            stopTracks();
            var type = session.mime || (kind === "video" ? "video/webm" : "audio/webm");
            var blob = new Blob(chunks, {type:type});
            resolve({blob:blob, mime:blob.type || type, kind:kind,
                     seconds:Math.max(1, Math.round((Date.now() - startedAt) / 1000))});
          }, {once:true});
          try{ rec.stop(); }catch(e){ stopTracks(); reject(e); }
        });
      },
      discard: function(){
        if(settled) return;
        settled = true;
        try{ rec.stop(); }catch(e){}
        stopTracks();
      }
    };
    rec.start(250);
    return session;
  });
}

/* ================= shared lookups ================= */
function pieceById(id){
  for(var i=0;i<atlas.pieces.length;i++) if(atlas.pieces[i].id === id) return atlas.pieces[i];
  return null;
}
function pieceName(id){ var p = pieceById(id); return p ? p.name : ""; }
function openClaims(){ return ledger.entries.filter(function(e){ return !isChecked(e); }); }
function isChecked(e){
  if(e.outcome && e.outcome.trim()) return true;
  return e.outcomeChip === "happened" || e.outcomeChip === "didnt" || e.outcomeChip === "partly";
}
function heldUp(e){ return e.outcomeChip === "happened" || e.outcomeChip === "partly"; }
var KIND_LABELS = {
  prediction:"Prediction",
  now:"Claim about right now",
  commentary:"Running commentary",
  announcement:"Announcement",
  instruction:"Instruction"
};
function outcomeLabel(e){
  var parts = [];
  if(e.outcomeChip === "happened") parts.push("It happened");
  if(e.outcomeChip === "didnt") parts.push("It didn\u2019t happen");
  if(e.outcomeChip === "partly") parts.push("Partly");
  if(e.outcome) parts.push(e.outcome);
  return parts.join(" \u2014 ");
}
/* receipts tallies for one voice (by piece id or exact name) */
function receiptsForPiece(p){
  var mine = ledger.entries.filter(function(e){
    return (e.whoId && e.whoId === p.id) || (e.who && e.who === p.name);
  });
  var checked = mine.filter(isChecked);
  return {
    total: mine.length,
    checked: checked.length,
    open: mine.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function allReceiptTallies(){
  var checked = ledger.entries.filter(isChecked);
  return {
    total: ledger.entries.length,
    checked: checked.length,
    open: ledger.entries.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function learnedBodySpots(){
  var spots = [];
  atlas.events.forEach(function(ev){ (ev.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  atlas.pieces.forEach(function(p){ (p.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  return spots;
}

  else if(view === "create"){ v.innerHTML = h + viewCreate(); bindCreate(); }

}

function greetingWord(){
  var hr = new Date().getHours();
  if(hr < 5) return "Up late";
  if(hr < 12) return "Morning";
  if(hr < 18) return "Afternoon";
  return "Evening";
}
function daysSince(ts){
  var now = new Date(); var d = new Date(ts);
  var startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var startD = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return Math.round((startNow - startD) / 86400000);
}
/* The companion speaks first, from the person's own record. Candidates are
   gathered from what is actually in the record; one is picked per day so
   the greeting is stable within a day and varies across days. */
function companionOpener(){
  var cands = [];
  var evs = atlas.events.slice().sort(function(a,b){ return b.ts - a.ts; });
  /* the most recent piece in the record */
  for(var i=0;i<evs.length;i++){
    var ids = evs[i].whoIds || [];
    if(ids.length){
      var p0 = pieceById(ids[0]);
      if(p0){ cands.push(p0.name + " was around " + relDay(evs[i].ts) + ". It\u2019s in your record."); break; }
    }
  }
  /* an open claim, waiting on its outcome */
  var open = openClaims();
  if(open.length === 1){

      (ev.register || []).join(" "), ev.seeing || "");

    var claimId = uid();

      kept.kind = m.kind;

      if(srcEv2){
        kept.ts = srcEv2.ts;
        if(srcEv2.timeUnknown){ kept.timeUnknown = true; kept.toldTs = srcEv2.toldTs || srcEv2.ts; delete kept.remembered; }
        else if(srcEv2.remembered){ kept.remembered = true; kept.toldTs = srcEv2.toldTs || srcEv2.ts; delete kept.timeUnknown; }
        else { delete kept.timeUnknown; delete kept.remembered; delete kept.toldTs; }

    var lastEv2 = evs[evs.length - 1];

}

/* the line itself, in the person's vibe. Firsts stay plain in every
   vibe — a first that touches the body or a new channel is not a
   place for levity. Facts only: the line audits the record and the
   voices' pattern, never the person. */
function fbLine(kind, d){
  var v = vibeOf();
  if(kind === "recurrence"){
    if(v === "straight") return ordinal(d.n) + " " + d.kindShort + " from " + d.name + " this week.";
    if(v === "humor") return d.name + " again — the " + ordinal(d.n) + " " + d.kindShort + " this week.";
    return "That’s the " + ordinal(d.n) + " " + d.kindShort + " from " + d.name + " this week.";
  }
  if(kind === "pieceweek"){
    if(v === "straight") return d.name + ": " + d.n + " moments this week.";
    if(v === "humor") return d.name + " again — " + d.n + " moments this week.";
    return d.name + "’s been in " + d.n + " moments this week.";
  }
  if(kind === "firstpiece") return "First time " + d.name + "’s come up in the talk.";
  if(kind === "firstclaim"){
    if(v === "straight") return d.name + "’s first " + (KIND_SHORT[d.claimKind] || "claim") + " I’ve heard from them.";
    return "That’s " + d.name + "’s first " + (KIND_SHORT[d.claimKind] || "claim") + " I’ve heard from them.";
  }
  if(kind === "firstchan") return "First time " + d.name + "’s come through as " + d.chan + " — it’s on the map now.";
  if(kind === "firstreg") return "First " + d.reg + " register for " + d.name + " — it’s on the map now.";
  if(kind === "move"){
    if(v === "straight") return "Move #" + d.n + " in your record.";
    if(v === "humor") return "Move #" + d.n + ". Your record’s on your side.";
    return "That’s move #" + d.n + " in your record.";
  }
  return "";
}
function noticedSuppressed(){ return vibeOf() === "asked"; }
function postNoticed(fb){
  if(!fb || !fb.line) return null;
  return pushMsg({type:"companion", noticed:true, fbKind:fb.kind, text:fb.line});
}
function queueOrgNote(line){
  if(!line) return;
  if(thread.orgNotes.indexOf(line) === -1) thread.orgNotes.push(line);
  while(thread.orgNotes.length > 6) thread.orgNotes.shift();
  saveThread();

/* facts about THIS message, computed from the stores after its event
   filed. Returns {kind, line} or null. Firsts outrank recurrence:
   a piece's first appearance can't also be a recurrence. */
function computeNoticed(ev, text){
  if(noticedSuppressed()) return null;
  var mentioned = piecesMentionedIn(text);
  if(!mentioned.length) return null;
  var p = mentioned[0];
  var now = Date.now(), WEEK = 7 * 86400000;
  var priorAny = atlas.events.some(function(e2){ return e2.id !== ev.id && eventTouchesPiece(e2, p); });
  var ledgerAny = ledger.entries.some(function(e2){ return entryMatchesPiece(e2, p); });
  if(!priorAny && !ledgerAny){
    return {kind:"firstpiece", line:fbLine("firstpiece", {name:p.name})};
  }
  if(!CLAIM_PAT.test(text || "")){
    if(ev.timeUnknown) return null; /* flashes count all-time, never in a dated window */
    var anchor = ev.ts || now;
    var n = 0;
    atlas.events.forEach(function(e2){
      if(e2.id !== ev.id && !e2.timeUnknown && e2.ts >= anchor - WEEK && e2.ts <= anchor && eventTouchesPiece(e2, p)) n++;
    });
    n += 1; /* this message itself — the piece was mentioned in it,
               by name or by its glossary term */
    if(n >= 2) return {kind:"pieceweek", line:fbLine("pieceweek", {name:p.name, n:n})};
  }
  return null;
}
/* feedback at a claim's filing: recurrence of the same piece + same
   kind in the last 7 days — counted INCLUDING this claim, so two
   priors plus this one reads "the 3rd" — or the piece's first claim
   ever. Runs only when no precedent fired (precedent outranks). */
function postClaimFeedback(entry){
  if(noticedSuppressed() || !entry) return;
  var p = entry.whoId ? pieceById(entry.whoId) : null;
  if(!p && entry.who){
    atlas.pieces.forEach(function(x){ if(x.name === entry.who) p = x; });
  }
  if(!p) return;
  var mine = ledger.entries.filter(function(e){ return entryMatchesPiece(e, p); });
  if(mine.length === 1){
    postNoticed({kind:"firstclaim", line:fbLine("firstclaim", {name:p.name, claimKind:entry.kind})});
    return;
  }
  if(entry.timeUnknown) return; /* a flash counts all-time (above), never in a dated window */
  var end = entry.ts || Date.now(), WEEK = 7 * 86400000;
  var n = mine.filter(function(e){ return !e.timeUnknown && e.kind === entry.kind && e.ts >= end - WEEK && e.ts <= end; }).length;
  if(n >= 2){
    postNoticed({kind:"recurrence", line:fbLine("recurrence",
      {name:p.name, n:n, kindShort:KIND_SHORT[entry.kind] || "claim"})});
  }
}
/* every claim filing runs through here: the precedent is the
   feedback when it fires; otherwise the filing's own facts speak */
function afterClaimFiled(entry){
  var prec = maybePostPrecedent(entry);
  if(!prec) postClaimFeedback(entry);
  /* a remembered or flash claim's moment is already past — its
     outcome can be answered right away, through the same receipt
     card every open claim uses */
  if(entry && (entry.remembered || entry.timeUnknown) && !isChecked(entry)){
    pushMsg({type:"receipt", claimId:entry.id});
  }
}
function moveCount(){
  return ledger.entries.filter(function(e){ return e.move && e.move.trim(); }).length;
}
function postMoveMomentum(){
  if(noticedSuppressed()) return;
  var n = moveCount();
  if(n >= 1) postNoticed({kind:"move", line:fbLine("move", {n:n})});
}
/* ---- the feedback floor: day-shape facts (v1.9) ----
   Ordinary talk often matches no piece and no claim pattern — and
   before v1.9 that meant silence, which the founder felt as "no
   feedback yet." These facts are computed from the stores on EVERY
   exchange, match or no match: what is in the record today, what
   is still open, the moves on record, when the last move landed.
   In live mode they ride in the packet's ORGANIZING NOTES every
   time, so the companion always has something true to build on.
   In rule-based mode they post as a line only when nothing else
   computed for the message, and at most once a day — a light
   touch, never a running commentary on the person. */
function lastMoveTs(){
  var t = 0;
  ledger.entries.forEach(function(e){
    if(e.move && e.move.trim()){
      var et = e.tsOutcome || e.ts || 0;
      if(et > t) t = et;
    }
  });
  return t;
}
function dayShapeFacts(){
  var now = Date.now(), tk = dayKeyOf(now), out = [];
  var todayN = 0;
  atlas.events.forEach(function(ev){ if(dayKeyOf(ev.ts) === tk) todayN++; });
  if(todayN) out.push(todayN + (todayN === 1 ? " thing" : " things") + " in your record today");
  var open = openClaims().length;
  if(open) out.push(open + (open === 1 ? " claim" : " claims") + " still open");
  var mv = moveCount();
  if(mv) out.push(mv + (mv === 1 ? " move" : " moves") + " in your record");
  var lm = lastMoveTs();
  if(lm){
    var d = Math.floor((now - lm) / 86400000);
    if(d >= 1) out.push("the last move was " + d + (d === 1 ? " day" : " days") + " ago");
    else out.push("a move landed today");
  }
  return out;
}
function dayShapeFb(){
  if(noticedSuppressed()) return null;
  var tk = dayKeyOf(Date.now());
  if(thread.dayShapeDay === tk) return null; /* the floor speaks once a day */
  var facts = dayShapeFacts();
  if(!facts.length) return null;
  var line = facts.slice(0, 3).join(". ") + ".";
  line = line.charAt(0).toUpperCase() + line.slice(1);
  return {kind:"dayshape", line:line};
}
/* firsts inside a detail filing (Add detail): a channel or register
   this piece has never come through, figured from cap BEFORE
   fileCapture applies the tallies. Plain in every vibe. */
function computeCaptureFirsts(){
  if(noticedSuppressed() || !cap) return null;
  var ids = (cap.whoIds || []).filter(function(id){ return pieceById(id); });
  var i, j, p;
  for(i = 0; i < ids.length; i++){
    p = pieceById(ids[i]);
    var chans = cap.channels || [];
    for(j = 0; j < chans.length; j++){
      if(!(p.channels && p.channels[chans[j]])){
        var c = chans[j];
        return {kind:"firstchan", line:fbLine("firstchan",
          {name:p.name, chan:c.charAt(0).toLowerCase() + c.slice(1)})};
      }
    }
  }
  for(i = 0; i < ids.length; i++){
    p = pieceById(ids[i]);
    var regs = cap.register || [];
    for(j = 0; j < regs.length; j++){
      if(!(p.registers && p.registers[regs[j]])){
        var r = String(regs[j]).split(" — ")[0];
        return {kind:"firstreg", line:fbLine("firstreg",
          {name:p.name, reg:r.charAt(0).toLowerCase() + r.slice(1)})};
      }
    }
  }
  return null;
}
function ensureThread(){
  if(!bootTypingSwept){
    /* a typing bubble can only be live inside one session; one found
       in the store at boot is stale — the call it belonged to is gone */
    bootTypingSwept = true;
    if(thread.messages.some(function(m){ return m.type === "typing"; })){
      thread.messages = thread.messages.filter(function(m){ return m.type !== "typing"; });
      saveThread();
    }
  }
  var today = Math.floor(Date.now() / 86400000);
  if(!thread.messages.length){
    /* the companion speaks first and carries the opening — a new
       person is never faced with an empty thread (v1.12) */
    sessionOpenerId = pushMsg({type:"companion", text:greetingText()}).id;
    var metArrival = thread.proofDue && !thread.roomShown;
    if(thread.proofDue && !thread.roomShown){
      /* the arrival law: the showing comes with the saying — the
         room itself first, then the not-alone line, never the
         claim alone; then the standing job, finding your first */
      pushMsg({type:"roomproof", lines:roomProofLines()});
      pushMsg({type:"companion", notAlone:true, text:notAloneLine()});
      pushMsg({type:"companion", findingFirst:true, text:findingFirstText()});
      thread.roomShown = true;
      thread.proofDue = false;
    } else {
      pushMsg({type:"companion", notAlone:true, text:notAloneLine()});
    }
    pushMsg(offerMsg(true));
    /* the playlist starts as soon as possible (v1.13): the seed is
       planted inside this first greeting, after the opening settles —
       but only when arrival was met in person; a record that simply
       appears gets the same door later, as a calm daily surface */
    if(metArrival) postPlaylistSeed();
    thread.lastDay = today;
    thread.surfaceDay = today;
    thread.v16note = true; /* a brand-new thread is not an upgrade — no note owed */
    saveThread();
    bootInterruptChecked = true;
    maybePostInterruption();
    return;
  }
  if(!thread.v16note){
    /* first run after the v1.6 upgrade: the companion says what changed, once */
    thread.v16note = true;
    pushMsg({type:"companion", text:"It’s just us talking now. Everything else, I’ll bring to you."});
    saveThread();
  }
  if(thread.lastDay < today){
    sessionOpenerId = pushMsg({type:"companion", text:greetingText()}).id;
    thread.lastDay = today;
    bootInterruptChecked = true;
    var didInt = maybePostInterruption();
    if(thread.surfaceDay < today){
      if(!didInt) postDailySurface();
      thread.surfaceDay = today;
    }
    saveThread();
  }
  if(!bootInterruptChecked){
    bootInterruptChecked = true;
    maybePostInterruption();
  }
  /* a pour run left hanging across a pause gets its proposals on this open */
  var run = thread.pendingPour;
  if(run && run.ids && run.ids.length && (Date.now() - run.lastTs) > POUR_PAUSE_MS) flushPendingPour();
  maybeOfferCreation();
}
/* ---- creation, offered later (v1.12) ----
   A person who began by just talking runs the whole app with an
   unnamed companion. Creation is offered conversationally — once
   they have talked a while (three of their own messages in) or on
   a later day than the one they began — as a small card in the
   thread: dismissible, never blocking, at most once a day, and
   never again once a companion exists. Making it theirs later
   touches nothing in the record or the thread. */
function maybeOfferCreation(){
  if(companion) return;
  if(!thread.messages.length) return;
  var todayKey = dayKeyOf(Date.now());
  if(thread.createOfferDay === todayKey) return;
  var personN = 0, firstDay = "";
  for(var i=0;i<thread.messages.length;i++){
    var m = thread.messages[i];
    if(m.type === "createoffer" && !m.dismissed) return; /* one live offer at a time */
    if(m.type === "person"){ personN++; if(!firstDay) firstDay = dayKeyOf(m.ts); }
  }
  if(!personN) return;
  if(personN < 3 && !(firstDay && todayKey > firstDay)) return;
  thread.createOfferDay = todayKey;
  pushMsg({type:"createoffer", dismissed:false});
  saveThread();
}

/* the welcome greeting (v1.16): hello, one line from the room,
   the playlist standing beside it — doors as chips on the one
   message; once a door is answered the words stay, the chips rest */
function welcomeHTML(m){
  var h = '<div class="msg them"><div class="bubble room"><p class="hub-label">Welcome</p>'
    + '<p style="margin:4px 0">'+esc(m.text)+'</p>';
  if(m.roomLine) h += '<p style="margin:4px 0"><span class="muted small">From the room:</span> '+esc(m.roomLine)+'</p>';
  if(m.playlistLine) h += '<p style="margin:4px 0">'+esc(m.playlistLine)+'</p>';
  if(!m.dismissed && m.plState === "seed"){
    h += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':seedstart">Start my playlist</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':seedlater">Later</button></div>';

/* ---- self-recording, in the talk (v1.17) ----
   Recording himself is a way of talking, so it lives here: a
   small affordance in the composer and a card in the thread —
   never an app mode. A recording is received, never analyzed,
   never transcribed; it lands on today's page under the name
   he gives it, and nowhere else. */
var MEDIA_DENIED_LINE = "The mic/camera is off for this page — your phone's site settings can turn it on. Nothing was recorded.";
var MEDIA_LABELS = ["Crying", "Laughing", "Dancing", "Singing", "Just me"];
var MEDIA_MAX_SECONDS = 600; /* ten minutes */
var mediaSession = null; /* {msgId, kind, session, startedAt, stopping} — live only, never stored */
var mediaTimer = null;
var mediaURLCache = {};
function fmtDuration(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
}
function postRecordCard(){
  if(mediaSession) return; /* a recording is already running — its card is the door */
  for(var i=0;i<thread.messages.length;i++){
    var old = thread.messages[i];
    if(old.type === "recordcard" && !old.dismissed && old.stage === "choose") return;
  }
  pushMsg({type:"recordcard", stage:"choose", kind:"", startedAt:0, clipId:"", error:"", capNote:"", dismissed:false});
}
function recordCardHTML(m){
  if(m.dismissed) return "";
  var h = '<div class="msg them"><div class="bubble"><p class="hub-label">Record yourself</p>';
  if(m.stage === "recording"){
    var el = Math.min(MEDIA_MAX_SECONDS, Math.floor((Date.now() - (m.startedAt || Date.now())) / 1000));
    h += '<p style="margin:4px 0"><span class="record-dot">●</span> Recording… <span data-record-elapsed="'+m.id+'">'+fmtDuration(el)+'</span></p>'
      + (m.kind === "video" ? '<p class="small muted" style="margin:4px 0">Video — you, as you are.</p>' : '<p class="small muted" style="margin:4px 0">Voice — you, as you are.</p>')
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':recdone">Done</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':recdiscard">Discard</button></div>';
  } else if(m.stage === "starting" || m.stage === "saving"){
    h += '<p style="margin:4px 0">'+(m.stage === "starting" ? "Getting the mic/camera ready…" : "Keeping it…")+'</p>';
  } else if(m.stage === "error"){
    h += '<p style="margin:4px 0">'+esc(m.error || MEDIA_DENIED_LINE)+'</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':reccancel">Close</button></div>';
  } else {
    h += '<p style="margin:4px 0">Your voice, or your body — crying, laughing, dancing, whatever is true. It stays on this phone, on today’s page, under your name for it.</p>'
      + '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':recvoice">Voice</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':recvideo">Video</button>'
      + '<button type="button" class="chip" data-tchip="'+m.id+':reccancel">Cancel</button></div>';
  }
  return h + '</div></div>';
}
function recordLabelHTML(m){
  if(m.done){
    return '<div class="msg them"><div class="bubble"><p class="muted small">Your recording'
      + (m.label ? ' — kept as &ldquo;'+esc(m.label)+'&rdquo;' : '') + '.</p></div></div>';
  }
  var chips = MEDIA_LABELS.map(function(lab, i){
    return '<button type="button" class="chip" data-tchip="'+m.id+':medialabel:'+i+'">'+esc(lab)+'</button>';
  }).join("");
  chips += '<button type="button" class="chip" data-tchip="'+m.id+':mediaown">In my words</button>'
    + '<button type="button" class="chip" data-tchip="'+m.id+':medianone">No label</button>';
  return '<div class="msg them"><div class="bubble"><p class="hub-label">Your recording</p>'
    + '<p style="margin:4px 0">What is this one?</p>'
    + '<div class="chiprow">'+chips+'</div></div></div>';
}
function stopMediaTimer(){
  if(mediaTimer){ clearInterval(mediaTimer); mediaTimer = null; }
}
function startMediaTimer(m){
  stopMediaTimer();
  mediaTimer = setInterval(function(){
    var s = Math.floor((Date.now() - (m.startedAt || Date.now())) / 1000);
    var nodes = document.querySelectorAll('[data-record-elapsed="'+m.id+'"]');
    nodes.forEach(function(n){ n.textContent = fmtDuration(Math.min(MEDIA_MAX_SECONDS, s)); });
    if(s >= MEDIA_MAX_SECONDS) stopMediaRecording(m, true);
  }, 500);
}
function startMediaRecording(m, kind){
  if(mediaSession) return;
  m.stage = "starting"; m.kind = kind; m.error = ""; saveThread(); render();
  var capResult;
  try{ capResult = EPMedia.capture(kind); }catch(e){ capResult = Promise.reject(e); }
  Promise.resolve(capResult).then(function(session){
    if(m.dismissed){ if(session && typeof session.discard === "function") session.discard(); return; }
    if(session && session.blob && typeof session.stop !== "function"){
      finalizeMediaResult(m, kind, session); /* a capture that hands back the clip itself */
      return;
    }
    if(!session || typeof session.stop !== "function") throw new Error("capture unavailable");
    mediaSession = {msgId:m.id, kind:kind, session:session, startedAt:Date.now(), stopping:false};
    m.stage = "recording"; m.startedAt = mediaSession.startedAt; saveThread();
    render();
    startMediaTimer(m);
  }).catch(function(){
    m.stage = "error"; m.error = MEDIA_DENIED_LINE; saveThread(); render();
  });
}
function stopMediaRecording(m, capped){
  if(!mediaSession || mediaSession.msgId !== m.id || mediaSession.stopping) return;
  mediaSession.stopping = true;
  stopMediaTimer();
  if(capped) m.capNote = "That reached ten minutes, so it stopped there.";
  m.stage = "saving"; saveThread(); render();
  var session = mediaSession.session;
  mediaSession = null;
  var stopped;
  try{ stopped = session.stop(); }catch(e){ stopped = Promise.reject(e); }
  Promise.resolve(stopped).then(function(result){
    finalizeMediaResult(m, m.kind, result || {});
  }).catch(function(){
    m.stage = "error"; m.error = MEDIA_DENIED_LINE; saveThread(); render();
  });
}
function discardMediaRecording(m){
  if(mediaSession && mediaSession.msgId === m.id){
    try{ mediaSession.session.discard(); }catch(e){}
    mediaSession = null;
  }
  stopMediaTimer();
  m.dismissed = true; saveThread(); render();
}
function finalizeMediaResult(m, kind, result){
  var clip = {id:uid(), kind:kind, ts:Date.now(), label:"",
              seconds:Math.max(1, Math.round(result.seconds || 1))};
  media.clips.push(clip);
  saveMedia();
  if(result.blob){
    var rec = {id:clip.id, kind:kind, mime:result.mime || result.blob.type || "", ts:clip.ts, label:""};
    try{
      var p = EPMedia.put(rec, result.blob);
      if(p && typeof p.catch === "function") p.catch(function(){});
    }catch(e){}
  }
  m.stage = "done"; m.clipId = clip.id; m.dismissed = true; saveThread();
  if(m.capNote) pushMsg({type:"companion", text:m.capNote});
  pushMsg({type:"recordlabel", clipId:clip.id, done:false, label:""});
  render();
}
function settleMediaLabel(m, label){
  var clip = mediaClipById(m.clipId);
  if(clip){
    clip.label = label;
    saveMedia();
    if(window.EPMedia && typeof EPMedia.setLabel === "function"){
      try{
        var p = EPMedia.setLabel(clip.id, label);
        if(p && typeof p.catch === "function") p.catch(function(){});
      }catch(e){}
    }
  }
  m.label = label; m.done = true; saveThread();
  pushMsg({type:"companion", text:"Kept. It's on today's page."});
}
function removeMediaClip(id){
  media.clips = media.clips.filter(function(c){ return c.id !== id; });
  saveMedia();

var EPPhoto = {
  /* decode the picked file and scale it to the cap, as JPEG.
     Resolves {blob, mime}; rejects when the file cannot be
     decoded as an image at all. The seam exists so the flow
     around it is testable, the way capture sits behind
     EPMedia.capture. */
  prepare: function(file){
    return new Promise(function(resolve, reject){
      var url;
      try{ url = URL.createObjectURL(file); }catch(e){ reject(e); return; }
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth || img.width || 0;
          var h = img.naturalHeight || img.height || 0;
          if(!w || !h) throw new Error("no dimensions");
          var scale = Math.min(1, ATTACH_MAX_EDGE / Math.max(w, h));
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          var ctx = canvas.getContext("2d");
          if(!ctx) throw new Error("canvas unavailable");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try{ URL.revokeObjectURL(url); }catch(e){}
          if(typeof canvas.toBlob === "function"){
            canvas.toBlob(function(blob){
              if(blob) resolve({blob:blob, mime:"image/jpeg"});
              else reject(new Error("encode failed"));
            }, "image/jpeg", 0.85);
          } else {
            var bin = atob((canvas.toDataURL("image/jpeg", 0.85).split(",")[1] || ""));
            var bytes = new Uint8Array(bin.length);
            for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
            resolve({blob:new Blob([bytes], {type:"image/jpeg"}), mime:"image/jpeg"});
          }
        }catch(e){ reject(e); }
      };
      img.onerror = function(){
        try{ URL.revokeObjectURL(url); }catch(e){}
        reject(new Error("decode failed"));
      };
      img.src = url;
    });
  }
};

var LIFE_STOP = {};
("today yesterday tomorrow morning evening night tonight really just like went came back time times "

  words.forEach(function(w){

      if(!byWord[w]) byWord[w] = {};

    return {word:w, days:Object.keys(byWord[w]).length};

      if(d.writings.length) parts.push(d.writings.length + (d.writings.length === 1 ? " writing" : " writings"));
      if(d.clips && d.clips.length) parts.push(d.clips.length + (d.clips.length === 1 ? " recording" : " recordings"));
      if(d.claimsLog.length) parts.push(d.claimsLog.length + (d.claimsLog.length === 1 ? " claim" : " claims") + " said");
      if(d.claimsClosed.length) parts.push(d.claimsClosed.length + " checked");
      var mv = d.moves.length ? d.moves[d.moves.length - 1].move : "";
      L.push("- " + dayLabel(k) + ": " + (parts.join(", ") || "nothing written")
        + (mv ? "; latest move, in their words: “" + shortWords(mv, 140) + "”" : ""));
    });
  }
  var out = L.join("\n");
  if(out.length > 6500) out = out.slice(0, 6500) + "\n[…your record continues; the app holds all of it.]";
  return out;
}
/* ---- thread history for the model: their words + the companion's,

function liveHistoryNote(m){
  function br(s){ return "[" + s + "]"; }
  if(m.type === "receiptsFig") return br("You showed the figured receipts: " + (m.lines || []).join(" "));
  if(m.type === "receipt"){
    var e = ledgerEntryById(m.claimId);

  }
  if(m.type === "offer") return br("You offered doors: " + (m.chips || []).map(function(c){ return c.label; }).join(" · "));
