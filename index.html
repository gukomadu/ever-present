/* ================= the dynamic journal — the day data =================
   The journal still assembles itself from the record, day by day:
   his words verbatim and dominant, the companion's part connective
   tissue and figuring only — claims as they logged and closed, his
   moves, the receipts figured (stamped on the day they were
   figured), precedents surfaced, knowledge offered. It renders as
   a card in the thread now (journalCardHTML); this is the data
   under it, and the correction flow that starts from its days. */
function journalPrompts(){
  var prompts = [
    "What did they claim this week that never happened?",
    "Which voice has been quiet lately \u2014 and what changed?",
    "Write the moment they defined for you, in your words instead."
  ];
  var pers = [];
  /* a quiet op, named */
  var lastSeen = {};
  atlas.events.forEach(function(ev){ if(ev.timeUnknown) return; (ev.whoIds||[]).forEach(function(id){
    if(!lastSeen[id] || ev.ts > lastSeen[id]) lastSeen[id] = ev.ts;
  }); });
  var quietId = "", quietTs = Infinity;
  Object.keys(lastSeen).forEach(function(id){ if(lastSeen[id] < quietTs){ quietTs = lastSeen[id]; quietId = id; } });
  if(quietId && Date.now() - quietTs > 86400000){
    var qp = pieceById(quietId);
    if(qp) pers.push(qp.name + " has been quiet since " + relDay(quietTs) + ". What\u2019s different?");
  }
  /* an unchecked claim, named */
  var open = openClaims();
  if(open.length) pers.push("Still open: \u201c" + open[0].claim + "\u201d What has actually happened since?");
  /* a claim that failed, named */
  var failed = ledger.entries.filter(function(e){ return e.outcomeChip === "didnt"; });
  if(failed.length){
    var f = failed[failed.length - 1];
    pers.push((f.who ? f.who : "A voice") + " claimed \u201c" + f.claim + "\u201d \u2014 and it didn\u2019t happen. What does their record look like now?");
  }
  return pers.concat(prompts);
}
function dayKeyOf(ts){
  var d = new Date(ts);
  var mo = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (mo < 10 ? "0" + mo : mo) + "-" + (dd < 10 ? "0" + dd : dd);
}
function dayLabel(key){
  var p = key.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
}
function fmtTime(ts){
  return new Date(ts).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
}
function evWords(ev){
  return ev.fragmentText || ev.pourText || ev.eventOwn || "";
}
/* The journal's spine is the day something was TOLD — every entry
   lives under the day it was communicated, full stop. A stated when
   stays inside the entry as part of the telling (an in-entry tag);
   it never moves the entry to another day. */
function journalToldKeyForEvent(ev){ return dayKeyOf(ev.toldTs || ev.ts); }
function journalToldKeyForClaim(e){ return dayKeyOf(e.toldTs || e.ts); }
function journalDayData(key){
  var d = {key:key, pours:[], writings:[], claimsLog:[], claimsClosed:[], moves:[],
           fig:null, prec:[], know:null, corrections:[], hiddenItems:[], verbatim:[]};
  atlas.events.forEach(function(ev){
    if(journalToldKeyForEvent(ev) !== key) return;
    if(djournal.hidden[ev.id]){ d.hiddenItems.push({id:ev.id, text:evWords(ev)}); return; }
    d.pours.push(ev);
    d.verbatim.push({id:ev.id, text:evWords(ev)});
  });
  journal.entries.forEach(function(en){
    if(dayKeyOf(en.ts) !== key) return;
    if(djournal.hidden[en.id]){ d.hiddenItems.push({id:en.id, text:en.text}); return; }
    d.writings.push(en);
    d.verbatim.push({id:en.id, text:en.text});
  });
  ledger.entries.forEach(function(e){
    if(journalToldKeyForClaim(e) === key) d.claimsLog.push(e);
    if(e.move && e.move.trim()){
      if(dayKeyOf(e.tsOutcome || e.toldTs || e.ts) === key) d.moves.push(e);
    } else if(isChecked(e) && e.tsOutcome && dayKeyOf(e.tsOutcome) === key && journalToldKeyForClaim(e) !== key){
      d.claimsClosed.push(e);
    }
  });
  if(djournal.dayFig[key]) d.fig = djournal.dayFig[key].slice();
  d.prec = (djournal.precedents[key] || []).slice();
  d.know = djournal.knowledgeDays[key] || null;
  d.corrections = (djournal.corrections[key] || []).slice();
  d.pours.sort(function(a,b){ return a.ts - b.ts; });
  d.writings.sort(function(a,b){ return a.ts - b.ts; });
  d.claimsLog.sort(function(a,b){ return a.ts - b.ts; });
  d.claimsClosed.sort(function(a,b){ return (a.tsOutcome || 0) - (b.tsOutcome || 0); });
  d.moves.sort(function(a,b){ return (a.tsOutcome || a.ts) - (b.tsOutcome || b.ts); });
  return d;
}
function journalHasContent(d){
  return !!(d.pours.length || d.writings.length || d.claimsLog.length || d.claimsClosed.length
    || d.moves.length || d.fig || d.prec.length || d.know || d.corrections.length || d.hiddenItems.length);
}
function journalDayKeys(){
  var seen = {};
  atlas.events.forEach(function(ev){ seen[journalToldKeyForEvent(ev)] = 1; });
  journal.entries.forEach(function(en){ seen[dayKeyOf(en.ts)] = 1; });
  ledger.entries.forEach(function(e){
    seen[journalToldKeyForClaim(e)] = 1;
    if(e.tsOutcome) seen[dayKeyOf(e.tsOutcome)] = 1;
  });
  Object.keys(djournal.dayFig).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.precedents).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.knowledgeDays).forEach(function(k){ seen[k] = 1; });
  Object.keys(djournal.corrections).forEach(function(k){ seen[k] = 1; });
  return Object.keys(seen).sort().reverse();
}
function shortWords(text, n){
  var t = String(text || "").replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}

function startCorrectDay(key){
  clearModes();
  correctionDay = key;
  view = "home";
  var d = journalDayData(key);
  var actions = [];
  d.verbatim.forEach(function(v){
    actions.push({act:"hide", eventId:v.id, label:"Hide: " + (shortWords(v.text, 28) || "something you said")});
  });
  if(d.fig){
    actions.push({act:"editfig", label:"Rewrite the figures"});
    actions.push({act:"dropfig", label:"Take the figures off this day"});
  }
  actions.push({act:"donecorrect", label:"That’s all"});
  pushMsg({type:"correct", dayKey:key, actions:actions,
    text:"What’s off about " + dayLabel(key) + "? Say it here — your words go on the day as a correction, word for word. Your pours and writings are never rewritten; you can hide one from the journal, and the figuring is mine to fix."});
  render();
}

function ledgerEntryById(id){
  for(var i=0;i<ledger.entries.length;i++) if(ledger.entries[i].id === id) return ledger.entries[i];
  return null;
}

    + (label ? '<p class="hub-label">'+esc(label)+'</p>' : '') + inner + '</div></div>';

/* ---- the journal card: today + this week, condensed; earlier days a tap away ---- */
function startOfWeekKey(){
  var d = new Date();
  var dow = (d.getDay() + 6) % 7; /* Monday = 0 */
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  return dayKeyOf(mon.getTime());
}
function postJournalCard(scope, beforeKey){
  pushMsg({type:"journalcard", scope:scope || "week", beforeKey:beforeKey || ""});
}
function journalCardHTML(m){
  var keys = journalDayKeys();
  var wk = startOfWeekKey();
  var show = [], olderKey = "";
  if(m.scope === "earlier"){
    var before = m.beforeKey || wk;
    show = keys.filter(function(k){ return k < before; }).slice(0, 7);
    if(show.length){
      var lastK = show[show.length - 1];
      if(keys.some(function(k){ return k < lastK; })) olderKey = lastK;
    }
  } else {
    show = keys.filter(function(k){ return k >= wk; });
    if(keys.some(function(k){ return k < wk; })) olderKey = wk;
  }
  var body = "";
  if(!show.length)
    body = '<p style="margin:4px 0">Nothing there yet — the journal writes itself from our talk, day by day, your words first.</p>';
  show.forEach(function(k){ body += journalCardDayHTML(m, k); });
  if(olderKey)
    body += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':jearlier:'+olderKey+'">Earlier days</button></div>';
  return cardBubble("Journal", body);
}
function journalCardDayHTML(m, key){
  var d = journalDayData(key);
  var h = '<div class="cardblock"><p style="margin:2px 0"><strong>'+esc(dayLabel(key))+'</strong></p>';
  var items = 0;
  d.pours.forEach(function(ev){
    if(items >= 3) return;
    var wtxt = evWords(ev);
    if(!wtxt) return;
    var isFrag = ev.mode === "fragment" || ev.type === "fragment";

    h += '<p class="small muted" style="margin:3px 0">'+d.hiddenItems.length

  h += '<div class="chiprow"><button type="button" class="chip" data-tchip="'+m.id+':jcorrect:'+key+'">Correct this day</button></div>';

function exportRecord(){
  /* The export is the record itself: a flat map of store names to
     their values, exactly what Import reads back — so a record that
     leaves this phone can come home to any phone, whole. */
  var data = {};
  Object.keys(K).forEach(function(name){
    var key = K[name];
    var raw = null;
    try{ raw = localStorage.getItem(key); }catch(e){}
    if(raw === null || raw === undefined) return;
    var val;
    try{ val = JSON.parse(raw); }catch(e){ val = raw; }
    if(key === K.liveai && val && typeof val === "object"){
      /* the live-companion settings travel with the record — the key itself never does */
      val = {provider: val.provider, model: val.model, on: !!val.on};
    }
    data[key] = val;
  });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ever-present-record.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---- import: bring a record home from an export file ----
   The file must be what Export writes — an object keyed by store
   names. Anything else is refused, plainly, and nothing changes.
   The live-companion key is never read out of a file and never
   overwritten by one: it lives on this device only, so the device's
   own key survives an import untouched. */
var pendingImport = null;
var IMPORT_KEYS = Object.keys(K).map(function(name){ return K[name]; });
function importParse(text){
  var data;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  if(!data || typeof data !== "object" || Array.isArray(data)) return null;
  var stores = {}, found = 0, bad = false;
  Object.keys(data).forEach(function(key){
    if(bad || IMPORT_KEYS.indexOf(key) === -1) return; /* keys that aren't stores are simply not part of the record */
    var val = data[key];
    if(typeof val === "string"){
      try{ JSON.parse(val); }catch(e){ bad = true; return; } /* a store's value must itself be readable */
    }
    stores[key] = val; found++;
  });
  if(bad || !found) return null;
  return stores;
}
function importRejected(){
  pendingImport = null;
  pushMsg({type:"companion", text:"That file doesn’t look like an Ever Present export. Nothing was changed."});
  render();
}
function handleImportFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var stores = importParse(String(reader.result || ""));
    if(!stores){ importRejected(); return; }
    pendingImport = stores;
    pushMsg({type:"confirmact", kind:"import", done:""});
    render();
  };
  reader.onerror = function(){ importRejected(); };
  try{ reader.readAsText(file); }catch(e){ importRejected(); }
}
function pickImportFile(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.style.display = "none";
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(f) handleImportFile(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
function applyImport(stores){
  var deviceKey = "";
  try{
    var cur = storeLoad(K.liveai, liveaiBlank);
    if(cur && typeof cur.key === "string") deviceKey = cur.key;
  }catch(e){}
  var kill = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("ever_present") === 0) kill.push(k);
  }
  kill.forEach(function(k){ localStorage.removeItem(k); });
  Object.keys(stores).forEach(function(key){
    var val = stores[key];
    if(key === K.liveai){
      var lv = val;
      if(typeof lv === "string"){ try{ lv = JSON.parse(lv); }catch(e){ lv = null; } }
      if(!lv || typeof lv !== "object") lv = {};
      var clean = {};
      Object.keys(lv).forEach(function(p){ if(p !== "key") clean[p] = lv[p]; });
      clean.key = deviceKey; /* this device's key stays this device's */
      localStorage.setItem(key, JSON.stringify(clean));
    } else if(typeof val === "string"){
      localStorage.setItem(key, val);
    } else {
      localStorage.setItem(key, JSON.stringify(val));
    }
  });
  location.reload();
}
function eraseEverything(){
  var kill = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("ever_present") === 0) kill.push(k);
  }
  kill.forEach(function(k){ localStorage.removeItem(k); });
  location.reload();
}

/* ---- text asks: the companion asked for words; the next message is the answer ---- */
function askText(kind, extra, promptText){
  textAsk = Object.assign({kind:kind}, extra || {});
  pushMsg({type:"companion", text:promptText});
}
function handleTextAsk(text){
  var ask = textAsk;
  textAsk = null;
  if(!ask) return;
  if(ask.kind === "move"){
    saveMove(ask.claimId, text);
    var e1 = ledgerEntryById(ask.claimId);
    if(e1){ e1.moveAsked = true; saveLedger(); }
    var mm = threadMsgById(ask.msgId);
    if(mm){ mm.moveDone = true; if(mm.outDone) mm.done = "done"; saveThread(); }
    /* move momentum rides the confirmation: the count, this move
       included, is the feedback for this message (v1.8) */
    var mvLine = noticedSuppressed() ? "" : fbLine("move", {n:moveCount()});
    if(mvLine) pushMsg({type:"companion", noticed:true, fbKind:"move", text:mvLine});
  } else if(ask.kind === "outcome"){
    setOutcome(ask.claimId, "", text);
    var mm2 = threadMsgById(ask.msgId);
    if(mm2){ mm2.outDone = true; if(mm2.moveDone) mm2.done = "done"; saveThread(); }
    /* the moveask message's own state is the proof — no extra line */
  } else if(ask.kind === "claimtext"){
    pushMsg({type:"claimkind", text:text, claimId:""});
  } else if(ask.kind === "seeing"){
    var p1 = pieceById(ask.pieceId);
    if(p1){ p1.seeing = text; p1.seeingTs = Date.now(); saveAtlas(); }
    var sm = threadMsgById(ask.msgId);
    if(sm){ sm.done = true; saveThread(); }
    pushMsg({type:"companion", text:"Your seeing is on top now."});
  } else if(ask.kind === "rename"){
    var p2 = pieceById(ask.pieceId);
    if(p2){
      p2.name = text;
      p2.nameHistory = p2.nameHistory || [];
      p2.nameHistory.push({name:text, ts:Date.now()});
      saveAtlas();
    }
    pushMsg({type:"companion", text:"Renamed. History kept."});
  } else if(ask.kind === "glossterm"){
    pushMsg({type:"glossdoes", pieceId:ask.pieceId, term:text, done:false});
  }
}

/* ================= Add detail — the tap trees, as a conversation =================
   The capture and confirm screens are gone. Filing an entry with
   detail — a first capture from the map card, or Add detail on a
   filed entry — now walks the same trees as a sequence of chip
   messages in the thread, one step at a time. `cap` is the
   session's working capture, the shape the trees always used;

    curMsg.answered = true;

    saveThread();
  }
  var idx = DETAIL_STEPS.indexOf(detail.step);

    var cw = claimWhoOf(d);
    fake.whoId = (cw.id && cw.id !== "__new") ? cw.id : "";
    if(cw.id === "__new") return understandingSentence(fake, defaultPieceName());
    return understandingSentence(fake);
  }
  var firstId = d.whoIds.length ? d.whoIds[0] : "";
  if(firstId) fake.whoId = firstId;
  else if(newPieceWanted()) return understandingSentence(fake, defaultPieceName());
  return understandingSentence(fake);
}
function dreviewHTML(m){
  if(m.filed === true)
    return '<div class="msg them"><div class="bubble"><p class="muted small">As you said it</p></div></div>';
  if(m.filed === false)
    return '<div class="msg them"><div class="bubble"><p class="muted small">'+(m.editing ? "Left as it was." : "Not kept.")+'</p></div></div>';
  if(!detail || detail.msgId !== m.id || !cap) return "";
  return '<div class="msg them"><div class="bubble wide"><p class="hub-label">What I heard</p>'
    + '<p style="margin:4px 0">' + esc(detailPlaybackSentence()) + '</p>'
    + detailSummaryHTML(cap)
    + '<div class="chiprow"><button type="button" class="chip" data-dchip="file">That’s right</button>'
    + '<button type="button" class="chip" data-dchip="revvoice">Different voice</button>'
    + '<button type="button" class="chip" data-dchip="revkind">Different kind</button>'
    + '<button type="button" class="chip" data-dchip="revtime">Different time</button>'
    + '<button type="button" class="chip" data-dchip="dropfile">Don’t keep this</button></div></div></div>';
}
function detailSummaryHTML(d){
  var h = "";
  if(d.mode === "pour" && d.pourText){
    h += '<h3>Your pour, kept whole</h3><p>'+esc(d.pourText.length > 280 ? d.pourText.slice(0,280) + "…" : d.pourText)+'</p>';
  }
  var whoNames = d.whoIds.map(function(id){ return esc(pieceName(id)); }).filter(Boolean);
  if(newPieceWanted()) whoNames.push(esc(defaultPieceName()) + " (new)");
  if(d.whoOwn) whoNames.push(esc(d.whoOwn));
  if(d.whoFlags.indexOf("noises") !== -1) whoNames.push("Just noises");
  if(d.whoFlags.indexOf("bodyonly") !== -1) whoNames.push("No one — body only");
  if(d.whoFlags.indexOf("toomany") !== -1) whoNames.push("Too many to count");
  if(whoNames.length) h += '<h3>Who</h3>' + summaryList(whoNames);
  if(d.channels.length) h += '<h3>What came through</h3>' + summaryList(d.channels.map(esc));
  var manner = d.mannerWhere.concat(d.mannerHow).concat(d.bodySpots).concat(d.bodySpotOwn ? [d.bodySpotOwn] : []);
  if(manner.length) h += '<h3>Manner and position</h3>' + summaryList(manner.map(esc));
  if(d.among.length) h += '<h3>Among themselves</h3>' + summaryList(d.among.map(esc));
  if(d.claimKind){
    var cw = claimWhoOf(d);
    h += '<h3>A claim</h3>' + summaryList([
      esc(KIND_LABELS[d.claimKind] || d.claimKind),
      "&ldquo;" + esc(claimTextOf(d) || "(from the options above)") + "&rdquo;",
      cw.name ? "Said by: " + esc(cw.name) : "No one specific named"
    ]);
    if(d.claimChips.indexOf("It charged me with something it won’t say plainly") !== -1)
      h += '<p class="muted small">Encoded charge: your record holds the question open — not yet understandable.</p>';
  }
  if(d.response.length) h += '<h3>Your response</h3>' + summaryList(d.response.map(esc));
  if(d.register.length) h += '<h3>How they presented</h3>' + summaryList(d.register.map(esc));
  var seeing = d.seeingOwn.trim() || d.seeingChip;
  if(seeing) h += '<h3>How you see them</h3><p>'+esc(seeing)+'</p>';
  if(d.glossTerm) h += '<h3>A word they use</h3>' + summaryList([esc(d.glossTerm), esc(d.glossDoes || d.glossDoesOwn || "")].filter(Boolean));
  if(d.eventOwn) h += '<h3>In your words</h3><p>'+esc(d.eventOwn)+'</p>';
  if(!whoNames.length && !d.channels.length && !d.claimKind && !d.pourText && !d.eventOwn && !d.glossTerm)
    h += '<p class="empty">Nothing picked yet.</p>';
  return h;
}
function handleDetailText(text){
  if(!detail || !cap) return;
  var f = detail.textField;
  detail.textField = "";
  if(f === "whoOwn") cap.whoOwn = text;
  else if(f === "npName"){ cap.newPiece.name = text; if(text) cap.newPiece.noName = false; }
  else if(f === "bodySpotOwn") cap.bodySpotOwn = text;
  else if(f === "claimOwn") cap.claimOwn = text;
  else if(f === "seeingOwn") cap.seeingOwn = text;
  else if(f === "glossTerm") cap.glossTerm = text;
  else if(f === "glossDoesOwn") cap.glossDoesOwn = text;
  else if(f === "eventOwn") cap.eventOwn = text;
}
function handleDetailChip(spec){
  if(!detail || !cap) return;
  flushPendingPour(); /* a tap is a pause — a hanging pour run gets its proposals */
  var parts = String(spec || "").split(":");
  var act = parts[0];
  if(act === "next"){ detailAdvance(); return; }
  if(act === "revvoice" || act === "revkind" || act === "revtime"){
    detail.returnStep = "review";
    detail.step = act === "revtime" ? "time" : (cap.claimKind || act === "revkind" ? "claim" : "who");
    var rvm = pushMsg({type:"dstep", step:detail.step});
    detail.msgId = rvm.id;
    render();
    return;
  }
  if(act === "time"){
    var tb2 = TOLD_TIME_BUCKETS[parts[1]] ? parts[1] : "now";
    cap.timeBucket = tb2;
    cap.timeLabel = TOLD_TIME_BUCKETS[tb2].label;
    cap.timeExplicit = true;
    render();
    return;
  }
  if(act === "writetext"){
    detail.textField = parts[1];
    var prompts = {
      whoOwn:"Say who, in your own words — it fills this step.",
      npName:"Say the name — the name as you know it, or a name you’re giving it.",
      bodySpotOwn:"Say the body spot, in your own words.",
      claimOwn:"Say the claim, in your own words.",
      seeingOwn:"Say how you see them — your words lead.",
      glossTerm:"Say the word — just the word.",
      glossDoesOwn:"Say what the word does, in your own words.",
      eventOwn:"Say whatever else belongs with it."
    };
    pushMsg({type:"companion", text:prompts[parts[1]] || "Say it in your words."});
    render();
    return;
  }
  if(act === "file"){
    var rm = threadMsgById(detail.msgId);
    var wasEdit = detail.editing;
    var ledBefore = ledger.entries.length;
    var capFirst = computeCaptureFirsts(); /* figured from cap BEFORE it files */
    detail = null;
    fileCapture();
    if(rm){ rm.filed = true; saveThread(); }
    /* the review message now reads "As you said it" — no extra line */
    /* a first from this filing is its feedback — unless the filing
       also created a claim, whose own organizing (precedent or
       filing facts, inside fileCapture) already spoke for it */
    if(capFirst && ledger.entries.length === ledBefore) postNoticed(capFirst);
    render();
    return;
  }
  if(act === "dropfile"){
    var rm2 = threadMsgById(detail.msgId);
    var wasEdit2 = detail.editing;
    if(rm2){ rm2.filed = false; saveThread(); }
    detail = null; cap = null;
    /* the review message now reads "Left as it was." / "Not kept." */
    render();
    return;
  }
  var idx = parseInt(parts[1], 10);
  if(act === "piece"){ var p = atlas.pieces[idx]; if(p) toggleIn(cap.whoIds, p.id); }
  else if(act === "whoflag"){ var wf = WHO_FLAG_OPTS[idx]; if(wf) toggleIn(cap.whoFlags, wf[0]); }
  else if(act === "npnoname"){ cap.newPiece.noName = !cap.newPiece.noName; }
  else if(act === "likeness"){ cap.newPiece.likeness = LIKENESS_OPTS[idx] || ""; }
  else if(act === "npstatus"){ cap.newPiece.status = idx === 0 ? "new" : "known"; }
  else if(act === "npstanding"){ cap.newPiece.standing = !cap.newPiece.standing; }
  else if(act === "channels"){ toggleIn(cap.channels, CHANNEL_OPTS[idx]); }
  else if(act === "where"){ toggleIn(cap.mannerWhere, WHERE_OPTS[idx]); }
  else if(act === "how"){ toggleIn(cap.mannerHow, HOW_OPTS[idx]); }
  else if(act === "spot"){ var sp = learnedBodySpots()[idx]; if(sp) toggleIn(cap.bodySpots, sp); }
  else if(act === "among"){ toggleIn(cap.among, AMONG_OPTS[idx]); }
  else if(act === "claimkind"){
    var v2 = idx === 0 ? "" : (CLAIM_KIND_CHIPOPTS[idx - 1] ? CLAIM_KIND_CHIPOPTS[idx - 1][0] : "");
    cap.claimKind = (cap.claimKind === v2) ? "" : v2;
    cap.claimChips = [];
  }
  else if(act === "claimsub"){ var cs = (CLAIM_SUBS[cap.claimKind] || [])[idx]; if(cs) toggleIn(cap.claimChips, cs); }
  else if(act === "claimwho"){ var o = claimWhoOptions()[idx]; if(o) cap.claimWhoId = o[0]; }
  else if(act === "response"){ toggleIn(cap.response, RESPONSE_OPTS[idx]); }
  else if(act === "register"){ var ro = REGISTER_OPTS_CAP[idx]; if(ro) toggleIn(cap.register, ro[0]); }
  else if(act === "seeingchip"){ cap.seeingChip = (cap.seeingChip === SEEING_OPTS[idx]) ? "" : SEEING_OPTS[idx]; }
  else if(act === "glossdoes"){ cap.glossDoes = (cap.glossDoes === GLOSS_DOES_OPTS[idx]) ? "" : GLOSS_DOES_OPTS[idx]; }
  render();
}

/* ================= Screen 8 — Help button + help ladder ================= */
var helpReturn = "home";
var ladderReturn = "help";
function viewHelp(){
  var t = allReceiptTallies();
  var h = '<div class="card" style="margin-top:10px">';
  h += '<button class="btn quiet small" id="helpBack" type="button">\u2190 Back</button>';
  h += '<h2 style="margin-top:8px">Help, your way</h2>';
  h += '<p class="lede muted">Sometimes you just need help. This connects you outward \u2014 it never alerts or notifies anyone behind your back, and pressing it writes nothing down. No log of help-seeking is kept, anywhere.</p>';

  /* rung 1 — reassurance, from the person's own record */
  h += '<div class="rung"><h3>Reassurance \u2014 from your own record</h3>';
  if(ladder.noteForHardDay){
    h += '<p class="muted small">A note you wrote on a calm day, for a hard one:</p>';
    h += '<div class="hardday-note">'+esc(ladder.noteForHardDay)+'</div>';
  }
  if(t.total){
    h += '<p>The claims have a track record, and you can check it: '+t.total+(t.total===1?" claim":" claims")+' logged, '
      + t.checked+' checked' + (t.checked ? ' \u2014 '+t.held+' held up, '+t.didnt+' didn\u2019t' : '') + '.</p>';
    h += '<div class="btnrow"><button class="btn secondary small" id="helpReceipts" type="button">Check the receipts</button></div>';
  }
  if(!ladder.noteForHardDay && !t.total){
    h += '<p>You are the one who keeps this record. Their claims have a track record, and you can check it.</p>';
  }
  if(!ladder.noteForHardDay){
    h += '<div class="btnrow"><button class="btn quiet small" id="helpNote" type="button">Write a note for a hard day</button></div>';
  }
  h += '</div>';

  /* rung 2 — a person */
  h += '<div class="rung"><h3>A person</h3>';
  if(ladder.contacts.length){
    ladder.contacts.forEach(function(c){
      h += '<p><strong>'+esc(c.name)+'</strong><br>'
        + '<a class="call-link" href="tel:'+esc(c.phone)+'">Call</a>'
        + '<a class="call-link" href="sms:'+esc(c.phone)+'">Text</a></p>';
    });
  } else {
    h += '<p class="muted">Circles and the people features arrive in a later phase \u2014 in v1, nothing shared leaves this phone. You can still put a person you trust on this rung.</p>';
  }
  h += '<div class="btnrow"><button class="btn secondary small" id="helpArrange" type="button">Arrange my ladder</button></div>';
  h += '</div>';

  /* rung 3 — a professional: live from first open, no setup, never removable */
  h += '<div class="rung far"><h3>Speak with a professional</h3>';
  h += '<p><strong>988 Suicide and Crisis Lifeline</strong> (US)<br>'
    + '<a class="call-link far" href="tel:988">Call 988</a>'
    + '<a class="call-link far" href="sms:988">Text 988</a></p>';
  h += '<p><strong>Crisis Text Line</strong><br>'
    + '<a class="call-link far" href="sms:741741?&amp;body=HOME">Text HOME to 741741</a></p>';
  if(ladder.clinician && ladder.clinician.phone){
    h += '<p><strong>'+esc(ladder.clinician.name || "My clinician")+'</strong><br>'
      + '<a class="call-link far" href="tel:'+esc(ladder.clinician.phone)+'">Call '+esc(ladder.clinician.phone)+'</a></p>';
  }
  h += '<p class="muted small">These standard routes stay on your ladder and can\u2019t be removed by accident. Stepping up from any rung is one tap \u2014 no gates, no \u201care you sure.\u201d</p>';
  h += '</div></div>';
  return h;
}
function bindHelp(){
  el("helpBack").addEventListener("click", function(){ go(helpReturn || "home"); });
  var r = el("helpReceipts"); if(r) r.addEventListener("click", function(){ go("home"); postReceiptsCard(); render(); });
  var n = el("helpNote"); if(n) n.addEventListener("click", function(){ ladderReturn = "help"; go("ladder"); });
  el("helpArrange").addEventListener("click", function(){ ladderReturn = "help"; go("ladder"); });
}

/* ---- arrange the ladder (owner-authored, in calm times, skippable) ---- */
function viewLadder(){
  var h = '<div class="card" style="margin-top:10px">';
  h += '<button class="btn quiet small" id="ladBack" type="button">\u2190 Back</button>';
  h += '<h2 style="margin-top:8px">Arrange your help ladder</h2>';
  h += '<p class="lede muted">Yours to arrange. Stored on this phone only.</p>';
  h += '<h3>A note for a hard day</h3>';
  h += '<p class="muted small">From a calm day, for a hard one.</p>';
  h += '<textarea class="big" id="ladNote" style="min-height:14vh" placeholder="What a hard day needs to hear from you\u2026" aria-label="A note for a hard day">'+esc(ladder.noteForHardDay)+'</textarea>';
  h += '<div class="btnrow"><button class="btn small" id="ladNoteSave" type="button">Save note</button></div>';
  h += '<hr class="divider"><h3>A person</h3>';
  if(ladder.contacts.length){
    ladder.contacts.forEach(function(c, i){
      h += '<p class="small"><strong>'+esc(c.name)+'</strong> \u2014 '+esc(c.phone)
        + ' <button class="btn quiet small" data-delcontact="'+i+'" type="button">Remove</button></p>';
    });
  }
  h += '<input type="text" class="txt" id="ladCName" placeholder="Their name" aria-label="Contact name" style="margin-bottom:8px">';
  h += '<input type="tel" class="txt" id="ladCPhone" placeholder="Their number" aria-label="Contact number">';
  h += '<div class="btnrow"><button class="btn secondary small" id="ladCAdd" type="button">Add</button></div>';
  h += '<hr class="divider"><h3>My clinician or clinic</h3>';
  h += '<input type="text" class="txt" id="ladClinName" placeholder="Name (e.g. my clinic)" value="'+esc(ladder.clinician.name || "")+'" aria-label="Clinician name" style="margin-bottom:8px">';
  h += '<input type="tel" class="txt" id="ladClinPhone" placeholder="Number" value="'+esc(ladder.clinician.phone || "")+'" aria-label="Clinician number">';
  h += '<div class="btnrow"><button class="btn small" id="ladClinSave" type="button">Save</button></div>';
  h += '</div>';
  return h;
}
function bindLadder(){
  el("ladBack").addEventListener("click", function(){ go(ladderReturn || "help"); });
  el("ladNoteSave").addEventListener("click", function(){
    ladder.noteForHardDay = el("ladNote").value.trim();
    saveLadder(); toast = "Saved.";
    render();
  });
  el("ladCAdd").addEventListener("click", function(){
    var n = el("ladCName").value.trim(), ph = el("ladCPhone").value.trim();
    if(!n || !ph){ (n ? el("ladCPhone") : el("ladCName")).focus(); return; }
    ladder.contacts.push({name:n, phone:ph});
    saveLadder(); render();
  });
  document.querySelectorAll("[data-delcontact]").forEach(function(b){
    b.addEventListener("click", function(){
      ladder.contacts.splice(parseInt(b.getAttribute("data-delcontact"), 10), 1);
      saveLadder(); render();
    });
  });
  el("ladClinSave").addEventListener("click", function(){
    ladder.clinician = {name: el("ladClinName").value.trim(), phone: el("ladClinPhone").value.trim()};
    saveLadder(); toast = "Saved to your ladder\u2019s professional rung.";
    render();
  });
}

el("helpBtn").addEventListener("click", function(){
  if(view !== "help"){ helpReturn = view; }
  view = "help";
  render(); window.scrollTo(0,0);
});
render();
