<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#476b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ever Present">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ever Present</title>
<style>
  /* ================= Ever Present v1 — styles =================
     Palette carried from the local product build: warm paper, calm green.
     Mobile-first. Big tap targets. No streaks, no scores on the person. */
  :root{
    --paper:#faf7f1; --card:#fffdf9; --ink:#2b2620; --muted:#7a7166;
    --line:#e4dccb; --accent:#476b5c; --accent-soft:#e9f0ea;
    --amber-bg:#fbf3e2; --amber-line:#e6d3a3; --amber-ink:#7a5b23;
    --help:#a8432f; --help-soft:#f9ebe7;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; font-size:16px;
    padding-bottom:calc(126px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:680px; margin:0 auto; padding:18px 16px 30px}
  h1.appname{
    font-family:Georgia,"Times New Roman",serif; font-weight:600;
    font-size:1.55rem; margin:6px 0 0; letter-spacing:.2px;
  }
  .companion-line{color:var(--muted); margin:2px 0 14px; font-size:.98rem}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin:0 0 14px;
  }
  .card h2{font-family:Georgia,serif; font-size:1.3rem; margin:0 0 10px; font-weight:600}
  .card h3{font-size:1.02rem; margin:18px 0 6px; font-weight:700}
  .card h3:first-child{margin-top:0}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  .lede{font-size:1.03rem}
  .empty{color:var(--muted); font-style:italic}
  .field-label{font-weight:600; font-size:.95rem; margin:14px 0 6px}
  .field-label:first-child{margin-top:0}

  /* ---- buttons ---- */
  .btn{
    display:inline-block; border:1px solid var(--accent); background:var(--accent); color:#fff;
    padding:12px 20px; border-radius:999px; font-size:1rem; cursor:pointer; min-height:48px;
    font-family:inherit;
  }
  .btn.secondary{background:var(--card); color:var(--ink); border-color:var(--line)}
  .btn.quiet{background:transparent; color:var(--muted); border-color:transparent}
  .btn.danger{background:var(--card); color:var(--help); border-color:var(--help)}
  .btn.small{padding:8px 14px; min-height:40px; font-size:.92rem}
  .btn.block{display:block; width:100%; text-align:center}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .btn:disabled{opacity:.5}

  /* ---- chips (options first, questions last) ---- */
  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:10px 14px; border-radius:999px; font-size:.95rem; cursor:pointer;
    min-height:44px; font-family:inherit; text-align:left;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip.alt.on{background:#7a5b23; border-color:#7a5b23}
  .chip small{display:block; font-size:.78rem; opacity:.85; font-weight:400}

  /* ---- inputs ---- */
  textarea.big, input.txt, textarea.txt{
    width:100%; border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:12px 14px; font-size:1rem; font-family:inherit; color:var(--ink);
  }
  textarea.big{min-height:16vh; line-height:1.55}
  textarea.short{min-height:9vh}

  /* ---- persistent help button ---- */
  #helpBtn{
    position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:80;
    background:var(--help); color:#fff; border:2px solid rgba(255,255,255,.9); border-radius:999px;
    padding:12px 22px; font-size:1.02rem; font-weight:700; cursor:pointer; min-height:48px;
    box-shadow:0 5px 16px rgba(43,38,32,.4), 0 2px 5px rgba(43,38,32,.3), inset 0 1px 0 rgba(255,255,255,.35);
    font-family:inherit;
  }
  #helpBtn:active{transform:translateY(2px); box-shadow:0 2px 8px rgba(43,38,32,.35)}

  /* ---- fragment button: one tap, from anywhere ---- */
  #fragBtn{
    position:fixed; right:16px; z-index:75;
    bottom:calc(92px + env(safe-area-inset-bottom));
    width:72px; height:72px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    box-shadow:0 10px 26px rgba(43,38,32,.35), 0 3px 8px rgba(43,38,32,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:inherit;
  }
  #fragBtn:active{transform:translateY(2px)}
  #fragBtn .frag-gly{font-size:1.55rem; line-height:1; font-weight:300}
  #fragBtn .frag-lab{font-size:.6rem; font-weight:700; letter-spacing:.4px; margin-top:2px}
  .chip.big{font-size:1.05rem; padding:14px 18px}

  /* ---- floating pill dock ---- */
  nav.bottom{
    position:fixed; left:50%; transform:translateX(-50%); z-index:70;
    bottom:calc(12px + env(safe-area-inset-bottom));
    width:min(660px, calc(100% - 20px));
    background:rgba(53,80,63,.97); border-radius:999px;
    box-shadow:0 12px 32px rgba(43,38,32,.35), 0 2px 8px rgba(43,38,32,.22);
    display:flex; padding:6px; gap:2px;
  }
  nav.bottom button{
    flex:1; background:none; border:none; cursor:pointer; font-family:inherit;
    padding:8px 2px 7px; color:#d9e4da; font-size:.7rem; min-height:52px;
    border-radius:999px; line-height:1.2; min-width:0;
  }
  nav.bottom button .gly{display:block; font-size:1.2rem; line-height:1.25}
  nav.bottom button .navlab{
    display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  nav.bottom button.active{background:var(--paper); color:var(--accent); font-weight:700}

  /* ---- the Hub (Home) ---- */
  .hub-top{padding:8px 2px 18px}
  .hub-opener{
    font-family:Georgia,"Times New Roman",serif; font-weight:600;
    font-size:1.85rem; line-height:1.32; margin:6px 0 12px;
  }
  .status-chips{display:flex; flex-wrap:wrap; gap:8px}
  .status-chips span{
    background:var(--accent-soft); color:var(--accent); border-radius:999px;
    padding:6px 13px; font-size:.84rem; font-weight:600;
  }
  .hero-card{
    border-radius:24px; padding:26px 22px 22px; margin:0 0 16px; cursor:pointer;
    background:linear-gradient(155deg,#5f8772 0%, #476b5c 48%, #324a3e 100%);
    color:#f7f3e8; box-shadow:0 14px 34px rgba(50,74,62,.38);
  }
  .hero-label{
    font-size:.76rem; letter-spacing:1.5px; text-transform:uppercase;
    font-weight:700; opacity:.85;
  }
  .hero-line{
    font-family:Georgia,"Times New Roman",serif; font-size:1.5rem;
    line-height:1.35; margin:10px 0 20px;
  }
  .hero-main{
    display:block; width:100%; border:none; cursor:pointer; font-family:inherit;
    background:#faf7f1; color:#324a3e; font-weight:700; font-size:1.12rem;
    padding:16px 20px; border-radius:999px; min-height:58px;
    box-shadow:0 4px 14px rgba(30,45,38,.25);
  }
  .hero-quick{
    display:block; margin:12px auto 2px; background:transparent; color:#f7f3e8;
    border:1px solid rgba(247,243,232,.55); border-radius:999px;
    padding:10px 20px; font-family:inherit; font-size:.95rem; cursor:pointer;
    min-height:48px;
  }
  .hub-card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:20px 22px; margin:0 0 16px;
    box-shadow:0 6px 22px rgba(43,38,32,.07);
  }
  .hub-card h2{font-family:Georgia,serif; font-size:1.28rem; margin:0 0 8px; font-weight:600}
  .hub-label{
    font-size:.78rem; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin:0 0 10px;
  }
  .hub-card .claim-text{font-size:1.08rem; line-height:1.45}

  /* ---- tallies (ported) ---- */
  .tally{display:flex; gap:14px; flex-wrap:wrap; margin:0 0 14px}
  .tally .pill{
    background:var(--accent-soft); border-radius:999px; padding:8px 16px; font-size:.95rem;
  }
  .tally .pill b{font-size:1.15rem; margin-right:6px}

  /* ---- claims ledger (ported from the local product build) ---- */
  .ledger-entry{border-top:1px solid var(--line); padding:14px 0}
  .ledger-entry:first-of-type{border-top:none}
  .ledger-entry .claim-text{font-size:1.05rem}
  .ledger-outcome{
    background:var(--accent-soft); border-radius:8px; padding:10px 14px; margin-top:10px;
  }
  .kind-tag{
    display:inline-block; background:var(--amber-bg); border:1px solid var(--amber-line);
    color:var(--amber-ink); border-radius:999px; padding:1px 9px; font-size:.76rem;
    margin-left:8px; vertical-align:middle;
  }

  /* ---- map pieces ---- */
  .piece-card{cursor:pointer}
  .piece-card:active{border-color:var(--accent)}
  .piece-name{font-family:Georgia,serif; font-size:1.2rem; font-weight:600}
  .type-tag{
    display:inline-block; background:var(--accent-soft); color:var(--accent);
    border-radius:999px; padding:1px 9px; font-size:.76rem; margin-left:8px; vertical-align:middle;
  }
  .seeing-box{
    background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:8px;
    padding:10px 14px; margin:10px 0;
  }
  .seeing-box .lab{font-size:.78rem; text-transform:uppercase; letter-spacing:.6px; color:var(--amber-ink); font-weight:700}
  .mini-chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
  .mini-chips span{
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:.82rem;
  }

  /* ---- journal prompts ---- */
  .prompt-card{cursor:pointer; text-align:left; width:100%; font-family:inherit; font-size:1rem}
  .prompt-card:active{border-color:var(--accent)}

  /* ---- help ladder ---- */
  .rung{border-left:5px solid var(--accent); padding-left:14px; margin:18px 0}
  .rung.far{border-left-color:var(--help)}
  .rung h3{margin:0 0 4px}
  .hardday-note{
    font-family:Georgia,serif; font-size:1.15rem; background:var(--amber-bg);
    border:1px solid var(--amber-line); border-radius:8px; padding:14px 16px; margin:10px 0;
    white-space:pre-wrap;
  }
  .call-link{
    display:inline-block; margin:4px 8px 4px 0; padding:10px 16px; border-radius:999px;
    background:var(--accent); color:#fff; text-decoration:none; font-weight:600; min-height:44px;
  }
  .call-link.far{background:var(--help)}

  /* ---- misc ---- */
  .howto{background:var(--accent-soft); border-radius:8px; padding:10px 14px; font-size:.92rem; margin:0 0 14px}
  .offer-card{border-color:var(--amber-line); background:var(--amber-bg)}
  .divider{border:none; border-top:1px solid var(--line); margin:16px 0}
  .stepdots{color:var(--muted); font-size:.85rem; margin:0 0 10px}
  .quiet-screen{padding-top:12vh}
  .summary-list{margin:6px 0; padding-left:20px}
  .summary-list li{margin:3px 0}
  a.plain{color:var(--accent)}
  .toast{
    background:var(--accent-soft); border:1px solid var(--accent); color:var(--ink);
    border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:.95rem;
  }

  /* ---- the thread (Home is a conversation) ---- */
  .thread{display:flex; flex-direction:column; gap:10px; padding-top:4px}
  .msg{display:flex}
  .msg.me{justify-content:flex-end}
  .msg .bubble{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 16px; max-width:88%; white-space:pre-wrap; line-height:1.5;
  }
  .msg.me .bubble{background:var(--accent); border-color:var(--accent); color:#fff}
  .msg .bubble .chiprow{margin-top:8px}
  .msg .bubble p{margin:0}
  .thread-spacer{height:158px}
  .composer{
    position:fixed; left:50%; transform:translateX(-50%); z-index:65;
    width:min(680px, 100%);
    bottom:calc(84px + env(safe-area-inset-bottom));
    background:var(--paper); border-top:1px solid var(--line);
    padding:8px 12px 6px;
  }
  .composer-row{display:flex; gap:8px; align-items:flex-end}
  .composer textarea{
    flex:1; border:1px solid var(--line); border-radius:12px; background:#fff;
    padding:12px 14px; font-size:1rem; font-family:inherit; color:var(--ink);
    min-height:48px; max-height:20vh; resize:none; line-height:1.4;
  }
  .composer .btn{min-height:48px}
</style>
</head>
<body>
<button id="helpBtn" type="button" aria-label="Help">Help</button>
<button id="fragBtn" type="button" aria-label="Catch a fragment" style="display:none"><span class="frag-gly">＋</span><span class="frag-lab">Fragment</span></button>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="bottom" id="bottomNav" style="display:none"></nav>

<script>
"use strict";
/* =====================================================================
   Ever Present v1 — single-file web app.
   Private, on-device core: companion, capture (the pour), map,
   Check the receipts (claims ledger), journal, help ladder, settings.
   Nothing leaves the device. Nothing grades the person.
   ===================================================================== */

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function el(id){ return document.getElementById(id); }
function fmtDate(ts){ /* ported from the local product build (ledgerFmt) */
  var d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})
    + ", " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function relDay(ts){
  var now = new Date(); var d = new Date(ts);
  var startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var startD = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var days = Math.round((startNow - startD) / 86400000);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 7) return "last " + d.toLocaleDateString(undefined,{weekday:"long"});
  return "on " + d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function uniqPush(arr, val){ if(val && arr.indexOf(val) === -1) arr.push(val); return arr; }

/* ================= stores (localStorage) =================
   Ledger keeps the ported key ever_present_ledger_v1 for continuity
   with the local product build; all v1 stores use ever_present_v1_*.
   Erase-all sweeps every key beginning with "ever_present". */
var K = {
  companion: "ever_present_v1_companion",
  atlas:     "ever_present_v1_atlas",
  journal:   "ever_present_v1_journal",
  ladder:    "ever_present_v1_ladder",
  ledger:    "ever_present_ledger_v1",
  thread:    "ever_present_v1_thread"
};
function storeLoad(key, blank){
  try{
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : blank();
  }catch(e){ return blank(); }
}
function storeSave(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function companionBlank(){ return null; }
function atlasBlank(){ return {pieces:[], events:[], glossary:[]}; }
function journalBlank(){ return {entries:[]}; }
function ladderBlank(){ return {noteForHardDay:"", contacts:[], clinician:{name:"", phone:""}}; }
function ledgerBlank(){ return {entries:[]}; } /* ported shape */

var companion = storeLoad(K.companion, companionBlank);
var atlas     = storeLoad(K.atlas, atlasBlank);
if(!atlas.pieces) atlas.pieces = [];
if(!atlas.events) atlas.events = [];
if(!atlas.glossary) atlas.glossary = [];
var journal   = storeLoad(K.journal, journalBlank);
if(!journal.entries) journal.entries = [];
var ladder    = storeLoad(K.ladder, ladderBlank);
if(!ladder.contacts) ladder.contacts = [];
if(!ladder.clinician) ladder.clinician = {name:"", phone:""};
var ledger    = storeLoad(K.ledger, ledgerBlank); /* ported load */
if(!ledger.entries) ledger.entries = [];

function saveCompanion(){ storeSave(K.companion, companion); }
function saveAtlas(){ storeSave(K.atlas, atlas); }
function saveJournal(){ storeSave(K.journal, journal); }
function saveLadder(){ storeSave(K.ladder, ladder); }
function saveLedger(){ storeSave(K.ledger, ledger); } /* ported save */

/* ================= shared lookups ================= */
function pieceById(id){
  for(var i=0;i<atlas.pieces.length;i++) if(atlas.pieces[i].id === id) return atlas.pieces[i];
  return null;
}
function pieceName(id){ var p = pieceById(id); return p ? p.name : ""; }
function openClaims(){ return ledger.entries.filter(function(e){ return !isChecked(e); }); }
function isChecked(e){
  if(e.outcome && e.outcome.trim()) return true;
  return e.outcomeChip === "happened" || e.outcomeChip === "didnt" || e.outcomeChip === "partly";
}
function heldUp(e){ return e.outcomeChip === "happened" || e.outcomeChip === "partly"; }
var KIND_LABELS = {
  prediction:"Prediction",
  now:"Claim about right now",
  commentary:"Running commentary",
  announcement:"Announcement",
  instruction:"Instruction"
};
function outcomeLabel(e){
  var parts = [];
  if(e.outcomeChip === "happened") parts.push("It happened");
  if(e.outcomeChip === "didnt") parts.push("It didn\u2019t happen");
  if(e.outcomeChip === "partly") parts.push("Partly");
  if(e.outcome) parts.push(e.outcome);
  return parts.join(" \u2014 ");
}
/* receipts tallies for one voice (by piece id or exact name) */
function receiptsForPiece(p){
  var mine = ledger.entries.filter(function(e){
    return (e.whoId && e.whoId === p.id) || (e.who && e.who === p.name);
  });
  var checked = mine.filter(isChecked);
  return {
    total: mine.length,
    checked: checked.length,
    open: mine.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function allReceiptTallies(){
  var checked = ledger.entries.filter(isChecked);
  return {
    total: ledger.entries.length,
    checked: checked.length,
    open: ledger.entries.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function learnedBodySpots(){
  var spots = [];
  atlas.events.forEach(function(ev){ (ev.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  atlas.pieces.forEach(function(p){ (p.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  return spots;
}

/* ================= app state ================= */
var view = companion ? "home" : "arrival";
var toast = "";
var sessionDismissed = {}; /* in-memory only: dismissing an offer writes nothing about the person */
var pieceDetailId = null;
var journalReadId = null;
var journalPrompt = "";
var frag = null;
var fragReturn = "home";
var FRAG_CHANNELS = ["Speaking","Noise","Body","Pain","Seeing","Presence"];
var FRAG_VIEWS = ["home","map","piece","receipts","journal","journalRead"];
var threadDoor = false; /* set when a flow was entered from the thread */

/* ================= render root + nav ================= */
function navItems(){
  return [
    ["home","⌂", companion ? companion.name : "Companion"],
    ["pour","◉","Pour"],
    ["map","✦","Map"],
    ["receipts","✓","Receipts"],
    ["journal","✎","Journal"]
  ];
}
function renderNav(){
  var nav = el("bottomNav");
  if(!companion){ nav.style.display = "none"; nav.innerHTML = ""; return; }
  nav.style.display = "flex";
  var base = (view === "fragment") ? fragReturn : view;
  if(base === "piece" || base === "capture") base = "map";
  if(base === "quick" || base === "create" || base === "settings" || base === "help" || base === "ladder" || base === "fragment") base = "home";
  if(base === "proposals") base = "pour";
  if(base === "confirm") base = (cap && cap.mode === "pour") ? "pour" : "map";
  if(base === "journalWrite" || base === "journalRead") base = "journal";
  nav.innerHTML = navItems().map(function(n){
    return '<button type="button" data-nav="'+n[0]+'" class="'+(base===n[0] ? "active" : "")+'">'
      + '<span class="gly">'+n[1]+'</span><span class="navlab">'+esc(n[2])+'</span></button>';
  }).join("");
  nav.querySelectorAll("[data-nav]").forEach(function(b){
    b.addEventListener("click", function(){
      var target = b.getAttribute("data-nav");
      if(target === "pour"){ threadDoor = false; startPour(); }
      else go(target);
    });
  });
}
function go(v){
  view = v;
  render();
  window.scrollTo(0,0);
}
function headerHTML(){
  var h = '<h1 class="appname">Ever Present</h1>';
  if(companion){
    h += '<p class="companion-line">'+esc(companion.name)+' keeps your record.</p>';
  }
  return h;
}
function render(){
  var v = el("app");
  var h = "";
  if(toast){ h += '<div class="toast">'+esc(toast)+'</div>'; toast = ""; }
  if(view === "arrival"){ v.innerHTML = h + viewArrival(); bindArrival(); }
  else if(view === "create"){ v.innerHTML = h + viewCreate(); bindCreate(); }
  else if(view === "home"){ v.innerHTML = headerHTML() + h + viewThread(); bindThread(); }
  else if(view === "capture"){ v.innerHTML = headerHTML() + h + viewCapture(); bindCapture(); }
  else if(view === "pour"){ v.innerHTML = headerHTML() + h + viewPour(); bindPour(); }
  else if(view === "proposals"){ v.innerHTML = headerHTML() + h + viewProposals(); bindProposals(); }
  else if(view === "quick"){ v.innerHTML = headerHTML() + h + viewQuick(); bindQuick(); }

function greetingWord(){

function daysSince(ts){
  var now = new Date(); var d = new Date(ts);
  var startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var startD = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return Math.round((startNow - startD) / 86400000);
}
/* The companion speaks first, from the person's own record. Candidates are
   gathered from what is actually in the record; one is picked per day so
   the greeting is stable within a day and varies across days. */
function companionOpener(){
  var cands = [];
  var evs = atlas.events.slice().sort(function(a,b){ return b.ts - a.ts; });
  /* the most recent piece in the record */
  for(var i=0;i<evs.length;i++){
    var ids = evs[i].whoIds || [];
    if(ids.length){
      var p0 = pieceById(ids[0]);
      if(p0){ cands.push(p0.name + " was around " + relDay(evs[i].ts) + ". It\u2019s in the record."); break; }
    }
  }
  /* an open claim, waiting on its outcome */
  var open = openClaims();
  if(open.length === 1){
    var ct = open[0].claim.length > 60 ? open[0].claim.slice(0,60) + "\u2026" : open[0].claim;
    cands.push("One claim still open \u2014 \u201c" + ct + "\u201d");
  } else if(open.length > 1){
    cands.push(open.length + " claims still open.");
  }
  /* days since the last pour */
  var lastPour = null;
  for(var j=0;j<evs.length;j++){ if(evs[j].mode === "pour" && evs[j].pourText){ lastPour = evs[j]; break; } }
  if(lastPour){
    var dp = daysSince(lastPour.ts);
    if(dp >= 2) cands.push("Last pour: " + dp + " days ago. The door\u2019s open.");
  }
  /* a piece that hasn't been visited in a while */
  if(atlas.pieces.length > 1){
    var seen = {};
    atlas.events.forEach(function(ev){
      (ev.whoIds||[]).forEach(function(id){ if(!seen[id] || ev.ts > seen[id]) seen[id] = ev.ts; });
    });
    var quietP = null, quietTs = Infinity;
    atlas.pieces.forEach(function(p){
      var t = seen[p.id] || p.created || 0;
      if(t < quietTs){ quietTs = t; quietP = p; }
    });
    if(quietP && Date.now() - quietTs > 4 * 86400000)
      cands.push(quietP.name + " \u2014 quiet since " + relDay(quietTs) + ".");
  }
  if(!cands.length){
    if(atlas.pieces.length)
      return "Your map holds " + atlas.pieces.length + (atlas.pieces.length === 1 ? " piece" : " pieces") + ", in your words.";
    return "I\u2019m here. Your record is a blank page \u2014 a fine place to start.";
  }
  var dayIdx = Math.floor(Date.now() / 86400000);
  return cands[dayIdx % cands.length];
}

/* ================= the thread (Home is a conversation) =================
   The companion speaks first; the person's words are pours; the
   record's surfaces arrive as messages in the thread. The thread is
   persisted on-device and capped at the last 300 messages. */
function threadBlank(){ return {messages:[], lastDay:-1, surfaceDay:-1, figSignature:""}; }
var thread = storeLoad(K.thread, threadBlank);
if(!thread.messages) thread.messages = [];
if(thread.lastDay == null) thread.lastDay = -1;
if(thread.surfaceDay == null) thread.surfaceDay = -1;
if(thread.figSignature == null) thread.figSignature = "";
if(thread.interruptionKey == null) thread.interruptionKey = "";
if(thread.interruptionHandledAt == null) thread.interruptionHandledAt = 0;
var bootInterruptChecked = false;
if(!thread.doorCounts) thread.doorCounts = {};

var sessionHold = false;
function saveThread(){
  if(thread.messages.length > 300) thread.messages = thread.messages.slice(thread.messages.length - 300);
  storeSave(K.thread, thread);
}
function pushMsg(m){
  m.id = m.id || uid();

  thread.messages.push(m);
  saveThread();
  return m;
}
function threadMsgById(id){
  for(var i=0;i<thread.messages.length;i++) if(thread.messages[i].id === id) return thread.messages[i];
  return null;

function eventById(id){

/* ---- the receipts, figured by the companion ----
   Tallies and track records are counted by the companion and brought
   into the thread. The companion counts; the person concludes. */
function figuredReceipts(){
  var byWho = {};
  ledger.entries.forEach(function(e){
    var key = e.who || "";
    if(!byWho[key]) byWho[key] = [];
    byWho[key].push(e);
  });
  function figLine(label, mine){
    var checked = mine.filter(isChecked);
    var held = checked.filter(heldUp).length;
    var didnt = checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length;
    var line = label + ": " + mine.length + (mine.length === 1 ? " claim" : " claims") + ".";
    if(checked.length) line += " " + checked.length + " checked — " + held + " held up, " + didnt + " didn’t.";
    var openN = mine.length - checked.length;
    if(openN) line += " " + openN + " still open.";
    return line;
  }
  var lines = [];
  Object.keys(byWho).filter(function(k){ return k; }).sort().forEach(function(name){
    lines.push(figLine(name, byWho[name]));
  });
  if(byWho[""] && byWho[""].length) lines.push(figLine("No one specific", byWho[""]));
  var byKind = {};
  ledger.entries.forEach(function(e){
    if(e.kind){ if(!byKind[e.kind]) byKind[e.kind] = []; byKind[e.kind].push(e); }
  });
  var kinds = Object.keys(byKind);
  if(kinds.length > 1){
    lines.push(kinds.map(function(k){
      var mine = byKind[k];
      var checked = mine.filter(isChecked);
      return (KIND_LABELS[k] || k) + ": " + mine.length + " logged, " + checked.length + " checked";
    }).join(" · "));
  }
  var withMove = ledger.entries.filter(function(e){ return e.move && e.move.trim(); }).length;
  if(withMove) lines.push((withMove === 1 ? "1 time" : withMove + " times") + " they announced and you moved anyway.");
  var checkedAll = ledger.entries.filter(isChecked).length;
  return {lines:lines, total:ledger.entries.length, checked:checkedAll};
}
/* A signature over the figured facts only (checked / held / didn't per
   voice). It changes when a claim is checked — never when one is merely
   logged — so the figured picture is news exactly when the figuring is. */
function figSignature(){
  var sig = {};
  ledger.entries.forEach(function(e){
    if(!isChecked(e)) return;
    var k = e.who || "";
    if(!sig[k]) sig[k] = [0,0,0];
    sig[k][0]++;
    if(heldUp(e)) sig[k][1]++;
    if(e.outcomeChip === "didnt") sig[k][2]++;
  });
  return JSON.stringify(sig);
}
function figNew(){
  return figuredReceipts().checked >= 1 && figSignature() !== thread.figSignature;
}
function postFiguredReceipts(){

  } else {

  }
  thread.figSignature = figSignature();
  saveThread();
}
/* At most one surface a day beyond the greeting: the figured receipts
   when the figuring is new, else a rotation of what's live — the
   oldest open claim (its outcome proposed, never decided), the top

/* ---- vibe: the companion tuned to the person's personality ----

   silences every proactive surface; the person's own chips and
   requests always work. Humor never enters safety surfaces: the

function vibeOf(){ return (companion && companion.vibe) || "gentle"; }
function doorsLine(){

  return "I’m here. This is a lot landing at once.";

/* Leading doors learn: counters of the doors the person actually
   taps, kept on-device like everything else, exported and erased
   with the rest of the record. Offer rows compose most-taken first. */
var DOOR_KEY = {pour:"pour", quick:"quick", figreceipts:"receipts", write:"write", playbook:"moves", helpdoor:"help"};
function bumpDoor(act){
  var k = DOOR_KEY[act];
  if(!k) return;
  thread.doorCounts[k] = (thread.doorCounts[k] || 0) + 1;
  saveThread();
}
function doorCount(act){
  var k = DOOR_KEY[act];
  return k ? ((thread.doorCounts || {})[k] || 0) : 0;
}
function orderByDoors(items, actOf){
  return items.map(function(it, i){ return {it:it, i:i}; })
    .sort(function(a, b){
      var d = doorCount(actOf(b.it)) - doorCount(actOf(a.it));
      return d !== 0 ? d : a.i - b.i;
    })
    .map(function(x){ return x.it; });
}
/* ---- helping make the move ----
   When a claim sits in the record unanswered — the blast is the only
   thing written — the companion can help the person make their move.
   Once per claim, on a later open (never in the moment of logging),
   or at once when they tap "Doors?" on the claim in Receipts. The
   doors are his own recorded moves and the app's doors. Nothing here
   is advice, and dismissal is forever. */
function postDoors(entry){
  pushMsg({type:"doors", claimId:entry.id, dismissed:false});
  entry.doorsPosted = true;
  saveLedger();
}
function postDoorsIfDue(){
  var cands = ledger.entries.filter(function(e){

  var ta = el("threadInput");
  if(ta) ta.addEventListener("keydown", function(ev){
    if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); sendThreadText(); }
  });
  document.querySelectorAll("[data-tdoor]").forEach(function(b){
    b.addEventListener("click", function(){
      var act = b.getAttribute("data-tdoor");
      bumpDoor(act);
      if(act === "fragment"){ startFragment(); }
      else if(act === "quick"){ startQuickNote(); threadDoor = true; }
      else if(act === "pour"){ startPour(); threadDoor = true; }
      else if(act === "figreceipts"){ postFiguredReceipts(); render(); }
    });
  });
  document.querySelectorAll("[data-tchip]").forEach(function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-tchip").split(":");
      var m = threadMsgById(parts[0]);
      var act = parts[1];
      bumpDoor(act);
      if(act === "pour"){ startPour(); threadDoor = true; }
      else if(act === "quick"){ startQuickNote(); threadDoor = true; }
      else if(act === "fragment"){ startFragment(); }
      else if(act === "write"){ journalPrompt = ""; go("journalWrite"); }
      else if(act === "figreceipts"){ postFiguredReceipts(); render(); }
      else if(act === "seereceipts"){ go("receipts"); }
      else if(act === "seeclaim"){ go("receipts"); }
      else if(act === "playbook"){
        var pm2 = pastMoves();
        pushMsg({type:"playbook", lines: pm2.map(function(x){ return x.move.trim(); })});
        saveThread(); render();
      }
      else if(act === "seeprec" && m){
        var sce = null;
        ledger.entries.forEach(function(x){ if(x.id === m.claimId) sce = x; });
        if(sce){ maybePostPrecedent(sce); saveThread(); }
        render();
      }
      else if(act === "pourclaim" && m){
        var pce = null;
        ledger.entries.forEach(function(x){ if(x.id === m.claimId) pce = x; });
        threadDoor = true;
        startPour();
        if(pce){ cap.pourText = "About the claim: \u201C" + pce.claim + "\u201D\n\n"; }
        render();
      }
      else if(act === "helpdoor"){ helpReturn = "home"; view = "help"; window.scrollTo(0,0); render(); }
      else if(act === "justlog" && m){
        ledger.entries.forEach(function(x){
          if(x.id === m.claimId) x.doorsDismissed = true;
        });
        saveLedger();
        m.dismissed = true; saveThread(); render();
      }
      else if(act === "more" && m){ m.expanded = true; saveThread(); render(); }
      else if(act === "hardnote"){ ladderReturn = "home"; go("ladder"); }
      else if(act === "alright" && m){
        m.dismissed = true;
        thread.interruptionHandledAt = Date.now();
        saveThread(); render();
      }
      else if(act === "openmap"){ go("map"); }
      else if(act === "dismiss"){
        if(m){
          m.dismissed = true;
          if(m.type === "knowledge"){
            thread.knowledge.dismissed[m.theme] = Date.now();
          }
          saveThread();
        }
        render();
      }
      else if(act === "pickgo" && m){
        if(m.act === "pour"){ startPour(); threadDoor = true; }
        else if(m.act === "note"){ ladderReturn = "home"; go("ladder"); }
        else if(m.act === "piece"){ pieceDetailId = m.pieceId; go("piece"); }
        else if(m.act === "prompt"){ journalPrompt = m.prompt || ""; go("journalWrite"); }
        else if(m.act === "map"){ go("map"); }
      }
    });
  });
  document.querySelectorAll("[data-tout]").forEach(function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-tout").split(":");
      setOutcome(parts[0], parts[1], "");
      toast = "Written down.";
      render();
    });
  });
  document.querySelectorAll("[data-tpiece]").forEach(function(b){
    b.addEventListener("click", function(){ pieceDetailId = b.getAttribute("data-tpiece"); go("piece"); });
  });
  document.querySelectorAll("[data-tprop]").forEach(function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-tprop").split(":");
      var m = threadMsgById(parts[0]);
      if(!m) return;
      var sub = parts[1];
      if(sub === "piece"){
        var ev = eventById(m.eventId);
        if(ev){ toggleIn(ev.whoIds, parts[2]); saveAtlas(); }
        render();
      } else if(sub === "kind"){
        var ev2 = eventById(m.eventId);
        var lid = uid();
        var whoId = (ev2 && ev2.whoIds && ev2.whoIds[0]) || "";
        var newClaim = {
          id:lid, claim: ev2 ? (ev2.pourText || "") : "", kind: parts[2],
          who: whoId ? pieceName(whoId) : "", whoId: whoId,
          ts:Date.now(), outcome:"", outcomeChip:"", tsOutcome:0, encoded:false, move:""
        };
        ledger.entries.push(newClaim);
        saveLedger();
        if(ev2){ ev2.claimLedgerId = lid; saveAtlas(); }
        m.claimId = lid;
        saveThread();
        toast = "Filed to the ledger.";
        maybePostPrecedent(newClaim);
        render();
      } else if(sub === "keep"){
        m.quiet = true;
        saveThread();
        render();
      }
    });
  });
  window.scrollTo(0, document.body && document.body.scrollHeight ? document.body.scrollHeight : 0);
}
var moveEditId = "";
function saveMove(id, text){
  ledger.entries.forEach(function(e){ if(e.id === id) e.move = text; });
  saveLedger();
}
function setOutcome(id, chip, text){
  ledger.entries.forEach(function(e){
    if(e.id === id){
      if(chip && chip !== "notyet"){ e.outcomeChip = chip; }
      if(chip === "notyet"){ e.outcomeChip = "notyet"; }
      if(text){ e.outcome = text; }
      e.tsOutcome = Date.now();
    }
  });
  saveLedger();
}

/* ================= Screen 4 — the pour, quick note, Add to the map (detail trees) ================= */
var cap = null;
function blankCap(){
  return {
    mode:"quick", pourText:"", editEventId:"", pourWhoIds:[],
    whoIds:[], whoFlags:[], whoOwn:"",
    newPiece:{name:"", noName:false, likeness:"", status:"", standing:false},
    channels:[], mannerWhere:[], mannerHow:[], bodySpots:[], bodySpotOwn:"",
    among:[],
    claimKind:"", claimChips:[], claimOwn:"", claimWhoId:"", claimWhoText:"", encoded:false,
    response:[],
    register:[], seeingChip:"", seeingOwn:"",
    glossTerm:"", glossDoes:"", glossDoesOwn:"",
    eventOwn:""
  };
}
function startCapture(mode){
  cap = blankCap(); cap.mode = mode || "quick";
  go("capture");
}
function startPour(){
  cap = blankCap(); cap.mode = "pour";
  go("pour");
}
var CHANNEL_OPTS = ["Words, like someone talking","Like a thought, not a sound","Sounds or noises, no words",
  "A feeling in my body","Pain","Being touched","Something I saw \u2014 a person","Something I saw \u2014 a face",
  "Something else I saw","Someone there, but nothing seen or heard"];
var WHERE_OPTS = ["Right next to my ear","Inside my head","Out in the room","Behind me",
  "In a part of my body","Close by, but I couldn\u2019t see or hear anything","Everywhere at once"];
var HOW_OPTS = ["Whispering","Normal talking volume","Shouting","So quiet I could barely hear it"];
var AMONG_OPTS = ["They were talking to each other","They were talking about me","One answered another",
  "They took turns","They were arguing","They were working together","They were singing together",
  "Each one only talks to me \u2014 they don\u2019t talk to each other","I could hear them, but it wasn\u2019t for me"];
var CLAIM_SUBS = {
  prediction:["It said something would happen","It threatened something","It promised something","It said I\u2019d be responsible if I didn\u2019t listen"],
  now:["It said what this means","It said what someone is really doing","It said I did something wrong","It blamed me","It said someone else is at fault","It charged me with something it won\u2019t say plainly"],
  commentary:["It described what I was doing","It graded what I just did","It announced something I did wrong, back to me","It reacted to what I was thinking","It narrated like a sportscaster","It commented, but nothing was said out loud"],
  announcement:["It announced what I am","It announced what would happen to me","It delivered a verdict","It blasted it like news"],
  instruction:["It told me to do something","It gave advice, strongly"]
};
var REGISTER_OPTS_CAP = [
  ["Grand \u2014 acting big, acting in charge",""],["Threatening",""],["Hilarious",""],["Strange",""],["Pathetic",""],
  ["Kind \u2014 being nice",""],["Biscuit \u2014 nice as a lure","their word: niceness offered like a treat, to get me to come closer, follow, or stay"],
  ["Cruel",""],["Like an authority, talking down",""],["Like family",""],["Using my own words back at me",""]
];
var SEEING_OPTS = ["A clown \u2014 I see through the act","A bully running a script",
  "A squatter \u2014 in my house without permission","Smaller than it sounds",
  "Grand on the surface, losing on the record","Still getting to me \u2014 for now","Not sure how I see this one yet"];
var GLOSS_DOES_OPTS = ["It\u2019s their word for something ordinary","It\u2019s a lure \u2014 niceness or reward offered to steer me",
  "It\u2019s a threat dressed as something else","It\u2019s a name they call me",
  "It\u2019s a name they call each other / themselves","It\u2019s a rule they enforce","It grades or scores what I do"];
var LIKENESS_OPTS = ["Someone I know","Someone I used to know","A stranger","It reminds me of someone","Not a person, exactly","A group or crowd"];
var WHO_FLAG_OPTS = [
  ["new","Someone new"],["knownnew","Someone I know \u2014 not in my map yet"],["group","A group or crowd"],
  ["notperson","Not a person, exactly"],["noises","Just noises \u2014 no one specific"],
  ["bodyonly","No one \u2014 it\u2019s in my body only"],["presence","Someone there, but nothing seen or heard"],
  ["toomany","Too many to count"]
];
function capChips(group, opts, selected, multi){
  return '<div class="chiprow">' + opts.map(function(o){
    var val = Array.isArray(o) ? o[0] : o;
    var lab = Array.isArray(o) ? o[1] : o;
    var on = multi ? (selected.indexOf(val) !== -1) : (selected === val);
    return '<button type="button" class="chip'+(on ? " on" : "")+'" data-capchip="'+group+'" data-val="'+esc(val)+'">'+esc(lab)+'</button>';
  }).join("") + '</div>';
}
function whoCount(){
  var n = cap.whoIds.length;
  ["new","knownnew","group","presence","notperson"].forEach(function(f){ if(cap.whoFlags.indexOf(f) !== -1) n++; });
  return n;
}
function hasPresence(){
  if(cap.whoIds.length) return true;
  return ["new","knownnew","group","presence","notperson","noises"].some(function(f){ return cap.whoFlags.indexOf(f) !== -1; });
}
function newPieceWanted(){
  return ["new","knownnew","group","presence","notperson"].some(function(f){ return cap.whoFlags.indexOf(f) !== -1; });
}
function newPieceType(){
  if(cap.whoFlags.indexOf("presence") !== -1) return "presence";
  if(cap.whoFlags.indexOf("group") !== -1) return "group";
  if(cap.whoFlags.indexOf("notperson") !== -1) return "other";
  return "voice";
}
function claimWhoOptions(){
  var opts = [];
  cap.whoIds.forEach(function(id){ var p = pieceById(id); if(p) opts.push([id, p.name]); });
  if(newPieceWanted()) opts.push(["__new", cap.newPiece.name || "The new one"]);
  opts.push(["", "No one specific"]);
  return opts;
}
function viewCapture(){
  var d = cap;
  var amongShown = (whoCount() >= 2 || d.whoFlags.indexOf("group") !== -1);
  var claimsNo = 3 + (hasPresence() ? 1 : 0) + (amongShown ? 1 : 0);
  var h = "";
  if(d.mode === "pour" && !d.editEventId){
    h += '<div class="card"><h2>Filing the pour</h2>'
      + '<p class="muted">Your pour stays whole. Filing below is optional.</p>'
      + '<div class="btnrow"><button class="btn" id="capJustPour" type="button">File just the pour</button></div></div>';
  } else if(d.editEventId){
    h += '<div class="card"><h2>Add detail</h2>'
      + '<p class="muted">Change anything. The entry keeps its place.</p>'
      + '<div class="btnrow"><button class="btn" id="capDoneTop" type="button">Done</button></div></div>';
  } else {
    h += '<div class="card"><h2>Add to the map</h2>'
      + '<p class="muted">Tap what fits. Done works from the first tap.</p>'
      + '<div class="btnrow"><button class="btn" id="capDoneTop" type="button">Done</button></div></div>';
  }

  /* 1 — Who is present (their own ops first, rebrands verbatim) */
  h += '<div class="card"><h3>1. Who is present</h3>';
  if(atlas.pieces.length){
    h += '<div class="chiprow">' + atlas.pieces.map(function(p){
      var on = d.whoIds.indexOf(p.id) !== -1;
      return '<button type="button" class="chip'+(on ? " on" : "")+'" data-who="'+p.id+'">'+esc(p.name)+'</button>';
    }).join("") + '</div>';
  }
  h += capChips("whoFlags", WHO_FLAG_OPTS, d.whoFlags, true);
  h += '<input type="text" class="txt" id="capWhoOwn" value="'+esc(d.whoOwn)+'" placeholder="In my own words (optional)" aria-label="Who is present, in my own words">';

  /* Path E — identity capture, inline, right now */
  if(newPieceWanted()){
    h += '<hr class="divider"><h3>The new one \u2014 captured now</h3>';
    h += '<p class="field-label">Its name</p>';
    h += '<input type="text" class="txt" id="npName" value="'+esc(d.newPiece.name)+'" placeholder="The name as you know it \u2014 or a name you\u2019re giving it" aria-label="Name">';
    h += '<div class="chiprow"><button type="button" class="chip'+(d.newPiece.noName ? " on" : "")+'" id="npNoName">No name yet</button></div>';
    h += '<p class="field-label">Who it is like</p>';
    h += capChips("npLikeness", LIKENESS_OPTS, d.newPiece.likeness, false);
    h += '<p class="field-label">New or known</p>';
    h += capChips("npStatus", [["new","New \u2014 first time"],["known","I\u2019ve met this one before"]], d.newPiece.status, false);
    h += '<p class="field-label">Standing <span class="muted" style="font-weight:400">(optional \u2014 yours to make or not)</span></p>';
    h += '<div class="chiprow"><button type="button" class="chip'+(d.newPiece.standing ? " on" : "")+'" id="npStanding">It stands for something that happened</button></div>';
  }
  h += '</div>';

  /* 2 — What came through (channels combine into one event) */
  h += '<div class="card"><h3>2. What came through</h3>';

  h += capChips("channels", CHANNEL_OPTS, d.channels, true);
  h += '</div>';

  /* 3 — Manner and position (when a voice or presence is in the event) */
  if(hasPresence()){
    h += '<div class="card"><h3>3. Manner and position</h3>';
    h += '<p class="field-label">Where it was</p>';
    h += capChips("mannerWhere", WHERE_OPTS, d.mannerWhere, true);
    h += '<p class="field-label">How it came through</p>';
    h += capChips("mannerHow", HOW_OPTS, d.mannerHow, true);
    var showSpots = d.mannerWhere.indexOf("In a part of my body") !== -1
      || d.channels.indexOf("A feeling in my body") !== -1
      || d.channels.indexOf("Pain") !== -1 || d.channels.indexOf("Being touched") !== -1;
    if(showSpots){
      h += '<p class="field-label">Where in the body</p>';
      var spots = learnedBodySpots();
      if(spots.length) h += capChips("bodySpots", spots, d.bodySpots, true);
      h += '<input type="text" class="txt" id="capSpotOwn" value="'+esc(d.bodySpotOwn)+'" placeholder="A body spot, in my own words (optional)" aria-label="Body spot">';
    }
    h += '</div>';
  }

  /* 4 — Voices among themselves */
  if(amongShown){
    h += '<div class="card"><h3>'+(hasPresence() ? 4 : 3)+'. Among themselves</h3>';
  
    h += capChips("among", AMONG_OPTS, d.among, true);
    h += '</div>';
  }

  /* 5 — What they're doing: claims log to the ledger from here (Path F) */
  h += '<div class="card"><h3>'+claimsNo+'. What they\u2019re doing \u2014 claims</h3>';

  h += capChips("claimKind", [["prediction","A prediction \u2014 something would happen"],["now","A claim about right now"],["commentary","Running commentary"],["announcement","An announcement"], ["instruction","Not a claim \u2014 an instruction"]], d.claimKind, false);
  if(d.claimKind){
    h += capChips("claimChips", CLAIM_SUBS[d.claimKind], d.claimChips, true);
    if(d.claimKind === "now") h += '<p class="muted small">If it charged you with something it won\u2019t say plainly, the record holds the question open: <strong>not yet understandable</strong>. It is never marked nonsense, and the app never closes it.</p>';
    h += '<p class="field-label">The claim, in my own words <span class="muted" style="font-weight:400">(optional)</span></p>';
    h += '<textarea class="big short" id="capClaimOwn" placeholder="What was claimed" aria-label="The claim in my own words">'+esc(d.claimOwn)+'</textarea>';
    h += '<p class="field-label">Who said it</p>';
    h += capChips("claimWho", claimWhoOptions(), d.claimWhoId || (claimWhoOptions().length ? claimWhoOptions()[0][0] : ""), false);
    h += '<p class="field-label">My response <span class="muted" style="font-weight:400">(optional)</span></p>';
    h += capChips("response", ["I answered back","It argued with what I decided"], d.response, true);
  }
  h += '</div>';

  /* 6 — How they presented (Path G) */
  h += '<div class="card"><h3>How they presented</h3>';

  h += '<div class="chiprow">' + REGISTER_OPTS_CAP.map(function(o){
    var on = d.register.indexOf(o[0]) !== -1;
    return '<button type="button" class="chip'+(on ? " on" : "")+'" data-capchip="register" data-val="'+esc(o[0])+'">'+esc(o[0])+(o[1] ? '<small>'+esc(o[1])+'</small>' : '')+'</button>';
  }).join("") + '</div>';
  h += '</div>';

  /* 7 — How you see them (Path H — the top layer; own words lead) */
  h += '<div class="card"><h3>How you see them</h3>';
  h += '<p class="muted small">Your seeing is the top layer.</p>';
  h += '<textarea class="big short" id="capSeeingOwn" placeholder="In my own words (optional)" aria-label="How I see them, in my own words">'+esc(d.seeingOwn)+'</textarea>';
  h += capChips("seeingChip", SEEING_OPTS, d.seeingChip, false);
  h += '</div>';

  /* 8 — Optional filings: their own words (Path I) */
  h += '<div class="card"><h3>File a word they use <span class="muted" style="font-weight:400">(optional)</span></h3>';

  h += '<input type="text" class="txt" id="capGlossTerm" value="'+esc(d.glossTerm)+'" placeholder="The word \u2014 e.g. biscuit" aria-label="A word they use">';
  if(d.glossTerm){
    h += '<p class="field-label">What it means / what it does</p>';
    h += capChips("glossDoes", GLOSS_DOES_OPTS, d.glossDoes, false);
    h += '<input type="text" class="txt" id="capGlossOwn" value="'+esc(d.glossDoesOwn)+'" placeholder="In my own words (optional)" aria-label="What the word does, in my own words">';
  }
  h += '<p class="field-label">Anything else, in my own words <span class="muted" style="font-weight:400">(optional)</span></p>';
  h += '<textarea class="big short" id="capEventOwn" placeholder="Whatever else belongs in the record" aria-label="Anything else">'+esc(d.eventOwn)+'</textarea>';
  h += '<div class="btnrow"><button class="btn" id="capDone" type="button">Done \u2014 review</button>'
    + '<button class="btn quiet" id="capDiscard" type="button">'+(d.editEventId ? "Cancel \u2014 keep it as it was" : "Don\u2019t file this")+'</button></div>';
  h += '</div>';
  return h;
}
function harvestCap(){
  if(!cap) return;
  var m = {capWhoOwn:"whoOwn", npName:null, capSpotOwn:"bodySpotOwn", capClaimOwn:"claimOwn",
           capSeeingOwn:"seeingOwn", capGlossTerm:"glossTerm", capGlossOwn:"glossDoesOwn", capEventOwn:"eventOwn"};
  Object.keys(m).forEach(function(id){
    var node = el(id);
    if(!node) return;
    if(id === "npName"){ cap.newPiece.name = node.value.trim(); }
    else cap[m[id]] = node.value;
  });
  var pt = el("pourText"); if(pt && cap.mode === "pour") cap.pourText = pt.value;
}
function toggleIn(arr, val){ var i = arr.indexOf(val); if(i === -1) arr.push(val); else arr.splice(i,1); }
function bindCapture(){
  document.querySelectorAll("[data-who]").forEach(function(b){
    b.addEventListener("click", function(){ harvestCap(); toggleIn(cap.whoIds, b.getAttribute("data-who")); render(); });
  });
  document.querySelectorAll("[data-capchip]").forEach(function(b){
    b.addEventListener("click", function(){
      harvestCap();
      var g = b.getAttribute("data-capchip"), val = b.getAttribute("data-val");
      if(g === "whoFlags") toggleIn(cap.whoFlags, val);
      else if(g === "channels") toggleIn(cap.channels, val);
      else if(g === "mannerWhere") toggleIn(cap.mannerWhere, val);
      else if(g === "mannerHow") toggleIn(cap.mannerHow, val);
      else if(g === "bodySpots") toggleIn(cap.bodySpots, val);
      else if(g === "among") toggleIn(cap.among, val);
      else if(g === "claimKind"){ cap.claimKind = (cap.claimKind === val) ? "" : val; cap.claimChips = []; }
      else if(g === "claimChips") toggleIn(cap.claimChips, val);
      else if(g === "claimWho") cap.claimWhoId = val;
      else if(g === "response") toggleIn(cap.response, val);
      else if(g === "register") toggleIn(cap.register, val);
      else if(g === "seeingChip") cap.seeingChip = (cap.seeingChip === val) ? "" : val;
      else if(g === "glossDoes") cap.glossDoes = (cap.glossDoes === val) ? "" : val;
      else if(g === "npLikeness") cap.newPiece.likeness = val;
      else if(g === "npStatus") cap.newPiece.status = val;
      render();
    });
  });
  var nn = el("npNoName");
  if(nn) nn.addEventListener("click", function(){ harvestCap(); cap.newPiece.noName = !cap.newPiece.noName; render(); });
  var ns = el("npStanding");
  if(ns) ns.addEventListener("click", function(){ harvestCap(); cap.newPiece.standing = !cap.newPiece.standing; render(); });
  var jp = el("capJustPour");
  if(jp) jp.addEventListener("click", function(){ harvestCap(); go("confirm"); });
  var dt = el("capDoneTop");
  if(dt) dt.addEventListener("click", function(){ harvestCap(); go("confirm"); });
  el("capDone").addEventListener("click", function(){ harvestCap(); go("confirm"); });
  el("capDiscard").addEventListener("click", function(){
    if(cap && cap.editEventId){ cap = null; toast = "Left as it was."; go("map"); }
    else { cap = null; toast = "Not filed."; go("home"); }
  });
}
function viewPour(){
  var h = '<div class="card quiet-screen"><h2>Pour it out</h2>'
    + '<p class="lede">'+esc(companion.name)+' is listening. Take your time.</p>'
    + '<p class="muted">Nothing is filed while you pour.</p>';
  if(atlas.pieces.length){
    h += '<p class="field-label">Who\u2019s in it (optional)</p>';
    h += '<div class="chiprow">' + atlas.pieces.map(function(p){
      var on = cap.pourWhoIds.indexOf(p.id) !== -1;
      return '<button type="button" class="chip'+(on ? " on" : "")+'" data-pourwho="'+p.id+'">'+esc(p.name)+'</button>';
    }).join("") + '</div>';
  }
  h += '<textarea class="big" id="pourText" style="min-height:34vh" placeholder="It all goes here\u2026" aria-label="Pour it out">'+esc(cap.pourText)+'</textarea>'
    + '<div class="btnrow"><button class="btn" id="pourDone" type="button">Done pouring</button>'
    + '<button class="btn secondary" id="pourQuick" type="button">Just a quick note instead</button>'
    + '<button class="btn quiet" id="pourNever" type="button">Never mind</button></div></div>';
  return h;
}
function bindPour(){
  document.querySelectorAll("[data-pourwho]").forEach(function(b){
    b.addEventListener("click", function(){
      var pt = el("pourText"); if(pt) cap.pourText = pt.value;
      toggleIn(cap.pourWhoIds, b.getAttribute("data-pourwho"));
      render();
    });
  });
  el("pourDone").addEventListener("click", function(){
    cap.pourText = el("pourText").value;
    startProposals();
  });
  el("pourQuick").addEventListener("click", function(){ cap = null; startQuickNote(); });

/* ================= Confirm / file the capture ================= */
function claimTextOf(d){
  if(d.claimOwn && d.claimOwn.trim()) return d.claimOwn.trim();
  return d.claimChips.join("; ");
}
function claimWhoOf(d){
  var opts = claimWhoOptions();
  var chosen = d.claimWhoId || (opts.length ? opts[0][0] : "");
  if(chosen === "__new") return {id:"__new", name: d.newPiece.name || "The new one"};
  if(chosen){ var p = pieceById(chosen); if(p) return {id:p.id, name:p.name}; }
  return {id:"", name:""};
}
function defaultPieceName(){
  var t = newPieceType();
  if(cap.newPiece.name) return cap.newPiece.name;
  if(t === "presence") return "A presence";
  if(t === "group") return "A group";
  return "Unnamed one";
}
function summaryList(items){
  if(!items.length) return "";

}
function viewConfirm(){

  }

  if(newPieceWanted()) whoNames.push(esc(defaultPieceName()) + " (new)");
  if(d.whoOwn) whoNames.push(esc(d.whoOwn));
  if(d.whoFlags.indexOf("noises") !== -1) whoNames.push("Just noises");
  if(d.whoFlags.indexOf("bodyonly") !== -1) whoNames.push("No one \u2014 body only");
  if(d.whoFlags.indexOf("toomany") !== -1) whoNames.push("Too many to count");
  if(whoNames.length) h += '<h3>Who</h3>' + summaryList(whoNames);

/* ---- Add detail: reopen a filed entry in the full trees, edit in place ---- */
function startEditCapture(ev){
  cap = blankCap();
  cap.editEventId = ev.id;
  cap.mode = ev.mode === "pour" ? "pour" : "quick";
  cap.pourText = ev.pourText || "";
  cap.whoIds = (ev.whoIds || []).slice();
  /* piece-creating flags are stripped: those pieces already exist in whoIds */
  cap.whoFlags = (ev.whoFlags || []).filter(function(f){
    return ["new","knownnew","group","presence","notperson"].indexOf(f) === -1;
  });
  cap.whoOwn = ev.whoOwn || "";
  cap.channels = (ev.channels || []).slice();
  cap.mannerWhere = (ev.mannerWhere || []).slice();
  cap.mannerHow = (ev.mannerHow || []).slice();
  cap.bodySpots = (ev.bodySpots || []).slice();
  cap.among = (ev.among || []).slice();
  cap.register = (ev.register || []).slice();
  cap.response = (ev.response || []).slice();
  cap.seeingOwn = ev.seeing || "";
  cap.eventOwn = ev.eventOwn || ev.fragmentText || "";
  if(ev.claimLedgerId){
    for(var i=0;i<ledger.entries.length;i++){
      if(ledger.entries[i].id === ev.claimLedgerId){
        var le = ledger.entries[i];
        cap.claimKind = le.kind || "";
        cap.claimOwn = le.claim || "";
        cap.claimWhoId = le.whoId || "";
        if(le.encoded) cap.claimChips = ["It charged me with something it won\u2019t say plainly"];
        break;
      }
    }
  }
  go("capture");
}
/* Piece tallies (channels, registers) are counts built from events. When an
   entry is edited, its old contribution is lifted out before the new one is
   laid in. Body spots and seeing are left as-is on removal: both are unions
   across the whole record, and unlearning them from one edit could erase
   what other entries taught. */
function adjustPiecesForEvent(ev, dir){
  (ev.whoIds || []).forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    (ev.channels || []).forEach(function(c){
      pc.channels[c] = (pc.channels[c] || 0) + dir;
      if(pc.channels[c] <= 0) delete pc.channels[c];
    });
    (ev.register || []).forEach(function(r){
      pc.registers[r] = (pc.registers[r] || 0) + dir;
      if(pc.registers[r] <= 0) delete pc.registers[r];
    });
  });
}
function bindConfirm(){
  el("cfFile").addEventListener("click", function(){ fileCapture(); });
  el("cfFix").addEventListener("click", function(){ go("capture"); });
  el("cfDrop").addEventListener("click", function(){ cap = null; toast = "Not filed."; go("home"); });
}
function fileCapture(){
  var d = cap;
  var ts = Date.now();
  var editingEv = null;
  if(d.editEventId){
    for(var ei=0;ei<atlas.events.length;ei++){
      if(atlas.events[ei].id === d.editEventId){ editingEv = atlas.events[ei]; break; }
    }
    if(editingEv){ adjustPiecesForEvent(editingEv, -1); ts = editingEv.ts; }
  }
  var involved = d.whoIds.slice();
  var newId = "";
  if(newPieceWanted()){
    newId = uid();
    var p = {
      id:newId, name: defaultPieceName(),
      nameHistory:[{name: defaultPieceName(), ts:ts}],
      type: newPieceType(), likeness: d.newPiece.likeness || "", status: d.newPiece.status || "",
      standing: !!d.newPiece.standing,
      seeing:"", seeingTs:0, registers:{}, channels:{}, bodySpots:[], created:ts
    };
    atlas.pieces.push(p);
    involved.push(newId);
  }
  var seeing = d.seeingOwn.trim() || d.seeingChip;
  var spots = d.bodySpots.slice(); if(d.bodySpotOwn) uniqPush(spots, d.bodySpotOwn.trim());
  involved.forEach(function(id){
    var pc = pieceById(id); if(!pc) return;
    d.channels.forEach(function(c){ pc.channels[c] = (pc.channels[c]||0) + 1; });
    d.register.forEach(function(r){ pc.registers[r] = (pc.registers[r]||0) + 1; });
    spots.forEach(function(s){ uniqPush(pc.bodySpots, s); });
    if(seeing){ pc.seeing = seeing; pc.seeingTs = ts; }
  });
  var ledgerId = "";
  var editingOldLedgerId = editingEv ? (editingEv.claimLedgerId || "") : "";
  if(d.claimKind){
    var cw = claimWhoOf(d);
    var whoId = cw.id === "__new" ? newId : cw.id;
    var claimFields = {
      claim: claimTextOf(d), kind: d.claimKind,
      who: cw.id === "__new" ? defaultPieceName() : cw.name, whoId: whoId || "",
      encoded: d.claimChips.indexOf("It charged me with something it won\u2019t say plainly") !== -1
    };
    var updatedOld = false;
    var newClaimEntry = null;
    if(editingOldLedgerId){
      ledger.entries.forEach(function(e){
        if(e.id === editingOldLedgerId){
          e.claim = claimFields.claim; e.kind = claimFields.kind;
          e.who = claimFields.who; e.whoId = claimFields.whoId; e.encoded = claimFields.encoded;
          ledgerId = e.id; updatedOld = true;
        }
      });
    }
    if(!updatedOld){
      ledgerId = uid();
      ledger.entries.push({
        id:ledgerId, claim: claimFields.claim, kind: claimFields.kind,
        who: claimFields.who, whoId: claimFields.whoId,
        ts:ts, outcome:"", outcomeChip:"", tsOutcome:0,
        encoded: claimFields.encoded
      });
      newClaimEntry = ledger.entries[ledger.entries.length - 1];
    }
    saveLedger();
    if(newClaimEntry) maybePostPrecedent(newClaimEntry);
  } else if(editingOldLedgerId){
    /* the claim was removed in Add detail — its ledger entry goes with it */
    ledger.entries = ledger.entries.filter(function(e){ return e.id !== editingOldLedgerId; });
    saveLedger();
  }
  var glossId = "";
  if(d.glossTerm){
    glossId = uid();
    atlas.glossary.push({
      id:glossId, term:d.glossTerm.trim(), does:d.glossDoes || "", doesOwn:d.glossDoesOwn || "",
      whoIds: involved.slice(),
      whoText: involved.map(function(id){ return pieceName(id); }).filter(Boolean).join(", "),
      ts:ts
    });
  }
  var evFields = {
    mode:d.mode, pourText:d.pourText || "",
    whoIds: involved, whoFlags: d.whoFlags.slice(), whoOwn: d.whoOwn,
    channels: d.channels.slice(), mannerWhere: d.mannerWhere.slice(), mannerHow: d.mannerHow.slice(),
    bodySpots: spots, among: d.among.slice(),
    claimLedgerId: ledgerId, register: d.register.slice(),
    seeing: seeing, response: d.response.slice(),
    glossaryId: glossId || (editingEv ? (editingEv.glossaryId || "") : ""), eventOwn: d.eventOwn
  };
  if(editingEv){
    Object.keys(evFields).forEach(function(k){ editingEv[k] = evFields[k]; });
    /* enriched: a fragment that gains detail becomes a full entry */
    delete editingEv.type; delete editingEv.fragmentText; delete editingEv.filed;
  } else {
    evFields.id = uid(); evFields.ts = ts;
    atlas.events.push(evFields);
  }
  saveAtlas();
  cap = null;
  toast = editingEv ? "Updated." : "Filed.";
  if(threadDoor && d.mode === "pour" && !editingEv){ threadDoor = false; go("home"); } else { go("map"); }
}

/* ================= Screen 5 — Map (your atlas) ================= */
var TYPE_LABELS = {voice:"Voice", presence:"Felt presence", group:"Group", other:"Not a person, exactly"};
function topKeys(counts, n){
  return Object.keys(counts || {}).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, n || 4);
}
function miniChips(items){
  if(!items.length) return "";
  return '<div class="mini-chips">' + items.map(function(i){ return '<span>'+esc(i)+'</span>'; }).join("") + '</div>';
}
function receiptsLine(p){
  var r = receiptsForPiece(p);
  if(!r.total) return '<p class="muted small">No claims in the ledger yet.</p>';
  return '<p class="small">Receipts: '+r.total+(r.total===1?" claim":" claims")+' logged, '+r.checked+' checked'
    + (r.checked ? ' \u2014 '+r.held+' held up, '+r.didnt+' didn\u2019t' : '')
    + (r.open ? ', '+r.open+' still open' : '') + '.</p>';
}
function viewMap(){
  var h = '<div class="card"><h2>Your map</h2>'

  }

    h += '<div class="card piece-card" data-piece="'+p.id+'">';

    if(p.seeing) h += '<div class="seeing-box"><span class="lab">How I see them</span><br>'+esc(p.seeing)+'</div>';
    var regs = topKeys(p.registers, 4);
    if(regs.length) h += '<p class="small" style="margin-bottom:2px"><strong>How they present:</strong></p>' + miniChips(regs);
    var chans = topKeys(p.channels, 4);
    if(chans.length) h += '<p class="small" style="margin-bottom:2px"><strong>Usual channels:</strong></p>' + miniChips(chans);
    if(p.bodySpots && p.bodySpots.length) h += '<p class="small" style="margin-bottom:2px"><strong>Body spots:</strong></p>' + miniChips(p.bodySpots);
    h += receiptsLine(p);

    h += '</div>';
  });
  if(atlas.glossary.length){
    h += '<div class="card"><h2>Their own words</h2>'
      + '<p class="muted small">Their terms \u2014 and what each one does.</p>';
    atlas.glossary.forEach(function(g){
      h += '<div class="ledger-entry"><div class="claim-text">&ldquo;'+esc(g.term)+'&rdquo;</div>'
        + '<div class="small">'+esc(g.does || "")+(g.doesOwn ? (g.does ? " \u2014 " : "") + esc(g.doesOwn) : "")+'</div>'
        + (g.whoText ? '<div class="muted small">Used by: '+esc(g.whoText)+'</div>' : "")
        + '</div>';
    });
    h += '</div>';
  }
  if(atlas.events.length){
    h += '<div class="card"><h2>Recent captures</h2>';
    atlas.events.slice().sort(function(a,b){ return b.ts - a.ts; }).slice(0,5).forEach(function(ev){
      var names = (ev.whoIds||[]).map(function(id){ return pieceName(id); }).filter(Boolean).join(", ");
      var isFrag = ev.mode === "fragment" || ev.type === "fragment";
      var evText = ev.fragmentText || ev.pourText || "";
      h += '<div class="ledger-entry"><div class="small"><strong>'+esc(fmtDate(ev.ts))+'</strong>'
        + (names ? ' \u2014 ' + esc(names) : '') + (ev.mode === "pour" ? ' \u2014 a pour' : '') + (isFrag ? ' \u2014 <strong>Fragment</strong>' : '') + '</div>'
        + (evText ? '<div class="small muted">'+esc(evText.length > 140 ? evText.slice(0,140)+"\u2026" : evText)+'</div>' : "")
        + (ev.channels && ev.channels.length ? '<div class="small muted">'+esc(ev.channels.join(" \u00b7 "))+'</div>' : "")
        + '<div style="margin-top:4px"><button type="button" class="btn quiet small" data-detail="'+ev.id+'">Add detail</button></div>'
        + '</div>';
    });
    h += '</div>';
  }
  return h;
}
function bindMap(){

var pieceGlossDoesSel = "";
function bindPiece(){
  var p = pieceById(pieceDetailId);

  document.querySelectorAll("[data-capchip]").forEach(function(b){

var receiptKindSel = "prediction";
function ledgerEntryHTML(e, isOpen){

    h += '<p class="small" style="margin:8px 0 0"><strong>What exactly did they say I did wrong?</strong> The record holds this question open: <strong>not yet understandable</strong>. It is never marked nonsense, and the app never closes it.</p>';

      + '<button type="button" class="chip" data-rout="'+e.id+':happened">It happened</button>'

      + ((!e.doorsPosted && !e.doorsDismissed && !(e.move && e.move.trim())) ? '<button class="btn quiet small" data-doors="'+e.id+'" type="button">Doors?</button>' : '') + '</div>';

    h += '<div class="btnrow"><button class="btn quiet small" data-del="'+e.id+'" type="button">Delete</button></div>';

function trackRecordHTML(){
  var byWho = {};

  });
  var names = Object.keys(byWho);

  var h = '<div class="card"><h2>Track records</h2>'
    + '<p class="muted small">The app counts. You conclude.</p>';
  names.sort().forEach(function(name){
    var mine = byWho[name];
    var checked = mine.filter(isChecked);
    var held = checked.filter(heldUp).length;
    var didnt = checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length;
    h += '<p class="small"><strong>'+esc(name)+'</strong> \u2014 '+mine.length+(mine.length===1?" claim":" claims")
      + ', '+checked.length+' checked'
      + (checked.length ? ', '+held+' held up, '+didnt+' didn\u2019t' : '')
      + (mine.length - checked.length ? ', '+(mine.length - checked.length)+' still open' : '') + '.</p>';
  });
