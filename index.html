    });
  });
  document.querySelectorAll("[data-close]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-close");
      var ta = el("out_" + id);
      var val = ta ? ta.value.trim() : "";
      var mvEl = el("move_" + id);
      var mv = mvEl ? mvEl.value.trim() : "";
      if(!val && !mv){ if(ta) ta.focus(); return; }
      if(mv) saveMove(id, mv);
      if(val) setOutcome(id, "", val);
      render(); window.scrollTo(0,0);
    });
  });
  document.querySelectorAll("[data-doors]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-doors");
      ledger.entries.forEach(function(x){
        if(x.id === id && !x.doorsPosted && !x.doorsDismissed) postDoors(x);
      });
      go("home");
    });
  });
  document.querySelectorAll("[data-moveask]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-moveask");
      ledger.entries.forEach(function(x){ if(x.id === id) x.moveAsked = true; });
      saveLedger();
      moveEditId = id;
      render();
    });
  });
  document.querySelectorAll("[data-moveskip]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-moveskip");
      ledger.entries.forEach(function(x){ if(x.id === id) x.moveAsked = true; });
      saveLedger();
      render();
    });
  });
  document.querySelectorAll("[data-moveadd]").forEach(function(b){
    b.addEventListener("click", function(){ moveEditId = b.getAttribute("data-moveadd"); render(); });
  });
  document.querySelectorAll("[data-movesave]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-movesave");
      var ta = el("moveedit_" + id);
      var mv = ta ? ta.value.trim() : "";
      if(mv){ saveMove(id, mv); moveEditId = ""; toast = "Saved."; }
      render();
    });
  });
  document.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-del");
      if(!confirm("Delete this ledger entry?")) return;
      ledger.entries = ledger.entries.filter(function(e){ return e.id !== id; });
      saveLedger(); render();
    });
  });
}

/* ================= Screen 7 — Journal ================= */
function journalPrompts(){
  var prompts = [
    "What did they claim this week that never happened?",
    "Which voice has been quiet lately \u2014 and what changed?",
    "Write the moment they defined for you, in your words instead."
  ];
  var pers = [];
  /* a quiet op, named */
  var lastSeen = {};
  atlas.events.forEach(function(ev){ (ev.whoIds||[]).forEach(function(id){
    if(!lastSeen[id] || ev.ts > lastSeen[id]) lastSeen[id] = ev.ts;
  }); });
  var quietId = "", quietTs = Infinity;
  Object.keys(lastSeen).forEach(function(id){ if(lastSeen[id] < quietTs){ quietTs = lastSeen[id]; quietId = id; } });
  if(quietId && Date.now() - quietTs > 86400000){
    var qp = pieceById(quietId);
    if(qp) pers.push(qp.name + " has been quiet since " + relDay(quietTs) + ". What\u2019s different?");
  }
  /* an unchecked claim, named */
  var open = openClaims();
  if(open.length) pers.push("Still open in the ledger: \u201c" + open[0].claim + "\u201d What has actually happened since?");
  /* a claim that failed, named */
  var failed = ledger.entries.filter(function(e){ return e.outcomeChip === "didnt"; });
  if(failed.length){
    var f = failed[failed.length - 1];
    pers.push((f.who ? f.who : "A voice") + " claimed \u201c" + f.claim + "\u201d \u2014 and it didn\u2019t happen. What does their record look like now?");
  }
  return pers.concat(prompts);
}
function viewJournal(){
  var h = '<div class="card"><h2>Journal</h2>'
    + '<p class="lede muted">For calm times. Entries are never summarized or filed anywhere else.</p></div>';
  h += '<div class="card"><h3>Prompts</h3>';
  journalPrompts().forEach(function(pr, i){
    h += '<button type="button" class="card prompt-card" data-prompt="'+i+'">'+esc(pr)+'</button>';
  });
  h += '<div class="btnrow"><button class="btn" id="jBlank" type="button">Blank page</button></div></div>';
  if(journal.entries.length){
    h += '<div class="card"><h2>Past entries</h2>';
    journal.entries.slice().sort(function(a,b){ return b.ts - a.ts; }).forEach(function(en){
      h += '<div class="ledger-entry" data-entry="'+en.id+'" style="cursor:pointer">'
        + '<div class="muted small">'+esc(fmtDate(en.ts))+(en.prompt ? ' \u2014 ' + esc(en.prompt) : '')+'</div>'
        + '<div class="small">'+esc(en.text.length > 160 ? en.text.slice(0,160) + "\u2026" : en.text)+'</div></div>';
    });
    h += '</div>';
  }
  return h;
}
var currentPrompts = [];
function bindJournal(){
  currentPrompts = journalPrompts();
  currentPrompts.forEach(function(_, i){
    document.querySelectorAll("[data-prompt='"+i+"']").forEach(function(b){
      b.addEventListener("click", function(){ journalPrompt = currentPrompts[i]; go("journalWrite"); });
    });
  });
  el("jBlank").addEventListener("click", function(){ journalPrompt = ""; go("journalWrite"); });
  document.querySelectorAll("[data-entry]").forEach(function(row){
    row.addEventListener("click", function(){ journalReadId = row.getAttribute("data-entry"); go("journalRead"); });
  });
}
function viewJournalWrite(){
  var h = '<div class="card"><button class="btn quiet small" id="jwBack" type="button">\u2190 Journal</button>';
  if(journalPrompt) h += '<p class="lede" style="margin-top:10px">'+esc(journalPrompt)+'</p>';
  h += '<textarea class="big" id="jwText" style="min-height:34vh" placeholder="Your words\u2026" aria-label="Journal entry"></textarea>'
    + '<div class="btnrow"><button class="btn" id="jwSave" type="button">Save</button>'
    + '<button class="btn quiet" id="jwDiscard" type="button">Discard</button></div></div>';
  return h;
}
function bindJournalWrite(){
  el("jwBack").addEventListener("click", function(){ go("journal"); });
  el("jwDiscard").addEventListener("click", function(){ go("journal"); });
  el("jwSave").addEventListener("click", function(){
    var t = el("jwText").value.trim();
    if(!t){ el("jwText").focus(); return; }
    journal.entries.push({id:uid(), ts:Date.now(), prompt:journalPrompt, text:t});
    saveJournal(); journalPrompt = "";
    toast = "Saved.";
    go("journal");
  });
}
function viewJournalRead(){
  var en = null;
  journal.entries.forEach(function(x){ if(x.id === journalReadId) en = x; });
  if(!en) return '<div class="card"><p class="empty">That entry isn\u2019t here anymore.</p></div>';
  var h = '<div class="card"><button class="btn quiet small" id="jrBack" type="button">\u2190 Journal</button>'
    + '<p class="muted small" style="margin-top:10px">'+esc(fmtDate(en.ts))+'</p>'
    + (en.prompt ? '<p class="lede">'+esc(en.prompt)+'</p>' : '')
    + '<p style="white-space:pre-wrap">'+esc(en.text)+'</p>'
    + '<hr class="divider"><div class="btnrow"><button class="btn danger small" id="jrErase" type="button">Erase this entry</button></div></div>';
  return h;
}
function bindJournalRead(){
  el("jrBack").addEventListener("click", function(){ go("journal"); });
  var er = el("jrErase");
  if(er) er.addEventListener("click", function(){
    if(!confirm("Erase this journal entry?")) return;
    journal.entries = journal.entries.filter(function(x){ return x.id !== journalReadId; });
    saveJournal(); journalReadId = null;
    toast = "Entry erased.";
    go("journal");
  });
}

/* ================= Screen 8 — Help button + help ladder ================= */
var helpReturn = "home";
var ladderReturn = "help";
function viewHelp(){
  var t = allReceiptTallies();
  var h = '<div class="card" style="margin-top:10px">';
  h += '<button class="btn quiet small" id="helpBack" type="button">\u2190 Back</button>';
  h += '<h2 style="margin-top:8px">Help, your way</h2>';
  h += '<p class="lede muted">Sometimes you just need help. This connects you outward \u2014 it never alerts or notifies anyone behind your back, and pressing it writes nothing down. No log of help-seeking is kept, anywhere.</p>';

  /* rung 1 — reassurance, from the person's own record */
  h += '<div class="rung"><h3>Reassurance \u2014 from your own record</h3>';
  if(ladder.noteForHardDay){
    h += '<p class="muted small">A note you wrote on a calm day, for a hard one:</p>';
    h += '<div class="hardday-note">'+esc(ladder.noteForHardDay)+'</div>';
  }
  if(t.total){
    h += '<p>The claims have a track record, and you can check it: '+t.total+(t.total===1?" claim":" claims")+' logged, '
      + t.checked+' checked' + (t.checked ? ' \u2014 '+t.held+' held up, '+t.didnt+' didn\u2019t' : '') + '.</p>';
    h += '<div class="btnrow"><button class="btn secondary small" id="helpReceipts" type="button">Check the receipts</button></div>';
  }
  if(!ladder.noteForHardDay && !t.total){
    h += '<p>You are the one who keeps this record. Their claims have a track record, and you can check it.</p>';
  }
  if(!ladder.noteForHardDay){
    h += '<div class="btnrow"><button class="btn quiet small" id="helpNote" type="button">Write a note for a hard day</button></div>';
  }
  h += '</div>';

  /* rung 2 — a person */
  h += '<div class="rung"><h3>A person</h3>';
  if(ladder.contacts.length){
    ladder.contacts.forEach(function(c){
      h += '<p><strong>'+esc(c.name)+'</strong><br>'
        + '<a class="call-link" href="tel:'+esc(c.phone)+'">Call</a>'
        + '<a class="call-link" href="sms:'+esc(c.phone)+'">Text</a></p>';
    });
  } else {
    h += '<p class="muted">Circles and the people features arrive in a later phase \u2014 in v1, nothing shared leaves this phone. You can still put a person you trust on this rung.</p>';
  }
  h += '<div class="btnrow"><button class="btn secondary small" id="helpArrange" type="button">Arrange my ladder</button></div>';
  h += '</div>';

  /* rung 3 — a professional: live from first open, no setup, never removable */
  h += '<div class="rung far"><h3>Speak with a professional</h3>';
  h += '<p><strong>988 Suicide and Crisis Lifeline</strong> (US)<br>'
    + '<a class="call-link far" href="tel:988">Call 988</a>'
    + '<a class="call-link far" href="sms:988">Text 988</a></p>';
  h += '<p><strong>Crisis Text Line</strong><br>'
    + '<a class="call-link far" href="sms:741741?&amp;body=HOME">Text HOME to 741741</a></p>';
  if(ladder.clinician && ladder.clinician.phone){
    h += '<p><strong>'+esc(ladder.clinician.name || "My clinician")+'</strong><br>'
      + '<a class="call-link far" href="tel:'+esc(ladder.clinician.phone)+'">Call '+esc(ladder.clinician.phone)+'</a></p>';
  }
  h += '<p class="muted small">These standard routes stay on your ladder and can\u2019t be removed by accident. Stepping up from any rung is one tap \u2014 no gates, no \u201care you sure.\u201d</p>';
  h += '</div></div>';
  return h;
}
function bindHelp(){
  el("helpBack").addEventListener("click", function(){ go(helpReturn || "home"); });
  var r = el("helpReceipts"); if(r) r.addEventListener("click", function(){ go("receipts"); });
  var n = el("helpNote"); if(n) n.addEventListener("click", function(){ ladderReturn = "help"; go("ladder"); });
  el("helpArrange").addEventListener("click", function(){ ladderReturn = "help"; go("ladder"); });
}

/* ---- arrange the ladder (owner-authored, in calm times, skippable) ---- */
function viewLadder(){
  var h = '<div class="card" style="margin-top:10px">';
  h += '<button class="btn quiet small" id="ladBack" type="button">\u2190 Back</button>';
  h += '<h2 style="margin-top:8px">Arrange your help ladder</h2>';
  h += '<p class="lede muted">Yours to arrange. Stored on this phone only.</p>';
  h += '<h3>A note for a hard day</h3>';
  h += '<p class="muted small">From a calm day, for a hard one.</p>';
  h += '<textarea class="big" id="ladNote" style="min-height:14vh" placeholder="What a hard day needs to hear from you\u2026" aria-label="A note for a hard day">'+esc(ladder.noteForHardDay)+'</textarea>';
  h += '<div class="btnrow"><button class="btn small" id="ladNoteSave" type="button">Save note</button></div>';
  h += '<hr class="divider"><h3>A person</h3>';
  if(ladder.contacts.length){
    ladder.contacts.forEach(function(c, i){
      h += '<p class="small"><strong>'+esc(c.name)+'</strong> \u2014 '+esc(c.phone)
        + ' <button class="btn quiet small" data-delcontact="'+i+'" type="button">Remove</button></p>';
    });
  }
  h += '<input type="text" class="txt" id="ladCName" placeholder="Their name" aria-label="Contact name" style="margin-bottom:8px">';
  h += '<input type="tel" class="txt" id="ladCPhone" placeholder="Their number" aria-label="Contact number">';
  h += '<div class="btnrow"><button class="btn secondary small" id="ladCAdd" type="button">Add</button></div>';
  h += '<hr class="divider"><h3>My clinician or clinic</h3>';
  h += '<input type="text" class="txt" id="ladClinName" placeholder="Name (e.g. my clinic)" value="'+esc(ladder.clinician.name || "")+'" aria-label="Clinician name" style="margin-bottom:8px">';
  h += '<input type="tel" class="txt" id="ladClinPhone" placeholder="Number" value="'+esc(ladder.clinician.phone || "")+'" aria-label="Clinician number">';
  h += '<div class="btnrow"><button class="btn small" id="ladClinSave" type="button">Save</button></div>';
  h += '</div>';
  return h;
}
function bindLadder(){
  el("ladBack").addEventListener("click", function(){ go(ladderReturn || "help"); });
  el("ladNoteSave").addEventListener("click", function(){
    ladder.noteForHardDay = el("ladNote").value.trim();
    saveLadder(); toast = "Saved.";
    render();
  });
  el("ladCAdd").addEventListener("click", function(){
    var n = el("ladCName").value.trim(), ph = el("ladCPhone").value.trim();
    if(!n || !ph){ (n ? el("ladCPhone") : el("ladCName")).focus(); return; }
    ladder.contacts.push({name:n, phone:ph});
    saveLadder(); render();
  });
  document.querySelectorAll("[data-delcontact]").forEach(function(b){
    b.addEventListener("click", function(){
      ladder.contacts.splice(parseInt(b.getAttribute("data-delcontact"), 10), 1);
      saveLadder(); render();
    });
  });
  el("ladClinSave").addEventListener("click", function(){
    ladder.clinician = {name: el("ladClinName").value.trim(), phone: el("ladClinPhone").value.trim()};
    saveLadder(); toast = "Saved to your ladder\u2019s professional rung.";
    render();
  });
}

/* ================= Screen 9 — Settings ================= */
function viewSettings(){
  var c = companion;
  var h = '<div class="card"><h2>Settings</h2></div>';
  h += '<div class="card"><h2>Your companion</h2>';
  if(c){
    h += '<p><strong>'+esc(c.name)+'</strong></p>';
    h += '<p class="small muted">Talks: '+esc([c.register.join(", "), c.registerOwn].filter(Boolean).join(" \u00b7 ") || "\u2014")
      + '<br>Language: '+esc([c.language.join(", "), c.languageOwn].filter(Boolean).join(" \u00b7 ") || "\u2014")
      + '<br>Addresses you: '+esc(c.addressType === "none" ? "no name \u2014 just talks to you" : (c.addressValue || c.addressType))
      + '<br>Offers: '+esc(c.offerFreq === "freely" ? "freely" : c.offerFreq === "asked" ? "only when you ask" : "sometimes")+'</p>';
  }
  h += '<div class="btnrow"><button class="btn secondary" id="setCompanion" type="button">Reshape companion</button></div>';
  h += '<p class="muted small">Renaming or reshaping your companion never touches your map or your receipts.</p></div>';
  h += '<div class="card"><h2>The contract</h2>' + contractHTML() + '</div>';
  h += '<div class="card"><h2>Your help ladder</h2>'
    + '<p class="small muted">Your rungs: reassurance, a person, a professional.</p>'
    + '<div class="btnrow"><button class="btn secondary" id="setLadder" type="button">My ladder</button></div></div>';
  h += '<div class="card"><h2>Your clinician</h2>'
    + '<input type="text" class="txt" id="setClinName" placeholder="Name (e.g. my clinic)" value="'+esc(ladder.clinician.name || "")+'" aria-label="Clinician name" style="margin-bottom:8px">'
    + '<input type="tel" class="txt" id="setClinPhone" placeholder="Number" value="'+esc(ladder.clinician.phone || "")+'" aria-label="Clinician number">'
    + '<div class="btnrow"><button class="btn small" id="setClinSave" type="button">Save</button></div></div>';
  h += '<div class="card"><h2>Export your record</h2>'
    + '<p class="muted small">Your whole record as one file. The app sends nothing anywhere.</p>'
    + '<div class="btnrow"><button class="btn secondary" id="setExport" type="button">Download record</button></div></div>';
  h += '<div class="card"><h2>Erase</h2>'
    + '<p class="muted small">Everything is on this phone. No account, no sync.</p>'
    + '<div class="btnrow"><button class="btn danger" id="setErase" type="button">Erase everything</button></div></div>';
  return h;
}
function bindSettings(){
  el("setCompanion").addEventListener("click", function(){ startCreate(true); });
  el("setLadder").addEventListener("click", function(){ ladderReturn = "settings"; go("ladder"); });
  el("setClinSave").addEventListener("click", function(){
    ladder.clinician = {name: el("setClinName").value.trim(), phone: el("setClinPhone").value.trim()};
    saveLadder(); toast = "Clinician saved to your ladder.";
    render();
  });
  el("setExport").addEventListener("click", function(){
    var data = {
      exportedAt: new Date().toISOString(),
      companion: companion, atlas: atlas, ledger: ledger, journal: journal, ladder: ladder, thread: thread
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ever-present-record.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  });
  el("setErase").addEventListener("click", function(){
    if(!confirm("Erase your entire record \u2014 your companion, all map pieces, glossary terms, every claim in the ledger, journal entries, and your help ladder? This can\u2019t be undone.")) return;
    var kill = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf("ever_present") === 0) kill.push(k);
    }
    kill.forEach(function(k){ localStorage.removeItem(k); });
    location.reload();
  });
}

el("helpBtn").addEventListener("click", function(){
  if(view !== "help"){ helpReturn = view; }
  view = "help";
  render(); window.scrollTo(0,0);
});
