<title>Ever Present</title>
<style>
  /* ================= Ever Present v1.22 — the founder's ACTUAL palette =================
     CORRECTION (2026-10-25): v1.21 was built on a MISREAD. The
     founder's "Instagram uses black white blue and purple" was
     INFORMATION about that app, not a direction for this one —
     he corrected it himself: "It was information." v1.22 retires
     the Instagram scheme wholesale (no violet, no IG blue, no
     gradient identity marks anywhere) and lands on what he
     actually stated:
     - "I like a white background (that can go black for dark
       theme at night)": light paper pure white #FFFFFF; dark
       paper TRUE BLACK #000000, surfaces #1A1A1A, text #F5F5F5.
     - "I like baby blue for the sign highlights": labels,
       kickers, badges and sign-like marks are BABY BLUE #89CFF0
       — as fills with ink text on them (10.74:1) where they are
       chips/badges, and as the readable deep blue #0B6FA4
       (5.49:1 on white) where a sign is text on white. Selected
       chips are baby-blue filled. Links are the deep blue.
     - "Your gray message highlights, I like the gray": incoming
       bubbles stay GRAY — #F0F0F0 on white, #262626 on black.
     - Outgoing bubbles return to the v1.20 status quo: the deep
       room-GREEN gradient with white text (6.54–9.63:1). Green
       survives ONLY there — his own messages — and nowhere as a
       general accent.
     - Help returns to terracotta (#B4552D, v1.20 values), top
       pill, unchanged position.
     - Room surfaces stay neutral light gray, told apart by
       baby-blue sign marks + labels.
     The serif stays OUT of the UI entirely (v1.21 finished that;
     v1.22 verifies it). All v1.20 geometry, motion tokens, target
     sizes and the 13px label floor are unchanged. Measured ratios
     are reported with the v1.22 build.
     v1.23 — DAY & NIGHT FROM THE FOUNDER'S PICTURES (2026-10-25):
     he sent two reference photos, "I like this aesthetic for the
     day" / "for night", and the ATMOSPHERE (never the images —
     no photo backgrounds anywhere) now sets the schemes:
     - DAY: the room opens to sky at the top — --paper-glow is the
       palest sky tint #F2F9FD and the body gradient lets it fade
       to white by 240px; the veil takes the tint too, so content
       still dissolves before the Help pill. Everything else stays
       low-saturation v1.22 — except HELP, which becomes the day
       photo's one vivid anchor, the saturated red field:
       #CF3316 (HSL 9°/81%/45%, white bold text 5.07:1 — the most
       saturated poppy that still passes; terracotta superseded).
       Danger #B3261E already harmonises with it.
     - NIGHT: the founder's night sky is INDIGO, not black —
       "night is blue" supersedes v1.22's plain-black reading.
       Paper #0D1230, surfaces step up in blue (#171E42 card,
       #20295C surface-2/field, #252E5E bubbles — off-white body
       text 11.81:1 on the bubbles), secondary text turns
       blue-gray, washes go indigo. Baby-blue signs stay #89CFF0
       and glow on indigo (10.68:1 on the paper). Outgoing green
       stays luminous against it; Help red stays saturated — the
       tower's one warm light. No #000000 remains in the scheme.
     - FOUND WHILE VERIFYING (latent v1.22 bug): in the dark
       scheme --ink flips to off-white, so every baby-blue FILL
       that took its text colour from --ink was carrying
       near-white text at 1.57:1. A new --on-sign token (#141414
       in BOTH schemes) pins dark text on sign fills everywhere;
       light rendering is pixel-identical. The alt-chip selected
       state likewise moves to the pale wash + family ink
       (4.97:1 light / 8.05:1 dark). The hero card gets its own
       --hero ground (near-black by day, deepest indigo #060A24
       by night) instead of borrowing --ink, which flips.
     v1.24 — FOUNDER CALLS (2026-10-25), resolved over a chain
     of corrections, each recorded as it landed:
     - OUTGOING bubbles: "my message background to change from
       green to plum violet" — PLUM VIOLET gradient, a warm
       reddish purple (day #7D3268 → #55204A, white text 8.31:1 /
       12.41:1; night luminous #9C4787 → #753468, 5.73:1 / 8.58:1
       against the indigo). Green is retired as a UI colour.
     - SEND: there isn't one. "the send button to cornflower
       blue" → "No, the highlight" → "do the same thing that's
       here on this app" → "No, the body" → "I'm talking about
       the send button" → FINAL: "Actually yours doesn't have
       a send button. You can actually remove it. And
       incorporate the color somewhere else." The button is
       REMOVED — Enter / the keyboard's send key sends, as in
       this app — and cornflower #6495ED is incorporated into
       the composer: its focus light (border tint + soft glow,
       with a 1px sign-deep hairline inside the glow for
       legibility, cornflower alone being 2.97:1 on white) and
       the Record button's pressed tint. Every earlier steer
       (fill, highlight-only, round icon button) is superseded.
       The Record button itself stays written, exactly as
       v1.23.
     - HELP: "And crimson for the help button" — the fill is
       CRIMSON #DC143C (the named colour, exact, both schemes;
       white bold label 4.99:1) and the family shifts with it
       (deep #A80E30, hi #EF4E6F, pale washes). The v1.23 poppy
       is superseded; danger stays #B3261E, a duller red.
     v1.27 — HELP IS THREE BARS + THE BLUE BRIGHTENS (2026-10-25):
     - "Inside help i like the hotline bars. So instead of
       other words just have bar options for My Playlist, My
       Encouragement, My People." The wordy ladder rungs are
       GONE: Help opens onto three full-width bars in his order
       and nothing else but one quiet "Arrange these" line to
       the calm-time editor. The bars group the same ladder
       store: song → My Playlist (the moment song leads, its
       Play it door first, the rest listed); calm-day note +
       room + receipts → My Encouragement; his people + his
       professional (988 / Crisis Text Line included) → My
       People. An empty playlist renders no Playlist bar
       (narrowed in v1.28 — the bar now always stands; see
       the v1.28 entry below).
     - "Center the help button and Bigger so the separation
       is evident." The pill moves to TOP-CENTER and grows
       (18px/700, min-height 56px, a deeper crimson shadow);
       the veil band and the wrap's top clearance grow with
       it, so content still dissolves before reaching it, at
       any scroll position, day and indigo night.
     - "The last message and bottom bar is not small enough"
       (on v1.26's ~14px): the under-thread stance tightens
       again — spacer 56px → 24px, wrap bottom padding
       30px → 20px — one tight rhythm step (~8px).
     - "I want that blue to be a brighter happier color."
       The whole blue family lifts to a brighter sky/azure:
       sign fills #38BDF8 (ink on them 8.60:1), sign-deep
       #0272AD (the #0284C7 family adjusted the minimum that
       holds every floor: 5.23:1 on white, 4.56:1 on the new
       wash), the composer glow takes the same #38BDF8
       (cornflower #6495ED superseded), washes shift pale
       with the family, and at night sign-deep lightens to
       #7DD3FC (10.99:1 on the indigo). Crimson, plum, the
       grays and the indigo are untouched.
     v1.28 — TWO FIELD-REPORT FIXES (2026-10-25):
     - "Keep the hotline bars. You only have two bars instead
       of three on the help front page." The v1.15 song-rung
       law (an empty playlist renders no rung), carried into
       the bars in v1.27, hid My Playlist whenever the
       playlist was empty — narrowing it here, on the
       founder's word: inside the three-bar Help, ALL THREE
       bars stand on every open, stocked or not. An unstocked
       My Playlist opens onto the invitation and the same
       "Start my playlist" door the seed card carries —
       never a dead end, the pattern My People already used.
     - "And the last message can be tighter to the bottom
       bar." The v1.26/v1.27 stance math measured from the
       viewport's bottom edge — the wrong datum. The composer
       is a fixed overlay 82px tall (+ the bottom safe-area
       inset), its bar's top edge 72px above the viewport
       bottom; the stance under the last message (flex gap
       16 + spacer + wrap bottom 20) had shrunk to 60px, so
       the last message's bottom 12px rested INSIDE the
       composer's gradient fade — no clean gap at all, and
       every "tightening" pushed it deeper in. The stance is
       now anchored to the bar itself: 16 + spacer + 20 =
       72 + inset + 7, i.e. the spacer is calc(43px + the
       inset) and the last message rests a clean ~7px above
       the bar, fully visible, at rest and scrolled alike.
     v1.30 — THE FOUNDER'S PICTURES AS THE ROOM (2026-10-25):
     "Use the background from the pictures I sent." The Day
     poppy-field scene serves the light scheme and the Night
     blossoms/tower scene serves the dark scheme, each as a
     fixed centered cover photograph under a strong watermark
     wash. The earlier picture-as-palette-only boundary is
     superseded by this direct instruction; interface surfaces
     remain solid.
     v1.32 — THE DOCK (2026-10-25): the founder, five times over:
     "the last message and bottom bar is still not tight." The
     composer floated position:fixed over a window-scrolling
     thread, and every stance fix (spacer arithmetic, dvh
     constants) drifted on real screens — browser chrome, the
     keyboard, desktop vs phone. The skeleton is rebuilt the
     way the reference chat app builds it: html/body at full
     height, overflow hidden; the app is a 100dvh flex column
     — [top band] [scroll area] [composer] — and the conversa-
     tion area ENDS where the bar begins, so the gap is
     structural and cannot drift. The top trio leaves its
     fixed posts and its veil for an in-flow header carrying
     the veil's own wash; .thread is the only scroller on the
     home view (flex:1, overflow-y auto), bottom-anchored by
     the first message's auto top margin plus the existing
     auto-scroll; the composer is the frame's last row, its
     separation its own hairline over the floor wash. The
     .thread-spacer, the bottom fade/melt, and ALL stance
     arithmetic (the calc(51px + inset) family, the 100dvh −
     108px min-height, the wrap's top/bottom stance padding,
     the body's composer padding) are REMOVED. The photo +
     wash room is untouched (body-level, fixed). */
  /* v1.33 — SLEEK TYPE (founder: "I want the body of the
     words more sleek like you have. Right now it looks
     bulky."). The bulk was the letterforms: the device stack
     (Roboto on his Android) is sturdy. Inter — a slim modern
     grotesque — is self-hosted (woff2, four weights) so the
     words render the same on every phone, offline after first
     load; until the files land, the fallback stack renders
     and swaps in (font-display:swap). Sleekness comes from
     the letterforms and the tracking, NOT smaller type:
     sizes and weight mappings are unchanged.
     v1.34 — SLEEK WORD-BOXES + PALETTE FREEZE (founder:
     "I'm also talking about the gray highlight box that
     house the words. It's sleek." — then, settling the
     palette: "I like my colors."). The companion's word-
     boxes become flat, wider and smoother-cornered; NO
     colour changes anywhere in this pass. The companion
     gray stays exactly #F0F0F0 by day and the night indigo
     bubble stays exactly #252E5E. Plum-band room cards are
     cards, not word-boxes, and keep their existing shadow
     and geometry.
     v1.36 — THE FOUNDER'S BABY BLUE (2026-10-25): showing a
     "Shop baby blue" cardstock swatch, he revised the blue
     family only: "I'm looking for this color blue. It has
     more live and energy and its brighter than the one I
     currently have." This supersedes the v1.34 palette
     freeze for blue alone; plum, crimson, grays, indigo
     grounds and the photo room remain frozen. The fill is
     tuned from his #79B5EE starting point to #79B0EE (hue
     211.8°, ink on it 8.12:1; on the night paper 8.08:1).
     Readable day text is #2F77C8 (4.57:1 on white); night
     text is the family tint #A9CDF5 (11.11:1 on the paper,
     9.79:1 on card, 8.31:1 on surface-2, 7.81:1 on the
     bubbles). The soft washes keep their prior lightness
     and shift hue with the family: #E0EEFE by day and
     #0E2947 by night. */
  @font-face{font-family:"Inter"; src:url("fonts/inter-400.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap}
  @font-face{font-family:"Inter"; src:url("fonts/inter-500.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap}
  @font-face{font-family:"Inter"; src:url("fonts/inter-600.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:swap}
  @font-face{font-family:"Inter"; src:url("fonts/inter-700.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap}
  :root{
    color-scheme:light;
    --paper:#ffffff;
    /* the FOUNDER'S PICTURES AS THE ROOM (v1.30, his words:
       "Use the background from the pictures I sent"). The
       extracted Day scene is the light scheme's fixed,
       centered cover photograph. It remains a WATERMARK:
       a white wash holds at .52 through the room and
       strengthens to .70 at the floor; the veil starts from
       that wash, and the composer melt uses the floor wash.
       Bubbles, cards and the composer surfaces stay solid,
       so ordinary text never rests directly on the photo.
       Day stamps and signs do sit on this washed ground;
       because photo contrast cannot be computed reliably,
       the wash is held at the strong end and its final
       strength is a founder phone-test call. No animation. */
    --room-photo:url("bg-day.jpg");
    /* v2.0 S11 (art value): the scene's focal band — by day
       the sky/horizon third sits in the room's open upper
       area; the wash itself is untouched (frozen) */
    --room-pos:32%;
    --room-wash:rgba(255,255,255,.52);
    --room-wash-low:rgba(255,255,255,.70);
    --room-wash-grad:linear-gradient(180deg, rgba(255,255,255,.48) 0%, var(--room-wash) 52%, var(--room-wash-low) 100%);
    --room-veil-grad:linear-gradient(180deg, rgba(255,255,255,.78) 0, rgba(255,255,255,.78) 78px, var(--room-wash) 100px);
    /* v1.38: outside the contained desktop column, the
       same Day scene becomes a calmer backdrop under a
       much heavier slate wash */
    --room-outer-grad:linear-gradient(180deg, rgba(219,228,238,.86) 0%, rgba(219,228,238,.93) 100%);
    --paper-low:var(--room-wash-low);
    --card:#ffffff; --card-line:#e7e7e7;
    /* text on a baby-blue sign fill: dark in BOTH schemes (the
       fill never changes, so its text must not flip with --ink) */
    --on-sign:#141414;
    /* the composer glyphs (attach sign + microphone): PURE
       BLACK by day (v1.27 — the founder: "black as black as
       possible"); at night they take off-white, because black
       cannot read on the indigo */
    --glyph:#000;
    /* the hero card's own ground: near-black by day */
    --hero:#141414;
    --field:#ffffff; --surface2:#ffffff;
    /* incoming bubbles: the gray he likes, kept */
    --bubble-in:#f0f0f0;
    --ink:#141414; --ink-soft:#595959; --muted:#6a6a6a;
    /* SIGN HIGHLIGHTS = the founder's baby-blue family
       (v1.36: the cyan-leaning sky of v1.27 is superseded
       by his swatch — a truer, livelier baby blue at hue
       ~212). --sign is a FILL (badges, selected chips, top
       lines) and always carries ink text (8.12:1);
       --sign-deep is the same family as readable TEXT on
       white (4.57:1); --sign-soft keeps the old wash's
       lightness with the hue shifted into the family */
    --sign:#79b0ee; --sign-deep:#2f77c8; --sign-soft:#e0eefe;
    /* outgoing: PLUM VIOLET (v1.24 — founder: "my message
       background to change from green to plum violet"). A warm
       reddish purple, not blue-violet, not lavender: white text
       8.31:1 on the light stop, 12.41:1 on the deep stop. The
       v1.20–v1.23 room-green gradient is superseded; no green
       remains as a UI colour anywhere.
       v1.29 (the founder: "bolder and more dynamic"): the
       saturation deepens a step — white text re-measured at
       7.45:1 on the light stop, 11.84:1 on the deep stop. */
    --me:#63184f;
    --me-grad:linear-gradient(160deg, #932a73 0%, #63184f 100%);
    --me-ink:#ffffff;
    /* THE COMPOSER GLOW (v1.24's home; v1.36's colour):
       there is no send button (founder: "yours doesn't have
       a send button — remove it, and incorporate the color
       somewhere else"), so the blue lives in the composer:
       its focus light (border tint + soft glow) and the
       Record button's pressed tint. Cornflower #6495ED and
       the v1.27 bright sky are both SUPERSEDED by the
       founder's baby-blue swatch — --send now takes the
       same #79B0EE as the signs, in both schemes */
    --send:#79b0ee;
    /* primary actions retain the prior readable azure
       #0272AD (white on it 5.23:1); v1.36 revises the
       --sign/--send/--sign-deep/--sign-soft tokens only */
    --accent:#0272ad; --accent-soft:#e0f2fe; --on-accent:#ffffff;
    /* text links: the same readable azure */
    --link:#0272ad;
    --sage:#a8a8a8; --sage-soft:#f0f0f0; --sage-line:#dbdbdb;
    /* the room: neutral light gray — told apart by the baby-blue
       sign marks and its labels, not a tint wash */
    --room-bg:#f5f5f5; --room-line:#e7e7e7;
    /* Help: the room's one vivid anchor — CRIMSON (v1.24;
       founder: "And crimson for the help button" — the named
       colour #DC143C, exact; white bold text 4.99:1). The
       v1.23 poppy #CF3316 family is superseded */
    --help:#dc143c; --help-deep:#a80e30; --help-hi:#ef4e6f; --help-soft:#fdecef;
    --danger:#b3261e;
    /* legacy --amber names: now a pale azure wash + azure ink
       (v1.27: shifted pale with the brighter family; the ink
       holds 4.76:1 on the wash) */
    --amber-bg:#eaf6fe; --amber-line:#a2dffc; --amber-ink:#0272ad;
    /* legacy alias (older rules lean on this name) */
    --line:var(--card-line);
    --radius:20px;
    /* v1.29: shadows one step stronger — soft, ink-tinted,
       never gray-flat (the founder: "bolder") */
    --shadow-card:0 2px 3px rgba(20,20,20,.06), 0 14px 36px rgba(20,20,20,.11);
    --shadow-bubble:0 1px 3px rgba(20,20,20,.06), 0 8px 26px rgba(20,20,20,.10);
    --shadow-me:0 2px 4px rgba(99,24,79,.25), 0 8px 20px rgba(99,24,79,.22);
    --shadow-bar:0 12px 32px rgba(20,20,20,.14), 0 2px 8px rgba(20,20,20,.08);
    /* motion tokens (research §8): press / new turn / card / exit.
       v1.29: the new-turn settle takes 240ms on the spring
       (below) — life in the arrival, within the 400ms ceiling */
    --dur-press:120ms; --dur-msg:240ms; --dur-card:280ms; --dur-exit:210ms;
    --ease-std:cubic-bezier(0.2,0,0,1);
    --ease-out:cubic-bezier(0.05,0.7,0.1,1);
    /* the spring (v1.29): a small overshoot for arrivals and
       touches — transform/opacity only, never ambience */
    --ease-spring:cubic-bezier(0.34,1.3,0.64,1);
    --ease-exit:cubic-bezier(0.3,0,0.8,0.15);
    /* v1.33: Inter leads the stack everywhere --sans is used
       (which is everywhere the app sets type) */
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      /* dark: INDIGO (v1.23 — the founder's night photo: cherry
         blossoms against a deep saturated indigo sky; "night is
         blue, not black" supersedes v1.22's plain-black reading).
         Paper is deep indigo #0D1230 and every surface steps up
         in blue; off-white text mitigates halation */
      --paper:#0d1230;
      /* the founder's Night scene (blossoms and the lit
         tower against indigo) is the dark scheme's fixed,
         centered cover photograph, under the same watermark
         treatment: an indigo wash at .56 through the room,
         strengthening to .70 at the floor. The veil starts
         from that wash; no animation. */
      --room-photo:url("bg-night.jpg");
      /* v2.0 S11: by night the blossoms and the tower sit
         higher in the room — center 22% */
      --room-pos:22%;
      --room-wash:rgba(13,18,48,.56);
      --room-wash-low:rgba(13,18,48,.70);
      --room-wash-grad:linear-gradient(180deg, rgba(13,18,48,.52) 0%, var(--room-wash) 52%, var(--room-wash-low) 100%);
      --room-veil-grad:linear-gradient(180deg, rgba(13,18,48,.76) 0, rgba(13,18,48,.76) 78px, var(--room-wash) 100px);
      /* v1.38: the Night scene outside the desktop column
         is dimmed under a much heavier indigo wash; inside
         the column, this extra indigo layer softens the
         photograph's saturation without changing a palette
         colour */
      --room-outer-grad:linear-gradient(180deg, rgba(5,8,26,.86) 0%, rgba(5,8,26,.93) 100%);
      --room-night-soft:linear-gradient(180deg, rgba(13,18,48,.20) 0%, rgba(13,18,48,.20) 100%);
      --paper-low:var(--room-wash-low);
      --card:#171e42; --card-line:#303a75;
      --field:#20295c; --surface2:#20295c;
      --bubble-in:#252e5e;
      --on-sign:#141414;
      --glyph:#f5f5f5;
      --hero:#060a24;
      --ink:#f5f5f5; --ink-soft:#aab3d8; --muted:#98a1c6;
      /* signs in the dark (v1.36, the founder's baby-blue
         family): the fill is #79B0EE and GLOWS on indigo
         (8.08:1 on the paper); sign fills carry --on-sign
         text; sign TEXT on indigo takes the family tint
         #A9CDF5 (11.11:1 on the paper, 9.79:1 on card,
         8.31:1 on surface-2, 7.81:1 on the bubbles). The
         soft wash keeps its prior lightness, hue-shifted
         from #0E2A47 to #0E2947 */
      --sign:#79b0ee; --sign-deep:#a9cdf5; --sign-soft:#0e2947;
      /* outgoing at night: plum against the indigo (v1.24
         supersedes the deep green). v1.38 deepens the night
         gradient toward the day family's depth — on the
         founder's desktop screenshot the luminous stops
         read hot pink ("This looks baaaaddd!"). White text
         re-measures 5.73:1 on the light stop and 8.58:1 on
         the deep stop */
      --me:#753468;
      --me-grad:linear-gradient(160deg, #9c4787 0%, #753468 100%);
      --me-ink:#ffffff;
      /* the founder's baby blue keeps the same home at
         night — the composer's focus light, Record's
         pressed tint */
      --send:#79b0ee;
      --accent:#0b6fa4; --accent-soft:#0e2a47; --on-accent:#ffffff;
      --link:#7dd3fc;
      --sage:#6b74a3; --sage-soft:#252e5e; --sage-line:#323c74;
      --room-bg:#171e42; --room-line:#303a75;
      /* Help stays CRIMSON at night — the tower's one warm
         light against the indigo (v1.24; white bold text
         4.99:1 — the poppy family superseded) */
      --help:#dc143c; --help-deep:#a80e30; --help-hi:#ef4e6f; --help-soft:#360a1b;
      --danger:#ea8a7f;
      --amber-bg:#0e2a47; --amber-line:#24507a; --amber-ink:#7dd3fc;
      --shadow-card:0 2px 3px rgba(0,0,0,.45), 0 14px 36px rgba(0,0,0,.45);
      --shadow-bubble:0 1px 3px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.4);
      --shadow-me:0 2px 4px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
      --shadow-bar:0 12px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{text-size-adjust:100%; -webkit-text-size-adjust:100%; height:100%; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; color:var(--ink);
    /* v1.32 — THE DOCK: the frame. Full height, no window
       scroll: body is a flex column — the top band, the
       scroll area (.wrap), and, on the home view, the docked
       composer as the frame's last row. The gap between the
       last message and the bar is structural now; it cannot
       drift with browser chrome or keyboards.
       The room itself is still the founder's selected
       photograph, fixed and centered under its watermark
       wash, so the scene stays put behind the frame (v1.30;
       the v1.29 gradient-only room is superseded). */
    height:100vh; height:100dvh; height:var(--ep-h, 100dvh);
    display:flex; flex-direction:column; overflow:hidden;
    background-color:var(--paper);
    background-image:var(--room-wash-grad), var(--room-photo);
    background-position:center center, center var(--room-pos);
    background-size:auto, cover;
    background-repeat:no-repeat, no-repeat;
    background-attachment:fixed, fixed;
    font-family:var(--sans);
    /* v1.33: the sleek tuning — tight tracking on the body,
       leading at 1.5 (was 26px ≈ 1.53). v1.37: the reading
       scale steps down one step, 17px → 16px, on the
       founder's "Is the font too big?" — controls keep
       their sizes (see the V37 harness block). */
    letter-spacing:-.011em;
    line-height:1.5; font-size:16px;
  }
  /* v2.0 (the parity map, row 9): selection in the baby-blue
     SOFT, no grey tap flash on touch, focus rings in the
     readable blue (sign-deep), not the retired azure */
  ::selection{background:var(--sign-soft); color:var(--ink)}
  :focus-visible{outline:2px solid var(--sign-deep); outline-offset:2px}
  /* ---- the top band (v1.32, THE DOCK) ----
     The trio used to float fixed over the scrolling thread,
     under a fixed veil (body::before, z 70) whose wash kept
     the pill from ever sitting on readable text. The veil is
     RETIRED: the band is a row of the frame now, in flow, and
     carries the veil's own surface — the same photograph
     under the same stronger veil wash, fixed-attached so it
     is continuous with the room behind it. The thread starts
     below the band by construction, so no content can ever
     reach the pill. Inside, a three-column grid (1fr auto
     1fr) seats Circles at the column's left edge, Playlist
     at its right, and Help exactly centered between them. */
  .top-band{
    flex:none;
    background-image:var(--room-veil-grad), var(--room-photo);
    background-position:center center, center var(--room-pos);
    background-size:auto, cover;
    background-repeat:no-repeat, no-repeat;
    background-attachment:fixed, fixed;
  }
  .top-band-in{
    max-width:680px; margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top)) 16px 8px;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  }
  /* ---- the scroll area ----
     .wrap is the frame's middle: flex:1 between the band
     and (on the home view) the docked composer. It scrolls
     for the full-screen flows (arrival, create, help,
     ladder); on the home view its content is exactly its
     own height — .thread flexes and scrolls inside it, the
     composer docks after it — so the wrap itself rests.
     The .home trim drops the bottom padding there: the
     composer must sit ON the frame's bottom edge, not
     float above a padded strip. */
  .wrap{
    width:100%; max-width:680px; margin:0 auto;
    flex:1; min-height:0;
    display:flex; flex-direction:column; overflow-y:auto;
    padding:12px 16px 20px;
  }
  /* v2.0 (field report A — "the bottom bar is now
     unavailable"): on the home view the wrap NEVER scrolls.
     Its only children are the thread (the scroller) and the
     docked composer (flex:none) — with overflow hidden here,
     nothing can scroll, push, or translate the dock zone
     out of the frame on any handset */
  .wrap.home{padding-bottom:0; overflow:hidden}
  h1.appname{
    font-family:var(--sans); font-weight:600;
    font-size:1.55rem; margin:6px 0 0; letter-spacing:.2px;
  }
  .companion-line{color:var(--muted); margin:4px 0 16px; font-size:16px}
  .card{
    /* v1.35: the card family's radius unifies at 22px
       (the 24px family is superseded — one system) */
    background:var(--card); border:1px solid var(--card-line); border-radius:22px;
    /* v2.0 S11: card padding snaps 20 → 16 on the rhythm */
    padding:16px; margin:0 0 16px; box-shadow:var(--shadow-card);
    font-size:16px; line-height:25px;
  }
  .card h2{font-family:var(--sans); font-size:1.3rem; margin:0 0 10px; font-weight:600}
  .card h3{font-size:1.02rem; margin:18px 0 6px; font-weight:700}
  .card h3:first-child{margin-top:0}
  .muted{color:var(--muted)} .small{font-size:14px}
  .lede{font-size:16px; line-height:1.5}
  .empty{color:var(--muted); font-style:italic}
  .field-label{font-weight:500; font-size:14px; margin:16px 0 8px}
  .field-label:first-child{margin-top:0}

  /* ---- buttons ---- */
  .btn{
    display:inline-block; border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
    padding:12px 24px; border-radius:999px; font-size:15px; font-weight:500; cursor:pointer; min-height:48px;
    font-family:inherit; transition:background var(--dur-press) var(--ease-std), border-color var(--dur-press) var(--ease-std), transform var(--dur-press) var(--ease-std);
  }
  .btn.secondary{background:var(--card); color:var(--ink); border-color:var(--card-line)}
  .btn.quiet{background:transparent; color:var(--muted); border-color:transparent}
  .btn.danger{background:var(--card); color:var(--danger); border-color:var(--danger)}
  .btn.small{padding:8px 14px; min-height:44px; font-size:14px}
  .btn.block{display:block; width:100%; text-align:center}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .btn:disabled{opacity:.5}

  /* ---- chips (options first, questions last): quiet outlined pills ---- */
  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .chip{
    border:1px solid var(--sage-line); background:transparent; color:var(--ink);
    /* v2.0 S11: padding snaps 10 → 12, type 15 → 14 (the v1.37
       scale); the 44px touch floor stands */
    padding:12px 16px; border-radius:999px; font-size:14px; font-weight:500; cursor:pointer;
    min-height:44px; font-family:var(--sans); text-align:left;
    transition:background var(--dur-press) var(--ease-std), border-color var(--dur-press) var(--ease-std), color var(--dur-press) var(--ease-std), transform var(--dur-press) var(--ease-std);
  }
  /* a selected chip is a sign: baby-blue fill, on-sign text
     (10.74:1 in both schemes — the fill never flips, so the
     text colour is pinned by --on-sign, not --ink) */
  .chip.on{background:var(--sign); border-color:var(--sign); color:var(--on-sign)}
  /* the alt selected chip: pale family wash, family ink
     (4.97:1 light / 8.05:1 dark — the solid family ink as a
     fill failed its own text in one scheme or the other) */
  .chip.alt.on{background:var(--amber-bg); border-color:var(--amber-ink); color:var(--amber-ink)}
  .chip small{display:block; font-size:.8125rem; opacity:.85; font-weight:400}

  /* ---- inputs ---- */
  textarea.big, input.txt, textarea.txt{
    width:100%; border:1px solid var(--card-line); border-radius:12px; background:var(--field);
    padding:12px 14px; font-size:17px; font-family:inherit; color:var(--ink);
  }
  textarea.big{min-height:16vh; line-height:1.55}
  textarea.short{min-height:9vh}

  /* ---- live companion: the typing bubble ---- */
  .tdots span{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--muted); opacity:.45; margin-right:5px;
  }
  .tdots span:last-child{margin-right:0}

  /* ---- persistent help button: the one saturated element in
     the room — CRIMSON #DC143C (v1.24, founder-named; the day
     photo's red field, the v1.23 poppy superseded). v1.27
     (the founder: "Center the help button and Bigger so the
     separation is evident"): TOP-CENTER and bigger — 18px/
     700, min-height 56px, a deeper crimson shadow, clear air
     around it. v1.32: it no longer floats fixed on a veil
     shelf — it sits in the frame's top band, centered by the
     band's middle grid column, with the same size, colour
     and shadow. One size at every width. The press dips by
     scale now, like the doors beside it. ---- */
  #helpBtn{
    justify-self:center;
    background:var(--help);
    color:#ffffff; border:1px solid rgba(255,255,255,.5); border-radius:999px;
    padding:14px 34px; font-size:1.125rem; font-weight:700; letter-spacing:.01em;
    cursor:pointer; min-height:56px; font-family:var(--sans);
    box-shadow:0 14px 34px rgba(220,20,60,.45), 0 4px 10px rgba(20,20,20,.28),
      inset 0 1px 0 rgba(255,255,255,.35);
  }
  #helpBtn:active{transform:scale(.98); box-shadow:0 4px 12px rgba(220,20,60,.4)}

  /* ---- the top band's side doors (v1.29, the founder: "The
     group and playlist button can go on the top where the
     button is to give that area a more fuller feel") ----
     [Circles] [Help] [Playlist]: Help stays the center
     anchor — biggest (56px), the only crimson up top. The
     side doors are matched solid pills (44px) centered on
     Help's row. v1.32: they leave their fixed posts for the
     band's grid — Circles justified to the start of the
     first column, Playlist to the end of the last, aligned
     to the wrap's content edge by the band's own padding.
     A door is not a screen — tapping one brings its card
     INTO the thread (the interface law). Press: scale .98. */
  .top-door{
    min-height:44px; padding:10px 14px; border-radius:999px;
    background:var(--card); border:1px solid var(--card-line);
    color:var(--sign-deep); font-size:15px; font-weight:600; font-family:var(--sans);
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    box-shadow:var(--shadow-card);
  }
  .top-door svg{flex:none}
  .top-door:active{transform:scale(.98)}
  #circlesBtn{justify-self:start}
  #playlistBtn{justify-self:end}

  .chip.big{font-size:16px; padding:12px 16px}

  /* ---- the Hub (Home) ---- */
  .hub-top{padding:8px 2px 18px}
  .hub-opener{
    font-family:var(--sans); font-weight:600;
    font-size:1.85rem; line-height:1.32; margin:6px 0 12px;
  }
  .status-chips{display:flex; flex-wrap:wrap; gap:8px}
  .status-chips span{
    /* status badges are signs: baby-blue fill, on-sign text */
    background:var(--sign); color:var(--on-sign); border-radius:999px;
    padding:6px 13px; font-size:.84rem; font-weight:600;
  }
  .hero-card{
    border-radius:22px; padding:26px 22px 22px; margin:0 0 16px; cursor:pointer;
    /* the deep card: its own ground (--hero — near-black by
       day, deepest indigo by night), white text (18.42:1 day /
       19.51:1 night), label and main action signed in baby blue */
    background:var(--hero);
    color:#ffffff; box-shadow:0 14px 34px rgba(20,20,20,.28);
  }
  .hero-label{
    font-size:.8125rem; letter-spacing:.16em; text-transform:uppercase;
    font-weight:700; color:var(--sign);
  }
  .hero-line{
    font-family:var(--sans); font-size:1.5rem;
    line-height:1.35; margin:10px 0 20px;
  }
  .hero-main{
    display:block; width:100%; border:none; cursor:pointer; font-family:inherit;
    /* the hero's main action is a sign: baby-blue fill, on-sign text */
    background:var(--sign); color:var(--on-sign); font-weight:700; font-size:1.12rem;
    padding:16px 20px; border-radius:999px; min-height:58px;
    box-shadow:0 4px 14px rgba(20,20,20,.25);
  }
  .hero-quick{
    display:block; margin:12px auto 2px; background:transparent; color:#ffffff;
    border:1px solid rgba(255,255,255,.55); border-radius:999px;
    padding:10px 20px; font-family:inherit; font-size:.95rem; cursor:pointer;
    min-height:48px;
  }
  .hub-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:22px;
    padding:20px; margin:0 0 16px;
    box-shadow:var(--shadow-card);
    font-size:16px; line-height:25px;
  }
  .hub-card h2{font-family:var(--sans); font-size:1.28rem; margin:0 0 8px; font-weight:600}
  .hub-label{
    font-size:.8125rem; letter-spacing:.16em; text-transform:uppercase;
    /* a sign written as text: the readable deep blue of the
       baby-blue family (5.49:1 light / 9.34:1 dark on card) */
    color:var(--sign-deep); font-weight:700; margin:0 0 8px; font-family:var(--sans);
  }
  .hub-card .claim-text{font-size:16px; line-height:1.5}

  /* ---- tallies (ported) ---- */
  .tally{display:flex; gap:14px; flex-wrap:wrap; margin:0 0 14px}
  .tally .pill{
    /* tally pills are signs: baby-blue fill, on-sign text */
    background:var(--sign); color:var(--on-sign); border-radius:999px; padding:8px 16px; font-size:.95rem;
  }
  .tally .pill b{font-size:1.15rem; margin-right:6px}

  /* ---- claims ledger (ported from the local product build) ---- */
  .ledger-entry{border-top:1px solid var(--card-line); padding:14px 0}
  .ledger-entry:first-of-type{border-top:none}
  .ledger-entry .claim-text{font-size:16px}
  .ledger-outcome{
    background:var(--sign-soft); border-radius:10px; padding:10px 14px; margin-top:10px;
  }
  .kind-tag{
    /* a badge is a sign: baby-blue fill, on-sign text */
    display:inline-block; background:var(--sign); border:1px solid var(--sign);
    color:var(--on-sign); border-radius:999px; padding:1px 9px; font-size:.8125rem;
    margin-left:8px; vertical-align:middle; font-family:var(--sans);
  }

  /* ---- map pieces ---- */
  .piece-card{cursor:pointer}
  .piece-card:active{border-color:var(--sign-deep)}
  .piece-name{font-family:var(--sans); font-size:1.2rem; font-weight:600}
  .type-tag{
    /* a badge is a sign: baby-blue fill, on-sign text */
    display:inline-block; background:var(--sign); color:var(--on-sign);
    border-radius:999px; padding:1px 9px; font-size:.8125rem; margin-left:8px; vertical-align:middle;
    font-family:var(--sans);
  }
  .seeing-box{
    background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:10px;
    padding:10px 14px; margin:10px 0;
  }
  .seeing-box .lab{font-size:.8125rem; text-transform:uppercase; letter-spacing:.12em; color:var(--amber-ink); font-weight:700; font-family:var(--sans)}
  .mini-chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
  .mini-chips span{
    background:var(--field); border:1px solid var(--card-line); border-radius:999px;
    padding:2px 10px; font-size:.82rem;
  }

  /* ---- journal prompts ---- */
  .prompt-card{cursor:pointer; text-align:left; width:100%; font-family:var(--sans); font-size:1rem}
  .prompt-card:active{border-color:var(--sign-deep)}

  /* ---- help ladder ---- */
  .rung{border-left:5px solid var(--sign-deep); padding-left:14px; margin:18px 0}
  .rung.far{border-left-color:var(--help)}
  .rung h3{margin:0 0 4px}
  .hardday-note{
    font-family:var(--sans); font-size:1.15rem; background:var(--amber-bg);
    border:1px solid var(--amber-line); border-radius:10px; padding:14px 16px; margin:10px 0;
    white-space:pre-wrap;
  }
  .call-link{
    display:inline-block; margin:4px 8px 4px 0; padding:10px 16px; border-radius:999px;
    background:var(--accent); color:var(--on-accent); text-decoration:none; font-weight:600; min-height:44px;
    line-height:1.55;
  }
  .call-link.far{background:var(--help)}
  /* ---- help: three bars (v1.27) ----
     "instead of other words just have bar options" — the
     bars ARE the words: full-width, calm card surfaces
     (v1.29 makes them bold blocks with family-colour left
     edges — see the rule below; the v1.27 sign line and
     azure labels are superseded there).
     Crimson stays on the Help button itself and on the true
     -emergency call links (.far) inside My People; the bars
     and their panels are calm. One bar opens at a time; its
     panel sits directly beneath it. */
  /* v1.29: the bars are BOLD BLOCKS — 60px tall, labels at
     17px/700 in ink, and each bar carries a thick 6px left
     block in its family colour: sky for My Playlist, plum
     for My Encouragement, graphite for My People (crimson
     would alarm inside Help; it stays on the button). The
     3px top sign line is retired, like the room cards'.
     Bold, not loud — the inside of Help stays calm */
  .helpbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; min-height:60px; margin:12px 0 0; padding:12px 16px;
    background-color:var(--card); color:var(--ink);
    border:1px solid var(--card-line); border-left:6px solid var(--sign-deep); border-radius:16px;
    font-family:inherit; font-size:16px; font-weight:700; text-align:left; cursor:pointer;
    box-shadow:var(--shadow-bubble);
    transition:border-color var(--dur-press) var(--ease-std), background-color var(--dur-press) var(--ease-std), transform var(--dur-press) var(--ease-std);
  }
  .helpbar[data-helpbar="playlist"]{border-left-color:var(--sign)}
  .helpbar[data-helpbar="encouragement"]{border-left-color:var(--me)}
  .helpbar[data-helpbar="people"]{border-left-color:var(--ink)}
  .helpbar:active{border-color:var(--sign-deep)}
  .helpbar.open{background-color:var(--room-bg); border-color:var(--sign-deep)}
  .helpbar-label{color:var(--ink)}
  .helpbar-mark{
    color:var(--ink-soft); font-size:1.35rem; line-height:1; flex:none;
    transition:transform var(--dur-msg) var(--ease-std);
  }
  .helpbar.open .helpbar-mark{transform:rotate(90deg)}
  .helpbar-panel{padding:12px 6px 2px}
  /* the one quiet line under the bars */
  .arrange-row{text-align:center; margin:18px 0 2px}
  /* the room speaks on neutral gray, marked with a baby-blue
     sign edge: visibly not ordinary talk, without a tint wash */
  .room-line{
    font-family:var(--sans); font-size:16px; line-height:1.5;
    background:var(--room-bg); border:1px solid var(--room-line);
    border-left:4px solid var(--sign);
    border-radius:12px; padding:12px 16px; margin:12px 0;
  }

  /* ---- misc ---- */
  .howto{background:var(--sign-soft); border-radius:12px; padding:12px 16px; font-size:14px; margin:0 0 16px}
  .offer-card{border-color:var(--amber-line); background:var(--amber-bg)}
  .divider{border:none; border-top:1px solid var(--card-line); margin:16px 0}
  .stepdots{color:var(--muted); font-size:13px; margin:0 0 12px}
  .quiet-screen{padding-top:12vh}
  .summary-list{margin:6px 0; padding-left:20px}
  .summary-list li{margin:4px 0}
  a.plain{color:var(--link)}
  .toast{
    background:var(--sign-soft); border:1px solid var(--sign-deep); color:var(--ink);
    border-radius:12px; padding:12px 16px; margin:0 0 16px; font-size:14px;
  }

  /* ---- the thread (Home is a conversation) ---- */
  /* v1.32, THE DOCK: the thread is the frame's scroller —
     flex:1 inside .wrap, overflow-y auto, the ONLY scroller
     on the home view. Its box ends where the docked composer
     begins, so the last message's rest over the bar is this
     rule's bottom padding — a constant 8px — and nothing
     else. No min-height against the viewport, no spacer,
     no stance arithmetic (the v1.26–v1.29 floating-bar
     mechanism is retired whole).
     Bottom-anchored the overflow-safe way: the FIRST
     message's auto top margin absorbs the slack when the
     talk is short (the empty space collects at the top, as
     v1.26 wanted), and computes to 0 when the talk is long —
     justify-content:flex-end on an overflowing column can
     clip the first message out of scroll reach, an auto
     margin never does. The existing auto-scroll (bindThread
     rests the thread at its end after every render) does
     the rest. */
  .thread{
    /* v1.29: the turn gap is 8px, not the research spec's
       16px feed rhythm — the founder, looking at a short
       thread: "It still looks empty. I don't know if it's
       the distance between the messages." The conversation
       gathers; cards keep their air via the rule below. */
    /* v2.0 (the parity map, row 3): the flex gap is now the
       BETWEEN-RUN value, 12px — runs gather their own
       messages at 3px inside .run (below); the v1.29 8px
       turn gap and the +6px card-air margin are superseded
       by the grouped rhythm */
    display:flex; flex-direction:column; gap:12px;
    flex:1; min-height:0; overflow-y:auto;
    /* v2.0 S11 (feel): the talk scrolls with momentum and
       never chains its scroll out to the frame */
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    /* v2.0 S11 (proportions): top padding snaps 10 → 12 on
       the 8pt rhythm; the bottom 8px is the dock gap —
       structural, an exception by design */
    padding:12px 0 8px;
  }
  .thread > :first-child{margin-top:auto}
  .msg{display:flex}
  .msg.me{justify-content:flex-end}
  /* ---- v2.0: the conversation anatomy (parity map rows
     1–4 + 8). The thread render groups consecutive plain
     messages from one side into .run containers: identity
     (medallion + name) opens a companion run, a timestamp
     closes every plain run, day dividers split the days,
     and the thread's own edges fade into the room. Cards
     keep their hub labels and stand outside runs. ---- */
  .threadbox{position:relative; flex:1; min-height:0; display:flex}
  .threadbox::before, .threadbox::after{
    content:""; position:absolute; left:0; right:0; height:14px;
    pointer-events:none; z-index:4;
  }
  .threadbox::before{top:0; background:linear-gradient(180deg, var(--room-wash), transparent)}
  .threadbox::after{bottom:0; background:linear-gradient(0deg, var(--room-wash), transparent)}
  .run{display:flex; flex-direction:column; gap:3px}
  .run-them .msg{margin-left:36px}
  .ghead{display:flex; align-items:center; gap:8px; margin-bottom:4px}
  .medallion{
    width:28px; height:28px; border-radius:50%; flex:none;
    background:var(--me-grad) var(--me); color:#ffffff;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; font-family:var(--sans);
  }
  .gname{font-size:12px; color:var(--muted); font-weight:500}
  .gtime{font-size:11px; color:var(--muted); margin-top:4px}
  .run-them .gtime{margin-left:36px}
  .run-me .gtime{text-align:right}
  .daydiv{display:flex; justify-content:center}
  .daydiv span{
    background:var(--surface2); color:var(--muted); font-size:12px;
    padding:4px 12px; border-radius:999px; border:1px solid var(--card-line);
  }
  /* grouped corners: outer corners stay 22px, the corners
     that join a run-mate square to 8px — companion side
     squares its LEFT joins, his side mirrors on the RIGHT */
  .msg.them .bubble.g-first{border-radius:22px 22px 22px 8px}
  .msg.them .bubble.g-mid{border-radius:8px 22px 22px 8px}
  .msg.them .bubble.g-last{border-radius:8px 22px 22px 22px}
  .msg.me .bubble.g-first{border-radius:22px 22px 8px 22px}
  .msg.me .bubble.g-mid{border-radius:22px 8px 8px 22px}
  .msg.me .bubble.g-last{border-radius:22px 8px 22px 22px}
  /* incoming: the gray he likes (#F0F0F0) in the light scheme,
     indigo-gray #252E5E on the indigo in the dark (v1.23).
     This is the base bubble geometry; v1.34's companion-only
     word-box override (below, after .bubble.wide) widens and
     smooths companion talk and removes its shadow, while the
     palette freeze keeps both bubble colours exact. The
     message markup carries no grouped-run class, so the spec's
     6px grouped corner is not applied rather than faked */
  .msg .bubble{
    background:var(--bubble-in); border:1px solid var(--card-line); border-radius:20px;
    /* v2.0 S11: bubble padding snaps 10×14 → 12×16 on the rhythm */
    padding:12px 16px; max-width:78%; white-space:pre-wrap;
    font-size:16px; line-height:1.5;
    box-shadow:var(--shadow-bubble);
  }
  /* v1.21: the serif is out of the UI entirely — every voice is
     sans; controls and attributions inside a bubble are pinned to
     the sans stack explicitly, as before */
  .msg .bubble .hub-label, .msg .bubble .chip, .msg .bubble .btn,
  .msg .bubble textarea, .msg .bubble input, .msg .bubble select,
  .msg .bubble .small, .msg .bubble .jtag, .msg .bubble .kind-tag,
  .msg .bubble .type-tag{font-family:var(--sans)}
  /* Outgoing: the PLUM VIOLET gradient (v1.24, founder's call —
     supersedes the room-green of v1.20–v1.23) — white on it
     measures 8.31:1 at the light stop, 12.41:1 at the deep stop
     by day (5.73:1 / 8.58:1 for the luminous night stops), and
     position + colour together encode "mine" (the redundant
     cue §7B.7 asks for). */
  .msg.me .bubble{
    background:var(--me-grad) var(--me);
    border-color:transparent; color:var(--me-ink);
    border-radius:20px; box-shadow:var(--shadow-me);
  }
  /* the room and the playlist sit on neutral gray — a different
     surface, so a glance tells them apart from ordinary talk.
     v1.29 retires the 3px baby-blue sign line these cards
     carried: in its place, a BOLD HEADER BAND — a block of
     plum (the gradient; luminous on indigo) across the
     card's top, carrying the card's title in white. A block
     of colour, not a hairline. */
  .msg .bubble.room{
    background-color:var(--room-bg); border-color:var(--room-line);
    background-image:none;
    padding-top:0;
    /* v1.35: the room cards rejoin the one type system —
       no more 500 against the bubbles' 400 */
    font-family:var(--sans);
  }
  .msg .bubble.room .hub-label{
    display:block; background:var(--me-grad); color:#ffffff;
    /* v1.35: the band's inset follows the cards' one
       internal padding (16px), its corners the 22px radius */
    margin:0 -16px 10px; padding:8px 16px;
    border-top-left-radius:21px; border-top-right-radius:21px;
  }
  /* display moments (v1.29): the welcome headline and the
     room's own lines speak with the chest out — 20px since
     v1.37 (21px before), weight 700, tight leading.
     Ordinary bubbles keep the 16px body */
  .display-line{font-size:20px; line-height:1.3; font-weight:700; letter-spacing:-.02em}
  /* a journal prompt, quoted in the talk: sans, set apart by
     weight and the room's gray */
  .jprompt{font-family:var(--sans); font-size:16px; font-weight:400}
  .msg .bubble .chiprow{margin-top:8px}
  .msg .bubble p{margin:0}
  /* the clearance under the last message — history: v1.26–
     v1.29 chased it with spacer arithmetic against the
     floating bar (56px, 24px, then the bar-anchored calc —
     each right on paper, each drifting on a real screen).
     v1.32 retires the whole family: there is no spacer.
     The thread is the scroller and its bottom padding (8px,
     in .thread above) IS the clearance, because the docked
     composer begins where the thread's box ends. */

  /* ---- the composer: one rounded bar, DOCKED (v1.32) ----
     The frame's last row on the home view: a flex child of
     .wrap, in flow — never fixed, never floating. It bleeds
     across the wrap's side padding so its surface spans the
     full column, as the floating bar did; the row inside
     keeps its old inset. Separation from the talk is the
     composer's own: the floor wash (--paper-low, the strong
     wash at the room's floor, both schemes) as its ground,
     a hairline across its top. The bottom fade/melt the
     floating bar needed is retired — there is nothing to
     melt into, the bar is simply there. Position:relative
     only so the attach sheet keeps its anchor in the bar.
     The safe-area bottom padding is kept. */
  /* v2.0 (parity map row 5 + field report A): the dock
     zone goes TRANSPARENT — the room shows around the bar,
     which is now a floating PILL inside the dock: card
     surface, radius 26px, one soft shadow, 10px side
     margins in the dock zone. The hairline/floor-wash
     separation of v1.32 is retired. The composer stays
     flex:none in the frame, always — no rule in this file
     hides, fades, or moves it (asserted in the harness) */
  .composer{
    position:relative; flex:none;
    margin:0 -16px;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    background:transparent;
    border-top:none;
  }
  /* v1.27: the row centers its contents — the founder: "I
     don't want pour hanging like that. Align it well." The
     textarea's one line and the two glyphs share one vertical
     center (see the textarea's tuned line below) */
  .composer-row{
    /* v2.0 S11: the pill's inner rhythm snaps 6 → 8 */
    display:flex; gap:8px; align-items:center;
    background:var(--card); border:1px solid var(--card-line); border-radius:26px;
    padding:8px; box-shadow:var(--shadow-bar);
    transition:border-color var(--dur-press) var(--ease-std), box-shadow var(--dur-press) var(--ease-std);
  }
  /* the focus light (v1.24's home; v1.36's colour): the
     founder's baby blue lives here — the send button's
     former home (there is no send button; Enter sends).
     The border tints baby blue with a soft glow outside
     it; a 1px azure hairline sits INSIDE the glow, because
     the baby blue alone measures 2.27:1 on white — the
     colour is the founder's, the hairline is legibility */
  .composer-row:focus-within{
    border-color:var(--send);
    box-shadow:var(--shadow-bar), inset 0 0 0 1px var(--accent),
      0 0 0 3px color-mix(in srgb, var(--send) 45%, transparent),
      0 0 18px color-mix(in srgb, var(--send) 30%, transparent);
  }
  .composer textarea{
    flex:1; border:none; background:transparent; border-radius:22px;
    /* one line, centered: a 24px line inside 12px of padding
       is exactly the 48px row — the words (and "Pour") sit on
       the same center as the glyphs; more lines still grow
       the field to the 120px cap */
    padding:12px; font-size:17px; font-family:inherit; color:var(--ink);
    min-height:48px; max-height:120px; resize:none; line-height:24px;
  }
  .composer textarea:focus{outline:none}
  .composer textarea::placeholder{color:var(--muted); opacity:.75}
  .composer .btn{min-height:48px; border-radius:999px}
  /* there is NO send button (v1.24, the founder's final word:
     "Actually yours doesn't have a send button. You can
     actually remove it. And incorporate the color somewhere
     else.") — Enter / the keyboard's send key sends, wired to
     the same sendThreadText the button used. Cornflower moved
     into the composer's focus light above and into Record's
     pressed tint below. */
  /* the Record control (v1.26): the founder restated the
     original instruction plainly — "Still has the word
     record." The word goes away: an icon-only microphone in
     a 48px ghost circle, like this chat app's mic. Its name
     lives in the aria-label alone; pressed, it still takes
     the sky tint — the colour's second home (cornflower in
     v1.24–26, the brighter sky from v1.27) */
  .composer .record-btn{
    width:48px; min-width:48px; padding:0; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border-color:transparent; color:var(--glyph);
    box-shadow:none;
  }
  .composer .record-btn svg{display:block}
  .composer .record-btn:active{
    background:color-mix(in srgb, var(--send) 20%, transparent);
    border-color:transparent; color:var(--ink);
  }
  /* the attach sign (v1.25, the founder's words: "add an
     attached sign. It doesn't have to be a +. You can try
     something else") — a PHOTO glyph: a small landscape in a
     rounded frame (mountains + a sun dot), not a plus, not a
     paperclip. A quiet ghost square at the composer's start;
     pressed, it takes the cornflower tint, like Record's */
  .composer .attach-btn{
    width:48px; min-width:48px; padding:0; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border-color:transparent; color:var(--glyph);
    box-shadow:none;
  }
  .composer .attach-btn:active{
    background:color-mix(in srgb, var(--send) 20%, transparent);
    border-color:transparent; color:var(--ink);
  }
  .composer .attach-btn svg{display:block}
  /* the attach menu (v1.26, the founder's screenshot of this
     chat app's sheet: "Add these same options on the
     attachment button") — a small card rising from the
     composer's start, above the bar: Camera / Photos /
     Videos / Files, an icon and a word to a row. The baby
     blue signs the sheet — a hairline across its top and the
     glyphs' colour — in both schemes */
  .attach-menu{
    position:absolute; left:12px; bottom:calc(100% - 6px); z-index:66;
    width:min(236px, calc(100vw - 24px)); padding:6px;
    background:var(--card); border:1px solid var(--card-line); border-radius:20px;
    box-shadow:var(--shadow-card);
    background-image:linear-gradient(90deg, var(--sign), var(--sign));
    background-size:100% 3px; background-position:top left; background-repeat:no-repeat;
  }
  .attach-menu[hidden]{display:none}
  .attach-option{
    display:flex; align-items:center; gap:12px; width:100%; min-height:48px;
    padding:10px 12px; border:none; border-radius:14px; background:transparent;
    color:var(--ink); font-family:var(--sans); font-size:16px; font-weight:500;
    text-align:left; cursor:pointer;
  }
  .attach-option:hover{background:var(--sign-soft)}
  .attach-option:active{background:color-mix(in srgb, var(--sign) 28%, transparent)}
  .attach-option:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .attach-option .attach-ico{display:inline-flex; flex:none; color:var(--sign-deep)}
  .attach-option .attach-ico svg{display:block}
  /* his photo in the thread: the image IS the message — the
     bubble keeps its 20px radius and 78% cap, a thin frame of
     plum around the picture */
  .msg .bubble.photo{padding:6px}
  .msg .bubble.photo img{display:block; max-width:100%; border-radius:14px}
  /* his attached video (v1.26): the same plum-framed media
     bubble family, the player inside it */
  .msg .bubble.video{padding:6px}
  .msg .bubble.video video{display:block; width:100%; border-radius:14px; background:#000}
  /* his attached file (v1.26): a card in the talk — the
     paperclip, the name he knows it by, its size */
  .msg .bubble.file{
    display:flex; align-items:center; gap:12px; white-space:normal;
  }
  .msg .bubble.file .file-ico{display:inline-flex; flex:none}
  .msg .bubble.file .file-ico svg{display:block}
  .msg .bubble.file .file-meta{display:flex; flex-direction:column; min-width:0; line-height:1.35}
  .msg .bubble.file .file-meta strong{overflow-wrap:anywhere}
  .msg .bubble.file .file-meta small{opacity:.85}
  .jmedia{width:100%; margin:6px 0; border-radius:12px}
  video.jmedia{max-height:340px; background:#000}
  /* an attached file on the day's page: a plum-tinted card
     that opens/downloads the kept bytes */
  .jfile{
    display:flex; align-items:center; gap:12px; margin:8px 0;
    padding:12px 16px; border-radius:12px; text-decoration:none;
    background:color-mix(in srgb, var(--me) 13%, var(--card));
    border:1px solid color-mix(in srgb, var(--me) 38%, var(--card-line));
    color:var(--ink);
  }
  .jfile .file-ico{display:inline-flex; flex:none; color:var(--me)}
  .jfile .file-meta{display:flex; flex-direction:column; min-width:0; line-height:1.35}
  .jfile .file-meta strong{overflow-wrap:anywhere}
  .jfile .file-meta small{color:var(--muted)}
  .record-dot{color:var(--help); font-weight:700}
  /* ---- the dynamic journal ---- */
  .jitem{border-top:1px solid var(--card-line); padding:12px 0}
  .jitem:first-of-type{border-top:none}
  .jtag{font-size:.8125rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0 0 4px; font-family:var(--sans)}
  .jwords{white-space:pre-wrap; font-size:16px; line-height:1.5; margin:4px 0}
  .jblock{margin-top:14px}
  .jhidden{opacity:.55}
  .msg .bubble.wide{max-width:88%}
  /* v1.34: the companion's WORD-BOXES are sleek slabs —
     flat, wider, and smoother-cornered, like the reference
     chat app's gray boxes. No colour changes: --bubble-in
     remains exactly #F0F0F0 by day and #252E5E by night
     ("I like my colors").
     v1.35: ONE SYSTEM for the whole companion side — the
     founder, looking at his phone: "I don't like what i'm
     seeing. Is it the different fonts the different box
     sizes?" His eye was right: companion boxes ran at three
     widths (78 / 88 / 94), two radii (20 / 22), two weights
     (the room cards sat at 500 against the bubbles' 400),
     two paddings, and the room cards kept a shadow the
     word-boxes had already lost. Now every companion
     word-box and companion card — plain, wide, room — is
     one system: max-width 88%, radius 22px, flat, and fully
     OPAQUE (the surfaces were already solid tokens —
     --bubble-in and --room-bg are hex in both schemes; the
     photo shows only in the room's open space, never inside
     a box). Companion CARDS (wide / room) take one internal
     padding, 16px; plain word-boxes keep 10×14. His plum
     bubbles keep their own width, geometry and shadow;
     the Help bars keep theirs. */
  .msg.them .bubble{border-radius:22px; max-width:88%; box-shadow:none}
  .msg.them .bubble.wide{max-width:88%; padding:16px}
  .msg.them .bubble.room{border-radius:22px; max-width:88%; box-shadow:none; padding:16px; padding-top:0}
  .msg.them .bubble.wide.room{max-width:88%}
  /* the ONE TYPE SYSTEM inside companion boxes/cards
     (v1.35): body is the base bubble's 16px / 400 since
     v1.37 (17px before); a card's lead line may take 600
     (the templates' own strong lines); secondary and
     quoted text is exactly one step down — 14px in the
     muted ink (15px before v1.37); the small caps sign
     stays 13px / 600 in sign-deep. The 20px / 700 display
     treatment is RESERVED for the welcome headline and the
     room's own lines — no other card borrows it. */
  .msg .bubble .small{font-size:14px}
  .msg .bubble .hub-label{font-weight:600}
  .msg .bubble .jprompt{font-size:16px; font-weight:400}
  .cardblock{border-top:1px solid var(--card-line); padding-top:12px; margin-top:12px}
  .cardblock:first-child{border-top:none; padding-top:0; margin-top:0}

  /* ---- v1.38: the large-screen room + the quiet scrollbar ----
     The founder's desktop screenshot ("This looks
     baaaaddd!") showed three widths on one screen: the band
     spanning the viewport, the talk in a narrower column,
     and the composer on its own width. At 640px and up the
     frame becomes ONE contained column — a phone standing
     on a desk: band, scroll area and (inside it) the docked
     composer all take the same 480px, full height, with
     hairline sides and a soft side shadow. Outside it, the
     body's photograph calms into a backdrop under the
     heavier --room-outer-grad wash; inside it, .wrap carries
     the room's normal wash + photo, continuous with the
     band. Below 640px nothing in this block applies.
     At night on the wide screen, one extra indigo layer
     (--room-night-soft) sits over the column's photograph
     — a background treatment that dims and desaturates the
     blossoms without touching a palette colour.
     The thread's scrollbar is styled everywhere a bar can
     show: thin, a surface-2 thumb, a transparent track. */
  .thread{scrollbar-width:thin; scrollbar-color:var(--surface2) transparent}
  .thread::-webkit-scrollbar{width:8px}
  .thread::-webkit-scrollbar-track{background:transparent}
  .thread::-webkit-scrollbar-thumb{background:var(--surface2); border-radius:999px}
  @media (min-width:640px){
    body{
      align-items:center;
      background-image:var(--room-outer-grad), var(--room-photo);
    }
    .top-band, .wrap{
      width:100%; max-width:480px;
      border-left:1px solid var(--card-line); border-right:1px solid var(--card-line);
      box-shadow:-28px 0 44px -30px rgba(20,20,20,.38), 28px 0 44px -30px rgba(20,20,20,.38);
    }
    .top-band-in{max-width:480px}
    .wrap{
      background-image:var(--room-wash-grad), var(--room-photo);
      background-position:center center, center var(--room-pos);
      background-size:auto, cover;
      background-repeat:no-repeat, no-repeat;
      background-attachment:fixed, fixed;
    }
  }
  @media (min-width:640px) and (prefers-color-scheme: dark){
    .top-band{
      background-image:var(--room-night-soft), var(--room-veil-grad), var(--room-photo);
      /* v2.0 S11: three layers need three positions, or the
         photo layer would inherit the first and lose the
         night's focal placement */
      background-position:center center, center center, center var(--room-pos);
      background-size:auto, auto, cover;
      background-repeat:no-repeat, no-repeat, no-repeat;
      background-attachment:fixed, fixed, fixed;
    }
    .wrap{
      background-image:var(--room-night-soft), var(--room-wash-grad), var(--room-photo);
      background-position:center center, center center, center var(--room-pos);
      background-size:auto, auto, cover;
      background-repeat:no-repeat, no-repeat, no-repeat;
      background-attachment:fixed, fixed, fixed;
    }
  }

  /* ---- v2.0: brand veil, view transitions, sheet scrim
     (parity map rows 6–7). The boot veil is the photo room
     with the wordmark, pointer-events NONE from its first
     frame (it can never block the bar — field report A),
     shown once per session, gone inside 600ms. View swaps
     ride .wrap.view-in (200ms fade + 6px rise, spring);
     the attach sheet gains a fading scrim. ---- */
  .bootveil{
    position:fixed; inset:0; z-index:120; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background-image:var(--room-wash-grad), var(--room-photo);
    background-position:center center, center var(--room-pos);
    background-size:auto, cover; background-repeat:no-repeat, no-repeat;
    background-attachment:fixed, fixed;
    transition:opacity .45s ease;
  }
  .bootveil .bootword{font-size:30px; font-weight:700; letter-spacing:-.02em; color:var(--ink); font-family:var(--sans)}
  .bootveil.gone{opacity:0}
  .bootveil.skip{display:none}
  @keyframes view-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .wrap.view-in{animation:view-in .2s var(--ease-spring)}
  @keyframes scrim-in{from{opacity:0} to{opacity:1}}
  .scrim{
    position:fixed; inset:0; z-index:60;
    background:rgba(20,16,24,.25);
    animation:scrim-in .18s ease-out;
  }
  .scrim[hidden]{display:none}
  @media (prefers-color-scheme: dark){
    .scrim{background:rgba(20,16,24,.45)}
  }

  /* ---- motion: tokenised — dynamic in arrivals and touches,
     never in ambience (v1.29, the founder: "bolder and more
     dynamic"). A new turn settles in 240ms on the spring
     (--ease-spring, a small overshoot; transform/opacity
     only, travel ≤8px); cards take 280ms on the same spring;
     the attach sheet pops (scale .96 → 1 + fade, 220ms);
     buttons, bars and chips press to scale .98. Exits stay
     instant/calm (--dur-exit remains a token only; the app
     has no exit animations). NO loops, NO infinite
     animations, NO idle or pulsing elements, nothing moves
     while a person is reading. Nothing exceeds the 400ms
     ceiling. ---- */
  @keyframes msg-in{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @keyframes msg-fade{from{opacity:0} to{opacity:1}}
  @keyframes sheet-pop{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}
  .msg{animation:msg-in var(--dur-msg) var(--ease-spring)}
  .card, .hero-card, .hub-card{animation:msg-in var(--dur-card) var(--ease-spring)}
  .attach-menu{animation:sheet-pop 220ms var(--ease-spring); transform-origin:bottom left}
  .btn:active, .chip:active, .helpbar:active, .attach-option:active,
  .composer .attach-btn:active, .composer .record-btn:active{transform:scale(.98)}
  @media (prefers-reduced-motion: reduce){
    /* EVERYTHING collapses to ≤100ms crossfades — no spring,
       no scale, no travel */
    .msg, .card, .hero-card, .hub-card, .attach-menu{animation:msg-fade .1s ease-out}
    /* v2.0: view swaps and the scrim flatten to crossfades
       too; the veil stops transitioning */
    .wrap.view-in{animation:msg-fade .1s ease-out}
    .scrim{animation:msg-fade .1s ease-out}
    .bootveil{transition:none}
    .btn:active, .chip:active, .helpbar:active, .attach-option:active,
    .top-door:active,
    .composer .attach-btn:active, .composer .record-btn:active{transform:none}
    *{transition-duration:.1s !important}
  }
</style>
</head>
<body>
<div class="bootveil" id="bootveil" aria-hidden="true"><div class="bootword">Ever Present</div></div>
<header class="top-band"><div class="top-band-in">
<button id="circlesBtn" class="top-door" type="button" aria-label="Circles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.7c2.3.2 4.2 1.6 4.9 4.3"/></svg><span>Circles</span></button>
<button id="helpBtn" type="button" aria-label="Help">Help</button>
<button id="playlistBtn" class="top-door" type="button" aria-label="Playlist"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18.5V6l10-2v12.5"/><circle cx="6.8" cy="18.5" r="2.4"/><circle cx="16.8" cy="16.5" r="2.4"/></svg><span>Playlist</span></button>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
"use strict";
/* =====================================================================
   Ever Present v1.7 — single-file web app.
   The interface is a conversation, full stop: one thread, one
   composer, and the Help button. The companion brings the journal,
   the map, the receipts and the settings into the talk as cards.
   v1.7 adds an optional live voice: with the person's own API key
   (kept only on this device), a model does the talking back while
   the code keeps the record — filing, figuring, doors, cards —
   exactly as before. The model never files or changes anything.
   v1.9 puts the knowledge base to work: it rides in the live
   packet so the companion can draw on the research at the moment,
   it can answer a matching message directly in rule-based mode,
   and a floor of day-shape facts means ordinary talk always has
   something true organizing it. Feedback stops waiting for the
   crude matchers to hit.
   ===================================================================== */

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function fmtDate(ts){ /* ported from the local product build (ledgerFmt) */
  var d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})
    + ", " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function relDay(ts){
  var now = new Date(); var d = new Date(ts);
  var startNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var startD = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var days = Math.round((startNow - startD) / 86400000);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 7) return "last " + d.toLocaleDateString(undefined,{weekday:"long"});
  return "on " + d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function uniqPush(arr, val){ if(val && arr.indexOf(val) === -1) arr.push(val); return arr; }

/* ================= self-recording storage (v1.17) =================
   The clips themselves — audio/video blobs — live in IndexedDB
   (db "ever_present_media", store "clips"); only their metadata
   (id, kind, told time, label, length) rides in localStorage, so
   the day's page can lay them out and the export can carry the
   index without carrying a single byte of media. Every operation
   degrades gracefully: no IndexedDB (an old browser, a test rig)
   means the metadata path still works and the clips simply have
   no bytes behind them yet. Capture itself sits behind
   EPMedia.capture, so the whole flow around it is testable. */
var EPMEDIA_DB = "ever_present_media";
var EPMEDIA_STORE = "clips";
var _epMediaDbPromise = null;
var EPMedia = {
  available: function(){ return typeof indexedDB !== "undefined"; },
  open: function(){
    if(!EPMedia.available()) return Promise.reject(new Error("IndexedDB is not available"));
    if(_epMediaDbPromise) return _epMediaDbPromise;
    _epMediaDbPromise = new Promise(function(resolve, reject){
      var req;
      try{ req = indexedDB.open(EPMEDIA_DB, 1); }catch(e){ reject(e); return; }
      req.onupgradeneeded = function(){
        if(!req.result.objectStoreNames.contains(EPMEDIA_STORE))
          req.result.createObjectStore(EPMEDIA_STORE, {keyPath:"id"});
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
      req.onblocked = function(){ reject(new Error("IndexedDB open blocked")); };
    });
    return _epMediaDbPromise;
  },
  _request: function(mode, makeReq){
    if(!EPMedia.available()) return Promise.resolve(null);
    return EPMedia.open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(EPMEDIA_STORE, mode);
        var req;
        try{ req = makeReq(tx.objectStore(EPMEDIA_STORE)); }catch(e){ reject(e); return; }
        if(!req){ resolve(null); return; }
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return null; });
  },
  put: function(record, blob){
    var rec = {id:record.id, kind:record.kind, mime:record.mime || (blob && blob.type) || "",
               ts:record.ts, label:record.label || "", blob:blob};
    return EPMedia._request("readwrite", function(store){ return store.put(rec); })
      .then(function(){ return !!EPMedia.available(); });
  },
  get: function(id){
    return EPMedia._request("readonly", function(store){ return store.get(id); })
      .then(function(rec){ return rec || null; });
  },
  remove: function(id){
    return EPMedia._request("readwrite", function(store){ return store.delete(id); })
      .then(function(){ return !!EPMedia.available(); });
  },
  clear: function(){
    return EPMedia._request("readwrite", function(store){ return store.clear(); })
      .then(function(){ return !!EPMedia.available(); });
  },
  setLabel: function(id, label){
    return EPMedia.get(id).then(function(rec){
      if(!rec) return false;
      rec.label = label;
      return EPMedia._request("readwrite", function(store){ return store.put(rec); })
        .then(function(){ return true; });
    });
  },
  capture: function(kind){ return startMediaCapture(kind); }
};
function pickMediaMime(kind){
  if(typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
  var opts = kind === "video"
    ? ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]
    : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for(var i=0;i<opts.length;i++) if(MediaRecorder.isTypeSupported(opts[i])) return opts[i];
  return "";
}
/* startMediaCapture resolves a session: {kind, stop() -> Promise
   of {blob, mime, kind, seconds}, discard()}. A denial anywhere
   along the way rejects, and the card answers with one plain line. */
function startMediaCapture(kind){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia
     || typeof MediaRecorder === "undefined")
    return Promise.reject(new Error("media capture is not available"));
  var constraints = kind === "video" ? {audio:true, video:true} : {audio:true};
  return navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    var mime = pickMediaMime(kind);
    var rec = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
    var chunks = [];
    var startedAt = Date.now();
    var settled = false;
    rec.addEventListener("dataavailable", function(ev){
      if(ev.data && ev.data.size) chunks.push(ev.data);
    });
    function stopTracks(){ stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }
    var session = {
      kind: kind,
      mime: rec.mimeType || mime || "",
      startedAt: startedAt,
      stop: function(){
        return new Promise(function(resolve, reject){
          if(settled){ reject(new Error("already stopped")); return; }
          settled = true;
          rec.addEventListener("stop", function(){
            stopTracks();
            var type = session.mime || (kind === "video" ? "video/webm" : "audio/webm");
            var blob = new Blob(chunks, {type:type});
            resolve({blob:blob, mime:blob.type || type, kind:kind,
                     seconds:Math.max(1, Math.round((Date.now() - startedAt) / 1000))});
          }, {once:true});
          try{ rec.stop(); }catch(e){ stopTracks(); reject(e); }
        });
      },
      discard: function(){
        if(settled) return;
        settled = true;
        try{ rec.stop(); }catch(e){}
        stopTracks();
      }
    };
    rec.start(250);
    return session;
  });
}

/* ================= shared lookups ================= */
function pieceById(id){
  for(var i=0;i<atlas.pieces.length;i++) if(atlas.pieces[i].id === id) return atlas.pieces[i];
  return null;
}
function pieceName(id){ var p = pieceById(id); return p ? p.name : ""; }
function openClaims(){ return ledger.entries.filter(function(e){ return !isChecked(e); }); }
function isChecked(e){
  if(e.outcome && e.outcome.trim()) return true;
  return e.outcomeChip === "happened" || e.outcomeChip === "didnt" || e.outcomeChip === "partly";
}
function heldUp(e){ return e.outcomeChip === "happened" || e.outcomeChip === "partly"; }
var KIND_LABELS = {
  prediction:"Prediction",
  now:"Claim about right now",
  commentary:"Running commentary",
  announcement:"Announcement",
  instruction:"Instruction"
};
function outcomeLabel(e){
  var parts = [];
  if(e.outcomeChip === "happened") parts.push("It happened");
  if(e.outcomeChip === "didnt") parts.push("It didn\u2019t happen");
  if(e.outcomeChip === "partly") parts.push("Partly");
  if(e.outcome) parts.push(e.outcome);
  return parts.join(" \u2014 ");
}
/* receipts tallies for one voice (by piece id or exact name) */
function receiptsForPiece(p){
  var mine = ledger.entries.filter(function(e){
    return (e.whoId && e.whoId === p.id) || (e.who && e.who === p.name);
  });
  var checked = mine.filter(isChecked);
  return {
    total: mine.length,
    checked: checked.length,
    open: mine.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function allReceiptTallies(){
  var checked = ledger.entries.filter(isChecked);
  return {
    total: ledger.entries.length,
    checked: checked.length,
    open: ledger.entries.length - checked.length,
    held: checked.filter(heldUp).length,
    didnt: checked.filter(function(e){ return e.outcomeChip === "didnt"; }).length
  };
}
function learnedBodySpots(){
  var spots = [];
  atlas.events.forEach(function(ev){ (ev.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  atlas.pieces.forEach(function(p){ (p.bodySpots||[]).forEach(function(s){ uniqPush(spots, s); }); });
  return spots;
}
